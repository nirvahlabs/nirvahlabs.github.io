<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unnati Promotion Prep · Free demo</title>
<style>/* Layout: phone-first single column under a slim indigo app bar, with a fixed bottom tab bar. */
:root{
  --bg:#F4F5FB; --surface:#FFFFFF; --sunk:#E9EBF6; --ink:#161A33; --muted:#5B6180; --line:#DDE0EF;
  --accent:#3F3AC7; --accent-2:#6D3FD8; --accent-ink:#FFFFFF; --saffron:#C2620A; --saffron-bg:#FDF0E2;
  --good:#0F7A55; --good-bg:#E1F4EC; --bad:#B42318; --bad-bg:#FCE8E6;
  --shadow:0 1px 2px rgba(22,26,51,.06),0 4px 14px rgba(22,26,51,.07);
  --f:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --mono:ui-monospace,"Roboto Mono",Consolas,monospace;
  --r:14px; --tab:64px;
}
:root[data-theme="dark"]{
  --bg:#0F1122; --surface:#181B33; --sunk:#22264A; --ink:#E9EBF7; --muted:#A3A8C6; --line:#2D3256;
  --accent:#9C98FF; --accent-2:#B79CFF; --accent-ink:#0F1122; --saffron:#F5A453; --saffron-bg:#3A2614;
  --good:#4FD1A0; --good-bg:#12302A; --bad:#F48B80; --bad-bg:#3A1B1A; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:1rem/1.5 var(--f);-webkit-tap-highlight-color:transparent;padding-bottom:calc(var(--tab) + 12px)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
[hidden]{display:none!important}

.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:12px 16px;
  background:linear-gradient(120deg,#2B2A8C,var(--accent) 60%,var(--accent-2));color:#fff}
.top h1{font-size:1.15rem;margin:0;font-weight:800;letter-spacing:.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topRight{font:700 .9rem var(--mono)}
#topRight.low{color:#FFD0CB}
:root[data-theme="dark"] .top{color:#fff;background:linear-gradient(120deg,#1E1C66,#3F3AC7 60%,#5B34B8)}

main{max-width:680px;margin:0 auto;padding:16px 16px 8px;outline:none}
.loading{color:var(--muted);text-align:center;margin-top:30vh}
h2{font-size:1.35rem;margin:6px 0 4px;text-wrap:balance}
h3{font-size:1rem;margin:20px 0 8px;color:var(--accent)}
.lede{color:var(--muted);margin:0 0 14px}
.label{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;height:var(--tab);display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -2px 10px rgba(22,26,51,.05)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:600}
.tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabbar a[aria-current="page"]{color:var(--accent)}
.tabbar a[aria-current="page"] svg{background:var(--sunk);border-radius:10px;padding:2px 10px;width:44px;box-sizing:content-box}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.stack{display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .v{font-size:1.45rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .v small{font-size:.8rem;color:var(--muted);font-weight:600}
.stat .k{font-size:.8rem;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2))}

.hero{border-radius:20px;padding:18px;color:#fff;background:linear-gradient(135deg,#2B2A8C,var(--accent) 55%,var(--accent-2));display:flex;gap:16px;align-items:center}
:root[data-theme="dark"] .hero{background:linear-gradient(135deg,#1E1C66,#3F3AC7 55%,#5B34B8)}
.hero .big{font-size:2.6rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.hero .big small{display:block;font-size:.72rem;letter-spacing:.12em;font-weight:700;opacity:.85}
.hero p{margin:0}
.hero button{margin-top:8px}

.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 4px 12px rgba(63,58,199,.25)}
:root[data-theme="dark"] .btn{color:#0F1122}
.btn.ghost{background:var(--surface);color:var(--accent);border:1.5px solid var(--accent);box-shadow:none}
.btn.light{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.4);box-shadow:none}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.btn:active{transform:translateY(1px)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:space-between}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:.88rem;font-weight:600;cursor:pointer}
.chip small{color:var(--muted);font-weight:600;margin-left:4px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip[aria-pressed="true"] small{color:rgba(255,255,255,.8)}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0F1122}
select,input[type=text],input[type=date],input[type=number],input[type=time],textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:180px;resize:vertical;line-height:1.55}
label.f{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin:10px 0 4px}

.q{font-size:1.08rem;font-weight:600;margin:6px 0 14px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--sunk);color:var(--accent)}
.tag.draft{background:var(--saffron-bg);color:var(--saffron)}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.opt .k{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--sunk);font-weight:800;font-family:var(--mono)}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.opt.sel .k{background:var(--accent);color:#fff}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:#fff}
.exp{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--sunk)}
.exp p{margin:0 0 6px}
.src{font-size:.82rem;color:var(--muted)}
.verdict{font-weight:800;margin:12px 0 0}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.progress{font:600 .85rem var(--mono);color:var(--muted)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:10px}
.pal button{padding:7px 0;border-radius:8px;border:1px solid var(--line);background:var(--surface);font:600 .8rem var(--mono);cursor:pointer}
.pal button.ans{background:var(--accent);border-color:var(--accent);color:#fff}
.pal button.cur{outline:2px solid var(--ink)}

.model{white-space:pre-wrap;padding:14px;border-radius:12px;background:var(--sunk);border-left:4px solid var(--good)}
.frame{white-space:pre-wrap;font-size:.93rem;padding:14px;border-radius:12px;background:var(--sunk)}
.wc{font:600 .82rem var(--mono);color:var(--muted)}
.wc.ok{color:var(--good)}
.check{display:flex;gap:10px;align-items:flex-start;margin:6px 0}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--good)}

.lock{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--saffron-bg);color:var(--ink)}
.lock b{color:var(--saffron)}
.list a.item,.list button.item{display:flex;align-items:center;gap:12px;width:100%;padding:14px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;text-decoration:none;color:var(--ink);cursor:pointer}
.list .item:last-child{border-bottom:0}
.list .item span{flex:1}
.list .item small{display:block;color:var(--muted)}
.list .item:after{content:"›";color:var(--muted);font-size:1.3rem}
.note-item{border-bottom:1px solid var(--line);padding:10px 0}
.note-item:last-child{border-bottom:0}
.note-item p{margin:4px 0;white-space:pre-wrap}
.linkish{background:none;border:0;padding:4px 0;color:var(--saffron);font-weight:600;cursor:pointer;font-size:.88rem;text-decoration:none}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.debug{border:2px dashed var(--saffron)}
#toast{position:fixed;left:50%;bottom:calc(var(--tab) + 16px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;max-width:90vw;z-index:20}
@media (prefers-reduced-motion:no-preference){.opt,.chip,.btn{transition:background .15s,border-color .15s,transform .1s}}

/* practice mode switcher */
.modes{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;box-shadow:var(--shadow)}
.modes a{text-align:center;padding:9px 4px;border-radius:9px;text-decoration:none;color:var(--muted);font-weight:700;font-size:.9rem}
.modes a[aria-current="page"]{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#fff}
:root[data-theme="dark"] .modes a[aria-current="page"]{color:#0F1122}
/* DI tables */
.di-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 8px;margin:4px 0 6px}
table.di{font-size:.84rem}
table.di th,table.di td{padding:7px 5px}
table.di th{font-size:.72rem;color:var(--accent);vertical-align:bottom}
/* buttons laid out like cards */
button.card.list-like{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;cursor:pointer}
button.card.list-like:disabled{opacity:.5;cursor:default}
/* recall card */
.flash .q{font-size:1.15rem;min-height:4.5em}
.flash .answer{padding:14px;border-radius:12px;background:var(--good-bg);color:var(--good);font-weight:800;font-size:1.1rem}

/* typing test */
.typing-src{margin:10px 0;padding:12px 14px;border-radius:12px;background:var(--sunk);font-size:1.02rem;line-height:1.7;overflow-wrap:anywhere}
.typing-src .ok{color:var(--good)}
.typing-src .err{color:#fff;background:var(--bad);border-radius:3px}
.typing-src .cur{border-bottom:3px solid var(--accent)}
#tin{min-height:140px;font-size:1rem}
.q{white-space:pre-line}
.q.passage{font-weight:400;font-size:1rem;line-height:1.65}

/* ---- v0.10: progress charts, full exam ---- */
.bars{display:flex;flex-direction:column;gap:12px}
.barrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.barrow .bl{grid-column:1/-1;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barrow .bn{color:var(--muted)}
.barrow .track{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.barrow .track i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.barrow .bv{font-variant-numeric:tabular-nums;font-weight:600;font-size:.9rem;min-width:88px;text-align:right}
.barrow .bs{grid-column:1/-1;margin-top:-2px}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 7px;border-radius:999px;vertical-align:1px}
.pill.good{color:var(--good);background:var(--good-bg)}
.pill.fair{color:var(--saffron);background:var(--saffron-bg)}
.pill.weak{color:var(--bad);background:var(--bad-bg)}
details summary{cursor:pointer;color:var(--accent);font-size:.9rem;padding:4px 0}
.tbl{overflow-x:auto}
.chart{margin:0}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ref{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4}
.chart .axis{fill:var(--muted);font-size:10px;font-family:var(--f)}
.chart .val{fill:var(--ink);font-size:11px;font-weight:600;font-family:var(--f)}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .dot.on{r:6}
.chart .hit{fill:transparent;cursor:pointer}
.chart figcaption{margin-top:6px}
.paper-item textarea{min-height:110px}

/* ---- v0.11: stars, daily plan, mock timing ---- */
.star{background:none;border:0;font-size:1.35rem;line-height:1;color:var(--muted);padding:2px 4px;margin-left:6px;cursor:pointer;vertical-align:middle}
.star[aria-pressed="true"]{color:var(--saffron)}
.plan{display:flex;flex-direction:column;gap:2px}
.plan-row{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.plan-row:first-of-type{margin-top:8px}
.plan-row .tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:800;color:#fff}
.plan-row.done .tick{background:var(--good);border-color:var(--good)}
.plan-row.done .pt b{color:var(--muted);text-decoration:line-through}
.plan-row .pt{display:flex;flex-direction:column;min-width:0}
.plan-row .pt small{color:var(--muted);font-size:.8rem;overflow:hidden;text-overflow:ellipsis}
.streak{font-size:.8rem;font-weight:700;color:var(--saffron);background:var(--saffron-bg);padding:3px 10px;border-radius:999px}
.btn.small{padding:7px 14px;font-size:.85rem;min-height:0}
.slowlist{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-top:4px}
td.n.slow{color:var(--bad);font-weight:700}

/* ---- v0.12: readiness, answer check, listen ---- */
.ready .rv{display:flex;align-items:baseline;gap:6px;margin-top:2px}
.ready .rv b{font-size:2.2rem;line-height:1.1}
.ready .rv small{color:var(--muted)}
.ready .rl{margin-left:6px;font-weight:700;color:var(--accent)}
.ready .meter{margin-top:10px}
.delta{font-size:.8rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.delta.up{color:var(--good);background:var(--good-bg)}
.delta.down{color:var(--bad);background:var(--bad-bg)}
.rparts{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.rp .meter{margin-top:4px;height:6px}
.check-box{background:var(--sunk);border-radius:12px;padding:12px 14px;margin:6px 0 12px}
.kp-head{margin-top:10px;font-size:.9rem}
.check-box .meter{margin-top:6px}
.kp{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.kp li{display:grid;grid-template-columns:20px 1fr;gap:6px;color:var(--muted)}
.kp li.ok{color:var(--ink)}
.kp .mk{font-weight:800;color:var(--muted)}
.kp li.ok .mk{color:var(--good)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.listen{white-space:nowrap;margin-left:8px}
.listen.on{color:var(--bad);font-weight:700}
#player{position:fixed;left:8px;right:8px;bottom:calc(var(--tab) + 8px);z-index:20;display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px;box-shadow:var(--shadow);font-size:.88rem}
#player span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}

/* ---- v0.13: guess marks, challenge, final week, calculators ---- */
.guessrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 10px}
.guessrow small{font-size:.78rem}
.chip.guess[aria-pressed="true"]{background:var(--saffron-bg);border-color:var(--saffron);color:var(--saffron)}
.chip.small{padding:4px 10px;font-size:.78rem;margin-left:6px}
.pal button.gs{box-shadow:inset 0 -3px 0 var(--saffron)}
.duelcode{font:800 2rem/1.2 var(--mono);letter-spacing:.12em;text-align:center;padding:14px;border:2px dashed var(--accent);border-radius:14px;color:var(--accent);margin:4px 0 10px;user-select:all}
.rivalin{width:64px;padding:4px 6px;font-size:.9rem}
button.tick{background:none;padding:0;cursor:pointer;font:inherit;font-size:.8rem;font-weight:800;color:#fff}
.plan-row.done button.tick{background:var(--good);border-color:var(--good)}
.card.final{border:2px solid var(--saffron)}
.cres{margin-top:4px}
.cres tr.lead td{font-weight:800;font-size:1.05rem;color:var(--accent)}

/* ---- v0.17: Style B "Indigo + Saffron Gold" (warm surfaces, gold primary actions, indigo structure) ---- */
:root{
  --bg:#FBF7F1; --sunk:#F4ECE1; --line:#EDE3D6; --ink:#1F1A2E; --muted:#6E6459;
  --gold:#D97706; --gold-2:#B45309; --gold-soft:#FFF3E2; --gold-line:#F2C27A;
  --shadow:0 1px 2px rgba(60,40,10,.05),0 6px 18px rgba(60,40,10,.07); --r:16px}
:root[data-theme="dark"]{--gold:#F5B04A; --gold-2:#E08A1A; --gold-soft:#33240F; --gold-line:#6B4A1A}
.top{border-bottom:3px solid transparent;border-image:linear-gradient(90deg,#F2A12B,#FFD27A,#F2A12B) 1}
.btn{background:linear-gradient(135deg,var(--gold),var(--gold-2));box-shadow:0 6px 14px rgba(180,83,9,.28);border-radius:14px}
:root[data-theme="dark"] .btn{color:#2A1800;box-shadow:none}
.btn.ghost{color:var(--accent);border-color:var(--accent);background:var(--surface)}
.btn.light{background:rgba(255,255,255,.16)}
.meter i{background:linear-gradient(90deg,var(--gold),#F2A12B)}
.hero{position:relative;overflow:hidden;box-shadow:0 10px 24px rgba(43,42,140,.25)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,#F2A12B,#FFD27A,#F2A12B)}
.hero .big{color:#FFD27A}
.card{border-color:var(--line)}
.stat .v{color:var(--ink)}
.lock{background:var(--gold-soft);border:1px dashed var(--gold-line)}
.lock b{color:var(--gold-2)}
.streak{color:var(--gold-2);background:var(--gold-soft)}
.star[aria-pressed="true"]{color:var(--gold)}

/* home punchline */
.motto{text-align:center;padding:2px 8px}
.motto b{display:block;font-size:1.12rem;color:var(--gold-2);letter-spacing:.01em}
.motto span{display:block;font-size:.82rem;color:var(--muted)}
:root[data-theme="dark"] .motto b{color:var(--gold)}

/* welcome */
body.no-tabs .tabbar{display:none}
body.no-tabs{padding-bottom:16px}
.welcome{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:8px 0 4px}
.w-badge{width:84px;height:84px;border-radius:24px;background:linear-gradient(135deg,#2B2A8C,#3F3AC7 55%,#6D3FD8);box-shadow:0 10px 24px rgba(43,42,140,.3);display:grid;place-items:center}
.w-badge svg{width:76px;height:76px}
.w-app{margin:0;font-weight:800;font-size:1.15rem;color:var(--accent)}
.couplet{margin:4px 0;padding:16px 18px;border-radius:18px;background:var(--surface);border:1px solid var(--gold-line);box-shadow:var(--shadow);width:100%}
.couplet p{margin:0}
.couplet p[lang="hi"]{font-size:1.06rem;font-weight:700;line-height:1.6;color:var(--ink)}
.couplet .en{margin-top:8px;font-size:.88rem;color:var(--muted);font-style:italic}
.couplet cite{display:block;margin-top:6px;font-size:.75rem;font-style:normal;color:var(--gold-2)}
.w-lede{margin:0;font-weight:600;color:var(--ink)}
.w-feat{list-style:none;padding:0;margin:0;display:grid;gap:8px;text-align:left;width:100%}
.w-feat li,.pw-feat li{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;font-size:.95rem}
.w-feat li::before,.pw-feat li::before{content:"✓";width:22px;height:22px;border-radius:50%;background:var(--gold);color:#fff;font-size:.75rem;font-weight:800;display:grid;place-items:center;margin-top:1px}

json": {"pack": "mcq", "items": [{"id": "S1-0001", "sec": "S1", "q": "Under the DICGC deposit insurance scheme, a depositor's deposits in one insured bank, held in the same right and capacity, are covered up to:", "opts": ["₹1 lakh", "₹2 lakh", "₹5 lakh", "₹10 lakh", "₹5 lakh per account"], "ans": 2, "exp": "The cover is ₹5 lakh per depositor per bank (not per account or per branch), for principal and interest together, across all accounts held in the same right and capacity. It was raised from ₹1 lakh with effect from 4 February 2020.", "src": "DICGC Act, 1961; DICGC cover revision effective 4 Feb 2020", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://www.dicgc.org.in/"}, {"id": "S1-0002", "sec": "S1", "q": "A savings or current account is treated as inoperative when there has been no customer-induced transaction for more than:", "opts": ["1 year", "2 years", "3 years", "Over 2 years, counting interest credits as transactions", "18 months"], "ans": 1, "exp": "An account with no customer-induced transaction for over two years is classified as inoperative. Interest credited by the bank does not count as a customer-induced transaction.", "src": "RBI circular on Inoperative Accounts and Unclaimed Deposits, 1 Jan 2024", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://www.rbi.org.in/"}, {"id": "S1-0005", "sec": "S1", "q": "RBI deregulated the interest rate on savings bank deposits with effect from:", "opts": ["1 April 2010", "1 April 2011", "25 October 2011", "1 April 2016", "16 December 2019"], "ans": 2, "exp": "Banks have been free to set their savings bank rate since 25 October 2011. Conditions: a Board-approved comprehensive policy on deposit rates; a uniform rate for balances up to ₹1 lakh; and above ₹1 lakh banks may give differential rates, but must not discriminate between similar deposits of the same size accepted on the same date at any of their offices.", "src": "RBI Master Direction - Interest Rate on Deposits, 2016 (as amended)", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=10296"}, {"id": "S1-0013", "sec": "S1", "q": "Interest earned on an NRE account is:", "opts": ["Taxable at the normal slab rates", "Taxed at a flat 30%", "Exempt from income tax in India", "Taxable only above ₹50,000 a year", "Exempt only if the depositor is a resident"], "ans": 2, "exp": "Interest on NRE balances is exempt from income tax in India (Income-tax Act, 2025, Schedule IV, item 1; formerly Sec 10(4)(ii) of the 1961 Act) for an individual who is a person resident outside India under FEMA, or who is permitted by RBI to maintain the account. When the holder returns and becomes resident, RBI requires the NRE account to be redesignated as a resident account (or the funds moved to an RFC account), and the interest thereafter is taxable.", "src": "Income-tax Act, 2025 (exemption formerly Sec 10(4)(ii) of the 1961 Act)", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://indiacode.gov.in/"}, {"id": "S1-0017", "sec": "S1", "q": "For a customer classified as high risk, periodic updation of KYC must be done at least once every:", "opts": ["1 year", "2 years", "8 years", "5 years", "10 years"], "ans": 1, "exp": "Periodic KYC updation is due every 2 years for high-risk, 8 years for medium-risk and 10 years for low-risk customers.", "src": "RBI Master Direction - Know Your Customer (KYC) Direction, 2016 (as amended)", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=13141"}, {"id": "S1-0022", "sec": "S1", "q": "In a joint term deposit with the mandate \"Former or Survivor\", who can withdraw the matured deposit while both holders are alive?", "opts": ["Either holder", "Both holders jointly", "Only the first-named holder", "Only the second-named holder", "The first-named holder, or the second with a written mandate from the first"], "ans": 2, "exp": "Under \"Former or Survivor\", only the first-named holder can operate/withdraw the deposit on maturity while both are alive; premature withdrawal may need the signature of both. On the death of the former, the survivor receives the proceeds; payment to the survivor gives the bank a valid discharge, and the survivor holds the money as trustee for the legal heirs of the deceased.", "src": "RBI (Commercial Banks – Responsible Business Conduct) Directions, 2025 (joint deposits / settlement of claims of deceased depositors)", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasterDirections.aspx"}, {"id": "S1-0028", "sec": "S1", "q": "Before DICGC's Risk-Based Premium Framework took effect on 1 April 2026, the flat deposit insurance premium paid by every insured bank was:", "opts": ["5 paise per ₹100 of assessable deposits", "15 paise per ₹100", "10 paise per ₹100", "12 paise per ₹100", "25 paise per ₹100"], "ans": 3, "exp": "From 1 April 2020 the flat premium was 12 paise per ₹100 of assessable deposits (raised from 10 paise). From 1 April 2026 DICGC moved to a Risk-Based Premium Framework: 12 paise is the card rate, and better-rated banks pay less (rates vary by bank, with a vintage adjustment). The premium is borne by the bank and cannot be passed on to depositors.", "src": "DICGC Act, 1961; DICGC Risk-Based Premium Framework; DICGC Annual Report 2025-26", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://www.dicgc.org.in/"}, {"id": "S1-0053", "sec": "S1", "q": "The rate of interest on a recurring deposit is generally:", "opts": ["The savings bank rate", "The term deposit rate applicable for the same tenor", "Fixed by RBI for all banks", "The term deposit rate minus 1%", "Zero for the first year"], "ans": 1, "exp": "Recurring deposits are a form of term deposit, and banks usually pay the term deposit rate for the corresponding maturity.", "src": "RBI Master Direction - Interest Rate on Deposits, 2016 (as amended)", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=10296"}, {"id": "S1-0201", "sec": "S1", "q": "Under SBI's Savings Bank Rules, a minor of 10 years or more who can sign uniformly may open an account in his or her single name with a maximum balance of ____; if the minor opens a joint account with the guardian, the cap is ____.", "opts": ["₹5 lakh; ₹10 lakh", "₹10 lakh; ₹20 lakh", "₹10 lakh; no limit", "₹2 lakh; ₹5 lakh", "₹20 lakh; ₹50 lakh"], "ans": 1, "exp": "The SB Rules (abridged) cap a minor's single account at ₹10 lakh and a joint account with the guardian at ₹20 lakh. Apart from these and the small account, there is no ceiling on SB balances.", "src": "SBI website (sbi.bank.in): Savings Bank Rules (Abridged) page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/web/personal-banking/accounts/saving-account/savings-bank-rulesabridged"}, {"id": "S1-0230", "sec": "S1", "q": "Arrange SBI's current account variants in ascending order of Monthly Average Balance required:", "opts": ["Silver, Gold, Diamond, Platinum, Palladium, Rhodium", "Gold, Silver, Platinum, Diamond, Rhodium, Palladium", "Silver, Gold, Platinum, Diamond, Palladium, Rhodium", "Silver, Diamond, Gold, Platinum, Rhodium, Palladium", "Gold, Silver, Diamond, Palladium, Platinum, Rhodium"], "ans": 0, "exp": "MAB: Regular ₹5,000; Silver ₹50,000; Gold ₹1 lakh; Diamond ₹5 lakh; Platinum ₹10 lakh; Palladium ₹25 lakh; Rhodium ₹50 lakh.", "src": "SBI website (sbi.bank.in): Compare Current Accounts page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/business/sme/current-accounts/compare-current-accounts"}, {"id": "S1-0259", "sec": "S1", "q": "Under SBI's Corporate Salary Package, an employee with a net monthly salary of ₹75,000 falls in which variant?", "opts": ["Silver", "Gold", "Diamond", "Platinum", "Rhodium"], "ans": 2, "exp": "By net salary: Silver ₹10,000 to ₹25,000; Gold above ₹25,000 to ₹50,000; Diamond above ₹50,000 to ₹1 lakh; Platinum above ₹1 lakh to ₹2 lakh; Rhodium above ₹2 lakh.", "src": "SBI website (sbi.bank.in): Salary Accounts - Corporate Salary Package page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/salary-account/corporate-salary-package"}, {"id": "S1-0275", "sec": "S1", "q": "For an existing SBI customer, the minimum Total Relationship Value (TRV) required to become an SBI Wealth client is:", "opts": ["₹10 lakh", "₹25 lakh", "₹30 lakh", "₹50 lakh", "₹1 crore"], "ans": 3, "exp": "Existing-to-Bank clients need a minimum TRV of ₹50 lakh. Clients may also qualify through an SBI Home Loan of ₹2 crore and above, or an Auto or Education Loan of ₹30 lakh and above.", "src": "SBI website (sbi.bank.in): SBI Wealth - Eligibility / Individual Clients page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/"}, {"id": "S1-0289", "sec": "S1", "q": "Which SBI current-account variant gives free cash deposit of 30 times the previous month's MAB, up to ₹25 lakh a month?", "opts": ["Regular", "Silver", "Gold", "Diamond", "Rhodium"], "ans": 1, "exp": "Silver: 30 times MAB, max ₹25 lakh. Regular: 100 times, max ₹5 lakh. Gold, Diamond, Platinum and Palladium: 15 times (max ₹100, 250, 500 and 800 lakh). Rhodium: 12 times, max ₹1,500 lakh. All limits include CDM, recycler, GCC and non-home branch deposits.", "src": "SBI website (sbi.bank.in): Business - Current Accounts - Compare Current Accounts page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/web/business/sme/current-accounts/compare-current-accounts"}, {"id": "S1-0309", "sec": "S1", "q": "As per SBI's eligibility table, which of these persons can open an NRO account but NOT an NRE or FCNR(B) account?", "opts": ["An NRI working in the UAE", "A PIO living in the UK", "A foreign student studying in India", "An OCI card holder living abroad", "An Indian seafarer on a foreign ship"], "ans": 2, "exp": "Foreign students and foreign tourists can open NRO accounts only (tourists' accounts need RBI approval beyond 6 months). NRIs, PIOs and OCIs can generally open NRO, NRE and FCNR(B) accounts; however, NRIs residing in Nepal or Bhutan cannot open NRO accounts. Foreign nationals employed in India open domestic accounts.", "src": "SBI website (sbi.bank.in): NRI - Eligibility for Account Opening (NRE / NRO / FCNR(B)) page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/nri/accounts/eligibility-fcnr"}, {"id": "S1-0328", "sec": "S1", "q": "The Banking Companies (Nomination) Rules, 2025, along with the amended nomination sections of the Banking Regulation Act, came into force from:", "opts": ["1 April 2025", "1 August 2025", "1 November 2025", "1 January 2026", "16 December 2025"], "ans": 2, "exp": "Effective 1 November 2025, following the Banking Laws (Amendment) Act, 2025, which amended Sections 45ZA, 45ZC and 45ZE of the BR Act. RBI issued matching Nomination Directions, 2025.", "src": "SBI website (sbi.bank.in): Personal Banking - Nomination Facility page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/personal-banking/nomination-facility"}, {"id": "S1-0351", "sec": "S1", "q": "For calculating interest on INR domestic deposits, SBI reckons the number of days in a year as:", "opts": ["360 days", "365 days, including in a leap year", "366 days in a leap year, 365 otherwise", "Actual days / 364", "360 days for TDR, 365 for SB"], "ans": 1, "exp": "365 days for all INR domestic deposits, leap year included. FCNR(B): interest calculated at 180-day intervals and then actual days, on a 360-day year. STDR: compounded quarterly, broken period on 365 days; TDR below 3 months: actual days / 365.", "src": "SBI website (sbi.bank.in): Interest Rates - Deposit Rates - Method of Calculation page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/interest-rates/interest-rates/deposit-rates"}, {"id": "S1-0362", "sec": "S1", "q": "Under SBI's revised locker agreement, before breaking open a locker of an untraceable hirer, the bank must issue a public notice of at least ____ in at least ____ newspapers.", "opts": ["1 month; one", "3 months; two (one English and one local language)", "6 months; three", "15 days; two", "2 months; one national"], "ans": 1, "exp": "Break-open happens before a committee of two bank officers and two independent witnesses; an inventory is made, contents are valued and kept sealed in a fireproof safe. Before any auction of contents, a further notice of at least 3 months is sent. The licence runs one year and is auto-extended; rent is recovered every 2 April.", "src": "SBI document on sbi.bank.in: Revised Safe Deposit Locker Agreement, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/documents/16012/22770835/050723-Revised+Locker+Agreement.pdf/267aa854-5133-9f9a-e1ed-80bc134d5898"}, {"id": "S1-0367", "sec": "S1", "q": "Under RBI's deposit-interest directions, banks may accept interest-free deposits only in:", "opts": ["Savings accounts of minors", "Current accounts", "Term deposits below 7 days", "Escrow accounts", "Any account, at the depositor's request"], "ans": 1, "exp": "RBI prohibits interest-free deposits other than in current accounts; banks may not accept interest-free deposits in any other account. (Savings deposits always earn interest, calculated on the daily balance.)", "src": "RBI FAQ on Interest Rate on Deposits Directions, 2025, and MD Interest Rate on Deposits (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://www.rbi.org.in/commonman/Upload/English/FAQs/PDFs/FAQIRD01042025.pdf"}, {"id": "S2-0001", "sec": "S2", "q": "Under RBI's framework for early recognition of stress, an account with principal or interest overdue for 61 to 90 days is classified as:", "opts": ["SMA-0", "SMA-1", "SMA-2", "Sub-standard asset", "NPA"], "ans": 2, "exp": "SMA-0 is up to 30 days overdue, SMA-1 is 31 to 60 days, and SMA-2 is 61 to 90 days. Beyond 90 days the account becomes an NPA.", "src": "RBI Prudential Framework for Resolution of Stressed Assets, 7 Jun 2019", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=11580"}, {"id": "S2-0004", "sec": "S2", "q": "Under the MSME classification revised with effect from 1 April 2025, a micro enterprise has investment and turnover not exceeding:", "opts": ["₹1 crore and ₹5 crore", "₹2.5 crore and ₹10 crore", "₹2 crore and ₹10 crore", "₹5 crore and ₹25 crore", "₹10 crore and ₹50 crore"], "ans": 1, "exp": "From 1 April 2025, micro means investment up to ₹2.5 crore and turnover up to ₹10 crore; small up to ₹25 crore and ₹100 crore; medium up to ₹125 crore and ₹500 crore.", "src": "Ministry of MSME notification revising MSME criteria, effective 1 Apr 2025", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://msme.gov.in/"}, {"id": "S2-0007", "sec": "S2", "q": "For an individual housing loan of ₹25 lakh, the maximum loan-to-value (LTV) ratio permitted is:", "opts": ["75%", "90%, including stamp duty and registration charges", "80%", "85%", "90%"], "ans": 4, "exp": "LTV caps are 90% for loans up to ₹30 lakh, 80% above ₹30 lakh up to ₹75 lakh, and 75% above ₹75 lakh.", "src": "RBI Master Circular - Housing Finance", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasterCirculars.aspx"}, {"id": "S2-0015", "sec": "S2", "q": "Interest on a non-performing asset is recognised as income:", "opts": ["When it falls due", "When it is debited to the account", "Only when it is actually realised", "On accrual, if security value covers the loan", "At the end of each quarter"], "ans": 2, "exp": "Income from NPAs is recognised only on realisation, not on accrual.", "src": "RBI Master Circular - Prudential norms on Income Recognition, Asset Classification and Provisioning", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasterCirculars.aspx"}, {"id": "S2-0022", "sec": "S2", "q": "After a loan is fully repaid, the original property documents must be released within 30 days. If the delay beyond that is attributable to the bank, it must compensate the borrower, for each day of delay:", "opts": ["₹1,000", "₹500", "₹2,500", "₹5,000", "₹10,000"], "ans": 3, "exp": "For delay attributable to the bank beyond 30 days, compensation is ₹5,000 per day, for cases where release is due on or after 1 December 2023. If documents are lost or damaged, the bank must help obtain duplicates and pay the compensation, with a further 30 days allowed.", "src": "RBI circular on Responsible Lending Conduct - Release of property documents, 13 Sep 2023", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/"}, {"id": "S2-0025", "sec": "S2", "q": "For an individual housing loan of ₹50 lakh, the maximum loan-to-value ratio permitted is:", "opts": ["75%", "80% plus stamp duty and registration charges", "80%", "85%", "90%"], "ans": 2, "exp": "The LTV cap is 80% for loans above ₹30 lakh and up to ₹75 lakh; 90% up to ₹30 lakh; 75% above ₹75 lakh.", "src": "RBI Master Circular - Housing Finance", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasterCirculars.aspx"}, {"id": "S2-0053", "sec": "S2", "q": "A bill of exchange payable after a stated period (for example, 90 days after sight) is a:", "opts": ["Demand bill", "Usance bill", "Accommodation bill", "Documentary demand bill", "Clean bill"], "ans": 1, "exp": "Usance bills are payable after a period and are financed by discounting; demand bills are payable on presentation and are financed by purchase.", "src": "Negotiable Instruments Act, 1881", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://indiacode.gov.in/"}, {"id": "S2-0201", "sec": "S2", "q": "For SBI's Personal Loan to salaried employees with a salary package account, the minimum service required is ____ for Government and Defence employees and ____ for Corporate-sector employees.", "opts": ["3 months; 6 months", "6 months; 12 months", "1 year; 2 years", "6 months; 24 months", "12 months; 12 months"], "ans": 1, "exp": "Government/Defence: 6 months; Corporate: 12 months. Age 21 to 60 years; loan up to ₹50 lakh, without security or guarantor, as a term loan or an overdraft with reducing drawing power.", "src": "SBI website (sbi.bank.in): SBI Personal Loan (Loans to Salaried Employees) page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/personal-banking/loans/personal-loans/sbi-personal-loan"}, {"id": "S2-0228", "sec": "S2", "q": "Under SBI's Kisan Credit Card, collateral security is waived for limits up to ____, and up to ____ where there is a tie-up arrangement.", "opts": ["₹1.60 lakh; ₹2 lakh", "₹2 lakh; ₹3 lakh", "₹3 lakh; ₹5 lakh", "₹1.60 lakh; ₹3 lakh", "₹2 lakh; ₹5 lakh"], "ans": 1, "exp": "SBI waives collateral for KCC limits up to ₹2 lakh, and up to ₹3 lakh with a tie-up arrangement. Above that, a mortgage of land or property worth 100% of the loan is taken.", "src": "SBI website (sbi.bank.in): Agri & Rural - Kisan Credit Card page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/agri-rural/yuva-kisan-credit-card"}, {"id": "S2-0263", "sec": "S2", "q": "SBI's Shaurya Education Loan is available to wards or spouses of serving or retired personnel of which forces, maintaining their salary or pension account with SBI?", "opts": ["Only Army", "Defence, Indian Coast Guard and Central Armed Police Forces", "State Police", "Railways and Defence", "All Central Government employees"], "ans": 1, "exp": "Shaurya: wards/spouses (or the personnel themselves) of Defence, Coast Guard and CAPF with DSP/ICGSP/CAPSP salary or pension accounts. Margin nil up to ₹4 lakh, 5% above; processing fee nil up to ₹20 lakh, ₹10,000 above; repayment up to 15 years; 6 months' grace to create a mortgage.", "src": "SBI website (sbi.bank.in): Personal Banking - Shaurya Education Loan page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/personal-banking/shaurya-education-loan"}, {"id": "S2-0280", "sec": "S2", "q": "Under SBI's MSME Udaan (finance to start-ups), the maximum loan and the door-to-door repayment period are:", "opts": ["₹10 crore; 60 months", "₹50 crore; 120 months", "₹25 crore; 84 months", "₹100 crore; 180 months", "₹5 crore; 120 months"], "ans": 1, "exp": "Up to ₹50 crore (two bands: up to ₹50 lakh and above), repayment up to 120 months including moratorium, bullet allowed; nil margin up to ₹10 lakh. For DPIIT-recognised start-ups with Udyam registration, up to 10 years old, turnover not above ₹100 crore in any year, backed by a recognised incubator/accelerator/investor.", "src": "SBI website (sbi.bank.in): Business - SME - Finance to Start-ups (MSME UDAAN) page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/web/business/s/sme/sme-loans/finance-to-start-ups-msme-udaan"}, {"id": "S2-0323", "sec": "S2", "q": "Per SBI's Commercial Loan FAQ (citing RBI's MSME Master Direction), the time limit for conveying a credit decision on an MSME loan up to ₹25 lakh is:", "opts": ["7 days", "14 days", "21 days", "30 days", "45 days"], "ans": 1, "exp": "14 days for loans up to ₹25 lakh. Through psbloansin59minutes.com, in-principle digital approval comes in 59 minutes, with sanction/disbursal generally in 7-8 working days. Collateral is not required for MSME loans up to ₹10 lakh; with CGTMSE cover SBI lends collateral-free up to ₹500 lakh.", "src": "SBI website (sbi.bank.in): FAQs - Commercial Loan page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/faq-s/faqs-on-commercial-loan"}, {"id": "S2-0329", "sec": "S2", "q": "Under SBI's Policy on Penal Charges (w.e.f. 01.01.2026), total penal charges on a borrower cannot exceed, whatever the number of non-compliances:", "opts": ["2% a year of the outstanding", "5% a year of the sanctioned limit or outstanding balance, whichever is higher", "5% a year of the outstanding, whichever is lower", "10% of the sanctioned limit", "1% a month of the overdue amount"], "ans": 1, "exp": "Overall cap 5% p.a. of sanctioned limit/outstanding (whichever is higher). Charges are applied monthly for the actual period, and GST does not apply to penal charges except prepayment/foreclosure and commitment charges. Irregularity: 2.40% p.a. up to 60 days, 5% p.a. beyond.", "src": "SBI document on sbi.bank.in: Policy on Penal Charges in Loans and Advances w.e.f. 01.01.2026, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/documents/16012/22770835/Penal+Charges+Website+Display.pdf/3c6461ec-4e4a-fb18-3c5c-46b7a2ab0850"}, {"id": "S2-0335", "sec": "S2", "q": "Under ECLGS 5.0, after an account turns NPA, NCGTC pays the interim claim of ____ of the amount in default within ____ of the claim.", "opts": ["50%; 60 days", "75%; 30 days", "90%; 30 days", "100%; 90 days", "75%; 90 days"], "ans": 1, "exp": "75% interim within 30 days (after legal action has been initiated - a recall notice alone is not enough); the balance 25% on conclusion of recovery or three years from the first settlement, whichever is earlier. NPA must be marked on the portal within 90 days. Recoveries must be remitted within 30 days, else interest at repo + 4%.", "src": "SBI document on sbi.bank.in: FAQs on ECLGS 5.0 (updated 07.07.2026), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/"}, {"id": "S2-0343", "sec": "S2", "q": "Under the SBI Scholar Loan MITC, the maximum loan WITHOUT security for institutes in List AA, A, B and C respectively is:", "opts": ["₹50 lakh; ₹40 lakh; ₹30 lakh; ₹7.5 lakh", "₹40 lakh; ₹30 lakh; ₹20 lakh; ₹7.5 lakh", "₹50 lakh; ₹30 lakh; ₹20 lakh; ₹10 lakh", "₹1 crore; ₹50 lakh; ₹30 lakh; ₹7.5 lakh", "₹50 lakh; ₹40 lakh; ₹20 lakh; ₹4 lakh"], "ans": 0, "exp": "With tangible collateral, List AA/A/B are need-based and List C goes above ₹7.5 lakh up to ₹1 crore. Parent/guardian co-obligation is optional for List AA institutes. Penal charges: 2.40% p.a. on the irregular portion up to 60 days; 5% p.a. on the outstanding if continuously irregular beyond 60 days.", "src": "SBI document on sbi.bank.in: SBI Scholar Loan - Most Important Terms and Conditions, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/documents/16012/75685/210224-MITC_17.02.2024.pdf/83069b89-7e74-a690-9031-db33c522cdd1"}, {"id": "S2-0345", "sec": "S2", "q": "For loans up to ____ to Micro and Small Enterprise borrowers, the credit decision must be taken within at most ____.", "opts": ["₹10 lakh; 7 working days", "₹25 lakh; 14 working days", "₹25 lakh; 21 days", "₹50 lakh; 14 working days", "₹1 crore; 30 days"], "ans": 1, "exp": "This assumes a complete application with all documents. The 21-day figure is the time for a lender to convey consent or objection to a request to transfer or take over an MSME loan. A composite loan of up to ₹1 crore (working capital plus term loan) can be sanctioned through a single window.", "src": "Ministry of MSME handbook \"Know Your Lender, Grow Your Business\" (on sbi.bank.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/"}, {"id": "S2-0349", "sec": "S2", "q": "As of March 2026, SBI's market share in education loans among all scheduled commercial banks was about:", "opts": ["18.5%", "24.6%", "32.9%", "41.2%", "50.3%"], "ans": 2, "exp": "SBI is India's largest education-loan lender (32.94% among ASCBs). It offers collateral-free loans of up to ₹50 lakh for admission to the top 100 global institutions, and Digital Document Execution for unsecured education loans.", "src": "SBI Annual Report 2025-26 (sbi.bank.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/web/investor-relations/annual-report"}, {"id": "S2-0350", "sec": "S2", "q": "Within the 18% agriculture target for domestic commercial banks, the sub-targets under the PSL Directions, 2025 are:", "opts": ["10% for non-corporate farmers, of which 8% for small and marginal farmers", "14% for non-corporate farmers, of which 10% for small and marginal farmers", "12% for small and marginal farmers only", "14% for small and marginal farmers, of which 10% for marginal farmers", "8% for small and marginal farmers"], "ans": 1, "exp": "Non-corporate farmers include individual farmers, proprietorship firms of farmers, and SHGs/JLGs of farmers. The same 18/14/10 structure applies to RRBs and SFBs; foreign banks with fewer than 20 branches have no agriculture target.", "src": "RBI Master Direction - Priority Sector Lending (Targets and Classification) Directions, 2025, updated 11 Sept 2026 (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=12799"}, {"id": "S2-0369", "sec": "S2", "q": "Under RBI's co-lending directions effective 1 January 2026, each regulated entity in a co-lending arrangement must retain at least ____ of each individual loan in its books.", "opts": ["5%", "10%", "20%", "25%", "30%"], "ans": 1, "exp": "The old 2020 bank-NBFC model required the NBFC to retain at least 20%. The new framework applies to arrangements between banks, AIFIs and NBFCs (including HFCs), for any loan type, PSL or not, but not to consortium, multiple banking or syndicated loans. Banks can claim PSL status for their share of PSL-eligible co-lent loans.", "src": "RBI (Commercial Banks - Transfer and Distribution of Credit Risk) Directions, 2025, updated 1 Oct 2026 (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=13151"}, {"id": "S2-0373", "sec": "S2", "q": "Under RBI's 2025 directions on lending against gold and silver, the maximum LTV for consumption loans where the total loan per borrower is above ₹2.5 lakh and up to ₹5 lakh is:", "opts": ["75%", "80%", "85%", "90%", "70%"], "ans": 1, "exp": "Up to ₹2.5 lakh: 85%; above ₹2.5 lakh up to ₹5 lakh: 80%; above ₹5 lakh: 75%. For bullet-repayment loans, both the loan amount and the LTV are calculated on the total amount payable at maturity (principal plus interest). LTV must be maintained throughout the tenor.", "src": "RBI (Lending Against Gold and Silver Collateral) Directions, 2025, updated 29 Sept 2025 (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://rbi.org.in/scripts/NotificationUser.aspx?Mode=0&Id=12859"}, {"id": "S2-0380", "sec": "S2", "q": "Under RBI's KCC Scheme Directions, 2026, applicable to KCC loans sanctioned from 1 January 2027, the composite KCC facility has a tenure of:", "opts": ["3 years", "5 years", "6 years", "7 years", "10 years"], "ans": 2, "exp": "Under the KCC Directions, 2026, KCCs sanctioned from 1 January 2027 have a six-year tenure. The KCC limit (Composite Maximum Permissible Limit) is the short-term limit fixed for the sixth year plus the estimated long-term (investment) limit. Under the earlier scheme, banks decided the card's validity and the limit was projected over 5 years. Loans sanctioned before 1 January 2027 follow the old guidelines till maturity or next renewal.", "src": "RBI [Commercial Banks - Kisan Credit Card (KCC) Scheme] Directions, 2026 (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/scripts/BS_ViewMasDirections.aspx?id=13522"}, {"id": "S2-0388", "sec": "S2", "q": "Under RBI's Interest Rates on Advances Directions, 2025, floating-rate loans that MUST be linked to an external benchmark are:", "opts": ["All corporate loans", "Personal/retail loans (housing, auto, etc.) and loans to MSMEs", "Only home loans", "All loans above ₹1 crore", "Agricultural loans only"], "ans": 1, "exp": "Permitted external benchmarks: RBI's policy repo rate, the 3-month or 6-month Treasury Bill yield published by FBIL, or any other FBIL benchmark. A bank must use one uniform external benchmark within a loan category. Banks may also offer EBLR loans to other borrowers.", "src": "RBI (Commercial Banks - Interest Rates on Advances) Directions, 2025 (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=13149&Mode=0"}, {"id": "S3-0001", "sec": "S3", "q": "The minimum amount that can be sent through RTGS is:", "opts": ["₹50,000", "No minimum", "₹1 lakh", "₹2 lakh", "₹5 lakh"], "ans": 3, "exp": "RTGS is meant for large-value payments, with a minimum of ₹2 lakh and no upper limit. NEFT has no minimum.", "src": "RBI RTGS System Regulations", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://www.rbi.org.in/"}, {"id": "S3-0003", "sec": "S3", "q": "Payment systems in India are regulated and supervised by RBI under:", "opts": ["The Banking Regulation Act, 1949", "The Payment and Settlement Systems Act, 2007", "The Information Technology Act, 2000", "The RBI Act, 1934, Section 45L", "The FEMA, 1999"], "ans": 1, "exp": "The Payment and Settlement Systems Act, 2007 designates RBI as the authority to regulate and supervise payment systems. RBI exercises these powers through the Payments Regulatory Board (PRB), which replaced the Board for Regulation and Supervision of Payment and Settlement Systems (BPSS) from 9 May 2025.", "src": "Payment and Settlement Systems Act, 2007", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://indiacode.gov.in/"}, {"id": "S3-0008", "sec": "S3", "q": "A customer reports an unauthorised electronic debit within 3 working days of receiving the bank's communication about it, and the fraud was due to a third-party breach (neither the bank nor the customer at fault). The customer's liability is:", "opts": ["Nil", "The transaction value or ₹5,000, whichever is lower", "Up to ₹5,000", "Up to ₹10,000", "The full amount"], "ans": 0, "exp": "Zero liability: where the deficiency lies elsewhere in the system (third-party breach) and the customer reports within 3 working days of receiving the bank's communication (the day of receipt excluded). If reported in 4-7 working days, liability is limited to the transaction value or a fixed cap (₹5,000 to ₹25,000 depending on account type), whichever is lower.", "src": "RBI circular on Customer Protection - Limiting Liability of Customers in Unauthorised Electronic Banking Transactions, 6 Jul 2017", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/"}, {"id": "S3-0011", "sec": "S3", "q": "The national helpline number for reporting cyber financial fraud is:", "opts": ["100", "1800-11-0001", "112", "1930", "14440"], "ans": 3, "exp": "Victims can call 1930 or report at cybercrime.gov.in under the Citizen Financial Cyber Fraud Reporting and Management System.", "src": "Ministry of Home Affairs, Indian Cyber Crime Coordination Centre (I4C)", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1}, {"id": "S3-0025", "sec": "S3", "q": "Unified Payments Interface (UPI) was launched by NPCI in:", "opts": ["2010", "2015", "2014", "2016", "2019"], "ans": 3, "exp": "UPI was launched in April 2016 and became the dominant retail payment system within a few years.", "src": "NPCI - UPI product overview", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://www.npci.org.in/"}, {"id": "S3-0201", "sec": "S3", "q": "SBI Green Remit Card is used for:", "opts": ["International ATM withdrawals", "Cash deposits by non-account holders into a designated SBI account through Green Channel Counters or CDMs", "Contactless metro travel", "Online shopping without PIN", "Paying utility bills through POS"], "ans": 1, "exp": "The Green Remit Card is a magstripe card without PIN, mapped to one beneficiary's SBI account, for cash deposits at Green Channel Counters and Cash Deposit Machines. Issue charge ₹20 + GST.", "src": "SBI website (sbi.bank.in): Green Remit Card page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://sbi.bank.in/web/personal-banking/cards/debit-card/green-remit-card"}, {"id": "S3-0209", "sec": "S3", "q": "To register for SBI WhatsApp Banking, a customer sends \"Hi\" to:", "opts": ["+91 72089 33148", "+91 90226 90226", "+91 80082 02020", "+91 94491 12211", "+91 72089 33145"], "ans": 1, "exp": "SBI WhatsApp Banking: send 'Hi' to +91 90226 90226 and complete OTP authentication. It supports voice commands and 8 languages (English, Hindi, Tamil, Telugu, Bengali, Marathi, Gujarati and Punjabi).", "src": "SBI website (sbi.bank.in): WhatsApp Banking page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://sbi.bank.in/web/personal-banking/digital/whatsapp-banking"}, {"id": "S3-0223", "sec": "S3", "q": "YONO Cash allows cardless cash withdrawal at which SBI touch points?", "opts": ["SBI ATMs only", "SBI ATMs, SBI merchant POS terminals and SBI Customer Service Points", "Any bank's ATM through UPI", "SBI branches only", "SBI ATMs and other banks' ATMs"], "ans": 1, "exp": "YONO Cash works at SBI ATMs, SBI merchant POS terminals and SBI CSPs in India, without a card or withdrawal slip. Cardless deposits can also be made at SBI cash deposit machines.", "src": "SBI website (sbi.bank.in): YONO - What is YONO Cash page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://sbi.bank.in/web/yono/what-is-yono-cash"}, {"id": "S3-0254", "sec": "S3", "q": "From 1 October 2026, SBI Salary Package account holders get how many free transactions a month at other banks' ATMs?", "opts": ["Unlimited", "10", "5", "3", "Nil"], "ans": 2, "exp": "Salary package accounts: unlimited until November 2025, 10 from 1 December 2025, and 5 from 1 October 2026 (financial plus non-financial). After that, ₹23 + GST per cash withdrawal and ₹11 + GST per non-financial transaction.", "src": "SBI public notice on its website: Revision in number of free monthly ATM transactions at other bank ATMs for Salary Package accounts w.e.f. 1 October 2026, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/documents/16012/22770835/01092026_Revision+in+monthly+FREE+ATM+transactions+of+Salary+Package+Accounts+w.e.f.+1st+October+2026.pdf/1669118d-50df-808a-077f-1a6246447354"}, {"id": "S3-0262", "sec": "S3", "q": "On SBI's Visa Infinite debit card, the complimentary personal accident cover for air accident death is:", "opts": ["₹10 lakh", "₹20 lakh", "₹50 lakh", "₹1 crore", "₹2 crore"], "ans": 3, "exp": "Visa Infinite: non-air ₹50 lakh, air ₹1 crore, purchase protection ₹1 lakh; 2 domestic lounge visits a quarter. Mastercard World: ₹10 lakh / ₹20 lakh. HPCL Everyday card: ₹5 lakh / ₹10 lakh. Cover needs at least one financial transaction in the 90 days before the accident (air cover also needs the ticket bought on the card).", "src": "SBI website (sbi.bank.in): Personal Banking - VISA Infinite Debit Card page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/web/personal-banking/cards/debit-card/visa-infinite-debit-card"}, {"id": "S3-0274", "sec": "S3", "q": "For foreign Visa and Mastercard cardholders, SBI ATMs offer Dynamic Currency Conversion (DCC) in how many currencies?", "opts": ["5", "10", "15", "21", "30"], "ans": 3, "exp": "DCC lets foreign cardholders transact in their home currency (21 currencies). SBI has 64,000+ ATMs/ADWMs (about 12,000+ ADWMs that also accept cash deposits), connected to NFS (including RuPay), Visa and Mastercard.", "src": "SBI website (sbi.bank.in): Personal Banking - ATM Services page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/web/personal-banking/information-services/kyc-guidelines/atm-services"}, {"id": "S3-0287", "sec": "S3", "q": "For an Insta Plus (Video KYC) savings account on YONO, the video call must be completed within ____ of token generation, and slots can be booked for the next ____.", "opts": ["2 days; 7 days", "5 days; 3 working days", "7 days; 5 working days", "30 days; 10 days", "24 hours; 1 day"], "ans": 1, "exp": "Video calls only in office hours on working days; resumable if dropped. Single mode of operation only; new-to-bank resident literate adults; nomination mandatory; RuPay Classic card; account active for debits after verification by bank officials.", "src": "SBI website (sbi.bank.in): YONO - Savings Account through Video KYC (Insta Plus) page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/web/yono/insta-plus-savings-bank-account"}, {"id": "S3-0298", "sec": "S3", "q": "After setting or resetting the UPI PIN on SBI apps, an Android user can transact at most ____ in the first ____.", "opts": ["₹1,000; 12 hours", "₹5,000; 24 hours", "₹10,000; 24 hours", "₹5,000; 5 days", "₹25,000; 48 hours"], "ans": 1, "exp": "Android: ₹5,000 in total for the first 24 hours; iOS: ₹5,000 a day for the first 5 days. Then ₹1 lakh per transaction and per day on BHIM SBI Pay, UPI on YONO or YFEI.", "src": "SBI website (sbi.bank.in): YONO Blog - Secure Every UPI Payment: Limits and Cooling Periods, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/yono/blog/understand-upi-transaction-limits-cooling-period-and-payment-tips"}, {"id": "S3-0312", "sec": "S3", "q": "On BHIM SBI Pay / YONO UPI, a user can create at most ____ VPAs, and a self-chosen numeric \"UPI number\" (mapper) must be ____ digits long.", "opts": ["1; 6", "3; 8 to 10 (a 10-digit number must be the user's own mobile number)", "5; 10 only", "3; 6 to 8", "10; 12"], "ans": 1, "exp": "Max 3 VPAs; one VPA can be linked to several accounts, with a default/primary account receiving credits. UPI numbers are 8-10 digits; a 10-digit one must be the user's mobile number. VPA handles: @sbi or @oksbi.", "src": "SBI website (sbi.bank.in): Customer Care - FAQ - UPI page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/web/customer-care/upi"}, {"id": "S3-0320", "sec": "S3", "q": "Per SBI's RTGS/NEFT FAQ, a beneficiary bank must credit an RTGS remittance within ____ of receiving it, and if it cannot, return it within ____.", "opts": ["2 hours; 4 hours", "30 minutes; one hour or before end of the RTGS business day, whichever is earlier", "1 hour; same day", "15 minutes; 30 minutes", "Immediately; T+1"], "ans": 1, "exp": "RTGS: credit within 30 minutes, return within 1 hour (or end of day). NEFT: half-hourly batches 24x7; credit expected within 2 hours of the batch; failed credits returned within B+2 hours. RTGS minimum ₹2 lakh, no maximum; NEFT from ₹1, no maximum. LEI is required for eligible large-value transactions.", "src": "SBI website (sbi.bank.in): FAQs - RTGS/NEFT page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/personal-banking/rtgs-neft"}, {"id": "S3-0324", "sec": "S3", "q": "Which SBI Corporate Internet Banking product is a complete multi-user suite for large corporates and government bodies, allowing up to ₹2,000 crore per transaction across accounts at many branches?", "opts": ["Khata", "Saral", "Vyapaar", "Vistaar", "Two User"], "ans": 3, "exp": "Khata: single-user enquiry only (cannot be upgraded). Khata Plus: multi-user enquiry, many branches. Saral: single-user transactional for proprietors/micro units. Two User: ₹50 lakh per transaction, single or joint authorisation. Vyapaar: multi-user transactional, single branch, ₹2 crore per transaction. Vistaar: multi-branch, ₹2,000 crore per transaction, no daily count limit.", "src": "SBI website (sbi.bank.in): FAQs - Corporate Internet Banking page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/faq-s/-faq-corporate-internet-banking"}, {"id": "S3-0333", "sec": "S3", "q": "If a bank issues an unsolicited credit card (or upgrades a card) and activates and bills it without the recipient's explicit consent, it must reverse the charges and also pay the recipient a penalty of:", "opts": ["₹500", "An amount equal to the charges", "Twice the value of the charges reversed", "₹100 per day", "Nothing more"], "ans": 2, "exp": "The recipient may also approach the RBI Ombudsman for compensation. Any loss from misuse of unsolicited cards before delivery is the card-issuer's responsibility. Renewal or replacement cards are not \"unsolicited\"; on renewal the holder must be given the option to decline.", "src": "RBI Credit Card and Debit Card - Issuance and Conduct Directions, 2022 (upd. 7 Mar 2024), consolidated in the 2025 Commercial Banks card Directions (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=12300"}, {"id": "S3-0341", "sec": "S3", "q": "Under RBI's Digital Lending Directions, 2025, a borrower may exit a digital loan without penalty during a \"cooling-off period\" of at least:", "opts": ["1 day, as fixed by the lender's Board", "3 days", "7 days", "15 days", "30 days"], "ans": 0, "exp": "The borrower repays the principal and the proportionate APR; the lender may keep a reasonable one-time processing fee if disclosed upfront in the Key Fact Statement. After the cooling-off period, prepayment follows normal RBI rules.", "src": "RBI (Digital Lending) Directions, 2025, 8 May 2025 (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=12848"}, {"id": "S4-0001", "sec": "S4", "q": "The Reserve Bank - Integrated Ombudsman Scheme, 2026 came into force on:", "opts": ["12 November 2021", "1 April 2026", "1 July 2026", "1 October 2026", "1 January 2026"], "ans": 2, "exp": "RB-IOS 2026 came into force on 1 July 2026 and repealed RB-IOS 2021 (which had started on 12 November 2021). Complaints received before 1 July 2026 continue under the 2021 scheme.", "src": "Reserve Bank - Integrated Ombudsman Scheme, 2026 (in force from 1 July 2026), as published on SBI's website", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/"}, {"id": "S4-0007", "sec": "S4", "q": "The RBI portal that lets the public search for their unclaimed deposits across several banks in one place is called:", "opts": ["SAMPARK", "UDGAM", "PRAVAAH", "SACHET", "DAKSH"], "ans": 1, "exp": "UDGAM (Unclaimed Deposits - Gateway to Access inforMation) was launched in August 2023.", "src": "RBI press release on UDGAM portal, 17 Aug 2023", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://www.rbi.org.in/"}, {"id": "S4-0053", "sec": "S4", "q": "A CTS-2010 standard cheque carries security features such as:", "opts": ["A magnetic stripe", "A \"VOID\" pantograph and the bank's logo in ultraviolet ink", "A hologram of the RBI Governor", "A QR code for the payee", "A microchip embedded in the leaf"], "ans": 1, "exp": "Features include a VOID pantograph that shows up on photocopies, the bank logo printed in invisible UV ink, and standard field placement for image-based clearing.", "src": "RBI instructions on CTS-2010 standard cheque features", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/"}, {"id": "S4-0083", "sec": "S4", "q": "When a customer deposits money in a savings or current account, the relationship between banker and customer is primarily that of:", "opts": ["Trustee and beneficiary", "Debtor and creditor", "Pledgee and pledgor", "Agent and principal", "Bailee and bailor"], "ans": 1, "exp": "The bank becomes the debtor and the customer the creditor; the bank need not keep the same notes and may use the money, repaying on demand.", "src": "Banker-customer relationship (case law and standard practice)", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1}, {"id": "S4-0201", "sec": "S4", "q": "The origin of State Bank of India goes back to the establishment of which bank, and when?", "opts": ["Bank of Bengal, 2 January 1809", "Bank of Calcutta, 2 June 1806", "Bank of Bombay, 15 April 1840", "Bank of Hindostan, 1770", "General Bank of India, 1786"], "ans": 1, "exp": "SBI traces its origin to the Bank of Calcutta, set up on 2 June 1806. Three years later it received its charter and was re-designated the Bank of Bengal (2 January 1809), the first joint-stock bank of British India sponsored by the Government of Bengal.", "src": "SBI website (sbi.bank.in): About Us - Evolution of SBI, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://sbi.bank.in/web/about-us"}, {"id": "S4-0227", "sec": "S4", "q": "In SBI's grievance redressal and escalation mechanism, the correct order of levels is:", "opts": ["Branch → DGM (CX) → AGM (CX) → Banking Ombudsman", "Branch → AGM (CX) → DGM (CX) → Banking Ombudsman", "Branch → Banking Ombudsman → AGM (CX) → DGM (CX)", "Contact Centre → Chairman → Banking Ombudsman", "Branch → Regional Manager → Local Head Office → Corporate Centre"], "ans": 1, "exp": "Level 1 is the branch, Level 2 the AGM (Customer Experience), Level 3 the DGM (Customer Experience), and Level 4 the Banking Ombudsman, with complaints to RBI through the CMS portal.", "src": "SBI website (sbi.bank.in): Customer Care - Grievance Redressal and Escalation Mechanism page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/customer-care/grievance-redressal-and-escalation-mechanism"}, {"id": "S4-0245", "sec": "S4", "q": "Under SBI's RTI arrangement, who has been designated as Assistant Central Public Information Officers (ACPIOs)?", "opts": ["Regional Managers", "All Branch Managers of SBI branches", "Chief Managers (Customer Service) only", "The Chief General Manager of each circle", "Compliance officers at LHOs"], "ans": 1, "exp": "All SBI Branch Managers are ACPIOs; they receive applications, enter them in a register, acknowledge them, and forward them to the concerned CPIO. Information can be given only to citizens of India.", "src": "SBI website (sbi.bank.in): Corporate Governance - Information page (G-SIB indicators, CSR, FEDAI/FIMMDA, RTI), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://sbi.bank.in/web/corporate-governance/information"}, {"id": "S4-0250", "sec": "S4", "q": "Under the RTI Act, information concerning the life or liberty of a person must be supplied within:", "opts": ["24 hours", "48 hours", "72 hours", "5 days", "7 days"], "ans": 1, "exp": "Life or liberty: 48 hours. Normal course: 30 days. When received through a CAPIO, 5 days are added to either limit. If the time limit is missed, the information must be given free of charge.", "src": "SBI website (sbi.bank.in): Corporate Governance - Right to Information Act 2005 page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/corporate-governance/right-to-information-act-2005"}, {"id": "S4-0267", "sec": "S4", "q": "Under SBI's cheque collection policy, the outer time limit for collecting an outstation cheque drawn on an SBI branch between two metro / major \"A\" class cities is ____, against ____ for a cheque drawn on another bank.", "opts": ["3 days; 5 days", "6 days; 7 days", "7 days; 10 days", "8 days; 10 days", "10 days; 14 days"], "ans": 1, "exp": "SBI branches / other banks: metros and major A-class cities 6/7 days; between those and state capitals or Area I cities (Pune, Nagpur, Kanpur, Surat, Agra, Varanasi etc.) 8/10 days; all other centres 10/14 days. These are outer limits; credit is given as soon as proceeds are realised.", "src": "SBI website (sbi.bank.in): Customer Care - Arrangements For Collection Of Domestic Cheques page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/web/customer-care/arrangements-for-collection-of-domestic-cheques"}, {"id": "S4-0283", "sec": "S4", "q": "Under RBI's Internal Ombudsman Directions, 2026, a bank's Internal Ombudsman must be of rank equivalent to ____ with at least ____ of relevant experience.", "opts": ["AGM; 5 years", "General Manager; 7 years", "Chief General Manager; 10 years", "DGM; 5 years", "Executive Director; 15 years"], "ans": 1, "exp": "IO: GM-equivalent (retired or serving, from an RE or a financial-sector regulator), 7 years' experience, never employed by the bank or its group, not over 70 at end of tenure. Deputy IO: DGM-equivalent, 5 years. Tenure fixed at not less than 3 years, total not more than 5. The IO reports administratively to the WTD/ED in charge of customer service and functionally to the Customer Service Committee of the Board.", "src": "RBI (Commercial Banks - Internal Ombudsman) Directions, 2026 (14 Jan 2026), as hosted on sbi.bank.in Customer Service Policies, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/"}, {"id": "S4-0286", "sec": "S4", "q": "Under SBI's Compensation Policy, where a fraud in a customer's account is established to have been committed by a member of staff, the bank will:", "opts": ["Restore the amount only after the police case is closed", "Restore the amount and also pay compensation at 1% above the applicable interest rate for the period, on the amount involved", "Restore 50% of the amount", "Pay ₹100 per day of delay", "Restore the amount at Savings Bank rate only"], "ans": 1, "exp": "Where fraud by a staff member is established, SBI restores the amount and pays compensation at 1% above the rate applicable to the deposit, overdraft or loan account concerned, for the period involved. Separately, for an unauthorised or erroneous debit, the bank refunds the amount and, if a cheque was returned or a direct debit not executed as a result, pays the financial loss plus interest at SB rate (minimum ₹100) and refunds cheque return charges.", "src": "SBI document on sbi.bank.in: Customer Rights, Grievance Redressal and Compensation Policy, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/documents/53471/263971/12052026_Customer+Rights%2CGrievance+Redressal+and+Compensation+Policy.pdf/834818f3-4529-ca6b-5203-e8f1cfd6b2d5"}, {"id": "S4-0295", "sec": "S4", "q": "Under the amended Note Refund Rules (2018), a mutilated ₹500 note whose single largest undivided piece is 70% of the note's area is paid:", "opts": ["Full value", "Half value", "Nothing (rejected)", "Three-quarters of the value", "Full value only at an RBI Issue Office"], "ans": 1, "exp": "For ₹50 and above: more than 80% = full value; 40% to 80% (inclusive) = half value; less than 40% = rejected. The 2018 amendment raised the full-value threshold from 65% to 80% because Mahatma Gandhi (New) series notes are smaller. For notes up to ₹20: more than 50% = full value, otherwise rejected.", "src": "RBI FAQ \"Indian Currency\" (updated 15 Apr 2025), rbi.org.in, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://www.rbi.org.in/commonman/Upload/English/FAQs/PDFs/INDIANCURRENCY15042025.pdf"}, {"id": "S4-0316", "sec": "S4", "q": "After every locker operation, RBI requires the bank to:", "opts": ["Send a monthly statement of operations", "Send an email and SMS alert to the registered ID/mobile before the end of the day, confirming the date and time of operation and the redressal mechanism", "Inform the nominee", "Record the contents", "Do nothing unless the hirer asks"], "ans": 1, "exp": "After every locker operation, the bank must send an email and SMS alert to the hirer's registered email ID and mobile number before the end of the day, confirming the date and time of operation and the redressal mechanism. It also keeps a check-in/check-out register signed by everyone who accesses the locker.", "src": "RBI Safe Deposit Locker / Safe Custody Article Facility - Revised Instructions (RBI/2021-22/86), consolidated in RBI Responsible Business Conduct Directions, 2025 (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=12146&Mode=0"}, {"id": "S4-0323", "sec": "S4", "q": "Under RBI's KYC Directions, 2025, a bank must upload a customer's KYC records to the Central KYC Records Registry (CKYCR) within ____ of starting the account-based relationship.", "opts": ["3 days", "7 days", "10 days", "15 days", "30 days"], "ans": 2, "exp": "This follows Rule 9(1A) of the PML Rules. Older accounts are uploaded at the time of periodic updation. The KYC Identifier is 14 digits; CKYCR is run by CERSAI.", "src": "RBI (Commercial Banks - Know Your Customer) Directions, 2025, updated 1 Oct 2026 (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=13141"}, {"id": "S4-0329", "sec": "S4", "q": "Under RB-IOS 2026, an Award by the RBI Ombudsman lapses unless the complainant gives the bank a letter of acceptance (in full and final settlement) within:", "opts": ["15 days of receiving the Award", "30 days of receiving the Award", "45 days", "60 days", "90 days"], "ans": 1, "exp": "The bank must then comply and inform the Ombudsman, or appeal, within 30 days of receiving the acceptance letter. A complainant who has filed an appeal cannot also furnish acceptance.", "src": "Reserve Bank - Integrated Ombudsman Scheme, 2026 (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/"}, {"id": "S5-0001", "sec": "S5", "q": "Under the Liberalised Remittance Scheme, a resident individual can remit abroad up to:", "opts": ["USD 1,00,000 per year", "USD 2,50,000 per financial year", "USD 2,50,000 per calendar year", "USD 5,00,000 per financial year", "No limit for permitted purposes"], "ans": 1, "exp": "The LRS limit is USD 2,50,000 per financial year for permitted current and capital account transactions.", "src": "RBI Master Direction, Liberalised Remittance Scheme (FEMA, 1999)", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://rbi.org.in/scripts/BS_ViewMasDirections.aspx?id=10192"}, {"id": "S5-0002", "sec": "S5", "q": "FEMA, which replaced FERA, came into force on:", "opts": ["1 April 1999", "1 June 2000", "1 January 2001", "15 August 2000", "29 December 1999"], "ans": 1, "exp": "The Foreign Exchange Management Act, 1999 came into force on 1 June 2000. Unlike FERA, FEMA generally treats contraventions as civil matters with monetary penalties; the exception is Sec 13(1C), under which specified contraventions involving foreign assets can attract imprisonment up to 5 years.", "src": "Foreign Exchange Management Act, 1999", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://indiacode.gov.in/"}, {"id": "S5-0023", "sec": "S5", "q": "When the forward rate of the US dollar against the rupee is higher than the spot rate, the dollar is said to be at a:", "opts": ["Forward discount", "Forward premium", "Par", "Swap discount", "Cross rate"], "ans": 1, "exp": "The forward premium usually reflects the interest rate difference between the two currencies.", "src": "Standard foreign exchange practice", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2}, {"id": "S5-0201", "sec": "S5", "q": "Under SBI's \"Fxout\" platform, a resident individual sending money abroad through Internet Banking may remit up to ____ per transaction / per day, within the overall LRS limit of ____ per financial year.", "opts": ["USD 25,000; USD 2,50,000", "USD 40,000; USD 2,50,000", "USD 50,000; USD 1,00,000", "USD 2,50,000; USD 2,50,000", "USD 40,000; USD 1 million"], "ans": 1, "exp": "Fxout limits: through a branch, USD 2,50,000 per transaction/day; through INB or YONO, USD 40,000 per transaction/day; all within the LRS limit of USD 2,50,000 a financial year.", "src": "SBI website (sbi.bank.in): Remittance From India page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/web/international-banking/services/remmitance-from-india"}, {"id": "S5-0215", "sec": "S5", "q": "SBI's IFSC Banking Unit at GIFT City gives NRIs an overdraft or demand loan against their FCNR(B) deposits. The minimum loan and the margin are:", "opts": ["USD 10,000; 10%", "USD 25,000; 15% on principal plus accrued interest", "USD 50,000; 25%", "USD 25,000; 5%", "USD 1,000; nil"], "ans": 1, "exp": "Minimum USD 25,000 (no maximum), margin 15%, lien on FCNR(B) deposits wi
