      <label class="check"><input type="checkbox" id="mix" ${store.get('mockMix', false) ? 'checked' : ''}><span>Mix questions from all sections (random order)</span></label>
    </div>
    ${full() ? `<div style="margin-top:14px"><button class="btn block" id="go" ${objN && descN ? '' : 'disabled'}>Start full exam</button></div>` : `<div style="margin-top:14px">${lockCard(1).replace('1 more', 'The full exam')}</div>`}
    ${hist.length ? `<h3>Past full exams</h3><div class="card"><table><thead><tr><th>Date</th><th class="n">Part A</th><th class="n">Part B</th><th class="n">Total</th></tr></thead><tbody>${hist.slice(-6).reverse().map(h => `<tr><td>${esc(h.d)}</td><td class="n">${h.obj}</td><td class="n">${h.desc}</td><td class="n"><b>${h.total}</b></td></tr>`).join('')}</tbody></table></div>` : ''}`;
  $('#mix').onchange = e => store.set('mockMix', e.target.checked);
  const go = $('#go');
  if (go) go.onclick = () => {
    const qs = buildObjective(store.get('mockMix', false));

function descriptivePaper(partA) {
  const items = Object.keys(PAPER).flatMap(t => shuffle(DESC.filter(d => d.type === t && unlocked(d))).slice(0, PAPER[t].offer).map(x => ({ t, x })));
  let html = `<div class="card"><b>Part A done: ${partA.obj} / ${partA.objMax}</b><p class="lede" style="margin:4px 0 0">Now Part B. Choose which questions to answer; the clock gives you ${C.examPattern.descMinutes} minutes.</p></div>`, last = '';
  items.forEach((it, i) => {
    if (it.t !== last) { html += `<h3>${DT[it.t].n}: answer ${PAPER[it.t].attempt} of ${PAPER[it.t].offer} · ${PAPER[it.t].marks} marks each</h3>`; last = it.t; }
    html += `<div class="card paper-item" style="margin-bottom:10px"><p class="q${it.t === 'COMP' ? ' passage' : ''}">${esc(it.x.q)}</p>
      <textarea id="pa${i}" placeholder="Type your answer, or leave blank to skip this question." spellcheck="true"></textarea><div class="wc" id="pw${i}">0 words</div><div id="po${i}"></div></div>`;
  });

  items.forEach((_, i) => { const ta = $('#pa' + i); ta.oninput = () => { $('#pw' + i).textContent = words(ta.value) + ' words'; }; });
  const t0 = Date.now(), LIM = C.examPattern.descMinutes * 60e3, R = $('#topRight');
  const tick = () => { const left = Math.max(0, LIM - (Date.now() - t0)); R.textContent = String(Math.floor(left / 60e3)).padStart(2, '0') + ':' + String(Math.floor(left % 60e3 / 1e3)).padStart(2, '0'); R.className = left < 10 * 60e3 ? 'low' : ''; if (!left) submit(); };

      const mk = PAPER[it.t].marks;
      $('#po' + i).innerHTML = `<div class="label">${attempted ? 'Attempted' : 'Not attempted'}</div><div id="pk${i}"></div><div class="label">Model answer</div><div class="model">${esc(it.x.ans)}</div>
        ${attempted ? `<label class="f" for="pm${i}">Your marks</label><select id="pm${i}" data-t="${it.t}">${Array.from({ length: mk * 2 + 1 }, (_, k) => `<option value="${k / 2}">${k / 2} / ${mk}</option>`).join('')}</select>` : ''}`;

      const hist = store.get('exams', []); hist.push({ d: new Date().toLocaleDateString('en-IN'), obj: partA.obj, desc, total, max }); store.set('exams', hist.slice(-50));
      V.innerHTML = `<div class="card"><h2>${total} / ${max}</h2>
        <table><tbody><tr><td>Part A · Objective</td><td class="n">${partA.obj} / ${partA.objMax}</td></tr><tr><td>Part B · Descriptive</td><td class="n">${desc} / ${C.examPattern.descMarks}</td></tr></tbody></table>
        <p class="lede" style="margin-top:10px">Mark your descriptive answers strictly; examiners reward structure, a rule where it fits, and a conclusion.</p>

<script>/* v0.11 study aids: mistake book and stars, daily plan and streak, reminder, text size, backup/restore,
   score card sharing and the Play rating prompt. Loaded after features.js; uses the app.js / features.js globals. */
'use strict';

const dayKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

// ================= STARS =================
let STARS = new Set(store.get('stars', []));
const isStar = id => STARS.has(id);
function starBtn(id) {
  return `<button class="star" data-star="${esc(id)}" aria-pressed="${isStar(id)}" aria-label="${isStar(id) ? 'Remove star' : 'Star this question'}" title="Star for revision">${isStar(id) ? '★' : '☆'}</button>`;
}
V.addEventListener('click', e => {
  const b = e.target.closest('[data-star]'); if (!b) return;
  e.stopPropagation();
  const id = b.dataset.star, on = !isStar(id);
  on ? STARS.add(id) : STARS.delete(id); store.set('stars', [...STARS]);
  b.setAttribute('aria-pressed', on); b.textContent = on ? '★' : '☆'; b.setAttribute('aria-label', on ? 'Remove star' : 'Star this question');
  toast(on ? 'Starred for revision' : 'Star removed');
}, true);

// ================= MISTAKE BOOK =================
// id -> correct answers in a row since the last wrong one; cleared after two in a row.
const MIST_CLEAR = 2;
let MIST = store.get('mist', null);
if (!MIST) { MIST = {}; for (const k in ST) if (ST[k][2]) MIST[k] = 0; store.set('mist', MIST); }   // first run: seed from past wrong answers
const _record = record;
record = function (id, ok) {
  _record(id, ok);
  if (!ok) MIST[id] = 0;
  else if (id in MIST && ++MIST[id] >= MIST_CLEAR) { delete MIST[id]; const F = store.get('fixed', {}); F[id] = 1; store.set('fixed', F); }   // a mistake turned into knowledge
  store.set('mist', MIST);
  onStudy('q');
};
const mistakeQs = () => MCQ.filter(q => q.id in MIST && unlocked(q));

function mistakes() {
  const mq = mistakeQs(), sq = mcqPool().filter(q => isStar(q.id) && unlocked(q)), sd = DESC.filter(d => isStar(d.id) && unlocked(d));
  const bySec = {}; mq.forEach(q => bySec[q.sec] = (bySec[q.sec] || 0) + 1);
  V.innerHTML = modeBar('mistakes') + `<h2>Mistakes and starred</h2>
    <p class="lede">Every question you get wrong lands here, in practice or in a mock. Answer it correctly twice in a row and it leaves the list. Tap ☆ on any question to keep it for revision.</p>
    <div class="grid2"><div class="card stat"><div class="v">${mq.length}</div><div class="k">Mistakes to clear</div></div>
      <div class="card stat"><div class="v">${sq.length + sd.length}</div><div class="k">Starred</div></div></div>
    <div class="card stack" style="margin-top:12px">
      <button class="btn block" id="pm" ${mq.length ? '' : 'disabled'}>Practise my mistakes${mq.length ? ' (' + Math.min(mq.length, 20) + ')' : ''}</button>
      ${Object.keys(bySec).length ? `<div class="chips" id="msec">${Object.entries(bySec).sort().map(([s, n]) => `<button class="chip" data-s="${s}">${s}<small>${n}</small></button>`).join('')}</div><p class="src" style="margin:0">Tap a section to practise only its mistakes.</p>` : ''}
      <button class="btn ghost block" id="ps" ${sq.length ? '' : 'disabled'}>Practise starred questions${sq.length ? ' (' + sq.length + ')' : ''}</button>
    </div>
    ${sd.length ? `<h3>Starred descriptive questions</h3>${sd.map(d => `<div class="card" style="margin-bottom:10px"><div class="row end"><span class="tag">${esc(DT[d.type].n)}</span>${starBtn(d.id)}</div>
      <p class="q${d.type === 'COMP' ? ' passage' : ''}">${esc(d.q)}</p><details><summary>Model answer</summary><div class="model">${esc(d.ans)}</div></details></div>`).join('')}` : ''}
    ${!mq.length && !sq.length && !sd.length ? '<p class="src">Nothing here yet. Mistakes from practice and mocks will appear automatically.</p>' : ''}`;
  const go = list => { if (list.length) runPractice(shuffle(list).slice(0, 20)); };
  $('#pm').onclick = () => go(mq);
  $('#ps').onclick = () => go(sq);
  const ms = $('#msec'); if (ms) ms.onclick = e => { const b = e.target.closest('.chip'); if (b) go(mq.filter(q => q.sec === b.dataset.s)); };
}

// ================= DAILY LOG, STREAK AND PLAN =================
// days: { 'YYYY-MM-DD': { q: questions answered, d: descriptive answers checked } }
let DAYS = store.get('days', {});
const activeDay = x => !!x && (x.q >= 10 || x.d >= 1);
function streak() {
  const d = new Date(); if (!activeDay(DAYS[dayKey(d)])) d.setDate(d.getDate() - 1);   // today not done yet: count up to yesterday
  let n = 0; while (activeDay(DAYS[dayKey(d)])) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function onStudy(kind) {
  const k = dayKey(), x = DAYS[k] || (DAYS[k] = { q: 0, d: 0 }), was = activeDay(x);
  x[kind] = (x[kind] || 0) + 1;
  const keys = Object.keys(DAYS).sort(); if (keys.length > 400) keys.slice(0, keys.length - 400).forEach(j => delete DAYS[j]);
  store.set('days', DAYS);
  if (!was && activeDay(x) && B.markStudied) B.markStudied(streak());   // no reminder needed today
}

function dailyPlan() {
  const exam = store.get('examDate', ''), left = exam ? Math.ceil((new Date(exam + 'T10:00:00') - new Date()) / 864e5) : 60;
  const unseen = MCQ.filter(q => unlocked(q) && !ST[q.id]).length, mist = mistakeQs().length;
  // finish first coverage ten days before the exam; keep those days for mocks and revision
  const qT = Math.max(20, Math.min(60, Math.ceil((unseen + mist) / Math.max(7, left - 10)))) || 20;
  const S = sectionStats().filter(s => s.total);
  const weak = S.filter(s => s.att >= 5 && s.acc < 70).sort((a, b) => a.acc - b.acc)[0];
  const focus = weak || S.slice().sort((a, b) => a.tried / a.total - b.tried / b.total)[0];
  const lastMock = Math.max(0, ...store.get('mocks', []).concat(store.get('exams', [])).map(m => { const [d, mo, y] = String(m.d).split('/'); return new Date(+y, mo - 1, +d).getTime() || 0; }));
  const mockDue = left > 0 && Object.keys(ST).length >= 100 && (Date.now() - lastMock) / 864e5 >= 7;   // after some practice, weekly
  const today = DAYS[dayKey()] || { q: 0, d: 0 };

<script>/* v0.12 coaching aids: exam readiness score, sectional tests, automatic key-point check for descriptive answers,
   and Listen mode (read aloud with the phone's own offline voice). Loaded after study.js. */
'use strict';

const clamp01 = x => Math.max(0, Math.min(1, x));

// ================= LISTEN MODE =================
const SAY = [];                       // texts behind the Listen buttons on screen
let PL = null;                        // current playback: { chunks, i, id, btn, items, item, label }
let sayId = 0;
function listenBtn(text) {
  if (!text) return '';
  const i = SAY.push(text) - 1; if (SAY.length > 3000) SAY.splice(0, 1000, ...new Array(1000).fill(''));
  return `<button class="linkish listen" data-say="${i}" aria-label="Listen">🔊 Listen</button>`;
}
/** Make written shorthand sound right when spoken. */
function speechText(t) {
  return String(t)
    .replace(/[_.\/\d-]*_{2,}[_.\/\d-]*|\.{3,}/g, ' blank ').replace(/\[[^\]]*\]/g, ' ')
    .replace(/\bSecs?\b\.?/g, m => m.startsWith('Secs') ? 'Sections' : 'Section').replace(/\bRs\.?\s?/g, 'rupees ').replace(/₹\s?/g, 'rupees ')
    .replace(/\be\.g\./gi, 'for example').replace(/\bi\.e\./gi, 'that is').replace(/\betc\./gi, 'and so on').replace(/&/g, ' and ').replace(/(\d)\s?%/g, '$1 percent')
    .replace(/[•▪◦]/g, '').replace(/\n+/g, m => '. ').replace(/\.\s*\./g, '.').replace(/\s{2,}/g, ' ').trim();
}
function chunks(t) {
  const out = []; let cur = '';
  for (const s of speechText(t).split(/(?<=[.?!;:])\s+/)) {
    if ((cur + ' ' + s).length > 1200 && cur) { out.push(cur); cur = s; } else cur = cur ? cur + ' ' + s : s;
  }
  if (cur) out.push(cur);
  return out;
}
function speakChunk() {
  if (!PL) return;
  if (PL.i >= PL.chunks.length) {                         // item finished: next item of a playlist, or stop
    if (PL.items && PL.item + 1 < PL.items.length) { PL.item++; PL.chunks = chunks(PL.items[PL.item]); PL.i = 0; drawPlayer(); }
    else return stopSpeech();
  }
  const text = PL.chunks[PL.i++], id = 'u' + (++sayId); PL.id = id;
  if (B.speak) B.speak(text, id);
  else if (window.speechSynthesis) {
    const u = new SpeechSynthesisUtterance(text); u.lang = 'en-IN'; u.rate = .95;
    u.onend = () => window.ppOnSpoken(id); u.onerror = () => window.ppOnSpoken(null);
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } else { toast('Listening is not available here'); stopSpeech(); }
}
window.ppOnSpoken = id => { if (!PL) return; if (id === null) return stopSpeech(); if (id === PL.id) speakChunk(); };
function startSpeech(texts, btn, label) {
  stopSpeech();
  const items = Array.isArray(texts) ? texts.filter(Boolean) : [texts];
  if (!items.length) return;
  PL = { items: items.length > 1 ? items : null, item: 0, chunks: chunks(items[0]), i: 0, btn, label };
  if (btn) { btn.textContent = '■ Stop'; btn.classList.add('on'); }
  drawPlayer(); speakChunk();
}
function stopSpeech() {
  const was = PL; PL = null;
  if (B.stopSpeaking) B.stopSpeaking(); else if (window.speechSynthesis) speechSynthesis.cancel();
  if (was && was.btn) { was.btn.textContent = '🔊 Listen'; was.btn.classList.remove('on'); }
  drawPlayer();
}
function drawPlayer() {
  let p = $('#player');
  if (!PL || !PL.items) { if (p) p.remove(); return; }
  if (!p) { p = document.createElement('div'); p.id = 'player'; p.setAttribute('role', 'region'); p.setAttribute('aria-label', 'Audio revision'); document.body.appendChild(p); }

function readiness() {
  const pool = MCQ.filter(unlocked), tried = pool.filter(q => ST[q.id]).length;
  // accuracy on FIRST attempts only: repeating a question you have already seen does not raise it
  let att = 0, ok = 0; const bySec = {};
  for (const q of pool) { const f = firstOk(ST[q.id]); if (f === null) continue; att++; ok += f; const b = bySec[q.sec] || (bySec[q.sec] = [0, 0]); b[0]++; b[1] += f; }
  const acc = att ? ok / att : 0;
  const weak = Object.entries(bySec).filter(([, [n, r]]) => n >= 8 && r / n < .6).sort((a, b) => a[1][1] / a[1][0] - b[1][1] / b[1][0]).slice(0, 2)
    .map(([c, [n, r]]) => ({ c, name: SEC[c] ? SEC[c].name : c, pct: Math.round(r / n * 100) }));
  const unrevised = pool.filter(q => MIST[q.id] === 0).length;
  const recent = store.get('mocks', []).filter(m => m.n >= 50).map(m => m.pct).concat(store.get('exams', []).map(e => Math.round(e.total / e.max * 100))).slice(-3);
  const avgM = recent.length ? Math.round(recent.reduce((a, b) => a + b, 0) / recent.length) : null;
  let active = 0; const d = new Date(); for (let k = 0; k < 14; k++) { if (activeDay(DAYS[dayKey(d)])) active++; d.setDate(d.getDate() - 1); }
  const parts = [
    { k: 'Coverage', w: 30, v: pool.length ? clamp01(tried / pool.length) : 0, d: `${tried} of ${pool.length} questions tried`, tip: 'Practise questions you have not seen yet.', go: 'practice' },
    // accuracy counts fully only after 50 attempts, so a lucky first session does not inflate it
    { k: 'Accuracy', w: 30, v: clamp01((acc - .4) / .45) * Math.min(1, att / 50), d: att ? `${Math.round(acc * 100)}% right first time in ${att} questions` : 'no answers yet', tip: 'Revise your mistakes until they clear.', go: 'mistakes' },
    { k: 'Mock scores', w: 25, v: avgM === null ? 0 : clamp01((avgM - 40) / 40), d: avgM === null ? 'no full mock yet' : `average ${avgM}% in the last ${recent.length}`, tip: 'Take a full timed mock.', go: 'mock' },
    { k: 'Regular practice', w: 15, v: clamp01(active / 10), d: `${active} of the last 14 days`, tip: 'Practise a little every day.', go: 'practice' },
  ];
  const score = Math.round(parts.reduce((a, p) => a + p.w * p.v, 0));
  const label = score >= 80 ? 'Exam ready' : score >= 65 ? 'Nearly ready' : score >= 40 ? 'Building up' : 'Early days';
  const next = parts.slice().sort((a, b) => (b.w * (1 - b.v)) - (a.w * (1 - a.v)))[0];
  // one score per day for the trend
  const H = store.get('ready', {}); H[dayKey()] = score;
  const ks = Object.keys(H).sort(); if (ks.length > 180) ks.slice(0, ks.length - 180).forEach(k => delete H[k]);
  store.set('ready', H);
  const wk = new Date(); wk.setDate(wk.getDate() - 7);
  const before = Object.keys(H).sort().filter(k => k <= dayKey(wk)).pop();
  const ret = store.get('ret', [0, 0]), fixed = Object.keys(store.get('fixed', {})).length;
  return { score, label, parts, next, weak, unrevised, ret, fixed, delta: before !== undefined ? score - H[before] : null };
}

const STOPW = new Set(('the and for are was were been being this that these those its their there which who whom whose what when where how why will would shall should can could may might must not nor but then than such also into onto upon about over under after before between during through without within any all each every both either neither other another some more most less least much many few very only own same just too again further once here per via has have had having does did done our ours your yours his her hers them they you she him one two three first second third should bank banks banking branch customer customers account accounts amount given make made take taken like well good need needs from with your able used uses using').split(' '));

function keyStems(text) {

    if (/^\d{2,}$/.test(w) || /^[A-Z]{2,6}s?$/.test(raw) || (w.length >= 4 && !STOPW.has(w))) out.add(stem(w));

/** Split a model answer into checkable points: list items or sentences; headings and letter template lines are skipped. */
function keyPoints(ans, type) {

  // blanks such as __.__.2026 are removed, not the sentence they sit in; mostly-blank header lines then fall below 4 words
  lines = lines.map(l => l.replace(/[_.\/\d-]*_{2,}[_.\/\d-]*/g, ' ').replace(/\[[^\]]+\]/g, ' ').replace(/\s{2,}/g, ' ').trim())
    .filter(l => !/^[A-Z][A-Z &/]+:?$/.test(l) && !/^(dear|yours|the regional|date|letter no|ref)/i.test(l));
  // letters: keep body content only (no address, all-caps subject or courtesy lines)
  if (type === 'EM') lines = lines.filter(l => !/^(to|cc|bcc|subject|regards|attachment)\b/i.test(l) && l.split(/\s+/).length >= 6);
  if (type === 'BC') lines = lines.filter(l => !/^(sub(ject)?|to)\b/i.test(l) && l.split(/\s+/).length >= 6 && l !== l.toUpperCase()
    && !/:$/.test(l) && !/assure you|thanking you|look forward|kind (notice|attention)|for your (kind|early)/i.test(l));

  if (type === 'RAT') C.push(['Separate points', listy >= 3 || lines.length >= 3], ['Key word leads the points (e.g. \"Fraud risk: ...\")', lines.filter(l => /^\s*([0-9]+[.)]|[•\-*])?\s*[A-Za-z/&() -]{3,30}:\s/.test(l)).length >= 2], ['Names a rule, Act or RBI direction', cites], ['Ends with a conclusion', concl]);

<script>/* v0.13: challenge a colleague by code, "sure or guess" confidence tracking, and the final-week plan.

'use strict';

// ================= CHALLENGE BY CODE =================
// The code alone decides the questions, so two phones with the same question bank get the same paper, offline.
// Format: S9-K4F7Q2 = section (or MX for mixed) + 5 seed characters + 1 check character over the question pool.
const DUEL_N = 20, DUEL_MIN = 15, DUEL_FREE_PER_DAY = 1;
const ALPH = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';   // no 0/O or 1/I/L, easy to read aloud
function hash32(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
// every published question of the section, locked or not, in a fixed order (release builds contain reviewed items only)
const duelPool = sec => MCQ.filter(q => sec === 'MX' ? q.sec !== 'S11' : q.sec === sec).slice().sort((a, b) => a.id < b.id ? -1 : 1);
const checkChar = (sec, seed) => ALPH[hash32(sec + seed + '|' + duelPool(sec).map(q => q.id).join(',')) % ALPH.length];
function makeCode(sec) { let seed = ''; for (let i = 0; i < 5; i++) seed += ALPH[Math.floor(Math.random() * ALPH.length)]; return sec + '-' + seed + checkChar(sec, seed); }
function parseCode(raw) {
  const m = String(raw).toUpperCase().replace(/[^A-Z0-9]/g, '').match(/^(MX|S10|S[1-9])([A-Z0-9]{6})$/);
  if (!m) return { err: 'That does not look like a challenge code. It looks like S9-K4F7Q2.' };
  const [, sec, body] = m, seed = body.slice(0, 5);
  if (!duelPool(sec).length) return { err: 'That section is not in this app.' };
  if (checkChar(sec, seed) !== body[5]) return { err: 'This code does not match your question bank. Check the code, and make sure both of you have the latest version of the app from Play Store.' };
  return { sec, seed, code: sec + '-' + body };
}
function duelQs(sec, seed) {
  const r = rng(hash32(sec + seed)), a = duelPool(sec);
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a.slice(0, DUEL_N);
}
function duelAllowed() {
  if (full()) return true;
  const u = store.get('duelUse', {}); return (u[dayKey()] || 0) < DUEL_FREE_PER_DAY;
}
function startDuel(p) {
  if (!duelAllowed()) return toast('Free version: one challenge a day. Unlock full access for unlimited challenges.');
  if (!full()) { const u = {}; u[dayKey()] = (store.get('duelUse', {})[dayKey()] || 0) + 1; store.set('duelUse', u); }
  const label = p.sec === 'MX' ? 'All sections' : p.sec + ' ' + SEC[p.sec].name;
  runMock(duelQs(p.sec, p.seed), DUEL_MIN, null, { hist: 'duels', sec: p.code, title: 'Challenge ' + p.code });
  // after the result screen appears, offer to send the score back with the code
  const obs = new MutationObserver(() => {
    const share = $('#share'); if (!share || $('#dsend')) return;
    obs.disconnect();
    const H = store.get('duels', []), last = H[H.length - 1];
    share.insertAdjacentHTML('afterend', `<button class="btn ghost" id="dsend">Send my score</button>`);
    $('#dsend').onclick = () => sendText(`I scored ${last.c}/${last.n} in Unnati challenge ${p.code} (${label}). Beat it: open Unnati Promotion Prep → Mock → Challenge → enter ${p.code}`);
  });

}
function sendText(t) {
  if (B.shareText) return B.shareText(t);
  if (navigator.share) return navigator.share({ text: t }).catch(() => { });
  navigator.clipboard && navigator.clipboard.writeText(t).then(() => toast('Copied. Paste it in WhatsApp.'));
}

  const H = store.get('duels', []).slice().reverse();
  const draw = () => {
    V.innerHTML = modeBar('duel', MOCK_MODES) + `<h2>Challenge a colleague</h2>
      <p class="lede">Make a code and send it on WhatsApp. Anyone who enters the same code gets exactly the same ${DUEL_N} questions, timed at ${DUEL_MIN} minutes. Compare scores and see who wins. Works offline.</p>
      <div class="card stack"><b>Make a challenge</b>
        <div class="chips" id="dsec"><button class="chip" data-s="MX" aria-pressed="${sel === 'MX'}">All sections</button>${M.sections.filter(s => s.code !== 'S11').map(s => `<button class="chip" data-s="${s.code}" aria-pressed="${s.code === sel}">${esc(s.code)}</button>`).join('')}</div>
        <button class="btn block" id="dmake">Make code</button><div id="dnew"></div></div>
      <div class="card stack" style="margin-top:12px"><b>Got a code?</b>
        <div class="row"><input type="text" id="dcode" placeholder="e.g. S9-K4F7Q2" autocapitalize="characters" autocomplete="off" spellcheck="false" maxlength="12" style="flex:1;text-transform:uppercase"><button class="btn" id="djoin">Start</button></div>
        <p class="src" id="derr" style="margin:0"></p></div>
      ${full() ? '' : `<p class="src">Free version: one challenge a day. ${esc(priceText())} unlocks unlimited challenges.</p>`}
      ${H.length ? `<h3>Your challenges</h3><div class="card"><table><thead><tr><th>Code</th><th>Date</th><th class="n">Score</th><th class="n">Rival</th></tr></thead><tbody>
        ${H.slice(0, 15).map((h, k) => `<tr><td data-noi18n>${esc(h.sec)}</td><td>${esc(h.d)}</td><td class="n"><b>${h.c}/${h.n}</b></td><td class="n">${h.rival !== undefined ? `${h.rival}/${h.n} ${h.c > h.rival ? '🏆' : h.c === h.rival ? '=' : ''}` : `<button class="linkish" data-rival="${H.length - 1 - k}">Add</button>`}</td></tr>`).join('')}</tbody></table>
        <p class="src" style="margin:6px 0 0">Tap Add to note your colleague's score when they send it.</p></div>` : ''}`;
    $('#dsec').onclick = e => { const b = e.target.closest('.chip'); if (!b) return; sel = b.dataset.s; store.set('duelSec', sel); draw(); };
    $('#dmake').onclick = () => {

      $('#dnew').innerHTML = `<div class="duelcode" data-noi18n>${code}</div>

    };
    $('#djoin').onclick = () => { const p = parseCode($('#dcode').value); if (p.err) { $('#derr').textContent = p.err; return; } startDuel(p); };
    // WebView has no prompt(): edit the rival's score in place
    V.querySelectorAll('[data-rival]').forEach(b => b.onclick = () => {
      const idx = +b.dataset.rival, h = store.get('duels', [])[idx];
      b.parentElement.innerHTML = `<input type="number" inputmode="numeric" min="0" max="${h.n}" class="rivalin" aria-label="Colleague's score"><button class="linkish" data-rsave="${idx}">Save</button>`;
      V.querySelector('.rivalin').focus();
      V.querySelector(`[data-rsave="${idx}"]`).onclick = e => {
        const n = Math.round(+e.target.previousElementSibling.value), all = store.get('duels', []);
        if (!(n >= 0 && n <= all[idx].n)) return toast('Enter a number from 0 to ' + all[idx].n);
        all[idx].rival = n; store.set('duels', all); duel();
      };
    });
  };
  draw();
}

// ================= SURE OR GUESS =================
// pp.conf: { S1: [sureRight, sureWrong, guessRight, guessWrong], ... }; pp.lucky / pp.sureWrong: ids to revise
let LUCKY = new Set(store.get('lucky', [])), SUREW = new Set(store.get('sureWrong', []));
const _recordConf = record;
record = function (id, ok, guess) {
  if (guess === undefined) { const g = V.querySelector('[data-guess]'); guess = !!g && g.getAttribute('aria-pressed') === 'true'; }
  _recordConf(id, ok);
  const q = MCQ.find(x => x.id === id); if (!q) return;
  const C2 = store.get('conf', {}), c = C2[q.sec] || (C2[q.sec] = [0, 0, 0, 0]);
  c[(guess ? 2 : 0) + (ok ? 0 : 1)]++; store.set('conf', C2);
  if (guess && ok) { LUCKY.add(id); MIST[id] = 0; store.set('mist', MIST); }   // a lucky guess is not yet known: revise it
  if (!guess && !ok) SUREW.add(id);
  if (!guess && ok) { LUCKY.delete(id); SUREW.delete(id); }
  store.set('lucky', [...LUCKY]); store.set('sureWrong', [...SUREW]);
};
V.addEventListener('click', e => {

function confTotals() { const t = [0, 0, 0, 0]; Object.values(store.get('conf', {})).forEach(c => c.forEach((v, i) => t[i] += v)); return t; }

// mistakes page: confident mistakes and lucky guesses
const _mistakesConf = ROUTES.mistakes;
ROUTES.mistakes = function () {
  _mistakesConf();

  card.innerHTML = `<div><b>Your blind spots</b><p class="src" style="margin:2px 0 0">Confident mistakes are answers you were sure of but got wrong. Lucky guesses were right, but you were guessing. Both need revision before exam day.</p></div>
    <div class="row">${sw.length ? `<button class="btn ghost" id="pSW">Confident mistakes (${sw.length})</button>` : ''}${lk.length ? `<button class="btn ghost" id="pLK">Lucky guesses (${lk.length})</button>` : ''}</div>`;
  V.querySelector('.card.stack').after(card);

};
// progress page: confidence card
const _progressConf = ROUTES.progress;
ROUTES.progress = function () {

const daysToExam = () => { const e = store.get('examDate', ''); return e ? Math.ceil((new Date(e + 'T10:00:00') - new Date()) / 864e5) : null; };

<script>/* Unlock screen with discount codes (#unlock) and the buyer's own friend code (#refer).
   Codes and dates live in config.js. Play enforces each offer's dates on its side; this file only decides
   which offer a code asks for and shows the price. */
'use strict';

const todayIST = () => new Date(Date.now() + 5.5 * 3600e3).toISOString().slice(0, 10);
const inWindow = o => { const d = todayIST(); return d >= o.from && d <= o.to; };
const fmtDay = d => new Date(d + 'T12:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
const playPrice = (offer, fallback) => (B.offerPrice && B.offerPrice(offer)) || fallback;

// ---- friend codes: NAME-XXXXX, where XX is random and XXX a check on the name, so the app can verify a code offline ----
const REF_ABC = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';   // 32 symbols, no 0/O or 1/I
const REF_SALT = 'unnati-promoprep-friend-2026';
function refCheck(name, rnd) {
  let h = 0x811c9dc5;
  for (const ch of REF_SALT + '|' + name + '|' + rnd) { h ^= ch.charCodeAt(0); h = Math.imul(h, 0x01000193) >>> 0; }
  return REF_ABC[h & 31] + REF_ABC[(h >>> 5) & 31] + REF_ABC[(h >>> 10) & 31];
}
function makeRefCode(name) {
  const r = REF_ABC[Math.floor(Math.random() * 32)] + REF_ABC[Math.floor(Math.random() * 32)];
  return name + '-' + r + refCheck(name, r);
}
function isRefCode(code) {
  const m = /^([A-Z]{3,10})-([2-9A-Z]{2})([2-9A-Z]{3})$/.exec(code);
  return !!m && refCheck(m[1], m[2]) === m[3];
}

// Today's public offer, if any.
const liveOffer = () => (C.offers || []).find(inWindow);
function bestPriceText() {
  const o = liveOffer();
  return o ? `${playPrice(o.offer, o.price)} with code ${o.code}` : priceText();
}

// What a typed code gives today: { ok, offer, price, msg }
function checkCode(raw) {
  const code = String(raw || '').toUpperCase().replace(/\s+/g, '');
  if (!code) return { ok: false, msg: 'Enter a code.' };
  const pub = (C.offers || []).find(o => o.code === code);
  if (pub) {
    if (todayIST() < pub.from) return { ok: false, msg: `Code ${pub.code} works from ${fmtDay(pub.from)}.` };
    if (todayIST() > pub.to) return { ok: false, msg: `Code ${pub.code} ended on ${fmtDay(pub.to)}.` };
    return { ok: true, offer: pub.offer, price: playPrice(pub.offer, pub.price), msg: `${pub.label}: ${playPrice(pub.offer, pub.price)} till ${fmtDay(pub.to)}.` };
  }
  if (isRefCode(code)) {
    const f = C.friendOffer;
    if (code === store.get('refCode', '')) return { ok: false, msg: 'This is your own friend code. Share it with colleagues.' };
    if (todayIST() < f.from) {
      const o = liveOffer();
      return { ok: false, msg: `Friend codes work from ${fmtDay(f.from)}.${o ? ` Today, code ${o.code} gives an even lower price.` : ''}` };
    }
    if (todayIST() > f.to) return { ok: false, msg: `Friend codes ended on ${fmtDay(f.to)}.` };
    return { ok: true, offer: f.offer, price: playPrice(f.offer, f.price), msg: `Friend code accepted: ${playPrice(f.offer, f.price)}.` };
  }
  return { ok: false, msg: 'This code is not valid. Check the spelling.' };
}

const buy = offer => offer && B.buyOffer ? B.buyOffer(offer) : B.buyFullAccess();

// ================= UNLOCK =================
function unlock() {
  if (full()) { V.innerHTML = `<div class="card"><h2>Full access is active</h2><p class="lede">Thank you. Lifetime access: every question, mock and model answer, every update and every attempt, until you are promoted.</p><a class="btn" href="#refer">Your friend code</a></div>`; return; }
  const o = liveOffer();
  const feats = [`${window.UNNATI_DEMO ? "3,000" : MCQ.length.toLocaleString("en-IN")} MCQs with explanations and sources`, 'Unlimited full mocks and sectional tests',
    `${DESC.length} descriptive questions with model answers`, 'Mistake book, recall cards and audio revision', 'Lifetime access: every update, every attempt, until you are promoted'];
  V.innerHTML = `<div class="pw-hero"><div class="pw-crown" aria-hidden="true">👑</div><h2>Unlock Full Access</h2><p>Everything you need for ${esc(TR.full)}, in one place</p><div class="pw-life">♾️ Pay once. Prepare till you're promoted.<span lang="hi" data-noi18n>एक बार खरीदें, प्रमोशन तक साथ निभाएं।</span></div></div>
    <ul class="pw-feat">${feats.map(f => `<li>${esc(f)}</li>`).join('')}</ul>
    ${compareTable()}
    ${o ? `<div class="pw-offer"><div class="o1">🪔 ${esc(o.label.toUpperCase())}</div><div class="o2">${esc(playPrice(o.offer, o.price))}<s>${esc(priceText())}</s></div><div class="o3">with code ${esc(o.code)} · till ${esc(fmtDay(o.to))}</div><button class="btn ghost small" id="use">Use code ${esc(o.code)}</button></div>` : ''}
    <div class="card pw-code"><label class="f" for="cc">Have a code?</label>
      <div class="row"><input type="text" id="cc" maxlength="20" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase;flex:1;width:auto"><button class="btn ghost" id="apply">Apply</button></div>
      <p class="src" id="cmsg" aria-live="polite"></p></div>
    <button class="btn block pw-cta" id="pay">Pay ${esc(priceText())}</button>
    <p class="pw-fine">One-time payment through Google Play · Lifetime access · No subscription</p>
    <p class="src" style="text-align:center;margin-top:6px">Already bought on this Google account? <button class="linkish" id="restore">Restore purchase</button></p>`;
  let chosen = null, chosenCode = '';
  const pay = $('#pay'), msg = $('#cmsg');
  $('#apply').onclick = () => {
    const r = checkCode($('#cc').value);
    msg.textContent = r.msg;
    chosen = r.ok ? r.offer : null; chosenCode = r.ok ? String($('#cc').value).toUpperCase().replace(/\s+/g, '') : '';
    pay.textContent = 'Pay ' + (r.ok ? r.price : priceText());
  };
  if ($('#use')) $('#use').onclick = () => { $('#cc').value = o.code; $('#apply').click(); };
  $('#cc').onkeydown = e => { if (e.key === 'Enter') $('#apply').click(); };
  // a friend code used at payment is remembered, so the buyer can send a thank-you code afterwards (referral.js)
  pay.onclick = () => { if (chosen === 'friend') store.set('tyFor', chosenCode); buy(chosen); };
  $('#restore').onclick = () => { if (B.restorePurchases) B.restorePurchases(); toast('Checking Google Play for your purchase…'); };
}

// Free vs Full, counted live from the content of the user's own exam track (no hard-coded numbers)
function compareTable() {
  const fq = MCQ.filter(q => q.free).length, fd = DESC.filter(d => d.free).length;
  const papers = typeof seriesPlan === 'function' ? seriesPlan().n : 0;
  const allQ = window.UNNATI_DEMO ? '3,000' : MCQ.length.toLocaleString('en-IN');
  const rows = [
    ['Practice questions with explanations and sources', fq.toLocaleString('en-IN'), allQ],
    DESC.length ? ['Descriptive questions with model answers', String(fd), window.UNNATI_DEMO ? 'All' : String(DESC.length)] : null,
    DESC.length ? ['Writing courses (Learn)', 'All', 'All'] : null,
    typeof seriesPlan === 'function' ? ['Mock series papers (exam pattern)', '1', full() ? String(papers) : 'Up to 10'] : null,
    DESC.length ? ['Full exam (objective + descriptive)', '—', '✓'] : null,
    ['Sectional tests, mistakes book, revision', 'On free questions', 'On every question'],
    ['Data interpretation sets', `${DI_FREE_PER_DAY} a day`, 'Unlimited'],
    ['Challenges with friends', '1 a day', 'Unlimited'],
    ['"What changed" rule updates', '✓', '✓'],
    ['Fact Finder (searchable cheat sheet of every figure)', 'On free questions', 'Every fact'],
    ['Law Dictionary: legal words with Act and section, quiz', 'Key words', 'All words'],
    ['Learning tools: Daily Capsule, Figure Blitz', 'On free questions', 'On every question'],
    ['Marks Planner: likely score and where to gain marks', '✓', '✓'],
    ['Confusion Buster and Interview Prep', 'Key items', 'All, with quiz and mock interview'],
    ['Future updates and new questions', 'Free set only', 'All, for life']
  ].filter(Boolean);
  return `<div class="card cmp"><table class="lt"><tr><th></th><th>Free</th><th>Full</th></tr>${rows.map(([k, f, p]) => `<tr><td>${esc(k)}</td><td>${esc(f)}</td><td><b>${esc(p)}</b></td></tr>`).join('')}</table>
    <p class="src" style="margin:8px 0 0">Full access is for ${esc(TR.full)}. Payment and refunds are handled by Google Play under its refund policy; access is restored on the same Google account with "Restore purchase".</p></div>`;
}

// ================= FRIEND CODE =================
function refer() {
  if (!full()) { location.hash = 'unlock'; return; }
  const code = store.get('refCode', ''), f = C.friendOffer;
  if (!code) {
    V.innerHTML = `<h2>Your friend code</h2>
      <p class="lede">Make your own code once. Colleagues who enter it pay ${esc(f.price)} instead of ${esc(priceText())}, from ${esc(fmtDay(f.from))} till ${esc(fmtDay(f.to))}.</p>
      <div class="card"><label class="f" for="rn">Your first name (letters only)</label><input type="text" id="rn" maxlength="10" autocomplete="off">
      <div class="row" style="margin-top:12px"><button class="btn" id="mk">Make my code</button></div></div>`;
    $('#mk').onclick = () => {
      const n = $('#rn').value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 10);
      if (n.length < 3) { toast('Enter at least 3 letters'); return; }
      store.set('refCode', makeRefCode(n)); ROUTES.refer();
    };
    return;
  }
  const text = `Preparing for the ${TR.full} promotion exam? Try Unnati Promotion Prep on Google Play. Use my friend code ${code} to unlock it for ${f.price} instead of ${C.price} (valid ${fmtDay(f.from)} to ${fmtDay(f.to)}).`;
  V.innerHTML = `<h2>Your friend code</h2>
    <div class="card"><div class="v" data-noi18n style="font-size:1.8em;font-weight:700;letter-spacing:.06em">${esc(code)}</div>
    <p class="src">Colleagues pay ${esc(f.price)} instead of ${esc(priceText())} with this code, from ${esc(fmtDay(f.from))} till ${esc(fmtDay(f.to))}.</p>
    <div class="row" style="margin-top:12px"><button class="btn" id="sh">Share on WhatsApp</button><button class="btn ghost" id="cp">Copy code</button></div></div>`;
  $('#sh').onclick = () => B.shareText ? B.shareText(text) : (location.href = 'https://wa.me/?text=' + encodeURIComponent(text));
  $('#cp').onclick = () => { try { navigator.clipboard.writeText(code); toast('Code copied'); } catch (e) { toast(code); } };
}

<script>/* #track: the user's profile. Name (kept only on this phone) and designation decide the exam:
   Clerk/Associate -> Clerical to JMGS-I (ticks Merit, Trainee Officer or both; one purchase covers both),
   Officer Scale I -> Scale I to II, Officer Scale II -> Scale II to III.
   #syllabus: the official structure of every exam (own exam first), with weightage, coverage and how to prepare. */
'use strict';

const DESIGNATIONS = [
  { id: 'jm', t: 'Clerk / Associate', s: 'Promotion to JMGS-I (Officer)' },
  { id: 's2', t: 'Officer, JMGS-I (Scale I)', s: 'Promotion to MMGS-II · 17 Jan 2027' },

const JM_EXAMS = [['merit', 'Merit / Normal-cum-Seniority channel', '3 Jan 2027 · 140 questions · no essay'], ['to', 'Trainee Officer channel', '10 Jan 2027 · 120 questions + essay']];
const profile = () => { try { return JSON.parse(localStorage.getItem('pp.profile') || 'null'); } catch (e) { return null; } };
const jmExams = () => (profile() || {}).jm || ['merit', 'to'];

function track() {
  document.body.classList.add('no-tabs');
  const p = profile() || { name: '', des: localStorage.getItem('pp.track') ? TRACK_ID : '', jm: ['merit', 'to'] };

    <div class="label">Your present designation</div>
    <div class="stack" id="des">${DESIGNATIONS.map(d => `<button class="card tp${p.des === d.id ? ' on' : ''}" data-d="${d.id}"><b>${esc(d.t)}</b><small>${esc(d.s)}</small></button>`).join('')}</div>
    <div id="jmBox" ${p.des === 'jm' ? '' : 'hidden'}><div class="label">Which exams will you write? (one purchase covers both)</div>
      <div class="card stack">${JM_EXAMS.map(([k, n, s]) => `<label class="check"><input type="checkbox" value="${k}" ${p.jm.includes(k) ? 'checked' : ''}><span><b>${n}</b><br><small class="src">${s}</small></span></label>`).join('')}</div></div>
    <button class="btn block" id="pSave" style="margin-top:14px">Save and see my syllabus</button>
    ${localStorage.getItem('pp.track') ? '<button class="linkish" id="tpBack" style="margin-top:12px">Cancel</button>' : ''}</div>`;
  let des = p.des;
  $('#des').onclick = e => { const b = e.target.closest('[data-d]'); if (!b) return; des = b.dataset.d; V.querySelectorAll('#des .tp').forEach(x => x.classList.toggle('on', x === b)); $('#jmBox').hidden = des !== 'jm'; };
  $('#pSave').onclick = () => {
    if (!des) return toast('Choose your designation.');
    const jm = [...V.querySelectorAll('#jmBox input:checked')].map(x => x.value);
    if (des === 'jm' && !jm.length) return toast('Tick at least one exam.');
    localStorage.setItem('pp.profile', JSON.stringify({ name: $('#pn').value.trim(), des, jm: des === 'jm' ? jm : ['merit', 'to'] }));
    localStorage.setItem('pp.track', JSON.stringify(des));
    if (des === 'jm' && !jm.includes(CHANNEL)) localStorage.setItem('pp.channel', JSON.stringify(jm[0]));
    localStorage.setItem('pp.welcomed', 'true');
    location.hash = 'syllabus'; location.reload();          // reload so the whole app switches to the exam
  };
  if ($('#tpBack')) $('#tpBack').onclick = () => { document.body.classList.remove('no-tabs'); history.back(); };
}

/** Clerks writing both channels switch between them here (same purchase). */
function channelSwitch() {
  if (TRACK_ID !== 'jm' || jmExams().length < 2) return '';
  return `<div class="chips ch-sw">${JM_EXAMS.map(([k, n]) => `<button class="chip" data-ch="${k}" aria-pressed="${k === CHANNEL}">${k === 'to' ? 'Trainee Officer' : 'Merit / NCS'}</button>`).join('')}</div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-ch]'); if (!b || b.dataset.ch === CHANNEL) return;
  localStorage.setItem('pp.channel', JSON.stringify(b.dataset.ch)); location.reload();
});

// How to prepare, by the bank's own section codes (track sections use their first source section).
const PREP_TIP = {
  S1: 'Learn the numbers: limits, tenors, interest rules, insurance cover. Most questions ask a figure or an eligibility.',
  S2: 'Know each loan scheme: purpose, eligibility, margin, maximum amount, repayment and collateral rules.',
  S3: 'Transaction limits and timings of UPI, IMPS, NEFT, RTGS, cards and ATMs, and RBI customer-protection rules.',
  S4: 'Account opening, KYC periodicity, nomination, deceased claims, dormant accounts, and HR rules on leave and conduct.',
  S5: 'Only 5 questions: learn FEMA basics, LRS limit, NRI account types and export credit periods.',
  S6: 'Government schemes: PMJDY, PMJJBY, PMSBY, APY, PPF, SSA, SCSS, Mudra, Stand-Up India. Learn premiums, ages and limits.',
  S7: 'Acts and sections: NI Act, BR Act, SARFAESI, RDB, IBC, PMLA, DICGC, Limitation Act. One fact per section.',
  S8: 'Current macro data: policy rates, CRR/SLR, inflation, GDP, Budget numbers and new RBI measures.',
  S9: 'NPA norms (SMA, 90 days, provisioning), CRILC, restructuring, appraisal ratios (DSCR, current ratio, MPBF).',

  G1: 'Read the whole passage first. Pick the option that follows the rule and protects both customer and bank.',

  B2: 'Organisation structure (verticals, circles, CPCs) and the Bank\'s key published policies and history.',

  IT1: 'CBS terms, cyber hygiene, phishing, password and data-security rules.'
};

// Every exam, for viewing: [id, channel, label]
const SY_VIEWS = [['s3', null, 'Scale II → III'], ['s2', null, 'Scale I → II'], ['jm', 'merit', 'Clerk: Merit / NCS'], ['jm', 'to', 'Clerk: Trainee Officer']];
const viewDef = (id, ch) => { const t = TRACKS[id]; return t.channels ? { ...t, ...t.channels[ch], track: t.name + ' · ' + t.channels[ch].name } : { ...t, track: t.name }; };
let syView = null;

function syllabus() {
  const mine = TRACK_ID + (TRACK_ID === 'jm' ? '.' + CHANNEL : ''), cur = syView || mine, own = cur === mine;

  const rows = sec.slice().sort((a, b) => mkOf(b) - mkOf(a)).map(s => {

      <tr><td>Situational analysis</td><td class="n">2 of 3</td><td class="n">6</td></tr><tr><td>Comprehension (English)</td><td class="n">1 (4 questions)</td><td class="n">4</td></tr>
      <tr><td>Business correspondence (English)</td><td class="n">1 of 2</td><td class="n">4</td></tr></tbody></table>
      <p class="src">Rationale, For and against and Situational analysis can be written in English or Hindi; Comprehension and Letter only in English. Paper I is bilingual.</p></div>` : '';
  V.innerHTML = `<div class="chips sy-tabs">${SY_VIEWS.map(([i, c, n]) => { const k = i + (c ? '.' + c : ''); return `<button class="chip" data-v="${k}" aria-pressed="${k === cur}">${n}${k === mine ? ' ★' : ''}</button>`; }).join('')}</div>
    <h2>${esc(D.full)}</h2><p class="lede">${esc(D.track)} · exam on <b>${new Date(D.date).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' })}</b>${own ? '' : ' · <span class="src">viewing only, not your exam</span>'}</p>
    <div class="grid2">
      <div class="card stat"><div class="v">${P.questions}</div><div class="k">Objective questions</div></div>
      <div class="card stat"><div class="v">${P.minutes}<small> min</small></div><div class="k">${Math.round(P.minutes * 60 / P.questions)} seconds a question</div></div>
      <div class="card stat"><div class="v">${+objMax.toFixed(2)}</div><div class="k">Objective marks</div></div>
      <div class="card stat"><div class="v">${total}</div><div class="k">Total marks</div></div>
    </div>
    ${vid === 'jm' && vch === 'to' ? '<p class="src">Qualifying: 65% overall (60% SC/ST); Section I needs 65% (60% SC/ST).</p>' : ''}
    <div class="label">Sections by weightage (highest first)</div>
    <div class="card sy">${rows}</div>
    ${descBlock}
    ${own ? `<div class="card"><b>How to use this</b><p class="lede" style="margin:4px 0 0">Spend your time in the order of this list: the top sections carry the most marks. Take a full mock every week and practise your two weakest sections every day.</p></div>` : ''}
    <p class="src">Structure as per the official guidelines for Promotion Year 2027-28. Five options per question in this app.</p>
    ${own ? '<a class="btn block" href="#home" style="margin-top:12px">Start preparing</a>' : '<a class="btn ghost block" href="#track" style="margin-top:12px">This is my exam: change my designation</a>'}`;
  V.querySelector('.sy-tabs').onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; syView = b.dataset.v === mine ? null : b.dataset.v; syllabus(); };

  'Which exams will you write? (one purchase covers both)': 'आप कौन सी परीक्षा देंगे? (एक ही खरीद में दोनों)',

  'Objective questions': 'वस्तुनिष्ठ प्रश्न', 'Objective marks': 'वस्तुनिष्ठ अंक', 'Total marks': 'कुल अंक', 'Start preparing': 'तैयारी शुरू करें',
  'Difficulty': 'कठिनाई', 'Simple': 'सरल', 'Moderate': 'मध्यम', 'Tough': 'कठिन', 'All': 'सभी', 'This is my exam: change my designation': 'यही मेरी परीक्षा है: मेरा पद बदलें'

<script>/* v0.24: "Your exam" card on Home (always shows who you are and your exam, one tap to change), and #guide: an in-app

function profileCard() {

}

const GUIDE_COMPARE = [
  ['Material', 'Notes from many places, some out of date', 'One app, written from current RBI directions and Acts, with the source of every answer'],
  ['Knowing what matters', 'Guesswork about important topics', 'Syllabus screen shows every section by its marks'],
  ['Practice', 'Re-reading notes', 'Active recall: answer, check, learn from the explanation'],
  ['Mistakes', 'Forgotten after a week', 'Mistake book brings them back until you get them right'],
  ['Exam practice', 'First timed paper is in the exam hall', 'Full mocks with the exact section mix, marks and time'],
  ['Descriptive / essay', 'Written without structure or key words', 'Frames, model answers, key-word chips and an answer checker'],
  ['Hindi-medium help', 'Struggle to put ideas in English', 'Phrases, key terms with Hindi meaning, Hindi → English sentences'],
  ['Figures and limits', 'Hunting through books for one amount or deadline', 'Fact Finder: every ₹ limit, day, tenure, age and % in one search'],
  ['Legal words', 'Unsure which Act and section defines a term', 'Law Dictionary: word → Act → section → meaning, with a line for your answer'],
  ['Regularity', 'Weekend study, long gaps', 'Daily target, streak and reminder keep you going'],
  ['Progress', 'No idea if you are improving', 'Section-wise accuracy, mock history and exam readiness score'],
];

function guide() {
  const hasDesc = DESC.length > 0, ex = TR.full;
  V.innerHTML = `<div class="gd">
  <div class="card gd-hero"><h2>How to prepare with Unnati</h2><p class="lede" style="margin:0">A simple plan for ${esc(ex)}. Ten minutes a day, every day, beats long sessions once a week.</p></div>

  <h3>Your benefits at a glance</h3>

    <li><b>One place for everything:</b> questions, mocks, ${hasDesc ? 'descriptive answers, ' : ''}figures and legal words. No pile of booklets.</li>

    <li><b>Exam-real practice:</b> mocks in your exam's exact section mix and time, on a real exam screen.</li>
    <li><b>Remember more:</b> a one-line "Remember" rule after each answer, and your mistakes keep coming back until you get them right.</li>

<script>/* v0.26 referral rewards, fully offline.
   1. A buyer who paid with a friend code (store 'tyFor', set in offers.js) gets a THANK-YOU code for that friend:
      TY-<NAME>-<nonce2><check3>, where the check is tied to the friend's full code, so it only works on the friend's phone.
   2. The friend (referrer) enters thank-you codes on #refer; each distinct one counts as one colleague who bought.
   Rewards: 1 = One-liner revision book (#revbook) · 3 = Ambassador badge + Tough mock · 5 = a free gift code for a
   colleague (claimed by email; NIRVAH LABS sends a Play promo code). Decided 18 Oct 2026. */
'use strict';

const tyCodeFor = refCode => {
  const name = refCode.split('-')[0], n = REF_ABC[Math.floor(Math.random() * 32)] + REF_ABC[Math.floor(Math.random() * 32)];
  return `TY-${name}-${n}${refCheck('TY:' + refCode, n)}`;
};
function isTyFor(code, refCode) {
  const m = /^TY-([A-Z]{3,10})-([2-9A-Z]{2})([2-9A-Z]{3})$/.exec(code);
  return !!m && m[1] === refCode.split('-')[0] && refCheck('TY:' + refCode, m[2]) === m[3];
}
const tyGot = () => store.get('tyGot', []);
const REWARDS = [
  { n: 1, icon: '📘', t: 'One-liner revision book', s: 'Every question as a one-line fact, section by section: fast revision in exam week.', go: '#revbook' },
  { n: 3, icon: '🏅', t: 'Ambassador badge + Tough mock', s: 'A badge on Home and a mock made only of Tough questions.', go: '#toughmock' },
  { n: 5, icon: '🎁', t: 'A free gift code for a colleague', s: 'Gift full access to one more colleague. Tap to claim by email; we send the code.', go: 'claim' }
];

const _refer = ROUTES.refer;
ROUTES.refer = function () {
  _refer();
  if (!full()) return;
  const my = store.get('refCode', ''), owe = store.get('tyFor', ''), got = tyGot();
  let html = '';
  if (owe) {
    let ty = store.get('tySent', '');
    if (!ty) { ty = tyCodeFor(owe); store.set('tySent', ty); }
    const msg = `Thank you for your Unnati friend code ${owe}! Here is your thank-you code: ${ty}. Enter it in Unnati → Your friend code → Thank-you codes to unlock your rewards.`;
    html += `<h3>Thank your friend</h3><div class="card"><p class="src" style="margin:0 0 8px">You bought with ${esc(owe)}'s code. Send this thank-you code to them; it unlocks their rewards.</p>
      <div class="v" data-noi18n style="font-size:1.4em;font-weight:700;letter-spacing:.05em">${esc(ty)}</div>
      <div class="row" style="margin-top:10px"><button class="btn" id="tySend">Send on WhatsApp</button></div></div>`;
    setTimeout(() => { const b = $('#tySend'); if (b) b.onclick = () => B.shareText ? B.shareText(msg) : (location.href = 'https://wa.me/?text=' + encodeURIComponent(msg)); });
  }
  if (my) {
    html += `<h3>Your rewards</h3><div class="card"><p style="margin:0 0 10px"><b>${got.length}</b> colleague${got.length === 1 ? '' : 's'} bought with your code.</p>
      ${REWARDS.map(r => { const on = got.length >= r.n; return `<div class="rw ${on ? 'on' : ''}"><span class="rw-i" aria-hidden="true">${r.icon}</span><span><b>${r.n} friend${r.n > 1 ? 's' : ''}: ${esc(r.t)}</b><small>${esc(r.s)}</small></span>
        ${on ? `<button class="btn small" data-rw="${r.go}">${r.go === 'claim' ? 'Claim' : 'Open'}</button>` : `<span class="rw-lock">🔒 ${r.n - got.length} more</span>`}</div>`; }).join('')}
      <label class="f" for="tyIn" style="margin-top:12px">Thank-you code from a colleague</label>
      <div class="row"><input type="text" id="tyIn" maxlength="20" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase;flex:1;width:auto"><button class="btn ghost" id="tyAdd">Add</button></div>
      <p class="src" id="tyMsg" aria-live="polite"></p></div>`;
  }
  if (!html) return;
  V.insertAdjacentHTML('beforeend', html);
  if (typeof translateTree === 'function') translateTree(V);
  const add = $('#tyAdd');
  if (add) add.onclick = () => {
    const c = $('#tyIn').value.toUpperCase().replace(/\s+/g, ''), m = $('#tyMsg');
    if (!isTyFor(c, my)) { m.textContent = 'This thank-you code is not for your friend code. Check the spelling.'; return; }
    if (got.includes(c)) { m.textContent = 'You have already added this code.'; return; }
    store.set('tyGot', got.concat(c)); toast('Thank-you code added'); ROUTES.refer();
  };
  V.querySelectorAll('[data-rw]').forEach(b => b.onclick = () => {
    if (b.dataset.rw !== 'claim') { location.hash = b.dataset.rw.slice(1); return; }
    const body = `I would like to claim my Unnati gift code (5 colleagues bought with my friend code ${my}).\n\nThank-you codes:\n${tyGot().join('\n')}\n\nGift for (colleague's Gmail used on Google Play): `;
    location.href = `mailto:${C.supportEmail}?subject=${encodeURIComponent('Unnati gift code claim: ' + my)}&body=${encodeURIComponent(body)}`;
  });
};

// Reward 1: one-liner revision book
function revbook() {
  if (!full() || tyGot().length < 1) { location.hash = 'refer'; return; }
  const secs = M.sections.filter(s => MCQ.some(q => q.sec === s.code && !q.psg));
  let cur = store.get('rbSec', secs[0] && secs[0].code);
  if (!secs.find(s => s.code === cur)) cur = secs[0] && secs[0].code;
  const qs = MCQ.filter(q => q.sec === cur && !q.psg);
  V.innerHTML = `<h2>One-liner revision book</h2><p class="lede">Each question as a fact: question, then the answer. Read a section in ten minutes.</p>
    <div class="chips" id="rbs">${secs.map(s => `<button class="chip" data-s="${s.code}" aria-pressed="${s.code === cur}">${esc(s.code)}</button>`).join('')}</div>
    <div class="card" style="margin-top:12px"><b>${esc(SEC[cur] ? SEC[cur].name : cur)}</b> · ${qs.length}
    <ol class="rb">${qs.map(q => `<li>${esc(q.q.replace(/[:?]\s*$/, ''))} → <b>${esc(q.opts[q.ans])}</b></li>`).join('')}</ol></div>`;
  $('#rbs').onclick = e => { const b = e.target.closest('[data-s]'); if (b) { store.set('rbSec', b.dataset.s); revbook(); } };
}

// Reward 2: Tough mock (only Tough questions), half a paper at exam pace
function toughmock() {
  if (!full() || tyGot().length < 3) { location.hash = 'refer'; return; }
  const pool = shuffle(MCQ.filter(q => q.lvl === 3 && !q.psg && q.sec !== 'S11'));
  const n = Math.min(pool.length, Math.round(C.examPattern.questions / 2)), mins = Math.max(10, Math.round(n * C.examPattern.minutes / C.examPattern.questions));
  V.innerHTML = `<div class="card"><h2>🏅 Tough mock</h2><p class="lede">${n} Tough questions in ${mins} minutes. Only for Unnati Ambassadors.</p><button class="btn block" id="tmGo">Start</button></div>`;
  $('#tmGo').onclick = () => runMock(pool.slice(0, n), mins, null, { hist: 'toughmocks', title: 'Tough mock' });
}

// Ambassador badge on the Home "Your exam" card
if (typeof profileCard === 'function') {
  const _pc = profileCard;
  profileCard = function () { const h = _pc(); return tyGot().length >= 3 ? h.replace('<b>', '<b><span class="amb">🏅 Ambassador</span> ') : h; };
}

Object.assign(ROUTES, { revbook, toughmock });
Object.assign(TITLES, { revbook: 'Revision book', toughmock: 'Tough mock' });
Object.assign(HI, {
  'Thank your friend': 'अपने मित्र को धन्यवाद दें', 'Your rewards': 'आपके इनाम', 'Send on WhatsApp': 'WhatsApp पर भेजें', 'Add': 'जोड़ें', 'Claim': 'प्राप्त करें', 'Open': 'खोलें',
  'Thank-you code from a colleague': 'साथी से मिला धन्यवाद कोड', 'One-liner revision book': 'एक-पंक्ति रिवीजन बुक', 'Tough mock': 'कठिन मॉक', 'Start': 'शुरू करें',
  'Ambassador badge + Tough mock': 'एम्बेसडर बैज + कठिन मॉक', 'A free gift code for a colleague': 'एक साथी के लिए मुफ्त गिफ्ट कोड'
});
</script>
<script>/* v0.25: (1) first-time tour — three quick tips the first time Practice, Mock or Write is opened;
   (2) Report a problem — flag button in the top bar on every screen: the user types what went wrong, the app takes a
       screenshot of the screen they were on and opens their email app (MainActivity.reportProblem; mailto in a browser).
   Larger tap targets are in app.css (v0.25 section). */
'use strict';

const TOURS = {
  practice: { t: 'Practice: 3 quick tips', tips: [
    ['🎯', 'Choose sections and a difficulty, or leave sections empty to practise everything. Unseen questions come first.'],
    ['🤔', 'Not sure? Tap "I\'m guessing" before you answer, so a lucky guess is not counted as known.'],
    ['🔁', 'Wrong answers go to your mistake book and come back until you get them right.']] },
  mock: { t: 'Mock: 3 quick tips', tips: [
    ['⏱️', 'A full mock follows your exam\'s official sections, marks and time. Sit it like the real exam: no breaks.'],
    ['📊', 'The result shows section scores weakest first, and the time you spent on each question.'],
    ['📅', 'One full mock a week is enough. Use sectional tests to speed up a slow section.']] },
  write: { t: 'Write: 3 quick tips', tips: [
    ['🧱', 'Each answer type has a frame. Open "Frames" once to learn the structure examiners expect.'],
    ['🔤', 'While typing, tap the key-word chips and Phrases to insert them. The Toolkit has Hindi → English help.'],
    ['✅', 'After writing, compare with the model answer and tick the checklist honestly.']] },
};

function showTour(r) {
  const T = TOURS[r], done = store.get('tour', []);
  if (!T || done.includes(r) || document.querySelector('.cele, .sheet') || !store.get('welcomed', false)) return;
  if (r === 'write' && !DESC.length) return;
  store.set('tour', done.concat(r));
  openSheet(`<h2>${esc(T.t)}</h2><div class="tour">${T.tips.map(([i, s]) => `<div class="tour-tip"><span aria-hidden="true">${i}</span><p>${esc(s)}</p></div>`).join('')}</div>
    <button class="btn block" data-close>Got it</button><p class="src" style="text-align:center;margin:8px 0 0">More help: More → How to use Unnati</p>`);
}

function openSheet(html) {
  const el = document.createElement('div'); el.className = 'sheet'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
  el.innerHTML = `<div class="sheet-card">${html}</div>`;
  document.body.appendChild(el);
  if (typeof translateTree === 'function') translateTree(el);
  const close = () => el.remove();
  el.addEventListener('click', e => { if (e.target === el || e.target.closest('[data-close]')) close(); });
  return { el, close };
}

function reportProblem() {
  if (document.querySelector('.sheet')) return;
  const screen = TITLES[(location.hash.slice(1) || 'home').split('/')[0]] || C.appName;
  const s = openSheet(`<h2>Report a problem</h2><p class="lede" style="margin:0 0 10px">Tell us what went wrong on "${esc(screen)}". We attach a screenshot of this screen and your app version.</p>
    <textarea id="rpText" rows="4" placeholder="For example: the answer to this question looks wrong, or a button does not work" style="width:100%"></textarea>
    <div class="row" style="margin-top:12px"><button class="btn" id="rpSend">Send by email</button><button class="btn ghost" data-close>Cancel</button></div>`);
  $('#rpText').focus();
  $('#rpSend').onclick = () => {
    const text = $('#rpText').value.trim() || '(no description)';
    const subject = `Problem report: ${C.appName} · ${screen}`;
    const body = `${text}\n\nScreen: ${screen}\nExam: ${TR.track}`;
    s.close();
    // let the sheet disappear so the screenshot shows the screen underneath
    setTimeout(() => {
      if (B.reportProblem) return B.reportProblem(C.supportEmail, subject, body);
      location.href = `mailto:${C.supportEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body + '\n\n' + navigator.userAgent)}`;
    }, 250);
  };
}

// flag button in the top bar, every screen
(function addReportButton() {
  const top = document.querySelector('.top'); if (!top || $('#rpBtn')) return;
  top.insertAdjacentHTML('beforeend', `<button id="rpBtn" class="rp-btn" aria-label="Report a problem" title="Report a problem"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 21V4h11l-1.5 4L16 12H7v9" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>`);
  $('#rpBtn').onclick = reportProblem;
})();

window.addEventListener('hashchange', () => setTimeout(() => showTour((location.hash.slice(1) || 'home').split('/')[0]), 500));

Object.assign(HI, {
  'Practice: 3 quick tips': 'अभ्यास: 3 काम की बातें', 'Mock: 3 quick tips': 'मॉक: 3 काम की बातें', 'Write: 3 quick tips': 'लेखन: 3 काम की बातें',
  'Got it': 'समझ गया', 'More help: More → How to use Unnati': 'और मदद: More → Unnati का उपयोग कैसे करें',
  'Report a problem': 'समस्या बताएं', 'Send by email': 'ईमेल से भेजें', 'Cancel': 'रद्द करें'
});
</script>
<script>/* v0.19 delight: streak flame card on Home, and one-time milestone celebrations (streaks, questions practised, mocks).
   Uses the daily log and streak() from study.js; celebrations already shown are remembered in pp.cele. */
'use strict';

const dayKeyOf = d => dayKey(d);

function streakCard() {
  const st = streak(), today = activeDay(DAYS[dayKeyOf(new Date())]);
  const days = [...Array(7)].map((_, k) => { const d = new Date(); d.setDate(d.getDate() - (6 - k)); return d; });
  const best = Math.max(st, store.get('bestStreak', 0));
  const dots = days.map(d => {
    const on = activeDay(DAYS[dayKeyOf(d)]), isToday = dayKeyOf(d) === dayKeyOf(new Date());
    return `<span class="sd${on ? ' on' : ''}${isToday ? ' today' : ''}"><i>${on ? '🔥' : ''}</i><small>${d.toLocaleDateString('en-IN', { weekday: 'narrow' })}</small></span>`;
  }).join('');
  return `<div class="card streak-card">
    <div class="sc-head"><span class="flame${st ? '' : ' off'}" aria-hidden="true">🔥</span>
      <div><b>${st ? st + '-day streak' : 'Start your streak'}</b><small>${today ? 'Today done. Come back tomorrow.' : st ? 'Practise 10 questions today to keep it.' : 'Practise 10 questions or write one answer.'}</small></div>
      ${best > 1 ? `<span class="sc-best">Best ${best}</span>` : ''}</div>
    <div class="sdots">${dots}</div></div>`;
}

// ---- milestones ----
const MILESTONES = [
  { id: 's3', test: m => m.streak >= 3, icon: '🔥', t: '3-day streak!', s: 'Three days in a row. Habits are built exactly like this.' },
  { id: 's7', test: m => m.streak >= 7, icon: '🔥', t: 'One full week!', s: '7 days in a row. You are ahead of most candidates.' },
  { id: 's14', test: m => m.streak >= 14, icon: '🏅', t: '14-day streak!', s: 'Two weeks of daily practice. This is how Scale III is won.' },
  { id: 's30', test: m => m.streak >= 30, icon: '🏆', t: '30-day streak!', s: 'A month without a break. Outstanding discipline.' },
  { id: 'q50', test: m => m.seen >= 50, icon: '📘', t: '50 questions practised', s: 'A strong start. Keep the daily rhythm going.' },
  { id: 'q100', test: m => m.seen >= 100, icon: '💯', t: '100 questions!', s: 'Your first century. Check your weakest section next.' },
  { id: 'q250', test: m => m.seen >= 250, icon: '🚀', t: '250 questions!', s: 'You are building real exam depth.' },

];

function metrics() {

  if (!next) return;

<script>/* v0.31 Mock Series and Smart Revision.
   Mock Series: up to 10 fixed papers per exam (and per Clerk channel), built in the exam's section mix and a set
   difficulty mix, with no question repeated across the series while the bank allows. Results are kept per paper.
   Smart Revision: what to revise now (mistakes and guesses, weakest section first) and one-line notes made from
   the learner's own mistakes and starred questions. */
'use strict';

const SERIES_MAX = 10;
const LV_MIX = TRACK_ID === 'jm' ? { 1: 0.5, 2: 0.5, 3: 0 } : { 1: 0.3, 2: 0.5, 3: 0.2 };   // Clerk sees Simple/Moderate only
const seriesKey = () => TRACK_ID + (TRACK_ID === 'jm' ? '.' + CHANNEL : '');
function seededShuffle(arr, seed) { const r = rng(hash32(seed)), a = arr.slice(); for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(r() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; }

/** Section plan: per section, questions needed and the level-wise lists in a fixed (seeded) order. */
function seriesPlan() {
  const pool = mcqPool().filter(q => q.sec !== 'MY' && unlocked(q));
  const secs = M.sections.filter(s => s.code !== 'S11').map(s => {
    const qs = pool.filter(q => q.sec === s.code), need = s.examQs;
    const by = {}; [1, 2, 3].forEach(L => { by[L] = seededShuffle(qs.filter(q => (q.lvl || 2) === L), seriesKey() + '|' + s.code + '|' + L); });
    const quota = {}; let given = 0;
    [1, 2, 3].forEach(L => { quota[L] = Math.round(need * (LV_MIX[L] || 0)); given += quota[L]; });
    quota[2] += need - given;                                   // rounding remainder goes to Moderate
    return { s, need, qs, by, quota, papers: Math.floor(qs.length / Math.max(1, need)) };
  });
  // Series length follows the whole bank; small sections rotate their questions, and "Coming soon" sections are skipped.
  const live = secs.filter(x => x.need && x.qs.length);
  const n = Math.max(1, Math.min(SERIES_MAX, Math.floor(live.reduce((a, x) => a + x.qs.length, 0) / Math.max(1, live.reduce((a, x) => a + x.need, 0)))));
  return { secs, n };
}
/** Paper n (0-based): slice n of each level list; short levels are topped up from the section's unused questions. */
function seriesPaper(n) {
  const { secs } = seriesPlan(), out = [];
  secs.forEach(({ s, need, qs, by, quota }) => {
    const pick = [];
    [1, 2, 3].forEach(L => {   // slice n of each level list, wrapping round when a level is small
      const list = by[L], q = Math.min(quota[L], list.length);
      for (let k = 0; k < q; k++) pick.push(list[(n * quota[L] + k) % list.length]);
    });
    if (pick.length < need) {
      const have = new Set(pick.map(q => q.id));
      pick.push(...seededShuffle(qs.filter(q => !have.has(q.id)), seriesKey() + '|fill|' + s.code + '|' + n).slice(0, need - pick.length));
    }
    out.push(...seededShuffle(pick.slice(0, need), seriesKey() + '|order|' + s.code + '|' + n));
  });
  const di = M.sections.find(s => s.code === 'S11');
  return di ? out.concat(diForMock(di.examQs)) : out;
}
const seriesRes = () => store.get('series', {})[seriesKey()] || {};
function saveSeries(n, r) {
  const all = store.get('series', {}), mine = all[seriesKey()] || {}, prev = mine[n];
  mine[n] = { d: new Date().toLocaleDateString('en-IN'), pct: r.pct, mk: +r.mk.toFixed(2), mkMax: +r.mkMax.toFixed(2), best: Math.max(r.pct, prev ? prev.best || prev.pct : 0), tries: (prev ? prev.tries || 1 : 0) + 1 };
  all[seriesKey()] = mine; store.set('series', all);
}
function seriesCard() {
  const { n } = seriesPlan(), R = seriesRes(), mins = C.examPattern.minutes;
  const done = Object.keys(R).length, avg = done ? Math.round(Object.values(R).reduce((a, x) => a + x.pct, 0) / done) : null;
  const rows = Array.from({ length: n }, (_, k) => {
    const r = R[k], locked = !full() && k > 0;
    return `<tr><td><b>Mock ${k + 1}</b></td><td class="n">${r ? r.pct + '%' : '–'}</td><td class="n">${r && r.tries > 1 ? r.best + '%' : r ? '' : ''}</td>
      <td class="n">${locked ? '🔒' : `<button class="btn small${r ? ' ghost' : ''}" data-ser="${k}">${r ? 'Retake' : 'Start'}</button>`}</td></tr>`;
  }).join('');
  return `<h3>Mock series</h3><div class="card"><p class="src" style="margin:0 0 8px">${n} fixed papers in the real section mix and difficulty mix (${TRACK_ID === 'jm' ? 'half Simple, half Moderate' : '30% Simple, 50% Moderate, 20% Tough'}), ${mins} minutes each. Each paper has its own questions (a few may repeat in small sections). Take them in order, one or two a week, and watch the trend.${avg !== null ? ` <b>Average so far: ${avg}%</b> over ${done} paper${done > 1 ? 's' : ''}.` : ''}</p>
    <table><thead><tr><th>Paper</th><th class="n">Score</th><th class="n">Best</th><th class="n"></th></tr></thead><tbody>${rows}</tbody></table>
    ${!full() ? `<p class="src" style="margin:8px 0 0">Mock 1 is free with the free questions. The full series opens with full access.</p>` : ''}</div>`;
}
const _mockPage = ROUTES.mock;
ROUTES.mock = function () {
  _mockPage();
  const anchor = V.querySelector('#go') && V.querySelector('#go').parentElement;
  if (!anchor) return;
  anchor.insertAdjacentHTML('afterend', seriesCard());
  V.querySelectorAll('[data-ser]').forEach(b => b.onclick = () => {
    const n = +b.dataset.ser;
    runMock(seriesPaper(n), C.examPattern.minutes, null, { title: 'Mock ' + (n + 1), onResult: r => saveSeries(n, r) });
  });
  if (typeof translateTree === 'function') translateTree(V);
};

// ================= SMART REVISION =================
const oneLine = q => `${q.q.replace(/\s*[:?]\s*$/, '').replace(/____/g, '…')} → ${q.opts[q.ans]}`;
function revise() {
  const S = sectionStats().filter(s => s.total), order = S.slice().sort((a, b) => (a.acc ?? 101) - (b.acc ?? 101)).map(s => s.code);
  const rank = c => { const k = order.indexOf(c); return k < 0 ? 99 : k; };
  const mist = mistakeQs(), starred = MCQ.filter(q => STARS.has(q.id) && unlocked(q));
  const due = mist.slice().sort((a, b) => rank(a.sec) - rank(b.sec));
  const noteQs = [...new Map(mist.concat(starred).map(q => [q.id, q])).values()];
  const groups = order.map(c => [c, noteQs.filter(q => q.sec === c)]).filter(([, qs]) => qs.length);
  const d = typeof daysToExam === 'function' ? daysToExam() : null;
  const weak = S.filter(s => s.att >= 5).sort((a, b) => a.acc - b.acc).slice(0, 3);
  V.innerHTML = modeBar('revise', PRACTICE_MODES) + `<h2>Smart revision</h2>
    <p class="lede">Built from your own answers: what you got wrong, guessed or starred, weakest section first.${d !== null && d >= 0 ? ` <b>${d} day${d === 1 ? '' : 's'} to your exam.</b>` : ''}</p>
    <div class="card"><div class="row end"><b>Revise now</b><span class="streak">${due.length}</span></div>
      <p class="src" style="margin:6px 0 10px">${due.length ? 'Mistakes not yet cleared, in order of your weakest sections. Answer one right twice to clear it.' : 'No pending mistakes. Take a mock from the series to find new ones.'}</p>
      <button class="btn block" id="rvGo" ${due.length ? '' : 'disabled'}>Practise ${Math.min(due.length, 30) || ''} now</button></div>
    ${weak.length ? `<h3>Your weakest sections</h3><div class="secbars">${weak.map(s => `<div class="sb"><span class="sb-n">${esc(s.code)}</span><span class="sb-t"><i class="${s.acc >= 70 ? 'g' : s.acc >= 40 ? 'm' : 'w'}" style="width:${s.acc}%"></i></span><span class="sb-v">${s.acc}%</span></div>`).join('')}</div>
      <button class="btn ghost block" id="rvSec" style="margin-top:8px">Sectional test on ${esc(weak[0].code)}</button>` : ''}
    <h3>Quick notes from your mistakes and stars</h3>
    ${groups.length ? groups.map(([c, qs]) => `<details class="card rvnotes"${c === order[0] ? ' open' : ''}><summary><b>${esc(c)}</b> · ${esc(SEC[c] ? SEC[c].name : '')} <small>(${qs.length})</small></summary>
      <div class="row end" style="margin:6px 0">${typeof listenBtn === 'function' ? listenBtn(qs.map(oneLine).join('. ')) : ''}</div>
      <ol class="rb">${qs.map(q => `<li>${esc(oneLine(q))}</li>`).join('')}</ol></details>`).join('')
      : '<div class="card"><p class="src" style="margin:0">Your notes appear here as you practise: every question you miss or star becomes a one-line fact to revise.</p></div>'}
    ${d !== null && d >= 0 && d <= 10 ? '<a class="btn ghost block" href="#final" style="margin-top:12px">Open the final-week plan</a>' : ''}`;
  $('#rvGo').onclick = () => runPractice(due.slice(0, 30));
  if ($('#rvSec')) $('#rvSec').onclick = () => { store.set('secSel', weak[0].code); store.set('secN', 30); location.hash = 'sectional'; };
  if (typeof translateTree === 'function') translateTree(V);
}
if (!PRACTICE_MODES.some(m => m[0] === 'revise')) PRACTICE_MODES.push(['revise', 'Revise']);
Object.assign(ROUTES, { revise });
Object.assign(TITLES, { revise: 'Smart revision' });
Object.assign(HI, { 'Smart revision': 'स्मार्ट रिवीजन', 'Revise': 'रिवीजन', 'Revise now': 'अभी दोहराएं', 'Mock series': 'मॉक सीरीज़', 'Your weakest sections': 'आपके सबसे कमज़ोर खंड', 'Quick notes from your mistakes and stars': 'आपकी गलतियों और स्टार से त्वरित नोट्स', 'Start': 'शुरू करें', 'Retake': 'दोबारा दें' });
</script>
<script>/* v0.32 "What changed": rule and limit changes, newest first, each tied to the questions that teach it.
   Data: content/changes.json (built by tools/build_changes.py, shipped with each update, works offline).
   Home shows a badge for entries the user has not opened yet. */
'use strict';

let CHG = null;
const chgSeen = () => new Set(store.get('chgSeen', []));
async function loadChanges() {
  if (CHG) return CHG;
  try { CHG = await (await fetch('content/changes.json')).json(); } catch (e) { CHG = { items: [] }; }
  return CHG;
}
const chgDate = d => new Date(d + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
const chgUpcoming = c => new Date(c.date + 'T00:00:00') > new Date();
const chgQs = c => c.q.map(id => MCQ.find(q => q.id === id || q.osec && q.id === id)).filter(Boolean);

async function changes() {
  V.innerHTML = '<p class="lede">Loading…</p>';
  const { items, updated } = await loadChanges();
  if (location.hash.slice(1).split('/')[0] !== 'changes') return;
  const seen = chgSeen(), areas = ['All', ...new Set(items.map(c => c.area))];
  let area = store.get('chgArea', 'All'); if (!areas.includes(area)) area = 'All';
  const shown = items.filter(c => area === 'All' || c.area === area);
  V.innerHTML = `<h2>What changed</h2>
    <p class="lede">Recent changes in rules, limits and charges that the exam can ask about, with what applied before and what applies now. The questions on each change are already updated.</p>
    <div class="chips" id="chgA">${areas.map(a => `<button class="chip" data-a="${esc(a)}" aria-pressed="${a === area}">${esc(a)}</button>`).join('')}</div>
    <div class="stack" style="margin-top:12px">${shown.map(c => { const qs = chgQs(c), up = chgUpcoming(c), fresh = !seen.has(c.id); return `<div class="card chg${up ? ' up' : ''}">
      <div class="row end"><span class="progress">${up ? 'From' : 'Since'} ${chgDate(c.date)} · ${esc(c.area)}</span>${up ? '<span class="tag soon">Coming</span>' : fresh ? '<span class="tag new">New</span>' : ''}</div>
      <b class="chg-t">${esc(c.title)}</b>
      <div class="chg-ba"><div><small>Before</small><p>${esc(c.before)}</p></div><div><small>Now</small><p>${esc(c.now)}</p></div></div>
      <div class="row" style="margin-top:8px">${qs.length ? `<button class="btn small" data-chq="${c.id}">Practise ${qs.length} question${qs.length > 1 ? 's' : ''}</button>` : ''}
        ${c.url ? `<a class="srclink" style="margin:0" href="${esc(c.url)}" target="_blank" rel="noopener">Source ↗</a>` : ''}</div></div>`; }).join('')}</div>
    <p class="src" style="margin-top:12px">List updated ${chgDate(updated)}. Each app update adds new changes.</p>`;
  $('#chgA').onclick = e => { const b = e.target.closest('[data-a]'); if (b) { store.set('chgArea', b.dataset.a); changes(); } };
  V.querySelectorAll('[data-chq]').forEach(b => b.onclick = () => { const c = items.find(x => x.id === b.dataset.chq), qs = chgQs(c).filter(unlocked); if (qs.length) runPractice(qs); else location.hash = 'unlock'; });
  store.set('chgSeen', [...new Set([...seen, ...items.map(c => c.id)])]);
  if (typeof translateTree === 'function') translateTree(V);
}

// Home: a small card while there are unseen changes
const _homeChg = ROUTES.home;
ROUTES.home = function () {
  _homeChg();
  loadChanges().then(({ items }) => {
    if ((location.hash.slice(1) || 'home').split('/')[0] !== 'home') return;
    const seen = chgSeen(), fresh = items.filter(c => !seen.has(c.id));
    if (!fresh.length || V.querySelector('.chg-home')) return;
    const anchor = V.querySelector('.motto') || V.querySelector('.hero');
    if (!anchor) return;
    anchor.insertAdjacentHTML('afterend', `<a class="card chg-home" href="#changes"><span class="chg-n">${fresh.length}</span><span><b>${fresh.length} rule change${fresh.length > 1 ? 's' : ''} to know</b><small>${esc(fresh[0].title)}${fresh.length > 1 ? ' and more' : ''}</small></span><span aria-hidden="true">›</span></a>`);
  });
};
// More menu entry
const _moreChg = ROUTES.more;
ROUTES.more = function () {
  _moreChg();
  const list = V.querySelector('.card.list');
  if (list) list.insertAdjacentHTML('afterbegin', `<a class="item" href="#changes"><span>What changed<small>New rules, limits and charges, before and now</small></span></a>`);
};
Object.assign(ROUTES, { changes });
Object.assign(TITLES, { changes: 'What changed' });
Object.assign(HI, { 'What changed': 'क्या बदला', 'Before': 'पहले', 'Now': 'अब', 'Coming': 'आने वाला', 'New': 'नया', 'All': 'सभी' });

<script>/* v0.40 Fact Finder: the master cheat sheet inside the app. Every question that carries a "Remember" line becomes a
   searchable fact, grouped by kind (₹, days, years, age, %, act/section) and subject, each with its source date and a
   one-tap "Practise". Free users see the facts of free questions; the rest are counted behind the Full access lock. */
'use strict';

const FK = [
  ['all', 'All', null],
  ['amt', '₹ Amounts', /₹|\brupees?\b|\blakh\b|\bcrore\b|USD|\$/i],
  ['day', 'Days & deadlines', /\b\d+\s*(working |calendar )?(days?|hours?|months?|weeks?)\b|T\+\d|\b\d+(st|nd|rd|th)\b/i],
  ['yr', 'Years & tenure', /\b\d+\s*(years?|yrs?)\b|tenure|lock-in|maturity/i],
  ['age', 'Age', /\bage[sd]?\b|years? (old|of age)|senior citizen|minor|\b(18|60|65|70|75|80)\+/i],
  ['pct', '%', /%|per cent|percent|\bbps\b/i],
  ['law', 'Acts & sections', /\bSec(tion)?s?\.?\s*\d|\bAct\b|\bRule\s*\d/i],
  ['last', 'Last 24 hours', null]
];
const factText = q => (q.opts[q.ans] + ' ' + q.tk);
const isFigure = q => FK.slice(1, 6).some(k => k[2].test(factText(q)));
function factKind(q, k) {
  if (k === 'all') return true;
  if (k === 'last') return q.lvl === 3 && isFigure(q);
  const re = FK.find(x => x[0] === k)[2];
  return re.test(k === 'law' ? factText(q) + ' ' + q.q : factText(q));
}

let factShown = 40;
function facts() {
