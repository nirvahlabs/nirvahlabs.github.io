l frauds today do not break into bank systems; they break into people's trust. A caller claiming to be from the bank warns that an account will be blocked unless the customer shares an OTP. A message offers a refund that can be claimed only by scanning a QR code. A video call shows a uniformed \"officer\" accusing the victim of a crime. In each case the fraudster creates fear or greed so that the victim acts before thinking.\n\nTechnology alone cannot stop such social engineering. Banks have added alerts, limits and cooling periods, but the decisive moment is when the customer chooses to share a code or approve a payment. Awareness is therefore the strongest defence.\n\nSimple rules help. A bank never asks for a PIN, OTP or password. Scanning a QR code is for paying, never for receiving money. Government agencies do not arrest people on video calls. When in doubt, the customer should disconnect and call the bank's official number. Every staff member who explains these rules to one customer may protect a whole family.\n\nQuestions:\n1. How do most digital frauds work, according to the passage?\n2. Why does the writer say technology alone cannot stop social engineering?\n3. State any two rules the passage gives for staying safe.\n4. What is meant by \"social engineering\" in this passage?", "ans": "1. They exploit people's trust rather than bank systems, creating fear or greed so that victims share codes or approve payments without thinking.\n2. Because the decisive step, sharing a code or approving a payment, is taken by the customer, so awareness matters more than technology.\n3. Any two: a bank never asks for a PIN, OTP or password; scanning a QR code is for paying, not receiving money; agencies do not arrest people on video calls; when in doubt, disconnect and call the bank's official number.\n4. Tricking people psychologically, through fear, greed or false authority, into giving away information or money.", "src": "Original model answer · original passage written for this app", "asOf": "2026-10", "free": true, "status": "reviewed"}, {"id": "ESSAY-0001", "type": "ESSAY", "q": "Digital banking: opportunities and challenges", "ans": "Digital banking has changed the way Indians handle money. A farmer can receive a subsidy directly in his account, a shopkeeper accepts payment through a QR code, and a student pays fees from a mobile phone in seconds. UPI, internet banking and mobile apps have made banking available every hour of every day.\n\nThe opportunities are large. Digital channels reduce the cost of each transaction, so banks can serve small customers profitably. Customers save time and travel. Every digital payment also leaves a record, which helps small borrowers build a credit history and get loans more easily. For the Government, direct benefit transfer has reduced leakages.\n\nThe challenges are equally real. Cyber fraud is rising, and many victims are new users who do not know that a bank never asks for a PIN or OTP. Elderly customers and people in remote areas may lack smartphones, connectivity or confidence. System failures, even for a few hours, can stop payments across the country.\n\nBanks must therefore grow digital services and safety together. Strong systems, quick reversal of failed transactions, simple apps in local languages and regular awareness campaigns are essential. Branch staff have a role too: they should help first-time users and explain safe habits patiently.\n\nIn conclusion, digital banking is not a replacement for trust but a new way of earning it. If convenience is matched by security and inclusion, digital banking can bring every Indian into the formal financial system.", "src": "Original model essay written for Unnati Promotion Prep", "asOf": "2026-10", "free": true, "status": "reviewed", "tracks": ["jm"]}, {"id": "ESSAY-0002", "type": "ESSAY", "q": "Financial inclusion: the road ahead", "ans": "Financial inclusion means that every individual, especially the poor and those in rural areas, has access to affordable financial services such as a savings account, credit, insurance, pension and payment facilities. India has made remarkable progress. Crores of accounts were opened under the Jan Dhan Yojana, and schemes such as PMJJBY, PMSBY and Atal Pension Yojana provide low-cost insurance and pensions.\n\nAccess, however, is only the first step. Many accounts remain unused, and a large number of families still borrow from moneylenders at high interest. Real inclusion means that people use their accounts regularly for saving, receiving payments and borrowing at fair rates.\n\nSeveral steps can take inclusion forward. Business correspondents should be trained and paid fairly so that they serve villages reliably. Financial literacy, in the local language and through practical examples, helps people understand interest, insurance and fraud. Small loans for self-help groups, small farmers and micro-enterprises should be easy to obtain, with simple documentation. Digital tools such as Aadhaar-based payments and UPI can lower costs further.\n\nWomen deserve special attention. When women control savings and credit, families spend more on education and health. Self-help groups have shown how powerful this can be.\n\nBanks gain as well. Today's small customer is tomorrow's home-loan borrower and investor. Inclusion therefore builds a larger and more stable business.\n\nIn conclusion, financial inclusion is both a social duty and a sound business choice. Its success should be measured not by accounts opened but by lives improved.", "src": "Original model essay written for Unnati Promotion Prep", "asOf": "2026-10", "free": true, "status": "reviewed", "tracks": ["jm"]}]}};

<script>/* Exam tracks: one app, three promotion exams (official structure, Promotion Year 2027-28 guidelines).
   Loaded after config.js and before app.js. The active track rewrites the exam pattern, the sections, the price and
   the offers; app.js then filters and relabels the question bank with applyTrack(), so every screen follows the track.
   Scale II -> III (s3) is the original app and stays exactly as it was: same section codes, same product, same keys.
   A track section draws from the bank's own sections (`from`); `pick` narrows by text, `lvl` by difficulty.
   `mk` = marks per question when a section differs from the pattern's marksEach. */
'use strict';

const CHANNEL_RX = /\b(ATM|ADWM|CDM|UPI|BHIM|IMPS|NEFT|RTGS|NACH|AePS|mobile|internet banking|YONO|POS|QR|card|wallet|BBPS|kiosk|CSP|BC\b|business correspondent|e-?mandate|FASTag|green pin)/i;
const LV = { 1: 'Simple', 2: 'Moderate', 3: 'Tough' };

const TRACKS = {
  s3: {
    name: 'Scale II → III', full: 'MMGS-II to MMGS-III', date: '2026-12-26', product: 'full_access',
    pattern: { questions: 140, minutes: 100, marksEach: 0.5, descMinutes: 80, descMarks: 30 },
    sections: null,                                // the manifest's sections, unchanged
    desc: ['RAT', 'FA', 'SIT', 'COMP', 'BC'], paper: null
  },
  s2: {
    name: 'Scale I → II', full: 'JMGS-I to MMGS-II', date: '2027-01-17', product: 'unlock_s2',
    pattern: { questions: 150, minutes: 120, marksEach: 0.5, descMinutes: 0, descMarks: 0 },
    sections: [
      { code: 'S1', name: 'Product features: deposit / liability', examQs: 20, from: ['S1'] },
      { code: 'S2', name: 'Product features: advances / assets', examQs: 20, from: ['S2'] },
      { code: 'S3', name: 'IT channels, payment solutions, new initiatives', examQs: 10, from: ['S3'] },
      { code: 'S4', name: 'Systems and procedures, organisation structure, HR', examQs: 20, from: ['S4'] },
      { code: 'S5', name: 'Forex / treasury / IB', examQs: 5, from: ['S5'] },
      { code: 'S6', name: 'Government business, cross-selling, financial inclusion', examQs: 15, from: ['S6'] },
      { code: 'S7', name: 'Laws relevant to banks', examQs: 15, from: ['S7'] },
      { code: 'S8', name: 'Macro-economic environment / general awareness', examQs: 10, from: ['S8'] },
      { code: 'S9', name: 'Pre/post-sanction processes and NPA management', examQs: 15, from: ['S9'] },
      { code: 'E1', name: 'English language comprehension', examQs: 20, from: ['E1'] }
    ],
    desc: [], paper: null
  },
  jm: {
    name: 'Clerical → Officer', full: 'Clerical to JMGS-I', product: 'unlock_jm',
    channels: {
      merit: {
        name: 'Merit / Normal-cum-Seniority', date: '2027-01-03',
        pattern: { questions: 140, minutes: 150, marksEach: 0.5, descMinutes: 0, descMarks: 0 },
        sections: [
          { code: 'M1', name: 'General banking, KYC, legal issues, systems and procedures', examQs: 50, from: ['S4', 'S7', 'G1'], lvl: [1, 2], mk: 0.5 },
          { code: 'M2', name: 'CBS, computer awareness, computer security', examQs: 20, from: ['S3', 'IT1'], pick: q => !CHANNEL_RX.test(q.q), mk: 0.75 },
          { code: 'M3', name: 'Products and services, associates, other banks, alternate channels, financial inclusion', examQs: 30, from: ['S1', 'S2', 'S6', 'S3'], lvl: [1, 2], mk: 0.5 },
          { code: 'M4', name: 'Latest financial results and performance of the Bank', examQs: 10, from: ['B1'], mk: 0.5 },
          { code: 'M5', name: 'Practical problems in general banking', examQs: 10, from: ['P1'], mk: 2 },
          { code: 'M6', name: 'General awareness', examQs: 10, from: ['S8'], lvl: [1, 2], mk: 1 },
          { code: 'M7', name: 'Organisational structure and policy guidelines of the Bank', examQs: 10, from: ['B2'], mk: 1 }
        ],
        desc: [], paper: null
      },
      to: {
        name: 'Trainee Officer', date: '2027-01-10',
        pattern: { questions: 120, minutes: 120, marksEach: 0.5, descMinutes: 30, descMarks: 20 },
        sections: [
          { code: 'T1', name: 'General awareness: banking environment, KYC, legal issues', examQs: 20, from: ['S8', 'S7'], lvl: [1, 2], mk: 0.5 },
          { code: 'T2', name: 'General banking, customer grievances, preventive vigilance (passages)', examQs: 20, from: ['G1'], mk: 1 },
          { code: 'T3', name: 'Products and services incl. retail finance, associates, other banks, financial inclusion', examQs: 20, from: ['S1', 'S2', 'S6'], lvl: [1, 2], mk: 1 },
          { code: 'T4', name: 'CBS and IT products, IT security', examQs: 20, from: ['S3', 'IT1'], pick: q => !CHANNEL_RX.test(q.q), mk: 0.75 },
          { code: 'T5', name: 'Alternate channel products', examQs: 20, from: ['S3'], pick: q => CHANNEL_RX.test(q.q), mk: 0.5 },
          { code: 'T6', name: 'Financial results, performance, organisational structure and history', examQs: 20, from: ['B1', 'B2'], mk: 0.25 }
        ],
        desc: ['ESSAY'], paper: { ESSAY: { offer: 3, attempt: 1, marks: 20 } }
      }
    }
  }
};

let TRACK_ID = 's3', CHANNEL = 'merit';
try { TRACK_ID = JSON.parse(localStorage.getItem('pp.track') || '"s3"'); CHANNEL = JSON.parse(localStorage.getItem('pp.channel') || '"merit"'); } catch (e) { }
if (!TRACKS[TRACK_ID]) TRACK_ID = 's3';
if (TRACK_ID === 'jm' && !TRACKS.jm.channels[CHANNEL]) CHANNEL = 'merit';
const TR = (() => { const t = TRACKS[TRACK_ID]; return t.channels ? { ...t, ...t.channels[CHANNEL], track: t.name + ' · ' + t.channels[CHANNEL].name } : { ...t, track: t.name }; })();

// Pattern for every screen that reads C.examPattern.
window.CONFIG.examPattern = TR.pattern;
// Prices and offers per track. s3 keeps config.js as it is; other tracks read C.trackPrices (none = no offers yet).
if (TRACK_ID !== 's3') {
  const p = (window.CONFIG.trackPrices || {})[TRACK_ID] || {};
  window.CONFIG.price = p.price || window.CONFIG.price;
  window.CONFIG.offers = p.offers || [];
  window.CONFIG.friendOffer = p.friendOffer || null;
}

/** Keys kept separately per exam, so mock history and the exam date of one track don't mix with another.
    s3 uses the original keys, so existing users keep their data. */
const TRACK_KEYS = ['examDate', 'mocks', 'exams', 'pSel', 'sectionals', 'duels', 'planDone'];
const trackKey = k => TRACK_ID === 's3' || !TRACK_KEYS.includes(k) ? k : k + '.' + TRACK_ID + (TRACK_ID === 'jm' ? '.' + CHANNEL : '');

/** Called by app.js load(): relabel the bank for the active track. Returns { sections, mcq, desc }. */
function applyTrack(manifestSections, mcq, desc) {
  const descOk = d => TR.desc.includes(d.type) && (d.tracks || ['s3']).includes(TRACK_ID);
  if (!TR.sections) {
    const own = new Set(manifestSections.map(s => s.code));
    return { sections: manifestSections, mcq: mcq.filter(q => own.has(q.sec)), desc: desc.filter(descOk) };
  }
  const out = [];
  for (const q of mcq) {
    const s = TR.sections.find(s => s.from.includes(q.sec) && (!s.lvl || s.lvl.includes(q.lvl || 2)) && (!s.pick || s.pick(q)));
    if (s) out.push(q.sec === s.code ? q : { ...q, sec: s.code, osec: q.sec });
  }
  return { sections: TR.sections, mcq: out, desc: desc.filter(descOk) };
}

/** Marks for one question in the active pattern. */
const marksOf = q => (SEC[q.sec] && SEC[q.sec].mk) || C.examPattern.marksEach;
const levelTag = q => q.lvl ? `<span class="tag lv${q.lvl}">${LV[q.lvl]}</span>` : '';
</script>

  <a href="#write" data-r="write"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Write</a>
  <a href="#more" data-r="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</a>
</nav>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script>/* Promotion Prep — single-page study app. Routes: #home #practice #mock #write #more #frames #notes #myq #settings #about */
'use strict';
const C = window.CONFIG;
const $ = (s, el = document) => el.querySelector(s);
const V = $('#view');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const words = s => (s.trim().match(/\S+/g) || []).length;
const store = {
  get(k, d) { try { const v = localStorage.getItem('pp.' + trackKey(k)); return v ? JSON.parse(v) : k === 'examDate' && TR.date ? TR.date : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('pp.' + trackKey(k), JSON.stringify(v)); } catch (e) { } }
};
const LETTERS = 'ABCDE';
const optOrder = q => shuffle(q.opts.map((_, k) => k));
const monthName = ym => { const [y, m] = String(ym).split('-'); return new Date(+y, +m - 1, 1).toLocaleDateString('en-IN', { month: 'short', year: 'numeric' }); };
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600); }

// ---- native bridge (falls back to a browser stub for testing on a PC) ----
const B = window.AppBridge || {
  isDebug: () => true, version: () => 'web',
  hasFullAccess: () => store.get('webFull', false),
  owns: p => p === 'full_access' ? store.get('webFull', false) : store.get('webFull.' + p, false),
  debugSetFullAccess: v => store.set(TR.product === 'full_access' ? 'webFull' : 'webFull.' + TR.product, !!v),
  buyFullAccess: () => toast('Purchases open when the app is on Google Play.')
};
const DEBUG = B.isDebug();
// Called by Billing.java when Play confirms or removes the purchase.
window.ppOnAccess = () => route();
const priceText = () => (B.price && B.price()) || C.price;
// Each exam is its own purchase. Scale II -> III is the original product full_access.
const full = () => TR.product === 'full_access' ? B.hasFullAccess() : !!(B.owns && B.owns(TR.product));
if (B.setProduct) B.setProduct(TR.product);

// ---- content ----
let M = null, MCQ = [], DESC = [], SEC = {};
async function load() {
  M = await (await fetch('content/manifest.json')).json();
  const packs = await Promise.all(M.packs.map(f => fetch('content/' + f).then(r => r.json())));   // in parallel: faster start on slow phones
  const allM = [], allD = [];
  for (const p of packs) {
    const items = p.items.filter(it => DEBUG || it.status === 'reviewed');
    (p.pack === 'mcq' ? allM : allD).push(...items);
  }
  // Passage-based items (English comprehension, case passages): the passage is shown above each of its questions.
  allM.forEach(q => { if (q.psg && !q.table) q.table = `<div class="card psg"><div class="label">${esc(q.psgTitle || 'Read the passage')}</div>${q.psg.split(/\n\s*\n/).map(p => `<p>${esc(p)}</p>`).join('')}</div>`; });
  const t = applyTrack(M.sections, allM, allD);   // tracks.js: this exam's sections and questions
  M.sections = t.sections; MCQ.push(...t.mcq); DESC.push(...t.desc);
  M.sections.forEach(s => SEC[s.code] = s);
}
const myQs = () => store.get('myq', []).map(q => ({ ...q, sec: 'MY', free: true, status: 'mine', src: 'My own question', asOf: '' }));
const unlocked = it => full() || it.free;
const mcqPool = () => MCQ.concat(myQs());

// ---- progress ----
let ST = store.get('stats', {}); // id -> [seen, correct, lastWrong]
function record(id, ok) { const s = ST[id] || [0, 0, 0]; s[0]++; if (ok) s[1]++; s[2] = ok ? 0 : 1; ST[id] = s; store.set('stats', ST); }

// ---- router ----
const ROUTES = { home, practice, recall, di, mock, write, typing, more, frames, notes, myq, settings, about };
const TITLES = { home: C.appName, practice: 'Practice', recall: 'Recall cards', di: 'Data interpretation', mock: 'Mock test', write: 'Descriptive', typing: 'Typing speed', more: 'More', frames: 'Answer frames', notes: 'My notes', myq: 'My questions', settings: 'Exam date and settings', about: 'About' };
let stopTimer = () => { };
function route() {
  stopTimer(); stopTimer = () => { };
  const r = (location.hash.slice(1) || 'home').split('/')[0];
  const fn = ROUTES[r] || home;
  $('#title').textContent = TITLES[r] || C.appName;
  $('#topRight').textContent = ''; $('#topRight').className = '';
  const tab = ['recall', 'di', 'mistakes', 'revise'].includes(r) ? 'practice' : ['typing', 'frames', 'toolkit'].includes(r) ? 'write' : ['exam', 'sectional', 'duel'].includes(r) ? 'mock' : ['practice', 'mock', 'write', 'more', 'home'].includes(r) ? r : (['notes', 'myq', 'settings', 'about', 'progress', 'calc', 'final', 'unlock', 'refer', 'syllabus', 'guide', 'track', 'revbook', 'toughmock', 'changes'].includes(r) ? 'more' : 'home');
  document.querySelectorAll('.tabbar a').forEach(a => a.dataset.r === tab ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  window.scrollTo(0, 0);
  fn();
}
window.addEventListener('hashchange', route);

const lockCard = n => full() || !n ? '' :
  `<div class="lock"><span><b>${n} more</b> in Full access. Unlock every question, mock and model answer for ${esc(bestPriceText())}.</span><button class="btn" data-buy>Unlock</button></div>`;
V.addEventListener('click', e => { if (e.target.closest('[data-buy]')) location.hash = 'unlock'; });

// ================= HOME =================
function home() {
  const exam = store.get('examDate', '');
  const left = exam ? Math.ceil((new Date(exam + 'T10:00:00') - new Date()) / 864e5) : null;
  let seen = 0, att = 0, ok = 0; for (const k in ST) { seen++; att += ST[k][0]; ok += ST[k][1]; }
  const mocks = store.get('mocks', []), best = mocks.length ? Math.max(...mocks.map(m => m.pct)) : null;
  const total = mcqPool().length, avail = mcqPool().filter(unlocked).length;
  V.innerHTML = `<div class="stack">
    <div class="hero">${left !== null && left >= 0
      ? `<div class="big">${left}<small>DAYS LEFT</small></div><p>${(() => { const n = (typeof profile === 'function' && profile() || {}).name; return n ? 'Namaste, <b>' + esc(n.split(' ')[0]) + '</b>. ' : ''; })()}<b>${esc(TR.full)}</b>${TRACK_ID === 'jm' ? ' · ' + esc(TR.channels[CHANNEL].name) : ''}<br>exam on <b>${new Date(exam).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' })}</b>.<br>Small daily practice beats last-week cramming.</p>`
      : `<div><p><b>Set your exam date</b> to see a countdown and pace your preparation.</p><button class="btn light" onclick="location.hash='settings'">Set exam date</button></div>`}</div>
    ${typeof channelSwitch === 'function' ? channelSwitch() : ''}
    <div class="motto" data-noi18n><b lang="hi">इस बार तैयारी पक्की।</b><span>This time, your preparation is solid.</span></div>
    ${typeof profileCard === 'function' ? profileCard() : ''}
    ${typeof streakCard === 'function' ? streakCard() : ''}
    ${planCard()}
    <div class="grid2">
      <div class="card stat"><div class="v">${seen} <small>/ ${total}</small></div><div class="k">Questions practised</div><div class="meter"><i style="width:${total ? Math.round(seen / total * 100) : 0}%"></i></div></div>
      <div class="card stat"><div class="v">${att ? Math.round(ok / att * 100) + '%' : '–'}</div><div class="k">Accuracy</div><div class="meter"><i style="width:${att ? Math.round(ok / att * 100) : 0}%"></i></div></div>
      <div class="card stat"><div class="v">${best !== null ? best + '%' : '–'}</div><div class="k">Best mock score</div><div class="meter"><i style="width:${best || 0}%"></i></div></div>
      ${DESC.length ? `<div class="card stat"><div class="v">${DESC.filter(unlocked).length}</div><div class="k">${DESC.every(d => d.type === 'ESSAY') ? 'Essay topics' : 'Descriptive questions'}</div><div class="meter"><i style="width:100%"></i></div></div>` : `<div class="card stat"><div class="v">${MCQ.filter(unlocked).length}</div><div class="k">Questions open to you</div><div class="meter"><i style="width:100%"></i></div></div>`}
    </div>
    <div class="card"><div class="row end"><b>Continue</b><span class="src">Content true as of ${new Date(M.asOf).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })}</span></div>
      <div class="stack" style="margin-top:10px">
        <button class="btn block" onclick="location.hash='practice'">Practise questions</button>
        <div class="grid2"><button class="btn ghost" onclick="location.hash='mock'">Mock test</button>${DESC.length ? `<button class="btn ghost" onclick="location.hash='write'">Write an answer</button>` : ''}
        <button class="btn ghost" onclick="location.hash='recall'">Recall cards</button>${SEC.S11 ? `<button class="btn ghost" onclick="location.hash='di'">DI sets</button>` : ''}
        ${C.examPattern.descMarks && DESC.length ? `<button class="btn ghost" onclick="location.hash='exam'">Full exam</button>` : ''}<button class="btn ghost" onclick="location.hash='progress'">My progress</button></div>
      </div></div>
    ${lockCard(total - avail)}
    ${DEBUG ? `<p class="src">Debug build · ${MCQ.filter(x => x.status === 'draft').length + DESC.filter(x => x.status === 'draft').length} draft items visible (hidden in release)</p>` : ''}
  </div>`;
}

// ================= PRACTICE =================
let pSel = store.get('pSel', []), pN = store.get('pN', 20), pLv = store.get('pLv', 0);
function practice() {
  const pool = mcqPool();
  const codes = M.sections.map(s => s.code).concat(myQs().length ? ['MY'] : []);
  const cnt = c => pool.filter(q => q.sec === c);
  V.innerHTML = modeBar('practice') + `<h2>Practice by section</h2><p class="lede">Pick sections, or leave them empty to draw from everything. Unseen questions come first.</p>
    <div class="label">Sections</div>
    <div class="secgrid" id="secs">${codes.map(c => {
      const all = cnt(c), av = all.filter(unlocked); if (!all.length) return c === 'MY' || c === 'S11' ? '' : `<div class="sec-card soon"><span class="ring" style="--p:0"><b>…</b></span><span class="sc-t"><b>${esc(c)}</b><span>${esc(SEC[c].name)}</span><small>Coming soon</small></span></div>`;
      const seenN = av.filter(q => ST[q.id]).length, pctSeen = av.length ? Math.round(seenN / av.length * 100) : 0;
      let at = 0, ok = 0; av.forEach(q => { const s = ST[q.id]; if (s) { at += s[0]; ok += s[1]; } });
      return `<button class="sec-card" data-c="${c}" aria-pressed="${pSel.includes(c)}">
        <span class="ring" style="--p:${pctSeen}"><b>${pctSeen}%</b></span>
        <span class="sc-t"><b>${c === 'MY' ? 'My questions' : esc(c)}</b><span>${c === 'MY' ? 'Your own' : esc(SEC[c].name)}</span>
        <small>${seenN}/${av.length} done${at ? ' · ' + Math.round(ok / at * 100) + '% right' : ''}</small></span>
      </button>`; }).join('')}</div>
    <div class="row end" style="margin-top:6px"><small class="src">Tap to choose sections. None chosen = all.</small><button class="linkish" id="clr">Clear</button></div>
    <div class="label">Difficulty</div>
    <div class="chips" id="lv">${[[0, 'All'], [1, 'Simple'], [2, 'Moderate'], [3, 'Tough']].map(([v, n]) => `<button class="chip" data-v="${v}" aria-pressed="${v === pLv}">${n}</button>`).join('')}</div>
    <div class="label">Questions per session</div>
    <div class="chips" id="ns">${[10, 20, 40].map(n => `<button class="chip" data-n="${n}" aria-pressed="${n === pN}">${n}</button>`).join('')}</div>
    <div style="margin-top:18px"><button class="btn block" id="go">Start practice</button></div>
    <div style="margin-top:14px">${lockCard(pool.length - pool.filter(unlocked).length)}</div>`;
  $('#clr').onclick = () => { pSel = []; store.set('pSel', pSel); document.querySelectorAll('#secs .sec-card').forEach(x => x.setAttribute('aria-pressed', false)); };
  $('#secs').onclick = e => { const b = e.target.closest('.sec-card'); if (!b) return; const c = b.dataset.c; pSel = pSel.includes(c) ? pSel.filter(x => x !== c) : pSel.concat(c); store.set('pSel', pSel); b.setAttribute('aria-pressed', pSel.includes(c)); };
  $('#lv').onclick = e => { const b = e.target.closest('.chip'); if (!b) return; pLv = +b.dataset.v; store.set('pLv', pLv); document.querySelectorAll('#lv .chip').forEach(x => x.setAttribute('aria-pressed', +x.dataset.v === pLv)); };
  $('#ns').onclick = e => { const b = e.target.closest('.chip'); if (!b) return; pN = +b.dataset.n; store.set('pN', pN); document.querySelectorAll('#ns .chip').forEach(x => x.setAttribute('aria-pressed', +x.dataset.n === pN)); };
  $('#go').onclick = () => {
    let qs = pool.filter(unlocked).filter(q => (!pSel.length || pSel.includes(q.sec)) && (!pLv || q.lvl === pLv));
    if (!qs.length) return toast('No questions in the chosen sections yet.');
    const unseen = shuffle(qs.filter(q => !ST[q.id])), seenQ = shuffle(qs.filter(q => ST[q.id])).sort((a, b) => (ST[b.id][2] - ST[a.id][2]));
    runPractice(unseen.concat(seenQ).slice(0, pN));
  };
}
function qCard(q, i, n) {
  const order = optOrder(q);
  return { order, html: `${q.table || ''}<div class="card"><div class="row end"><span class="progress">Question ${i + 1} of ${n}</span>
    <div class="tags">${q.sec === 'MY' ? '<span class="tag">Mine</span>' : `<span class="tag">${esc(q.sec)}</span>${levelTag(q)}`}${q.status === 'draft' ? '<span class="tag draft">DRAFT</span>' : ''}${q.sec !== 'MY' ? starBtn(q.id) : ''}</div></div>
    <p class="q">${esc(q.q)}</p>
    ${q.sec !== 'MY' ? '<div class="guessrow"><button class="chip guess" data-guess aria-pressed="false">I\'m guessing</button><small class="src">Not sure? Tap this before you answer.</small></div>' : ''}
    <div class="opts">${order.map((o, k) => `<button class="opt" data-o="${o}"><span class="k">${LETTERS[k]}</span><span>${esc(q.opts[o])}</span></button>`).join('')}</div>
    <div id="fb"></div></div>` };
}
// Official page behind the answer, so learners can verify it themselves (url added by tools/source_links.py).
const srcLink = q => q.url ? ` <a class="srclink" href="${esc(q.url)}" target="_blank" rel="noopener">Check the source on ${esc(q.url.split('/')[2].replace(/^www\./, ''))} ↗</a>` : '';
function explain(q, ok) {
  const mail = C.supportEmail.includes('@') ? `mailto:${C.supportEmail}?subject=${encodeURIComponent('Error in question ' + q.id)}` : '';
  return `<p class="verdict ${ok ? 'ok' : 'no'}">${ok ? 'Correct.' : 'Not quite. The right answer is ' + esc(q.opts[q.ans]) + '.'}</p>
    ${q.exp ? `<div class="exp"><p>${esc(q.exp)}</p><div class="src">Source: ${esc(q.src)}${q.asOf ? ' · true as of ' + monthName(q.asOf) : ''}${srcLink(q)}</div></div>` : ''}
    ${q.sec !== 'MY' && mail ? `<a class="linkish" href="${mail}">Report an error in this question</a>` : ''}`;
}
function runPractice(qs) {
  let i = 0, score = 0; const wrong = [];
  const show = () => {
    if (i >= qs.length) return done();
    const q = qs[i], c = qCard(q, i, qs.length);
    V.innerHTML = c.html + `<div class="row end" style="margin-top:12px"><button class="btn ghost" id="end">End</button><button class="btn" id="next" hidden>Next</button></div>`;
    V.querySelector('.opts').onclick = e => {
      const b = e.target.closest('.opt'); if (!b || V.querySelector('.opt.right')) return;
      const ok = +b.dataset.o === q.ans; record(q.id, ok); if (ok) score++; else wrong.push(q);
      V.querySelectorAll('.opt').forEach(x => { if (+x.dataset.o === q.ans) x.classList.add('right'); else if (x === b) x.classList.add('wrong'); });
      $('#fb').innerHTML = explain(q, ok); $('#next').hidden = false;
    };
    $('#next').onclick = () => { i++; show(); };
    $('#end').onclick = done;
  };
  const done = () => {
    const n = Math.min(i + (V.querySelector('.opt.right') ? 1 : 0), qs.length) || 0;
    V.innerHTML = `<div class="card"><h2>Session done</h2><p class="lede">${score} correct out of ${n} answered.</p>
      <div class="row">${wrong.length ? '<button class="btn" id="redo">Retry the ones I missed</button>' : ''}<button class="btn ghost" onclick="location.hash='practice';route()">New session</button></div></div>`;
    if (wrong.length) $('#redo').onclick = () => runPractice(wrong);
  };
  show();
}

// ================= MOCK =================
function mock() {
  const pool = mcqPool().filter(q => q.sec !== 'MY' && unlocked(q));
  const plan = M.sections.map(s => ({ s, take: s.code === 'S11' ? s.examQs : Math.min(s.examQs, pool.filter(q => q.sec === s.code).length) })).filter(p => p.take);
  const n = plan.reduce((a, p) => a + p.take, 0), mins = Math.max(5, Math.round(n * C.examPattern.minutes / C.examPattern.questions));
  const hist = store.get('mocks', []);
  V.innerHTML = modeBar('mock', MOCK_MODES) + `<h2>Mock test</h2><p class="lede">Questions are drawn in the exam's section mix: ${C.examPattern.questions} questions in ${C.examPattern.minutes} minutes, ${C.examPattern.marksEach} mark each, no negative marking. Answer every question; a blank scores the same as a wrong guess.</p>
    <div class="card"><table><thead><tr><th>Section</th><th class="n">Exam</th><th class="n">This mock</th></tr></thead><tbody>
    ${M.sections.map(s => { const p = plan.find(x => x.s === s); return `<tr><td>${esc(s.code + ' · ' + s.name)}</td><td class="n">${s.examQs}</td><td class="n">${p ? p.take : 0}</td></tr>`; }).join('')}
    <tr><td><b>Total</b></td><td class="n"><b>${C.examPattern.questions}</b></td><td class="n"><b>${n}</b></td></tr></tbody></table></div>
    ${n < C.examPattern.questions ? `<p class="src">Only ${n} questions are available${full() ? '' : ' in the free set'}, so this mock is shorter and timed at ${mins} minutes.</p>` : ''}
    <div style="margin-top:14px"><button class="btn block" id="go" ${n ? '' : 'disabled'}>Start ${mins}-minute mock</button></div>
    ${hist.length ? `<h3>Past mocks</h3><div class="card"><table><tbody>${hist.slice(-6).reverse().map(h => `<tr><td>${esc(h.d)}</td><td class="n">${h.c}/${h.n}</td><td class="n">${h.pct}%</td></tr>`).join('')}</tbody></table></div>` : ''}`;
  $('#go').onclick = () => runMock(plan.flatMap(p => p.s.code === 'S11' ? diForMock(p.take) : shuffle(pool.filter(q => q.sec === p.s.code)).slice(0, p.take)), mins);
}
const mmss = ms => { const t = Math.round(ms / 1e3); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
function runMock(qs, mins, onDone, opts = {}) {
  const ans = new Array(qs.length).fill(null), orders = qs.map(optOrder);
  let i = 0, t0 = 0, h = 0; const LIM = mins * 60e3, R = $('#topRight');
  // guess[] = "marked for review" (also fed to the mistake engine as an unsure answer); seen[] = visited
  const tq = new Array(qs.length).fill(0), guess = new Array(qs.length).fill(false), seen = new Array(qs.length).fill(false); let tIn = Date.now();
  const spend = () => { const now = Date.now(); tq[i] += now - tIn; tIn = now; };   // time on the question being left
  const tick = () => { const left = Math.max(0, LIM - (Date.now() - t0)); R.textContent = String(Math.floor(left / 60e3)).padStart(2, '0') + ':' + String(Math.floor(left % 60e3 / 1e3)).padStart(2, '0'); R.className = left < 5 * 60e3 ? 'low' : ''; if (!left) finish(); };
  const secs = [...new Set(qs.map(q => q.sec))];
  const st = k => ans[k] !== null ? (guess[k] ? 'ansrev' : 'ans') : guess[k] ? 'rev' : seen[k] ? 'na' : 'nv';
  const ST = { ans: 'Answered', na: 'Not answered', rev: 'Marked for review', ansrev: 'Answered & marked for review', nv: 'Not visited' };
  const legend = () => `<div class="legend">${Object.entries(ST).map(([k, t]) => `<span><i class="pk ${k}"></i>${t}</span>`).join('')}</div>`;
  const count = ks => { const c = { ans: 0, na: 0, rev: 0, ansrev: 0, nv: 0 }; ks.forEach(k => c[st(k)]++); return c; };
  const idx = s => qs.map((q, k) => q.sec === s ? k : -1).filter(k => k >= 0);
  // Instructions page, as in the online exam: the clock starts only after "I am ready".
  const intro = () => {
    const rows = secs.map(s => { const ks = idx(s), m = ks.reduce((a, k) => a + marksOf(qs[k]), 0); return `<tr><td>${esc(s)} · ${esc(SEC[s] ? SEC[s].name : '')}</td><td class="n">${ks.length}</td><td class="n">${+m.toFixed(2)}</td></tr>`; }).join('');
    const tot = qs.reduce((a, q) => a + marksOf(q), 0);
    V.innerHTML = `<div class="card"><h2>${esc(opts.title || 'Mock test')}: instructions</h2>
      <table><thead><tr><th>Section</th><th class="n">Questions</th><th class="n">Marks</th></tr></thead><tbody>${rows}
      <tr><td><b>Total</b></td><td class="n"><b>${qs.length}</b></td><td class="n"><b>${+tot.toFixed(2)}</b></td></tr></tbody></table>
      <ol class="instr"><li>Time allowed: <b>${mins} minutes</b>. The clock runs in the top bar and the test submits by itself when time is up.</li>
      <li>There is <b>no negative marking</b>. Answer every question; a blank scores the same as a wrong answer.</li>
      <li>Move between sections with the section tabs, and between questions with the question palette.</li>
      <li><b>Save &amp; Next</b> keeps your answer; <b>Mark for Review &amp; Next</b> flags the question to look at again (a marked question that has an answer is still evaluated); <b>Clear Response</b> removes your answer.</li>
      <li>Before final submission you will see how many questions are answered, not answered, marked for review and not visited.</li></ol>
      <div class="label">Question palette colours</div>${legend()}
      <label class="check" style="margin-top:12px"><input type="checkbox" id="agree"><span>I have read and understood the instructions.</span></label>

// Original passages in the register of a descriptive answer. Speed is net WPM: correct characters ÷ 5 per minute.
const PASSAGES = [
  'The branch has introduced a token system at the cash counter to reduce waiting time. Customers collect a token at the entrance and are called in turn on the display board. Senior citizens and persons with disabilities are served at a separate counter. The system has cut the average waiting time from twenty minutes to about eight minutes.',
  'Before releasing a term loan, the branch must verify that the borrower has brought in the promised margin, that all security documents are executed and stamped, and that the charge on the asset is registered. The first instalment should be released directly to the supplier against a proper invoice, and the asset should be inspected within thirty days.',
  'A cheque presented for payment must be examined for the date, the amount in words and figures, the signature, and any alteration. If the amount in words differs from the figures, the cheque is returned with a request for the drawer to confirm. A post-dated cheque must never be paid before its date, as such payment is not in due course.',
  'Early warning signals help the branch notice stress in an account before it becomes a non-performing asset. Frequent returns of cheques, delay in submitting stock statements, and a steady fall in turnover routed through the account are common signals. The branch should meet the borrower promptly, find the cause, and agree on corrective steps.',
  'Financial inclusion means bringing every household into the formal banking system at an affordable cost. Business correspondents extend banking services to villages that have no branch. They open accounts, accept small deposits, allow withdrawals and help people enrol in insurance and pension schemes. Their work must be monitored closely by the link branch.',
  'A good supervisor sets clear targets, explains the reason behind each instruction, and reviews progress regularly. Praise in public and correction in private build trust in the team. When a mistake occurs, the focus should be on fixing the process so that it does not happen again, rather than only on finding someone to blame.',
  'The nominee receives the deposit on the death of the depositor and gives the bank a valid discharge. However, the nominee holds the amount as a trustee for the legal heirs, who may claim their share from the nominee. Branches should encourage every depositor to register a nomination, since claims without nomination take longer to settle.',
  'Customer complaints should be acknowledged on the day they are received and resolved within the time promised. Each complaint should be recorded, given a reference number, and tracked until closure. The reply must address the specific issue raised, explain the action taken, and tell the customer where to go if they are not satisfied.'

let tMins = store.get('tMins', 3);
function typing() {
  const H = store.get('typing', []), best = H.length ? Math.max(...H.map(h => h.wpm)) : null, last = H[H.length - 1];
  V.innerHTML = modeBar('typing', WRITE_MODES) + `<h2>Typing speed</h2>
    <p class="lede">The descriptive paper is typed. To write about 1,200 words in 64 working minutes you need about <b>20 words a minute</b>; aim for 28 or more so that you have time to think. Practise on a keyboard if you can: phone typing is slower than exam typing.</p>
    ${H.length ? `<div class="grid2"><div class="card stat"><div class="v">${best}</div><div class="k">Best net WPM</div></div><div class="card stat"><div class="v">${last.acc}%</div><div class="k">Last accuracy</div></div></div>` : ''}
    <div class="label">Test length</div>

  $('#tm').onclick = e => { const b = e.target.closest('.chip'); if (!b) return; tMins = +b.dataset.m; store.set('tMins', tMins); document.querySelectorAll('#tm .chip').forEach(x => x.setAttribute('aria-pressed', +x.dataset.m === tMins)); };

function runTyping() {
  const text = shuffle(PASSAGES).join(' ');
  V.innerHTML = `<div class="card"><div class="src">Type the passage exactly, including punctuation. The clock starts with your first key.</div>
    <div class="typing-src" id="src"></div>
    <textarea id="tin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Start typing here"></textarea>
    <div class="row end" style="margin-top:8px"><span class="wc" id="live">0 WPM</span><button class="btn ghost" id="stop">Finish now</button></div></div>`;
  const src = $('#src'), tin = $('#tin'), live = $('#live'), R = $('#topRight'), LIM = tMins * 60e3;
  let t0 = null, h = null, ended = false;
  const score = () => { const v = tin.value; let ok = 0; for (let k = 0; k < v.length; k++) if (v[k] === text[k]) ok++; const mins = t0 ? Math.max((Date.now() - t0) / 60e3, 1 / 60) : 1; return { wpm: Math.round(ok / 5 / mins), acc: v.length ? Math.round(ok / v.length * 100) : 100, typed: v.length, secs: t0 ? Math.round((Date.now() - t0) / 1e3) : 0 }; };

    const v = tin.value, from = Math.max(0, v.length - 160), to = Math.min(text.length, v.length + 220); let out = from ? '…' : '';

    const s = score(), H = store.get('typing', []);
    if (s.typed >= 20) { H.push({ d: new Date().toLocaleDateString('en-IN'), wpm: s.wpm, acc: s.acc, min: tMins }); store.set('typing', H.slice(-50)); }
    const verdict = s.wpm >= 28 ? 'Good pace for the paper. Keep accuracy above 95%.' : s.wpm >= 20 ? 'Enough to finish the paper, with little spare time. Daily 5-minute practice will lift it.' : 'Below the pace needed to finish the paper. Practise daily; speed comes within two to three weeks.';
    V.innerHTML = `<div class="card"><h2>${s.wpm} net WPM</h2><p class="lede">${s.acc}% accuracy · ${s.typed} characters in ${s.secs >= 60 ? Math.floor(s.secs / 60) + ' min ' + (s.secs % 60 ? s.secs % 60 + ' s' : '') : s.secs + ' seconds'}.</p><p>${verdict}</p>
      <div class="row"><button class="btn" id="again">Try again</button><button class="btn ghost" onclick="location.hash='typing';route()">Results</button></div></div>`;
    $('#again').onclick = runTyping;
  };

    if (!t0) {
      t0 = Date.now();
      h = setInterval(() => { const left = LIM - (Date.now() - t0); R.textContent = String(Math.floor(Math.max(0, left) / 60e3)).padStart(2, '0') + ':' + String(Math.floor(Math.max(0, left) % 60e3 / 1e3)).padStart(2, '0'); R.className = left < 15e3 ? 'low' : ''; live.textContent = score().wpm + ' WPM'; if (left <= 0) end(); }, 250);
      stopTimer = () => { clearInterval(h); R.textContent = ''; };
    }
    paint(); if (tin.value.length >= text.length) end();
  });

  $('#stop').onclick = end;
  paint(); tin.focus();
}

// ================= DI GENERATOR =================
// Every data set is generated on the phone, so DI content is original and unlimited.
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const round5 = x => Math.round(x / 5) * 5;
const fmt = (x, d = 1) => Number(x.toFixed(d)).toLocaleString('en-IN', { minimumFractionDigits: d, maximumFractionDigits: d });
const pick = (arr, n) => shuffle(arr).slice(0, n);
/** Five distinct options, as in the exam: the right value plus typical-mistake values, topped up with near misses. */
function numOpts(right, wrong, d, unit = '') {
  const f = x => fmt(x, d) + unit, seen = new Set([f(right)]), out = [];
  for (const w of wrong) { if (isFinite(w) && w > 0 && !seen.has(f(w)) && out.length < 4) { seen.add(f(w)); out.push(f(w)); } }
  const step = Math.max(Math.abs(right) * 0.06, 1);
  for (let k = 1; out.length < 4 && k < 40; k++) { const w = right + (k % 2 ? 1 : -1) * step * Math.ceil(k / 2); if (w >= 0 && !seen.has(f(w))) { seen.add(f(w)); out.push(f(w)); } }
  const opts = shuffle([f(right), ...out]);
  return { opts, ans: opts.indexOf(f(right)) };
}
// with only four candidates (e.g. four quarters) the fifth option is "cannot be determined", always wrong because near-ties are re-rolled
function labelOpts(right, others) { const w = pick(others.filter(o => o !== right), 4); if (w.length < 4) w.push('Cannot be determined from the data'); const opts = shuffle([right, ...w]); return { opts, ans: opts.indexOf(right) }; }
const tbl = (head, rows) => `<div class="di-wrap"><table class="di"><thead><tr>${head.map((h, k) => `<th${k ? ' class="n"' : ''}>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, k) => `<td${k ? ' class="n"' : ''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

function diBranchSet() {
  const names = ['P', 'Q', 'R', 'S', 'T'].map(x => 'Branch ' + x), Y1 = 'FY 2024-25', Y2 = 'FY 2025-26';
  const rows = names.map(nm => { const d1 = round5(rnd(400, 1200)), d2 = round5(d1 * rnd(1.03, 1.25)), a1 = round5(d1 * rnd(0.55, 0.85)), a2 = round5(d2 * rnd(0.55, 0.9)); return { nm, d1, d2, a1, a2 }; });
  const table = `<p class="src">Deposits and advances of Branches P to T, ${Y1} and ${Y2} (₹ crore)</p>` + tbl(['Branch', 'Deposits<br>24-25', 'Deposits<br>25-26', 'Advances<br>24-25', 'Advances<br>25-26'], rows.map(r => [r.nm.replace('Branch ', ''), r.d1, r.d2, r.a1, r.a2]));
  const [b1, b2, b3] = pick(rows, 3), sumD2 = rows.reduce((s, r) => s + r.d2, 0), avgA1 = rows.reduce((s, r) => s + r.a1, 0) / 5;
  const growth = r => (r.a2 - r.a1) / r.a1 * 100, byG = rows.slice().sort((a, b) => growth(b) - growth(a)), best = byG[0];
  if (growth(byG[0]) - growth(byG[1]) < 0.2) return diBranchSet();   // near-tie would make "highest" ambiguous
  const g = (b1.d2 - b1.d1) / b1.d1 * 100, cd = b2.a2 / b2.d2 * 100, sh = b3.d2 / sumD2 * 100;
  const qs = [
    { q: `What is the percentage growth in deposits of ${b1.nm} from ${Y1} to ${Y2}?`, ...numOpts(g, [(b1.d2 - b1.d1) / b1.d2 * 100, b1.d2 / b1.d1 * 100, g + 1.5], 1, '%'),
      exp: `Growth = (${b1.d2} − ${b1.d1}) ÷ ${b1.d1} × 100 = ${b1.d2 - b1.d1} ÷ ${b1.d1} × 100 = ${fmt(g)}%. Divide by the earlier year, not the later one.` },
    { q: `What is the credit-deposit (CD) ratio of ${b2.nm} in ${Y2}?`, ...numOpts(cd, [b2.d2 / b2.a2 * 100, b2.a1 / b2.d1 * 100, cd + 2.5], 1, '%'),
      exp: `CD ratio = Advances ÷ Deposits × 100 = ${b2.a2} ÷ ${b2.d2} × 100 = ${fmt(cd)}%.` },
    { q: `What are the average advances per branch in ${Y1}?`, ...numOpts(avgA1, [avgA1 * 1.25, rows.reduce((s, r) => s + r.a2, 0) / 5, avgA1 * 0.8], 1, ' cr'),
      exp: `Average = (${rows.map(r => r.a1).join(' + ')}) ÷ 5 = ${rows.reduce((s, r) => s + r.a1, 0)} ÷ 5 = ₹${fmt(avgA1)} crore.` },
    { q: `Which branch recorded the highest percentage growth in advances from ${Y1} to ${Y2}?`, ...labelOpts(best.nm, names),
      exp: `Growth in advances: ${rows.map(r => `${r.nm.slice(-1)} ${fmt(growth(r))}%`).join(', ')}. Highest: ${best.nm}. Compare percentages, not the absolute increase.` },
    { q: `What is the share of ${b3.nm} in the total deposits of the five branches in ${Y2}?`, ...numOpts(sh, [b3.d2 / (sumD2 - b3.d2) * 100, b3.d1 / rows.reduce((s, r) => s + r.d1, 0) * 100, sh + 3], 1, '%'),
      exp: `Total ${Y2} deposits = ${sumD2}. Share = ${b3.d2} ÷ ${sumD2} × 100 = ${fmt(sh)}%.` }
  ];
  return { title: 'Branch business', table, qs };
}

function diNpaSet() {
  const Q = ['Q1 (Jun)', 'Q2 (Sep)', 'Q3 (Dec)', 'Q4 (Mar)'];
  let adv = round5(rnd(8000, 12000));
  const rows = Q.map(nm => { adv = round5(adv * rnd(1.0, 1.06)); const gnpa = round5(adv * rnd(0.03, 0.07)); const prov = round5(gnpa * rnd(0.5, 0.8)); return { nm, adv, gnpa, prov }; });
  const table = `<p class="src">Quarterly figures of a bank, FY 2025-26 (₹ crore)</p>` + tbl(['Quarter', 'Gross<br>advances', 'Gross<br>NPA', 'Provisions<br>held'], rows.map(r => [r.nm, r.adv, r.gnpa, r.prov]));
  const [x, y, z] = pick(rows, 3), ratio = r => r.gnpa / r.adv * 100, byR = rows.slice().sort((a, b) => ratio(a) - ratio(b)), lowest = byR[0];
  if (ratio(byR[1]) - ratio(byR[0]) < 0.05) return diNpaSet();      // near-tie would make "lowest" ambiguous
  const gr = ratio(x), pcr = y.prov / y.gnpa * 100, nnpa = (z.gnpa - z.prov) / (z.adv - z.prov) * 100, ch = (rows[3].gnpa - rows[0].gnpa) / rows[0].gnpa * 100;
  const qs = [
    { q: `What is the gross NPA ratio in ${x.nm}?`, ...numOpts(gr, [x.prov / x.adv * 100, (x.gnpa - x.prov) / x.adv * 100, gr + 0.6], 2, '%'),
      exp: `Gross NPA ratio = Gross NPA ÷ Gross advances × 100 = ${x.gnpa} ÷ ${x.adv} × 100 = ${fmt(gr, 2)}%.` },
    { q: `What is the provision coverage ratio (excluding technical write-offs) in ${y.nm}?`, ...numOpts(pcr, [y.gnpa / y.prov * 100, y.prov / y.adv * 100, pcr + 4], 1, '%'),
      exp: `PCR = Provisions ÷ Gross NPA × 100 = ${y.prov} ÷ ${y.gnpa} × 100 = ${fmt(pcr)}%.` },
    { q: `What is the net NPA ratio in ${z.nm}?`, ...numOpts(nnpa, [(z.gnpa - z.prov) / z.adv * 100, z.gnpa / z.adv * 100, nnpa + 0.5], 2, '%'),
      exp: `Net NPA = ${z.gnpa} − ${z.prov} = ${z.gnpa - z.prov}. Net advances = ${z.adv} − ${z.prov} = ${z.adv - z.prov}. Net NPA ratio = ${z.gnpa - z.prov} ÷ ${z.adv - z.prov} × 100 = ${fmt(nnpa, 2)}%. Deduct provisions from both numerator and denominator.` },
    { q: `By what percentage did gross NPA change from ${rows[0].nm} to ${rows[3].nm}?`, ...(() => { const o = numOpts(Math.abs(ch), [Math.abs((rows[3].gnpa - rows[0].gnpa) / rows[3].gnpa * 100), Math.abs(ch) + 2, rows[3].gnpa / rows[0].gnpa * 100], 1, '%'); o.opts = o.opts.map(s => (ch < 0 ? 'Fell ' : 'Rose ') + s); return o; })(),
      exp: `Change = (${rows[3].gnpa} − ${rows[0].gnpa}) ÷ ${rows[0].gnpa} × 100 = ${fmt(ch)}%, so gross NPA ${ch < 0 ? 'fell' : 'rose'} by ${fmt(Math.abs(ch))}%.` },
    { q: 'In which quarter was the gross NPA ratio the lowest?', ...labelOpts(lowest.nm, Q),
      exp: `Gross NPA ratios: ${rows.map(r => `${r.nm.split(' ')[0]} ${fmt(ratio(r), 2)}%`).join(', ')}. Lowest: ${lowest.nm}. Compare ratios, not the absolute NPA amount.` }
  ];
  return { title: 'Asset quality', table, qs };
}
const DI_SETS = [diBranchSet, diNpaSet];
/** n questions for the mock's S11 section, built from whole sets so each question has its table. */
function diForMock(n) {
  const out = []; while (out.length < n) { const s = DI_SETS[out.length / 5 % DI_SETS.length](); s.qs.forEach((q, k) => out.push({ ...q, id: 'DI-' + Date.now() + '-' + out.length, sec: 'S11', table: s.table, gen: true, src: 'Generated data set' })); }
  return out.slice(0, n);
}

const DI_FREE_PER_DAY = 3;

// Leitner boxes: a card you know moves up a box and comes back later; a miss sends it to box 0 for this session.
const BOX_DAYS = [0, 1, 3, 7, 15, 30];
function recall() {
  const CARDS = store.get('cards', {}), now = Date.now();
  const pool = MCQ.filter(unlocked).filter(q => !pSel.length || pSel.includes(q.sec));
  const due = pool.filter(q => CARDS[q.id] && CARDS[q.id][1] <= now), fresh = pool.filter(q => !CARDS[q.id]);
  const mastered = pool.filter(q => CARDS[q.id] && CARDS[q.id][0] >= 4).length;

  $('#go').onclick = () => runRecall(shuffle(due).concat(shuffle(fresh)).slice(0, 30));

function runRecall(queue) {
  const CARDS = store.get('cards', {}), missed = new Set(); let done = 0, known = 0;
  const show = () => {
    if (!queue.length) {
      V.innerHTML = `<div class="card"><h2>Session done</h2><p class="lede">${done} cards reviewed, ${known} known first time.</p><button class="btn" onclick="route()">Back to recall</button></div>`; return;
    }
    const q = queue[0];
    V.innerHTML = `<div class="card flash"><div class="row end"><span class="progress">${queue.length} left</span><span class="tag">${esc(q.sec)}</span></div>
      <p class="q">${esc(q.q)}</p><div id="back" hidden><div class="answer">${esc(q.opts[q.ans])}</div>${q.exp ? `<p class="src" style="margin-top:8px">${esc(q.exp)}</p>` : ''}${listenBtn(q.q + '. Answer: ' + q.opts[q.ans] + '. ' + (q.exp || ''))}</div></div>
      <div style="margin-top:12px" id="act"><button class="btn block" id="flip">Show answer</button></div>`;
    $('#flip').onclick = () => {
      $('#back').hidden = false;
      $('#act').innerHTML = `<div class="grid2"><button class="btn ghost" id="again">Didn't know</button><button class="btn" id="gotit">Knew it</button></div>`;
      $('#again').onclick = () => { CARDS[q.id] = [0, Date.now()]; store.set('cards', CARDS); if (!missed.has(q.id)) { missed.add(q.id); done++; } queue.push(queue.shift()); show(); };
      $('#gotit').onclick = () => {
        const box = missed.has(q.id) ? 1 : Math.min(5, ((CARDS[q.id] || [0])[0]) + 1);   // a card missed this session restarts low
        CARDS[q.id] = [box, Date.now() + BOX_DAYS[box] * 864e5]; store.set('cards', CARDS);
        if (!missed.has(q.id)) { done++; known++; } queue.shift(); show();
      };
    };
  };
  show();
}

const NO_I18N = '.q,.opt,.exp,.model,.frame,.typing-src,.di-wrap,.note-item,textarea,input,select option,.passage,table.di,[data-noi18n],#topRight';

// ================= PROGRESS CHARTS =================
function sectionStats() {

    const qs = MCQ.filter(q => q.sec === s.code); let tried = 0, att = 0, ok = 0;
    qs.forEach(q => { const r = ST[q.id]; if (r) { tried++; att += r[0]; ok += r[1]; } });

/** Single-series line chart (one axis, 0..max), 2px line, 8px markers, tap/hover readout, optional reference line. */

    ${ticks.map(t => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`).join('')}
    ${ref !== null ? `<line class="ref" x1="${L}" x2="${W - R}" y1="${y(ref)}" y2="${y(ref)}"/><text class="axis" x="${L + 4}" y="${y(ref) - 5}" text-anchor="start">${esc(refLabel)}</text>` : ''}

// ================= FULL EXAM: Part A objective + Part B descriptive =================
const MOCK_MODES = [['mock', 'Objective'], ['sectional', 'Sectional'], ['duel', 'Challenge'], ['exam', 'Full exam']];
const PAPER = TR.paper || { RAT: { offer: 6, attempt: 4, marks: 2 }, FA: { offer: 6, attempt: 4, marks: 2 }, SIT: { offer: 3, attempt: 2, marks: 3 }, COMP: { offer: 1, attempt: 1, marks: 4 }, BC: { offer: 2, attempt: 1, marks: 4 } };
function buildObjective(mix) {

  const qs = M.sections.flatMap(s => s.code === 'S11' ? diForMock(s.examQs) : shuffle(pool.filter(q => q.sec === s.code)).slice(0, s.examQs));
  if (!mix) return qs;

      <div><b>Part A · Objective</b><div class="src">${objN} questions · ${C.examPattern.minutes} minutes · exam section mix and marks</div></div>
      <div><b>Part B · Descriptive</b><div class="src">${C.examPattern.descMinutes} minutes · ${C.examPattern.descMarks} marks · answer 4 of 6 rationales, 4 of 6 for and against, 2 of 3 situations, 1 comprehension and 1 of 2 letters</div></div>
      <label class="check"><input type="checkbox" id="mix" ${store.get('mockMix', false) ? 'checked' : ''}><span>Mix questions from all sections (random order)</span></label>
    </div>
    ${full() ? `<div style="margin-top:14px"><button class="btn block" id="go" ${objN && descN ? '' : 'disabled'}>Start full exam</button></div>` : `<div style="margin-top:14px">${lockCard(1).replace('1 more', 'The full exam')}</div>`}
    ${hist.length ? `<h3>Past full exams</h3><div class="card"><table><thead><tr><th>Date</th><th class="n">Part A</th><th class="n">Part B</th><th class="n">Total</th></tr></thead><tbody>${hist.slice(-6).reverse().map(h => `<tr><td>${esc(h.d)}</td><td class="n">${h.obj}</td><td class="n">${h.desc}</td><td class="n"><b>${h.total}</b></td></tr>`).join('')}</tbody></table></div>` : ''}`;
  $('#mix').onchange = e => store.set('mockMix', e.target.checked);
  const go = $('#go');
  if (go) go.onclick = () => {
    const qs = buildObjective(store.get('mockMix', false));
    runMock(qs, C.examPattern.minutes, res => descriptivePaper({ obj: +res.mk.toFixed(2), objMax: +res.mkMax.toFixed(2) }));

function descriptivePaper(partA) {
  const items = Object.keys(PAPER).flatMap(t => shuffle(DESC.filter(d => d.type === t && unlocked(d))).slice(0, PAPER[t].offer).map(x => ({ t, x })));
  let html = `<div class="card"><b>Part A done: ${partA.obj} / ${partA.objMax}</b><p class="lede" style="margin:4px 0 0">Now Part B. Choose which questions to answer; the clock gives you ${C.examPattern.descMinutes} minutes.</p></div>`, last = '';

      <textarea id="pa${i}" placeholder="Type your answer, or leave blank to skip this question." spellcheck="true"></textarea><div class="wc" id="pw${i}">0 words</div><div id="po${i}"></div></div>`;
  });
  V.innerHTML = html + `<button class="btn block" id="psub">Submit descriptive paper</button>`;
  items.forEach((_, i) => { const ta = $('#pa' + i); ta.oninput = () => { $('#pw' + i).textContent = words(ta.value) + ' words'; }; });
  const t0 = Date.now(), LIM = C.examPattern.descMinutes * 60e3, R = $('#topRight');
  const tick = () => { const left = Math.max(0, LIM - (Date.now() - t0)); R.textContent = String(Math.floor(left / 60e3)).padStart(2, '0') + ':' + String(Math.floor(left % 60e3 / 1e3)).padStart(2, '0'); R.className = left < 10 * 60e3 ? 'low' : ''; if (!left) submit(); };
  const h = setInterval(tick, 1000); tick();

  let done = false;

    if (done) return; done = true; stopTimer();
    items.forEach((it, i) => {
      const ta = $('#pa' + i), attempted = words(ta.value) >= 10; ta.readOnly = true;
      const mk = PAPER[it.t].marks;
      $('#po' + i).innerHTML = `<div class="label">${attempted ? 'Attempted' : 'Not attempted'}</div><div id="pk${i}"></div><div class="label">Model answer</div><div class="model">${esc(it.x.ans)}</div>
        ${attempted ? `<label class="f" for="pm${i}">Your marks</label><select id="pm${i}" data-t="${it.t}">${Array.from({ length: mk * 2 + 1 }, (_, k) => `<option value="${k / 2}">${k / 2} / ${mk}</option>`).join('')}</select>` : ''}`;
      if (attempted) answerCheck(ta.value, it.x, $('#pk' + i), true);

      Object.keys(PAPER).forEach(t => { const m = [...V.querySelectorAll(`select[data-t="${t}"]`)].map(s => +s.value).sort((a, b) => b - a).slice(0, PAPER[t].attempt); desc += m.reduce((a, b) => a + b, 0); });
      const total = partA.obj + desc, max = partA.objMax + C.examPattern.descMarks;
      const hist = store.get('exams', []); hist.push({ d: new Date().toLocaleDateString('en-IN'), obj: partA.obj, desc, total, max }); store.set('exams', hist.slice(-50));
      V.innerHTML = `<div class="card"><h2>${total} / ${max}</h2>
        <table><tbody><tr><td>Part A · Objective</td><td class="n">${partA.obj} / ${partA.objMax}</td></tr><tr><td>Part B · Descriptive</td><td class="n">${desc} / ${C.examPattern.descMarks}</td></tr></tbody></table>
        <p class="lede" style="margin-top:10px">Mark your descriptive answers strictly; examiners reward structure, a rule where it fits, and a conclusion.</p>

// ---- register routes ----

<script>/* v0.11 study aids: mistake book and stars, daily plan and streak, reminder, text size, backup/restore,
   score card sharing and the Play rating prompt. Loaded after features.js; uses the app.js / features.js globals. */
'use strict';

const dayKey = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

// ================= STARS =================
let STARS = new Set(store.get('stars', []));
const isStar = id => STARS.has(id);
function starBtn(id) {
  return `<button class="star" data-star="${esc(id)}" aria-pressed="${isStar(id)}" aria-label="${isStar(id) ? 'Remove star' : 'Star this question'}" title="Star for revision">${isStar(id) ? '★' : '☆'}</button>`;
}
V.addEventListener('click', e => {
  const b = e.target.closest('[data-star]'); if (!b) return;
  e.stopPropagation();
  const id = b.dataset.star, on = !isStar(id);
  on ? STARS.add(id) : STARS.delete(id); store.set('stars', [...STARS]);
  b.setAttribute('aria-pressed', on); b.textContent = on ? '★' : '☆'; b.setAttribute('aria-label', on ? 'Remove star' : 'Star this question');
  toast(on ? 'Starred for revision' : 'Star removed');
}, true);

// ================= MISTAKE BOOK =================
// id -> correct answers in a row since the last wrong one; cleared after two in a row.
const MIST_CLEAR = 2;
let MIST = store.get('mist', null);
if (!MIST) { MIST = {}; for (const k in ST) if (ST[k][2]) MIST[k] = 0; store.set('mist', MIST); }   // first run: seed from past wrong answers
const _record = record;
record = function (id, ok) {
  _record(id, ok);
  if (!ok) MIST[id] = 0;
  else if (id in MIST && ++MIST[id] >= MIST_CLEAR) delete MIST[id];
  store.set('mist', MIST);
  onStudy('q');
};
const mistakeQs = () => MCQ.filter(q => q.id in MIST && unlocked(q));

function mistakes() {
  const mq = mistakeQs(), sq = mcqPool().filter(q => isStar(q.id) && unlocked(q)), sd = DESC.filter(d => isStar(d.id) && unlocked(d));
  const bySec = {}; mq.forEach(q => bySec[q.sec] = (bySec[q.sec] || 0) + 1);
  V.innerHTML = modeBar('mistakes') + `<h2>Mistakes and starred</h2>
    <p class="lede">Every question you get wrong lands here, in practice or in a mock. Answer it correctly twice in a row and it leaves the list. Tap ☆ on any question to keep it for revision.</p>
    <div class="grid2"><div class="card stat"><div class="v">${mq.length}</div><div class="k">Mistakes to clear</div></div>
      <div class="card stat"><div class="v">${sq.length + sd.length}</div><div class="k">Starred</div></div></div>
    <div class="card stack" style="margin-top:12px">
      <button class="btn block" id="pm" ${mq.length ? '' : 'disabled'}>Practise my mistakes${mq.length ? ' (' + Math.min(mq.length, 20) + ')' : ''}</button>
      ${Object.keys(bySec).length ? `<div class="chips" id="msec">${Object.entries(bySec).sort().map(([s, n]) => `<button class="chip" data-s="${s}">${s}<small>${n}</small></button>`).join('')}</div><p class="src" style="margin:0">Tap a section to practise only its mistakes.</p>` : ''}
      <button class="btn ghost block" id="ps" ${sq.length ? '' : 'disabled'}>Practise starred questions${sq.length ? ' (' + sq.length + ')' : ''}</button>
    </div>
    ${sd.length ? `<h3>Starred descriptive questions</h3>${sd.map(d => `<div class="card" style="margin-bottom:10px"><div class="row end"><span class="tag">${esc(DT[d.type].n)}</span>${starBtn(d.id)}</div>
      <p class="q${d.type === 'COMP' ? ' passage' : ''}">${esc(d.q)}</p><details><summary>Model answer</summary><div class="model">${esc(d.ans)}</div></details></div>`).join('')}` : ''}
    ${!mq.length && !sq.length && !sd.length ? '<p class="src">Nothing here yet. Mistakes from practice and mocks will appear automatically.</p>' : ''}`;
  const go = list => { if (list.length) runPractice(shuffle(list).slice(0, 20)); };
  $('#pm').onclick = () => go(mq);
  $('#ps').onclick = () => go(sq);
  const ms = $('#msec'); if (ms) ms.onclick = e => { const b = e.target.closest('.chip'); if (b) go(mq.filter(q => q.sec === b.dataset.s)); };
}

// ================= DAILY LOG, STREAK AND PLAN =================
// days: { 'YYYY-MM-DD': { q: questions answered, d: descriptive answers checked } }
let DAYS = store.get('days', {});
const activeDay = x => !!x && (x.q >= 10 || x.d >= 1);
function streak() {
  const d = new Date(); if (!activeDay(DAYS[dayKey(d)])) d.setDate(d.getDate() - 1);   // today not done yet: count up to yesterday
  let n = 0; while (activeDay(DAYS[dayKey(d)])) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function onStudy(kind) {
  const k = dayKey(), x = DAYS[k] || (DAYS[k] = { q: 0, d: 0 }), was = activeDay(x);
  x[kind] = (x[kind] || 0) + 1;
  const keys = Object.keys(DAYS).sort(); if (keys.length > 400) keys.slice(0, keys.length - 400).forEach(j => delete DAYS[j]);
  store.set('days', DAYS);
  if (!was && activeDay(x) && B.markStudied) B.markStudied(streak());   // no reminder needed today
}

function dailyPlan() {
  const exam = store.get('examDate', ''), left = exam ? Math.ceil((new Date(exam + 'T10:00:00') - new Date()) / 864e5) : 60;
  const unseen = MCQ.filter(q => unlocked(q) && !ST[q.id]).length, mist = mistakeQs().length;
  // finish first coverage ten days before the exam; keep those days for mocks and revision
  const qT = Math.max(20, Math.min(60, Math.ceil((unseen + mist) / Math.max(7, left - 10)))) || 20;
  const S = sectionStats().filter(s => s.total);
  const weak = S.filter(s => s.att >= 5 && s.acc < 70).sort((a, b) => a.acc - b.acc)[0];
  const focus = weak || S.slice().sort((a, b) => a.tried / a.total - b.tried / b.total)[0];

<script>/* v0.12 coaching aids: exam readiness score, sectional tests, automatic key-point check for descriptive answers,
   and Listen mode (read aloud with the phone's own offline voice). Loaded after study.js. */
'use strict';

const clamp01 = x => Math.max(0, Math.min(1, x));

// ================= LISTEN MODE =================
const SAY = [];                       // texts behind the Listen buttons on screen
let PL = null;                        // current playback: { chunks, i, id, btn, items, item, label }
let sayId = 0;
function listenBtn(text) {
  if (!text) return '';
  const i = SAY.push(text) - 1; if (SAY.length > 3000) SAY.splice(0, 1000, ...new Array(1000).fill(''));
  return `<button class="linkish listen" data-say="${i}" aria-label="Listen">🔊 Listen</button>`;
}
/** Make written shorthand sound right when spoken. */
function speechText(t) {
  return String(t)
    .replace(/[_.\/\d-]*_{2,}[_.\/\d-]*|\.{3,}/g, ' blank ').replace(/\[[^\]]*\]/g, ' ')
    .replace(/\bSecs?\b\.?/g, m => m.startsWith('Secs') ? 'Sections' : 'Section').replace(/\bRs\.?\s?/g, 'rupees ').replace(/₹\s?/g, 'rupees ')
    .replace(/\be\.g\./gi, 'for example').replace(/\bi\.e\./gi, 'that is').replace(/\betc\./gi, 'and so on').replace(/&/g, ' and ').replace(/(\d)\s?%/g, '$1 percent')
    .replace(/[•▪◦]/g, '').replace(/\n+/g, m => '. ').replace(/\.\s*\./g, '.').replace(/\s{2,}/g, ' ').trim();
}
function chunks(t) {
  const out = []; let cur = '';
  for (const s of speechText(t).split(/(?<=[.?!;:])\s+/)) {
    if ((cur + ' ' + s).length > 1200 && cur) { out.push(cur); cur = s; } else cur = cur ? cur + ' ' + s : s;
  }
  if (cur) out.push(cur);
  return out;
}
function speakChunk() {
  if (!PL) return;
  if (PL.i >= PL.chunks.length) {                         // item finished: next item of a playlist, or stop
    if (PL.items && PL.item + 1 < PL.items.length) { PL.item++; PL.chunks = chunks(PL.items[PL.item]); PL.i = 0; drawPlayer(); }
    else return stopSpeech();
  }
  const text = PL.chunks[PL.i++], id = 'u' + (++sayId); PL.id = id;
  if (B.speak) B.speak(text, id);
  else if (window.speechSynthesis) {
    const u = new SpeechSynthesisUtterance(text); u.lang = 'en-IN'; u.rate = .95;
    u.onend = () => window.ppOnSpoken(id); u.onerror = () => window.ppOnSpoken(null);
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } else { toast('Listening is not available here'); stopSpeech(); }
}
window.ppOnSpoken = id => { if (!PL) return; if (id === null) return stopSpeech(); if (id === PL.id) speakChunk(); };
function startSpeech(texts, btn, label) {
  stopSpeech();
  const items = Array.isArray(texts) ? texts.filter(Boolean) : [texts];
  if (!items.length) return;
  PL = { items: items.length > 1 ? items : null, item: 0, chunks: chunks(items[0]), i: 0, btn, label };
  if (btn) { btn.textContent = '■ Stop'; btn.classList.add('on'); }
  drawPlayer(); speakChunk();
}
function stopSpeech() {
  const was = PL; PL = null;
  if (B.stopSpeaking) B.stopSpeaking(); else if (window.speechSynthesis) speechSynthesis.cancel();
  if (was && was.btn) { was.btn.textContent = '🔊 Listen'; was.btn.classList.remove('on'); }
  drawPlayer();
}

// ================= EXAM READINESS =================
function readiness() {
  const pool = MCQ.filter(unlocked), tried = pool.filter(q => ST[q.id]).length;
  let att = 0, ok = 0; for (const k in ST) { att += ST[k][0]; ok += ST[k][1]; }
  const acc = att ? ok / att : 0;
  const recent = store.get('mocks', []).filter(m => m.n >= 50).map(m => m.pct).concat(store.get('exams', []).map(e => Math.round(e.total / e.max * 100))).slice(-3);
  const avgM = recent.length ? Math.round(recent.reduce((a, b) => a + b, 0) / recent.length) : null;
  let active = 0; const d = new Date(); for (let k = 0; k < 14; k++) { if (activeDay(DAYS[dayKey(d)])) active++; d.setDate(d.getDate() - 1); }
  const parts = [
    { k: 'Coverage', w: 30, v: pool.length ? clamp01(tried / pool.length) : 0, d: `${tried} of ${pool.length} questions tried`, tip: 'Practise questions you have not seen yet.', go: 'practice' },
    // accuracy counts fully only after 50 attempts, so a lucky first session does not inflate it
    { k: 'Accuracy', w: 30, v: clamp01((acc - .4) / .45) * Math.min(1, att / 50), d: att ? `${Math.round(acc * 100)}% correct in ${att} attempts` : 'no answers yet', tip: 'Revise your mistakes until they clear.', go: 'mistakes' },
    { k: 'Mock scores', w: 25, v: avgM === null ? 0 : clamp01((avgM - 40) / 40), d: avgM === null ? 'no full mock yet' : `average ${avgM}% in the last ${recent.length}`, tip: 'Take a full timed mock.', go: 'mock' },
    { k: 'Regular practice', w: 15, v: clamp01(active / 10), d: `${active} of the last 14 days`, tip: 'Practise a little every day.', go: 'practice' },
  ];
  const score = Math.round(parts.reduce((a, p) => a + p.w * p.v, 0));
  const label = score >= 80 ? 'Exam ready' : score >= 65 ? 'Nearly ready' : score >= 40 ? 'Building up' : 'Early days';
  const next = parts.slice().sort((a, b) => (b.w * (1 - b.v)) - (a.w * (1 - a.v)))[0];
  // one score per day for the trend
  const H = store.get('ready', {}); H[dayKey()] = score;
  const ks = Object.keys(H).sort(); if (ks.length > 180) ks.slice(0, ks.length - 180).forEach(k => delete H[k]);
  store.set('ready', H);
  const wk = new Date(); wk.setDate(wk.getDate() - 7);
  const before = Object.keys(H).sort().filter(k => k <= dayKey(wk)).pop();
  return { score, label, parts, next, delta: before !== undefined ? score - H[before] : null };
}

const STOPW = new Set(('the and for are was were been being this that these those its their there which who whom whose what when where how why will would shall should can could may might must not nor but then than such also into onto upon about over under after before between during through without within any all each every both either neither other another some more most less least much many few very only own same just too again further once here per via has have had having does did done our ours your yours his her hers them they you she him one two three first second third should bank banks banking branch customer customers account accounts amount given make made take taken like well good need needs from with your able used uses using').split(' '));
const stem = w => w.toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 6);
function keyStems(text) {
  const out = new Set();
  for (const raw of String(text).match(/[A-Za-z0-9₹%]+/g) || []) {
    const w = raw.toLowerCase();
    if (/^\d{2,}$/.test(w) || /^[A-Z]{2,6}s?$/.test(raw) || (w.length >= 4 && !STOPW.has(w))) out.add(stem(w));
  }
  return out;
}
/** Split a model answer into checkable points: list items or sentences; headings and letter template lines are skipped. */
function keyPoints(ans, type) {
  let lines = String(ans).split(/\n+/).map(l => l.replace(/^[\s•\-*▪]*(\(?[0-9a-zA-Z]{1,2}[).]\s+)?/, '').trim());
  // blanks such as __.__.2026 are removed, not the sentence they sit in; mostly-blank header lines then fall below 4 words
  lines = lines.map(l => l.replace(/[_.\/\d-]*_{2,}[_.\/\d-]*/g, ' ').replace(/\[[^\]]+\]/g, ' ').replace(/\s{2,}/g, ' ').trim())
    .filter(l => !/^[A-Z][A-Z &/]+:?$/.test(l) && !/^(dear|yours|the regional|date|letter no|ref)/i.test(l));
  // letters: keep body content only (no address, all-caps subject or courtesy lines)
  if (type === 'BC') lines = lines.filter(l => !/^(sub(ject)?|to)\b/i.test(l) && l.split(/\s+/).length >= 6 && l !== l.toUpperCase()
    && !/:$/.test(l) && !/assure you|thanking you|look forward|kind (notice|attention)|for your (kind|early)/i.test(l));
  if (lines.length < 3) lines = lines.join(' ').split(/(?<=[.;])\s+/);
  return lines.filter(l => l.split(/\s+/).length >= 4).slice(0, 12);
}
function structureChecks(text, type) {
  const T = DT[type], w = words(text), lines = text.split(/\n/).filter(l => l.trim());
  const cites = /\b(RBI|Act|Section|Sec\.?|Code|Rules?|guidelines?|directions?|circular|policy|IBC|SARFAESI|BR Act|FEMA|PMLA)\b/i.test(text);
  const concl = /\b(hence|therefore|thus|to conclude|in conclusion|conclusion|overall|in short|on balance)\b/i.test(text);
  const listy = lines.filter(l => /^\s*([0-9]+[.)]|[a-z][.)]|[•\-*])\s*/i.test(l)).length;
  const C = [[`${w} words (target ${T.words[0]}–${T.words[1]})`, w >= T.words[0] * .85 && w <= T.words[1] * 1.25]];
  if (type === 'RAT') C.push(['Separate points', listy >= 3 || lines.length >= 3], ['Names a rule, Act or RBI direction', cites], ['Ends with a conclusion', concl]);
  if (type === 'FA') C.push(['Has a FOR side', /(^|\n)\s*(for\b|in favour|arguments for|advantages)/i.test(text)], ['Has an AGAINST side', /(^|\n)\s*(against\b|arguments against|disadvantages)/i.test(text)], ['Ends with a conclusion', concl]);
  if (type === 'SIT') C.push(['Steps set out separately', listy >= 3], ['Cites the rule or procedure', cites], ['States the action to take', /\b(action|will|should|step|advise|ensure|obtain|report)\b/i.test(text)]);
  if (type === 'BC') C.push(['Subject line', /\b(sub(ject)?\b|^[A-Z][A-Z ,'-]{10,}$)/m.test(text)], ['Salutation (Dear Sir/Madam)', /\bdear\b/i.test(text)], ['Closing (Yours faithfully)', /\byours\s+(faithfully|sincerely|truly)\b/i.test(text)], ['Date and reference', /\b(date|ref|letter no)\b/i.test(text)]);
  if (type === 'COMP') C.push(['Answers numbered like the questions', listy >= 2]);
  return C;
}
function answerCheck(text, x, el, compact = false) {
  if (!el) return;
  if (words(text) < 10) { el.innerHTML = compact ? '' : `<div class="check-box"><p class="src" style="margin:0">Type your answer first to get a key-point check.</p></div>`; return; }
  const mine = keyStems(text), pts = keyPoints(x.ans, x.type);
  const res = pts.map(p => { const k = [...keyStems(p)]; const hit = k.filter(s => mine.has(s)).length; return { p, ok: k.length ? hit >= (k.length <= 2 ? 1 : Math.ceil(k.length * .35)) : false }; });
  const got = res.filter(r => r.ok).length, S = structureChecks(text, x.type);
  if (compact) { el.innerHTML = `<p class="src" style="margin:6px 0">Key points matched: <b>${got} of ${res.length}</b></p>`; return; }
  el.innerHTML = `<div class="check-box"><div class="row end"><b>Automatic check</b><span class="src">guide only</span></div>
    ${res.length ? `<div class="kp-head">Key points covered: <b>${got} of ${res.length}</b></div><div class="meter"><i style="width:${Math.round(got / res.length * 100)}%"></i></div>

    <div class="kp-head">Structure</div><ul class="kp">${S.map(([t, ok]) => `<li class="${ok ? 'ok' : ''}"><span class="mk" aria-hidden="true">${ok ? '✓' : '○'}</span><span>${esc(t)}</span><span class="sr">${ok ? 'yes' : 'no'}</span></li>`).join('')}</ul>
    <p class="src" style="margin:8px 0 0">The check matches your words with the model answer. A point written differently can still be right, so mark yourself honestly below.</p></div>`;
}

<script>/* v0.13: challenge a colleague by code, "sure or guess" confidence tracking, and the final-week plan.

// ================= CHALLENGE BY CODE =================
// The code alone decides the questions, so two phones with the same question bank get the same paper, offline.
// Format: S9-K4F7Q2 = section (or MX for mixed) + 5 seed characters + 1 check character over the question pool.
const DUEL_N = 20, DUEL_MIN = 15, DUEL_FREE_PER_DAY = 1;
const ALPH = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';   // no 0/O or 1/I/L, easy to read aloud

const _recordConf = record;
