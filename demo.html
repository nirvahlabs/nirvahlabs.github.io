<script>/* Unlock screen with discount codes (#unlock) and the buyer's own friend code (#refer).
   Codes and dates live in config.js. Play enforces each offer's dates on its side; this file only decides
   which offer a code asks for and shows the price. */
'use strict';

const todayIST = () => new Date(Date.now() + 5.5 * 3600e3).toISOString().slice(0, 10);
const inWindow = o => { const d = todayIST(); return d >= o.from && d <= o.to; };
const fmtDay = d => new Date(d + 'T12:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
const playPrice = (offer, fallback) => (B.offerPrice && B.offerPrice(offer)) || fallback;

// ---- friend codes: NAME-XXXXX, where XX is random and XXX a check on the name, so the app can verify a code offline ----
const REF_ABC = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';   // 32 symbols, no 0/O or 1/I
const REF_SALT = 'unnati-promoprep-friend-2026';
function refCheck(name, rnd) {
  let h = 0x811c9dc5;
  for (const ch of REF_SALT + '|' + name + '|' + rnd) { h ^= ch.charCodeAt(0); h = Math.imul(h, 0x01000193) >>> 0; }
  return REF_ABC[h & 31] + REF_ABC[(h >>> 5) & 31] + REF_ABC[(h >>> 10) & 31];
}
function makeRefCode(name) {
  const r = REF_ABC[Math.floor(Math.random() * 32)] + REF_ABC[Math.floor(Math.random() * 32)];
  return name + '-' + r + refCheck(name, r);
}
function isRefCode(code) {
  const m = /^([A-Z]{3,10})-([2-9A-Z]{2})([2-9A-Z]{3})$/.exec(code);
  return !!m && refCheck(m[1], m[2]) === m[3];
}

// Today's public offer, if any.
const liveOffer = () => (C.offers || []).find(inWindow);
function bestPriceText() {
  const o = liveOffer();
  return o ? `${playPrice(o.offer, o.price)} with code ${o.code}` : priceText();
}

// What a typed code gives today: { ok, offer, price, msg }
function checkCode(raw) {
  const code = String(raw || '').toUpperCase().replace(/\s+/g, '');
  if (!code) return { ok: false, msg: 'Enter a code.' };
  const pub = (C.offers || []).find(o => o.code === code);
  if (pub) {
    if (todayIST() < pub.from) return { ok: false, msg: `Code ${pub.code} works from ${fmtDay(pub.from)}.` };
    if (todayIST() > pub.to) return { ok: false, msg: `Code ${pub.code} ended on ${fmtDay(pub.to)}.` };
    return { ok: true, offer: pub.offer, price: playPrice(pub.offer, pub.price), msg: `${pub.label}: ${playPrice(pub.offer, pub.price)} till ${fmtDay(pub.to)}.` };
  }
  if (isRefCode(code)) {
    const f = C.friendOffer;
    if (code === store.get('refCode', '')) return { ok: false, msg: 'This is your own friend code. Share it with colleagues.' };
    if (todayIST() < f.from) {
      const o = liveOffer();
      return { ok: false, msg: `Friend codes work from ${fmtDay(f.from)}.${o ? ` Today, code ${o.code} gives an even lower price.` : ''}` };
    }
    if (todayIST() > f.to) return { ok: false, msg: `Friend codes ended on ${fmtDay(f.to)}.` };
    return { ok: true, offer: f.offer, price: playPrice(f.offer, f.price), msg: `Friend code accepted: ${playPrice(f.offer, f.price)}.` };
  }
  return { ok: false, msg: 'This code is not valid. Check the spelling.' };
}

const buy = offer => offer && B.buyOffer ? B.buyOffer(offer) : B.buyFullAccess();

// ================= UNLOCK =================
function unlock() {
  if (full()) { V.innerHTML = `<div class="card"><h2>Full access is active</h2><p class="lede">Thank you. Lifetime access: every question, mock and model answer, every update and every attempt, until you are promoted.</p><a class="btn" href="#refer">Your friend code</a></div>`; return; }
  const o = liveOffer();
  const feats = [`${window.UNNATI_DEMO ? "Nearly 2,000" : MCQ.length.toLocaleString("en-IN")} MCQs with explanations and sources`, 'Unlimited full mocks and sectional tests',
    `${DESC.length} descriptive questions with model answers`, 'Mistake book, recall cards and audio revision', 'Lifetime access: every update, every attempt, until you are promoted'];
  V.innerHTML = `<div class="pw-hero"><div class="pw-crown" aria-hidden="true">👑</div><h2>Unlock Full Access</h2><p>Everything you need for ${esc(TR.full)}, in one place</p><div class="pw-life">♾️ Pay once. Prepare till you're promoted.<span lang="hi" data-noi18n>एक बार खरीदें, प्रमोशन तक साथ निभाएं।</span></div></div>
    <ul class="pw-feat">${feats.map(f => `<li>${esc(f)}</li>`).join('')}</ul>
    ${o ? `<div class="pw-offer"><div class="o1">🪔 ${esc(o.label.toUpperCase())}</div><div class="o2">${esc(playPrice(o.offer, o.price))}<s>${esc(priceText())}</s></div><div class="o3">with code ${esc(o.code)} · till ${esc(fmtDay(o.to))}</div><button class="btn ghost small" id="use">Use code ${esc(o.code)}</button></div>` : ''}
    <div class="card pw-code"><label class="f" for="cc">Have a code?</label>
      <div class="row"><input type="text" id="cc" maxlength="20" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase;flex:1;width:auto"><button class="btn ghost" id="apply">Apply</button></div>
      <p class="src" id="cmsg" aria-live="polite"></p></div>
    <button class="btn block pw-cta" id="pay">Pay ${esc(priceText())}</button>
    <p class="pw-fine">One-time payment through Google Play · Lifetime access · No subscription</p>
    <p class="src" style="text-align:center;margin-top:6px">Already bought on this Google account? <button class="linkish" id="restore">Restore purchase</button></p>`;
  let chosen = null, chosenCode = '';
  const pay = $('#pay'), msg = $('#cmsg');
  $('#apply').onclick = () => {
    const r = checkCode($('#cc').value);
    msg.textContent = r.msg;
    chosen = r.ok ? r.offer : null; chosenCode = r.ok ? String($('#cc').value).toUpperCase().replace(/\s+/g, '') : '';
    pay.textContent = 'Pay ' + (r.ok ? r.price : priceText());
  };
  if ($('#use')) $('#use').onclick = () => { $('#cc').value = o.code; $('#apply').click(); };
  $('#cc').onkeydown = e => { if (e.key === 'Enter') $('#apply').click(); };
  // a friend code used at payment is remembered, so the buyer can send a thank-you code afterwards (referral.js)
  pay.onclick = () => { if (chosen === 'friend') store.set('tyFor', chosenCode); buy(chosen); };
  $('#restore').onclick = () => { if (B.restorePurchases) B.restorePurchases(); toast('Checking Google Play for your purchase…'); };
}

// ================= FRIEND CODE =================
function refer() {
  if (!full()) { location.hash = 'unlock'; return; }
  const code = store.get('refCode', ''), f = C.friendOffer;
  if (!code) {
    V.innerHTML = `<h2>Your friend code</h2>
      <p class="lede">Make your own code once. Colleagues who enter it pay ${esc(f.price)} instead of ${esc(priceText())}, from ${esc(fmtDay(f.from))} till ${esc(fmtDay(f.to))}.</p>
      <div class="card"><label class="f" for="rn">Your first name (letters only)</label><input type="text" id="rn" maxlength="10" autocomplete="off">
      <div class="row" style="margin-top:12px"><button class="btn" id="mk">Make my code</button></div></div>`;
    $('#mk').onclick = () => {
      const n = $('#rn').value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 10);
      if (n.length < 3) { toast('Enter at least 3 letters'); return; }
      store.set('refCode', makeRefCode(n)); ROUTES.refer();
    };
    return;
  }
  const text = `Preparing for the ${TR.full} promotion exam? Try Unnati Promotion Prep on Google Play. Use my friend code ${code} to unlock it for ${f.price} instead of ${C.price} (valid ${fmtDay(f.from)} to ${fmtDay(f.to)}).`;
  V.innerHTML = `<h2>Your friend code</h2>
    <div class="card"><div class="v" data-noi18n style="font-size:1.8em;font-weight:700;letter-spacing:.06em">${esc(code)}</div>
    <p class="src">Colleagues pay ${esc(f.price)} instead of ${esc(priceText())} with this code, from ${esc(fmtDay(f.from))} till ${esc(fmtDay(f.to))}.</p>
    <div class="row" style="margin-top:12px"><button class="btn" id="sh">Share on WhatsApp</button><button class="btn ghost" id="cp">Copy code</button></div></div>`;
  $('#sh').onclick = () => B.shareText ? B.shareText(text) : (location.href = 'https://wa.me/?text=' + encodeURIComponent(text));
  $('#cp').onclick = () => { try { navigator.clipboard.writeText(code); toast('Code copied'); } catch (e) { toast(code); } };
}

Object.assign(ROUTES, { unlock, refer });
Object.assign(TITLES, { unlock: 'Unlock full access', refer: 'Your friend code' });
Object.assign(HI, {
  'Unlock full access': 'फुल एक्सेस अनलॉक करें', 'Your friend code': 'आपका फ्रेंड कोड', 'Have a code?': 'कोई कोड है?', 'Apply': 'लागू करें',
  'Restore purchase': 'खरीद वापस लाएं', 'Already bought on this Google account?': 'इसी Google खाते से पहले खरीदा है?',
  'One payment through Google Play opens every question, mock test and model answer, and every update until your exam.':
    'Google Play से एक बार भुगतान पर सभी प्रश्न, मॉक टेस्ट और मॉडल उत्तर, और परीक्षा तक के सभी अपडेट खुल जाते हैं।',
  'Full access is active': 'फुल एक्सेस चालू है', 'Make my code': 'मेरा कोड बनाएं', 'Your first name (letters only)': 'आपका पहला नाम (केवल अक्षर)',
  'Use this code': 'यह कोड लगाएं', 'Share on WhatsApp': 'WhatsApp पर भेजें', 'Copy code': 'कोड कॉपी करें', 'Colleagues save on the app with your code': 'आपके कोड से साथियों की बचत',
  'Enter a code.': 'कोड डालें।', 'This code is not valid. Check the spelling.': 'यह कोड मान्य नहीं है। वर्तनी जांचें।',
  'This is your own friend code. Share it with colleagues.': 'यह आपका अपना फ्रेंड कोड है। इसे साथियों के साथ साझा करें।',
  'Unlock Full Access': 'फुल एक्सेस अनलॉक करें', 'Everything you need for MMGS-III, in one place': 'MMGS-III के लिए सब कुछ, एक ही जगह',
  'Unlimited full mocks and sectional tests': 'असीमित पूरे मॉक और खंडवार टेस्ट', 'Mistake book, recall cards and audio revision': 'गलतियों की सूची, रिकॉल कार्ड और ऑडियो दोहराव',
  'Every update until your exam': 'परीक्षा तक हर अपडेट', 'One-time payment through Google Play · No subscription': 'Google Play से एक बार का भुगतान · कोई सब्सक्रिप्शन नहीं',
  'Thank you. Every question, mock and model answer is open, including all future updates.': 'धन्यवाद। सभी प्रश्न, मॉक और मॉडल उत्तर खुले हैं, आगे के सभी अपडेट सहित।'

HI_PATTERNS.push(
  [/^Pay (.+)$/, '$1 का भुगतान करें'], [/^Use code (\S+)$/, 'कोड $1 लगाएं'],

<script>/* #track: the user's profile. Name (kept only on this phone) and designation decide the exam:
   Clerk/Associate -> Clerical to JMGS-I (ticks Merit, Trainee Officer or both; one purchase covers both),
   Officer Scale I -> Scale I to II, Officer Scale II -> Scale II to III.

'use strict';

const DESIGNATIONS = [
  { id: 'jm', t: 'Clerk / Associate', s: 'Promotion to JMGS-I (Officer)' },
  { id: 's2', t: 'Officer, JMGS-I (Scale I)', s: 'Promotion to MMGS-II · 17 Jan 2027' },

const JM_EXAMS = [['merit', 'Merit / Normal-cum-Seniority channel', '3 Jan 2027 · 140 questions · no essay'], ['to', 'Trainee Officer channel', '10 Jan 2027 · 120 questions + essay']];
const profile = () => { try { return JSON.parse(localStorage.getItem('pp.profile') || 'null'); } catch (e) { return null; } };
const jmExams = () => (profile() || {}).jm || ['merit', 'to'];

function track() {
  document.body.classList.add('no-tabs');
  const p = profile() || { name: '', des: localStorage.getItem('pp.track') ? TRACK_ID : '', jm: ['merit', 'to'] };
  if (!Array.isArray(p.jm)) p.jm = ['merit', 'to'];
  V.innerHTML = `<div class="tk-pick"><h2>About you</h2>
    <p class="lede">Your exam, sections, mocks, marks and countdown follow your designation. Kept only on this phone.</p>
    <div class="card"><label class="f" for="pn">Your name</label><input type="text" id="pn" maxlength="40" value="${esc(p.name)}" placeholder="Optional" autocomplete="off"></div>
    <div class="label">Your present designation</div>
    <div class="stack" id="des">${DESIGNATIONS.map(d => `<button class="card tp${p.des === d.id ? ' on' : ''}" data-d="${d.id}"><b>${esc(d.t)}</b><small>${esc(d.s)}</small></button>`).join('')}</div>
    <div id="jmBox" ${p.des === 'jm' ? '' : 'hidden'}><div class="label">Which exams will you write? (one purchase covers both)</div>
      <div class="card stack">${JM_EXAMS.map(([k, n, s]) => `<label class="check"><input type="checkbox" value="${k}" ${p.jm.includes(k) ? 'checked' : ''}><span><b>${n}</b><br><small class="src">${s}</small></span></label>`).join('')}</div></div>
    <button class="btn block" id="pSave" style="margin-top:14px">Save and see my syllabus</button>
    ${localStorage.getItem('pp.track') ? '<button class="linkish" id="tpBack" style="margin-top:12px">Cancel</button>' : ''}</div>`;
  let des = p.des;
  $('#des').onclick = e => { const b = e.target.closest('[data-d]'); if (!b) return; des = b.dataset.d; V.querySelectorAll('#des .tp').forEach(x => x.classList.toggle('on', x === b)); $('#jmBox').hidden = des !== 'jm'; };
  $('#pSave').onclick = () => {
    if (!des) return toast('Choose your designation.');
    const jm = [...V.querySelectorAll('#jmBox input:checked')].map(x => x.value);
    if (des === 'jm' && !jm.length) return toast('Tick at least one exam.');
    localStorage.setItem('pp.profile', JSON.stringify({ name: $('#pn').value.trim(), des, jm: des === 'jm' ? jm : ['merit', 'to'] }));
    localStorage.setItem('pp.track', JSON.stringify(des));
    if (des === 'jm' && !jm.includes(CHANNEL)) localStorage.setItem('pp.channel', JSON.stringify(jm[0]));
    localStorage.setItem('pp.welcomed', 'true');
    location.hash = 'syllabus'; location.reload();          // reload so the whole app switches to the exam
  };
  if ($('#tpBack')) $('#tpBack').onclick = () => { document.body.classList.remove('no-tabs'); history.back(); };
}

/** Clerks writing both channels switch between them here (same purchase). */
function channelSwitch() {
  if (TRACK_ID !== 'jm' || jmExams().length < 2) return '';
  return `<div class="chips ch-sw">${JM_EXAMS.map(([k, n]) => `<button class="chip" data-ch="${k}" aria-pressed="${k === CHANNEL}">${k === 'to' ? 'Trainee Officer' : 'Merit / NCS'}</button>`).join('')}</div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-ch]'); if (!b || b.dataset.ch === CHANNEL) return;
  localStorage.setItem('pp.channel', JSON.stringify(b.dataset.ch)); location.reload();
});

// How to prepare, by the bank's own section codes (track sections use their first source section).
const PREP_TIP = {
  S1: 'Learn the numbers: limits, tenors, interest rules, insurance cover. Most questions ask a figure or an eligibility.',
  S2: 'Know each loan scheme: purpose, eligibility, margin, maximum amount, repayment and collateral rules.',
  S3: 'Transaction limits and timings of UPI, IMPS, NEFT, RTGS, cards and ATMs, and RBI customer-protection rules.',

  S6: 'Government schemes: PMJDY, PMJJBY, PMSBY, APY, PPF, SSA, SCSS, Mudra, Stand-Up India. Learn premiums, ages and limits.',
  S7: 'Acts and sections: NI Act, BR Act, SARFAESI, RDB, IBC, PMLA, DICGC, Limitation Act. One fact per section.',

// Every exam, for viewing: [id, channel, label]
const SY_VIEWS = [['s3', null, 'Scale II → III'], ['s2', null, 'Scale I → II'], ['jm', 'merit', 'Clerk: Merit / NCS'], ['jm', 'to', 'Clerk: Trainee Officer']];
const viewDef = (id, ch) => { const t = TRACKS[id]; return t.channels ? { ...t, ...t.channels[ch], track: t.name + ' · ' + t.channels[ch].name } : { ...t, track: t.name }; };
let syView = null;

function syllabus() {
  const mine = TRACK_ID + (TRACK_ID === 'jm' ? '.' + CHANNEL : ''), cur = syView || mine, own = cur === mine;
  const [vid, vch] = cur.split('.'), D = own ? TR : viewDef(vid, vch), P = D.pattern;
  const sec = D.sections || M.sections;   // s3 uses the manifest's sections
  const mkOf = s => s.examQs * (s.mk || P.marksEach), objMax = sec.reduce((a, s) => a + mkOf(s), 0), total = objMax + (P.descMarks || 0);
  const have = s => own ? MCQ.filter(q => q.sec === s.code).length : 0;
  const rows = sec.slice().sort((a, b) => mkOf(b) - mkOf(a)).map(s => {
    const m = mkOf(s), pct = Math.round(m / total * 100), n = have(s), src = (s.from || [s.code])[0];
    return `<div class="sy-row">
      <div class="row end"><b>${esc(s.code)} · ${esc(s.name)}</b><span class="sy-mk">${+m.toFixed(2)} marks</span></div>
      <div class="sy-bar"><i style="width:${Math.max(3, pct)}%"></i></div>
      <div class="row end"><small>${s.examQs} questions${s.mk && s.mk !== P.marksEach ? ' · ' + s.mk + ' mark each' : ''} · ${pct}% of the paper</small>
        ${!own ? '' : n || s.code === 'S11' ? `<button class="linkish" data-p="${esc(s.code)}">Practise${n ? ' (' + n + ')' : ''}</button>` : '<small class="src">Coming soon</small>'}</div>
      ${PREP_TIP[src] ? `<p class="sy-tip">${esc(PREP_TIP[src])}</p>` : ''}
    </div>`;
  }).join('');
  const descBlock = D.paper ? `<div class="card"><b>Section II · Essay</b><p class="lede" style="margin:4px 0 0">1 essay out of 3 banking topics, about 250 words, ${P.descMarks} marks, ${P.descMinutes} minutes. Qualifying: 50% (General), 45% (SC/ST).</p></div>`
    : P.descMarks ? `<div class="card"><b>Paper II · Descriptive (${P.descMarks} marks, ${P.descMinutes} minutes, typed)</b>
      <table><thead><tr><th>Part</th><th class="n">Attempt</th><th class="n">Marks</th></tr></thead><tbody>
      <tr><td>Rationale</td><td class="n">4 of 6</td><td class="n">8</td></tr><tr><td>For and against</td><td class="n">4 of 6</td><td class="n">8</td></tr>
      <tr><td>Situational analysis</td><td class="n">2 of 3</td><td class="n">6</td></tr><tr><td>Comprehension (English)</td><td class="n">1 (4 questions)</td><td class="n">4</td></tr>
      <tr><td>Business correspondence (English)</td><td class="n">1 of 2</td><td class="n">4</td></tr></tbody></table>
      <p class="src">Rationale, For and against and Situational analysis can be written in English or Hindi; Comprehension and Letter only in English. Paper I is bilingual.</p></div>` : '';
  V.innerHTML = `<div class="chips sy-tabs">${SY_VIEWS.map(([i, c, n]) => { const k = i + (c ? '.' + c : ''); return `<button class="chip" data-v="${k}" aria-pressed="${k === cur}">${n}${k === mine ? ' ★' : ''}</button>`; }).join('')}</div>
    <h2>${esc(D.full)}</h2><p class="lede">${esc(D.track)} · exam on <b>${new Date(D.date).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' })}</b>${own ? '' : ' · <span class="src">viewing only, not your exam</span>'}</p>
    <div class="grid2">
      <div class="card stat"><div class="v">${P.questions}</div><div class="k">Objective questions</div></div>
      <div class="card stat"><div class="v">${P.minutes}<small> min</small></div><div class="k">${Math.round(P.minutes * 60 / P.questions)} seconds a question</div></div>
      <div class="card stat"><div class="v">${+objMax.toFixed(2)}</div><div class="k">Objective marks</div></div>
      <div class="card stat"><div class="v">${total}</div><div class="k">Total marks</div></div>
    </div>
    ${vid === 'jm' && vch === 'to' ? '<p class="src">Qualifying: 65% overall (60% SC/ST); Section I needs 65% (60% SC/ST).</p>' : ''}
    <div class="label">Sections by weightage (highest first)</div>
    <div class="card sy">${rows}</div>
    ${descBlock}
    ${own ? `<div class="card"><b>How to use this</b><p class="lede" style="margin:4px 0 0">Spend your time in the order of this list: the top sections carry the most marks. Take a full mock every week and practise your two weakest sections every day.</p></div>` : ''}
    <p class="src">Structure as per the official guidelines for Promotion Year 2027-28. Five options per question in this app.</p>
    ${own ? '<a class="btn block" href="#home" style="margin-top:12px">Start preparing</a>' : '<a class="btn ghost block" href="#track" style="margin-top:12px">This is my exam: change my designation</a>'}`;
  V.querySelector('.sy-tabs').onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; syView = b.dataset.v === mine ? null : b.dataset.v; syllabus(); };
  V.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { if (b.dataset.p === 'S11') { location.hash = 'di'; return; } pSel = [b.dataset.p]; store.set('pSel', pSel); location.hash = 'practice'; });
}

Object.assign(ROUTES, { track, syllabus });
Object.assign(TITLES, { track: 'About you', syllabus: 'Syllabus and weightage' });
Object.assign(HI, {
  'About you': 'आपके बारे में', 'Your name': 'आपका नाम', 'Your present designation': 'आपका वर्तमान पद', 'Optional': 'वैकल्पिक',
  'Save and see my syllabus': 'सहेजें और मेरा पाठ्यक्रम देखें', 'Cancel': 'रद्द करें', 'Choose your designation.': 'अपना पद चुनें।', 'Tick at least one exam.': 'कम से कम एक परीक्षा चुनें।',
  'Which exams will you write? (one purchase covers both)': 'आप कौन सी परीक्षा देंगे? (एक ही खरीद में दोनों)',
  'Change exam': 'परीक्षा बदलें', 'Preparing for': 'तैयारी', 'Syllabus and weightage': 'पाठ्यक्रम और अंक-भार', 'Coming soon': 'जल्द आ रहा है',
  'Sections by weightage (highest first)': 'अंक-भार के अनुसार खंड (सबसे अधिक पहले)', 'How to use this': 'इसका उपयोग कैसे करें',
  'Objective questions': 'वस्तुनिष्ठ प्रश्न', 'Objective marks': 'वस्तुनिष्ठ अंक', 'Total marks': 'कुल अंक', 'Start preparing': 'तैयारी शुरू करें',
  'Difficulty': 'कठिनाई', 'Simple': 'सरल', 'Moderate': 'मध्यम', 'Tough': 'कठिन', 'All': 'सभी', 'This is my exam: change my designation': 'यही मेरी परीक्षा है: मेरा पद बदलें'
});

<script>/* v0.24: "Your exam" card on Home (always shows who you are and your exam, one tap to change), and #guide: an in-app
   user guide — why Unnati beats the usual way of preparing, the first day, a daily and weekly routine, what every
   screen does, and the last-month plan. Uses TR / TRACK_ID / CHANNEL from tracks.js and profile() from trackpick.js. */
'use strict';

function profileCard() {
  const p = (typeof profile === 'function' && profile()) || null;
  if (!p) return `<a class="card pc-card pc-new" href="#track"><span class="pc-ic" aria-hidden="true">👤</span>
    <span><b>Tell us about you</b><small>Choose your designation so the app shows only your exam's syllabus, mocks and marks.</small></span><span class="pc-go">Start ›</span></a>`;

    <span><b>${p.name ? esc(p.name.split(' ')[0]) + ' · ' : ''}${esc(des)}</b><small>Preparing for ${esc(TR.full)}${TRACK_ID === 'jm' ? ' · ' + esc(TR.channels[CHANNEL].name) : ''}</small>
    <span class="pc-links"><a href="#syllabus">Syllabus</a> · <a href="#guide">How to use</a> · <a href="#track">Change</a></span></span></div>`;
}

const GUIDE_COMPARE = [
  ['Material', 'Notes from many places, some out of date', 'One app, written from current RBI directions and Acts, with the source of every answer'],
  ['Knowing what matters', 'Guesswork about important topics', 'Syllabus screen shows every section by its marks'],
  ['Practice', 'Re-reading notes', 'Active recall: answer, check, learn from the explanation'],
  ['Mistakes', 'Forgotten after a week', 'Mistake book brings them back until you get them right'],
  ['Exam practice', 'First timed paper is in the exam hall', 'Full mocks with the exact section mix, marks and time'],
  ['Descriptive / essay', 'Written without structure or key words', 'Frames, model answers, key-word chips and an answer checker'],
  ['Hindi-medium help', 'Struggle to put ideas in English', 'Phrases, key terms with Hindi meaning, Hindi → English sentences'],
  ['Regularity', 'Weekend study, long gaps', 'Daily target, streak and reminder keep you going'],
  ['Progress', 'No idea if you are improving', 'Section-wise accuracy, mock history and exam readiness score'],
];

function guide() {
  const hasDesc = DESC.length > 0, ex = TR.full;
  V.innerHTML = `<div class="gd">
  <div class="card gd-hero"><h2>How to prepare with Unnati</h2><p class="lede" style="margin:0">A simple plan for ${esc(ex)}. Ten minutes a day, every day, beats long sessions once a week.</p></div>

  <h3>Why Unnati works better than the usual way</h3>
  <div class="card tw"><table class="gd-tab"><thead><tr><th></th><th>Usual way</th><th>With Unnati</th></tr></thead>
  <tbody>${GUIDE_COMPARE.map(([a, b, c]) => `<tr><td><b>${esc(a)}</b></td><td class="gd-no">${esc(b)}</td><td class="gd-yes">${esc(c)}</td></tr>`).join('')}</tbody></table></div>

  <h3>Day 1: set up in 5 minutes</h3>
  <div class="card"><ol class="gd-steps">
    <li><b>Tell us about you.</b> More → About you. Choose your designation (clerks tick Merit, Trainee Officer or both). <a href="#track">Open</a></li>
    <li><b>Check your exam date.</b> Settings. The countdown on Home and your daily plan follow it. <a href="#settings">Open</a></li>
    <li><b>Read your syllabus.</b> See which sections carry the most marks and start with those. <a href="#syllabus">Open</a></li>
    <li><b>Turn on the daily reminder</b> in Settings so you never miss a day.</li>
    <li><b>Do your first 10 questions</b> in Practice. Tap "I'm guessing" when unsure, so lucky guesses are not counted as known. <a href="#practice">Start</a></li>
  </ol></div>

  <h3>Every day (20-40 minutes)</h3>
  <div class="grid2">
    <div class="card"><b>1 · Today's plan</b><p class="src">Home shows your target for the day. Finish it to keep your streak.</p></div>
    <div class="card"><b>2 · New questions</b><p class="src">10-20 questions from one section. Unseen ones come first.</p></div>
    <div class="card"><b>3 · Mistakes</b><p class="src">Practice → Mistakes. Clear yesterday's wrong answers.</p></div>
    <div class="card"><b>4 · ${hasDesc ? 'One answer' : 'Recall cards'}</b><p class="src">${hasDesc ? 'Write one descriptive answer or essay and compare with the model.' : 'Five minutes of quick recall cards on figures and limits.'}</p></div>
  </div>

  <h3>Every week</h3>
  <div class="card"><ul class="gd-list">
    <li><b>One full mock</b> in exam conditions: no breaks, phone on silent. <a href="#mock">Mock</a></li>
    <li><b>Read the result</b>: sections are shown weakest first. Practise the weakest two next week.</li>
    <li><b>Sectional tests</b> for a section you find slow; they run at exam pace.</li>

  </ul></div>

  <h3>What each screen does</h3>
  <div class="card"><dl class="gd-dl">
    <dt>🏠 Home</dt><dd>Countdown, streak, today's plan, exam readiness and quick links.</dd>
    <dt>🎯 Practice</dt><dd>Questions by section and difficulty (Simple, Moderate, Tough), mistakes, starred questions, recall cards${SEC.S11 ? ', data interpretation sets' : ''}.</dd>
    <dt>⏱️ Mock</dt><dd>Full mock in your exam's official pattern, sectional tests and challenges with friends${hasDesc && C.examPattern.descMarks ? ', and the full exam with the written part' : ''}.</dd>
    ${hasDesc ? '<dt>✍️ Write</dt><dd>Descriptive questions or essays with frames, model answers, key-word chips, ready phrases and an answer checker. The Toolkit has phrases, key terms, Act sections and Hindi → English sentences.</dd>' : ''}
    <dt>••• More</dt><dd>About you, syllabus, progress, notes, your own questions, calculators, settings (theme, text size, Hindi menus, reminder, backup).</dd>
  </dl></div>

  <h3>Tips that make a difference</h3>
  <div class="card"><ul class="gd-list">

  </div>`;
}

Object.assign(ROUTES, { guide });
Object.assign(TITLES, { guide: 'How to use Unnati' });
Object.assign(HI, {
  'How to use Unnati': 'Unnati का उपयोग कैसे करें', 'How to prepare with Unnati': 'Unnati से तैयारी कैसे करें', 'Tell us about you': 'अपने बारे में बताएं',
  'Why Unnati works better than the usual way': 'Unnati सामान्य तरीके से बेहतर क्यों है', 'Usual way': 'सामान्य तरीका', 'With Unnati': 'Unnati के साथ',
  'Day 1: set up in 5 minutes': 'पहला दिन: 5 मिनट में शुरुआत', 'Every day (20-40 minutes)': 'हर दिन (20-40 मिनट)', 'Every week': 'हर सप्ताह',
  'What each screen does': 'कौन सी स्क्रीन क्या करती है', 'Tips that make a difference': 'काम की बातें', 'The last month': 'अंतिम महीना',
  'Start practising': 'अभ्यास शुरू करें', 'Syllabus': 'पाठ्यक्रम', 'How to use': 'उपयोग कैसे करें', 'Change': 'बदलें', 'Start ›': 'शुरू करें ›', 'Open': 'खोलें', 'Start': 'शुरू करें'
});

<script>/* v0.26 referral rewards, fully offline.
   1. A buyer who paid with a friend code (store 'tyFor', set in offers.js) gets a THANK-YOU code for that friend:
      TY-<NAME>-<nonce2><check3>, where the check is tied to the friend's full code, so it only works on the friend's phone.
   2. The friend (referrer) enters thank-you codes on #refer; each distinct one counts as one colleague who bought.
   Rewards: 1 = One-liner revision book (#revbook) · 3 = Ambassador badge + Tough mock · 5 = a free gift code for a
   colleague (claimed by email; NIRVAH LABS sends a Play promo code). Decided 18 Oct 2026. */
'use strict';

const tyCodeFor = refCode => {
  const name = refCode.split('-')[0], n = REF_ABC[Math.floor(Math.random() * 32)] + REF_ABC[Math.floor(Math.random() * 32)];
  return `TY-${name}-${n}${refCheck('TY:' + refCode, n)}`;
};
function isTyFor(code, refCode) {
  const m = /^TY-([A-Z]{3,10})-([2-9A-Z]{2})([2-9A-Z]{3})$/.exec(code);
  return !!m && m[1] === refCode.split('-')[0] && refCheck('TY:' + refCode, m[2]) === m[3];
}
const tyGot = () => store.get('tyGot', []);
const REWARDS = [
  { n: 1, icon: '📘', t: 'One-liner revision book', s: 'Every question as a one-line fact, section by section: fast revision in exam week.', go: '#revbook' },
  { n: 3, icon: '🏅', t: 'Ambassador badge + Tough mock', s: 'A badge on Home and a mock made only of Tough questions.', go: '#toughmock' },
  { n: 5, icon: '🎁', t: 'A free gift code for a colleague', s: 'Gift full access to one more colleague. Tap to claim by email; we send the code.', go: 'claim' }
];

const _refer = ROUTES.refer;
ROUTES.refer = function () {
  _refer();
  if (!full()) return;
  const my = store.get('refCode', ''), owe = store.get('tyFor', ''), got = tyGot();
  let html = '';
  if (owe) {
    let ty = store.get('tySent', '');
    if (!ty) { ty = tyCodeFor(owe); store.set('tySent', ty); }

<script>/* v0.31 Mock Series and Smart Revision.
   Mock Series: up to 10 fixed papers per exam (and per Clerk channel), built in the exam's section mix and a set
   difficulty mix, with no question repeated across the series while the bank allows. Results are kept per paper.
   Smart Revision: what to revise now (mistakes and guesses, weakest section first) and one-line notes made from
   the learner's own mistakes and starred questions. */
'use strict';

const SERIES_MAX = 10;
const LV_MIX = TRACK_ID === 'jm' ? { 1: 0.5, 2: 0.5, 3: 0 } : { 1: 0.3, 2: 0.5, 3: 0.2 };   // Clerk sees Simple/Moderate only
const seriesKey = () => TRACK_ID + (TRACK_ID === 'jm' ? '.' + CHANNEL : '');
function seededShuffle(arr, seed) { const r = rng(hash32(seed)), a = arr.slice(); for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(r() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; }

/** Section plan: per section, questions needed and the level-wise lists in a fixed (seeded) order. */
function seriesPlan() {
  const pool = mcqPool().filter(q => q.sec !== 'MY' && unlocked(q));
  const secs = M.sections.filter(s => s.code !== 'S11').map(s => {
    const qs = pool.filter(q => q.sec === s.code), need = s.examQs;
    const by = {}; [1, 2, 3].forEach(L => { by[L] = seededShuffle(qs.filter(q => (q.lvl || 2) === L), seriesKey() + '|' + s.code + '|' + L); });
    const quota = {}; let given = 0;
    [1, 2, 3].forEach(L => { quota[L] = Math.round(need * (LV_MIX[L] || 0)); given += quota[L]; });
    quota[2] += need - given;                                   // rounding remainder goes to Moderate
    return { s, need, qs, by, quota, papers: Math.floor(qs.length / Math.max(1, need)) };
  });
  // Series length follows the whole bank; small sections rotate their questions, and "Coming soon" sections are skipped.
  const live = secs.filter(x => x.need && x.qs.length);
  const n = Math.max(1, Math.min(SERIES_MAX, Math.floor(live.reduce((a, x) => a + x.qs.length, 0) / Math.max(1, live.reduce((a, x) => a + x.need, 0)))));
  return { secs, n };
}
/** Paper n (0-based): slice n of each level list; short levels are topped up from the section's unused questions. */
function seriesPaper(n) {
  const { secs } = seriesPlan(), out = [];
  secs.forEach(({ s, need, qs, by, quota }) => {
    const pick = [];
    [1, 2, 3].forEach(L => {   // slice n of each level list, wrapping round when a level is small
      const list = by[L], q = Math.min(quota[L], list.length);
      for (let k = 0; k < q; k++) pick.push(list[(n * quota[L] + k) % list.length]);
    });
    if (pick.length < need) {
      const have = new Set(pick.map(q => q.id));
      pick.push(...seededShuffle(qs.filter(q => !have.has(q.id)), seriesKey() + '|fill|' + s.code + '|' + n).slice(0, need - pick.length));
    }
    out.push(...seededShuffle(pick.slice(0, need), seriesKey() + '|order|' + s.code + '|' + n));
  });

  return di ? out.concat(diForMock(di.examQs)) : out;
}

  mine[n] = { d: new Date().toLocaleDateString('en-IN'), pct: r.pct, mk: +r.mk.toFixed(2), mkMax: +r.mkMax.toFixed(2), best: Math.max(r.pct, prev ? prev.best || prev.pct : 0), tries: (prev ? prev.tries || 1 : 0) + 1 };

}

      <td class="n">${locked ? '🔒' : `<button class="btn small${r ? ' ghost' : ''}" data-ser="${k}">${r ? 'Retake' : 'Start'}</button>`}</td></tr>`;
  }).join('');

const oneLine = q => `${q.q.replace(/\s*[:?]\s*$/, '').replace(/____/g, '…')} → ${q.opts[q.ans]}`;
function revise() {

<script>/* Writing help inside the descriptive answer screen:
   (1) key-word chips from the model answer, tap to insert; (2) phrase bank, tap to insert at the cursor;
   (3) after "Show model answer": key words used / missed and linking words used.
   Wraps nextDesc() and answerCheck(); the toolkit content comes from toolkit.js (TK). */
'use strict';

const LINKERS = ['firstly', 'secondly', 'thirdly', 'finally', 'moreover', 'in addition', 'however', 'on the other hand', 'therefore',
  'hence', 'thus', 'as a result', 'for example', 'in other words', 'to sum up', 'in conclusion', 'furthermore', 'consequently'];
const PHRASE_GROUP = { RAT: 'Opening', FA: 'For', SIT: 'Situation', BC: 'Letter', COMP: 'Linking' };
const KW_SKIP = new Set(['THE', 'AND', 'FOR', 'BUT', 'NOT', 'ALL', 'ANY', 'MAY', 'ONE', 'TWO', 'SUB', 'REF', 'DATE', 'DEAR', 'YOURS', 'XYZ', 'ABC', 'PQR', 'OF', 'AT', 'TO', 'IN', 'ON', 'BY', 'AGAINST', 'CONCLUSION']);

async function loadTK() {
  if (!TK) { try { TK = await (await fetch('content/toolkit.json')).json(); } catch (e) { TK = { phrases: [], terms: [] }; } }
  return TK;
}

/** Key words for one question: section references, named terms (e.g. "Basel III"), acronyms, toolkit terms,
    then the answer's core words, ranking words that also appear in the question first and skipping plain verbs. */
function keyWords(ans, q = '') {
  // headings, subject lines and placeholders (all-caps lines, XYZ/ABC) are not key words
  ans = ans.split('\n').filter(l => { const L = l.replace(/[^A-Za-z]/g, ''); return !(L.length > 6 && L.replace(/[^A-Z]/g, '').length / L.length > .6); }).join('\n');
  const out = [], seen = new Set(), add = w => { const k = w.toLowerCase(); if (!seen.has(k) && out.length < 12) { seen.add(k); out.push(w); } };
  const wb = w => new RegExp('\\b' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
  (ans.match(/\b(?:Sec(?:tion)?\.?|Article)\s*\d+[A-Z]*(?:\(\d+\))?/g) || []).forEach(x => add(x.replace(/^Section/, 'Sec').replace(/\.\s*/, ' ').replace(/\s+/, ' ')));
  (ans.match(/\b[A-Z][a-z]+ (?:I{1,3}|IV|V)\b/g) || []).forEach(add);
  (ans.match(/\b[A-Z][A-Z0-9-]{1,9}\b/g) || []).map(w => w.replace(/-+$/, '')).filter(w => !KW_SKIP.has(w) && !/^\d/.test(w) && !/^(?:I{1,3}|IV|V|VI)$/.test(w)).forEach(add);
  if (TK) TK.terms.forEach(t => { const base = t.t.replace(/\s*\(.*\)/, '').split('/')[0].trim(); if (base.length > 3 && wb(base).test(ans)) add(base); });
  const ql = q.toLowerCase(), score = {};
  (ans.toLowerCase().match(/[a-z]{6,}/g) || []).forEach(w => {
    if (STOPW.has(w) || /^(because|should|within|without|through|therefore|however|whether|another)$/.test(w)) return;
    const inQ = ql.includes(w);
    if (!inQ && /(?:ed|ing|ly)$/.test(w)) return;          // plain verbs/adverbs only if the question uses them
    score[w] = (score[w] || 0) + 1 + (inQ ? 3 : 0);
  });
  Object.entries(score).sort((a, b) => b[1] - a[1] || b[0].length - a[0].length).slice(0, 8).forEach(([w]) => add(w));
  return out;
}
const usedIn = (text, w) => new RegExp('\\b' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s*'), 'i').test(text);

function insertAt(ta, s) {
  const a = ta.selectionStart ?? ta.value.length, b = ta.selectionEnd ?? a, before = ta.value.slice(0, a);
  const pad = before && !/\s$/.test(before) ? ' ' : '';
  ta.value = before + pad + s + ' ' + ta.value.slice(b);
  const p = a + pad.length + s.length + 1; ta.focus(); ta.setSelectionRange(p, p);
  ta.dispatchEvent(new Event('input'));
}

const currentDesc = () => { const q = $('#dq .q'); return q ? DESC.find(d => d.q === q.textContent) : null; };

const _nextDesc = nextDesc;
nextDesc = function () {
  _nextDesc();
  const x = currentDesc(), ta = $('#ta'); if (!x || !ta) return;
  loadTK().then(() => {
    const kw = keyWords(x.ans, x.q);
    if (kw.length) ta.insertAdjacentHTML('beforebegin', `<div class="kw-box"><div class="row end"><b>Key words to use</b><small class="src">tap to insert</small></div>
      <div class="kw" data-noi18n>${kw.map(w => `<button class="kw-chip" data-w="${esc(w)}">${esc(w)}</button>`).join('')}</div></div>`);
    V.querySelectorAll('.kw-chip').forEach(b => b.onclick = () => insertAt(ta, b.dataset.w));
  });
  const fr = $('#fr');
  if (fr) fr.insertAdjacentHTML('beforebegin', '<button class="linkish" id="phr">Phrases</button>');
  const phr = $('#phr'); if (!phr) return;
  phr.onclick = async () => {
    await loadTK();
    let grp = PHRASE_GROUP[x.type] || 'Opening';
    const box = document.createElement('div'); box.className = 'phr-box'; $('#frm').before(box);
    const draw = () => {
      const groups = [...new Set(TK.phrases.map(p => p.g))], list = TK.phrases.filter(p => p.g === grp && (full() || p.free));
      const locked = TK.phrases.filter(p => p.g === grp).length - list.length;
      box.innerHTML = `<div class="row end"><b>Phrases</b><button class="linkish" id="phx">Close</button></div>
        <div class="chips">${groups.map(g => `<button class="chip small" data-g="${esc(g)}" aria-pressed="${g === grp}">${esc(g)}</button>`).join('')}</div>
        <div class="phr-list">${list.map((p, k) => `<button class="phr" data-k="${k}"><span>${esc(p.en)}</span><small lang="hi" data-noi18n>${esc(p.hi)}</small></button>`).join('') || '<p class="src">Unlock full access for this group.</p>'}</div>
        ${locked ? `<p class="src" style="margin:6px 0 0">${locked} more in full access.</p>` : ''}`;
      box.querySelector('.chips').onclick = e => { const b = e.target.closest('[data-g]'); if (b) { grp = b.dataset.g; draw(); } };
      box.querySelectorAll('.phr').forEach(b => b.onclick = () => insertAt(ta, list[+b.dataset.k].en.replace(/\s*…\s*$/, '')));
      $('#phx').onclick = () => { box.remove(); phr.hidden = false; };
    };
    draw(); phr.hidden = true;
  };
};

const _answerCheck = answerCheck;
answerCheck = function (text, x, el, compact = false) {
  _answerCheck(text, x, el, compact);
  if (compact || !el || words(text) < 10) return;
  const kw = keyWords(x.ans, x.q), used = kw.filter(w => usedIn(text, w)), miss = kw.filter(w => !usedIn(text, w));
  const links = LINKERS.filter(l => new RegExp('\\b' + l + '\\b', 'i').test(text));
  const box = el.querySelector('.check-box'); if (!box) return;
  box.insertAdjacentHTML('beforeend', `<div class="kp-head">Key words used: <b>${used.length} of ${kw.length}</b></div>
    <div class="kw" data-noi18n>${used.map(w => `<span class="kw-chip ok">✓ ${esc(w)}</span>`).join('')}${miss.map(w => `<span class="kw-chip miss">${esc(w)}</span>`).join('')}</div>
    <div class="kp-head">Linking words: <b>${links.length}</b>${links.length >= 3 ? ' ✓' : ''}</div>
    <p class="src" style="margin:2px 0 0">${links.length >= 3 ? 'Good flow: ' + esc(links.join(', ')) + '.' : 'Use words like Firstly, Moreover, However, Hence to make your answer flow (see Phrases).'}</p>`);
};

Object.assign(HI, {
  'Key words to use': 'उपयोग करने योग्य मुख्य शब्द', 'tap to insert': 'जोड़ने के लिए टैप करें', 'Phrases': 'वाक्यांश', 'Close': 'बंद करें',
  'Unlock full access for this group.': 'इस समूह के लिए फुल एक्सेस अनलॉक करें।',
  'Use words like Firstly, Moreover, However, Hence to make your answer flow (see Phrases).': 'उत्तर में प्रवाह के लिए Firstly, Moreover, However, Hence जैसे शब्द लिखें (वाक्यांश देखें)।'
});
HI_PATTERNS.push([/^Key words used: (\d+) of (\d+)$/, 'उपयोग किए गए मुख्य शब्द: $2 में से $1'], [/^Linking words: (\d+)( ✓)?$/, 'जोड़ने वाले शब्द: $1$2'], [/^(\d+) more in full access\.$/, 'फुल एक्सेस में $1 और।']);
</script>
<script>/* v0.13: banking calculators. Each one shows its formula and a worked example, so it doubles as S11 practice.
   Pure arithmetic on the phone; the IRAC figures carry their source and "as of" month like the questions do. */
'use strict';

const inr = (x, d = 0) => isFinite(x) ? '₹ ' + Number(x).toLocaleString('en-IN', { minimumFractionDigits: d, maximumFractionDigits: d }) : '–';
const num = (x, d = 2) => isFinite(x) ? Number(x).toLocaleString('en-IN', { maximumFractionDigits: d }) : '–';
const pc = (x, d = 2) => isFinite(x) ? num(x, d) + '%' : '–';
const IRAC_SRC = 'RBI Master Circular, Prudential norms on Income Recognition, Asset Classification and Provisioning (IRAC)', IRAC_ASOF = '2026-10';

// f: [key, label, example, kind]  kind: money | pct | int | date | select:opt1/opt2
const CALCS = [
  { id: 'emi', name: 'EMI', sub: 'Loan instalment, total interest', f: [['p', 'Loan amount (₹)', 2500000, 'money'], ['r', 'Interest rate (% a year)', 8.5, 'pct'], ['n', 'Tenure (months)', 240, 'int']],
    calc: v => { const r = v.r / 1200, n = v.n, e = r ? v.p * r * (1 + r) ** n / ((1 + r) ** n - 1) : v.p / n;
      return [['EMI', inr(e)], ['Total payment', inr(e * n)], ['Total interest', inr(e * n - v.p)], ['First EMI: interest part', inr(v.p * r)], ['First EMI: principal part', inr(e - v.p * r)]]; },
    formula: 'EMI = P × r × (1 + r)ⁿ ÷ [(1 + r)ⁿ − 1], where r = annual rate ÷ 12 ÷ 100 and n = months.' },
  { id: 'int', name: 'Simple and compound interest', sub: 'Deposit or loan growth', f: [['p', 'Principal (₹)', 100000, 'money'], ['r', 'Rate (% a year)', 7, 'pct'], ['t', 'Period (years)', 3, 'num'], ['m', 'Compounding', 'Quarterly', 'select:Yearly/Half-yearly/Quarterly/Monthly']],
    calc: v => { const m = { Yearly: 1, 'Half-yearly': 2, Quarterly: 4, Monthly: 12 }[v.m], si = v.p * v.r * v.t / 100, a = v.p * (1 + v.r / (100 * m)) ** (m * v.t);
      return [['Simple interest', inr(si, 2)], ['Compound interest', inr(a - v.p, 2)], ['Maturity value (compound)', inr(a, 2)], ['Effective annual rate', pc(((1 + v.r / (100 * m)) ** m - 1) * 100, 3)]]; },
    formula: 'SI = P × R × T ÷ 100.   Compound amount A = P × (1 + R ÷ (100 × m))^(m × T), where m = compounding periods a year.' },
  { id: 'rd', name: 'Recurring deposit', sub: 'Maturity with quarterly compounding', f: [['i', 'Monthly instalment (₹)', 5000, 'money'], ['r', 'Rate (% a year)', 6.8, 'pct'], ['n', 'Period (months)', 36, 'int']],
    calc: v => { const q = v.r / 400; let m = 0; for (let k = 1; k <= v.n; k++) m += v.i * (1 + q) ** ((v.n - k + 1) / 3);
      return [['Maturity value', inr(m, 2)], ['Total deposited', inr(v.i * v.n)], ['Interest earned', inr(m - v.i * v.n, 2)]]; },
    formula: 'Each instalment grows for the months it stays: A = R × (1 + r/400)^(months left ÷ 3), summed over all instalments (quarterly compounding, as banks apply it).' },
  { id: 'mpbf', name: 'MPBF (Tandon methods)', sub: 'Working capital bank finance', f: [['ca', 'Current assets (₹)', 1000000, 'money'], ['ocl', 'Current liabilities other than bank borrowings (₹)', 300000, 'money'], ['cca', 'Core current assets (₹, for Method III)', 200000, 'money']],
    calc: v => { const g = v.ca - v.ocl, m1 = .75 * g, m2 = .75 * v.ca - v.ocl, m3 = .75 * (v.ca - v.cca) - v.ocl, z = x => x > 0 ? inr(x) : 'Nil';
      return [['Working capital gap (CA − OCL)', inr(g)], ['Method I: 75% of the gap', z(m1)], ['Method II: 75% of CA − OCL', z(m2)], ['Method III: 75% of (CA − core CA) − OCL', z(m3)], ['Current ratio after Method II', num((v.ca) / (v.ocl + Math.max(0, m2)))]]; },
    formula: 'Method I: 0.75 × (CA − OCL).   Method II: 0.75 × CA − OCL (gives a current ratio of 1.33).   Method III: 0.75 × (CA − core CA) − OCL.' },
  { id: 'turn', name: 'Turnover method', sub: 'Working capital for smaller MSE limits (Nayak Committee)', f: [['t', 'Projected annual turnover (₹)', 4000000, 'money']],
    calc: v => [['Working capital requirement (25%)', inr(v.t * .25)], ['Borrower\'s margin (5% of turnover)', inr(v.t * .05)], ['Bank finance (20% of turnover)', inr(v.t * .20)]],
    formula: 'Working capital = 25% of projected turnover; the borrower brings 5% and the bank finances 20%. Check your bank\'s loan policy for the limits it applies to.' },
  { id: 'dp', name: 'Drawing power', sub: 'From the stock statement', f: [['st', 'Value of stock (₹)', 800000, 'money'], ['cr', 'Unpaid stock: creditors for goods (₹)', 150000, 'money'], ['ms', 'Margin on stock (%)', 25, 'pct'], ['bd', 'Eligible book debts (within the age limit) (₹)', 300000, 'money'], ['mb', 'Margin on book debts (%)', 40, 'pct'], ['lim', 'Sanctioned limit (₹)', 600000, 'money']],
    calc: v => { const s = Math.max(0, v.st - v.cr) * (1 - v.ms / 100), b = v.bd * (1 - v.mb / 100), dp = s + b;
      return [['DP on stock: (stock − creditors) × (1 − margin)', inr(s)], ['DP on book debts', inr(b)], ['Total drawing power', inr(dp)], ['Operable limit: lower of DP and sanctioned limit', inr(Math.min(dp, v.lim))]]; },
    formula: 'DP = (Stock − unpaid stock) × (1 − stock margin) + eligible book debts × (1 − book-debt margin). The borrower may draw up to the lower of DP and the sanctioned limit.' },
  { id: 'dscr', name: 'DSCR', sub: 'Debt service coverage for a year', f: [['pat', 'Profit after tax (₹)', 600000, 'money'], ['dep', 'Depreciation (₹)', 200000, 'money'], ['int', 'Interest on term loan (₹)', 250000, 'money'], ['prn', 'Term loan instalments due (₹)', 500000, 'money']],
    calc: v => { const d = (v.pat + v.dep + v.int) / (v.int + v.prn); return [['DSCR', num(d)], ['Cash available for debt service', inr(v.pat + v.dep + v.int)], ['Debt to be serviced', inr(v.int + v.prn)], ['Reading', d >= 1 ? 'Cash covers the debt due this year' : 'Cash does not cover the debt due this year']]; },
    formula: 'DSCR = (PAT + depreciation + interest on term loan) ÷ (interest on term loan + instalments due). Above 1 means the cash generated covers the debt; your bank\'s loan policy sets the minimum average it accepts.' },
  { id: 'ratio', name: 'Balance sheet ratios', sub: 'Current, quick, TOL/TNW', f: [['ca', 'Current assets (₹)', 1200000, 'money'], ['cl', 'Current liabilities (₹)', 900000, 'money'], ['inv', 'Inventory (₹)', 500000, 'money'], ['tol', 'Total outside liabilities (₹)', 2400000, 'money'], ['tnw', 'Tangible net worth (₹)', 1000000, 'money']],
    calc: v => [['Current ratio (CA ÷ CL)', num(v.ca / v.cl)], ['Quick ratio ((CA − inventory) ÷ CL)', num((v.ca - v.inv) / v.cl)], ['TOL ÷ TNW', num(v.tol / v.tnw)], ['Net working capital (CA − CL)', inr(v.ca - v.cl)]],
    formula: 'Current ratio = CA ÷ CL.   Quick ratio = (CA − inventory) ÷ CL.   TOL/TNW = total outside liabilities ÷ tangible net worth.' },
  { id: 'npa', name: 'NPA status and provision', sub: 'SMA, sub-standard, doubtful; provision required', f: [['os', 'Outstanding (₹)', 1000000, 'money'], ['sec', 'Realisable value of security (₹)', 600000, 'money'], ['od', 'Overdue since', '', 'date'], ['ty', 'Standard asset type', 'Other advances', 'select:Other advances/Farm credit and SME/Commercial real estate']],
    calc: v => {
      if (!v.od) return [['Enter the date', 'from which the account is overdue']];
      const dpd = Math.floor((Date.now() - new Date(v.od + 'T00:00:00')) / 864e5);
      if (dpd < 0) return [['Days past due', 'Date is in the future']];
      const secd = Math.min(v.os, v.sec), uns = v.os - secd;
      let cls, prov;
      if (dpd <= 90) {
        cls = dpd === 0 ? 'Standard' : dpd <= 30 ? 'SMA-0 (standard)' : dpd <= 60 ? 'SMA-1 (standard)' : 'SMA-2 (standard)';
        prov = v.os * ({ 'Other advances': .004, 'Farm credit and SME': .0025, 'Commercial real estate': .01 }[v.ty]);
      } else {
        const m = (dpd - 90) / 30.44;                                  // months since it became NPA
        if (m <= 12) { cls = 'Sub-standard'; prov = secd * .15 + uns * .25; }
        else { const y = (m - 12) / 12, r = y <= 1 ? .25 : y <= 3 ? .40 : 1; cls = y <= 1 ? 'Doubtful D1' : y <= 3 ? 'Doubtful D2' : 'Doubtful D3'; prov = uns + secd * r; }
      }
      return [['Days past due', num(dpd, 0)], ['Classification', cls], ['NPA date (90 days overdue)', dpd > 90 ? new Date(new Date(v.od + 'T00:00:00').getTime() + 90 * 864e5).toLocaleDateString('en-IN') : '–'], ['Secured portion', inr(secd)], ['Unsecured portion', inr(uns)], ['Minimum provision', inr(prov)], ['Provision as % of outstanding', pc(prov / v.os * 100)]];
    },
    formula: 'NPA after 90 days overdue. Sub-standard for 12 months as NPA, then doubtful: D1 up to 1 year, D2 1–3 years, D3 over 3 years. Provision: standard 0.40% (farm credit and SME 0.25%, commercial real estate 1%); sub-standard 15% (25% on the unsecured part); doubtful: 100% of the unsecured part plus 25% / 40% / 100% of the secured part for D1 / D2 / D3. Loss assets: 100%.',
    note: 'Minimum provisions under the RBI IRAC norms; your bank may provide more. Crop loans follow crop-season rules, not the 90-day rule. Check the latest RBI circular before relying on these figures.', src: true },
  { id: 'grow', name: 'Growth, CAGR and CD ratio', sub: 'For data interpretation', f: [['a', 'Earlier value', 1250, 'num'], ['b', 'Later value', 1680, 'num'], ['y', 'Years between them', 3, 'num'], ['dep', 'Deposits', 5400, 'num'], ['adv', 'Advances', 3900, 'num']],
    calc: v => [['Growth', pc((v.b - v.a) / v.a * 100)], ['CAGR', pc(((v.b / v.a) ** (1 / v.y) - 1) * 100)], ['CD ratio (advances ÷ deposits)', pc(v.adv / v.dep * 100)], ['Advances as a share of deposits + advances', pc(v.adv / (v.adv + v.dep) * 100)]],
    formula: 'Growth = (later − earlier) ÷ earlier × 100.   CAGR = (later ÷ earlier)^(1 ÷ years) − 1.   CD ratio = advances ÷ deposits × 100.' },
];

function calc() {
  const sel = store.get('calcSel', 'emi'), c = CALCS.find(x => x.id === sel) || CALCS[0], saved = store.get('calcVals', {})[c.id] || {};
  V.innerHTML = `<h2>Banking calculators</h2>
    <div class="chips" id="cpick">${CALCS.map(x => `<button class="chip" data-c="${x.id}" aria-pressed="${x.id === c.id}">${esc(x.name)}</button>`).join('')}</div>
    <div class="card stack" style="margin-top:12px"><div><b>${esc(c.name)}</b><div class="src">${esc(c.sub)}</div></div>
      ${c.f.map(([k, label, ex, kind]) => {
        const val = saved[k] ?? (kind === 'date' ? '' : ex);
        if (kind.startsWith('select:')) return `<label class="f" for="c_${k}">${esc(label)}</label><select id="c_${k}" data-k="${k}">${kind.slice(7).split('/').map(o => `<option${o === val ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
        return `<label class="f" for="c_${k}">${esc(label)}</label><input id="c_${k}" data-k="${k}" type="${kind === 'date' ? 'date' : 'number'}" ${kind === 'date' ? '' : 'inputmode="decimal" step="any"'} value="${esc(val)}">`;
      }).join('')}
      <div class="row"><button class="btn small ghost" id="cex">Example</button><button class="btn small ghost" id="cclr">Clear</button></div>
      <table class="cres"><tbody id="cout"></tbody></table>
      <div class="frame" style="margin:0">${esc(c.formula)}</div>
      ${c.note ? `<p class="src" style="margin:0">${esc(c.note)}${c.src ? ` Source: ${esc(IRAC_SRC)} · checked ${monthName(IRAC_ASOF)}.` : ''}</p>` : ''}</div>`;
  const read = () => { const v = {}; V.querySelectorAll('[data-k]').forEach(el => { const kind = c.f.find(f => f[0] === el.dataset.k)[3]; v[el.dataset.k] = ['date'].includes(kind) || kind.startsWith('select:') ? el.value : parseFloat(el.value); }); return v; };
  const run = () => {
    const v = read(), A = store.get('calcVals', {}); A[c.id] = v; store.set('calcVals', A);
    const missing = c.f.some(([k, , , kind]) => kind !== 'date' && !kind.startsWith('select:') && !isFinite(v[k]));
    $('#cout').innerHTML = missing ? `<tr><td colspan="2" class="src">Fill in every box to see the result.</td></tr>`
      : c.calc(v).map(([a, b], k) => `<tr${k === 0 ? ' class="lead"' : ''}><td>${esc(a)}</td><td class="n">${esc(b)}</td></tr>`).join('');
  };
  V.querySelectorAll('[data-k]').forEach(el => el.oninput = el.onchange = run);
  $('#cpick').onclick = e => { const b = e.target.closest('.chip'); if (b) { store.set('calcSel', b.dataset.c); calc(); } };
  $('#cex').onclick = () => {
    c.f.forEach(([k, , ex, kind]) => { const el = $('#c_' + k); el.value = kind === 'date' ? new Date(Date.now() - 200 * 864e5).toISOString().slice(0, 10) : ex; });
    run();
  };
  $('#cclr').onclick = () => { c.f.forEach(([k, , , kind]) => { if (!kind.startsWith('select:')) $('#c_' + k).value = ''; }); run(); };
  run();
}

Object.assign(HI, {
  'Banking calculators': 'बैंकिंग कैलकुलेटर', 'Example': 'उदाहरण', 'Clear': 'साफ़ करें', 'Fill in every box to see the result.': 'परिणाम देखने के लिए हर खाना भरें।',
});
Object.assign(ROUTES, { calc });
Object.assign(TITLES, { calc: 'Calculators' });
</script>
