<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unnati Promotion Prep · Free demo</title>
<style>/* Layout: phone-first single column under a slim indigo app bar, with a fixed bottom tab bar. */
:root{
  --bg:#F4F5FB; --surface:#FFFFFF; --sunk:#E9EBF6; --ink:#161A33; --muted:#5B6180; --line:#DDE0EF;
  --accent:#3F3AC7; --accent-2:#6D3FD8; --accent-ink:#FFFFFF; --saffron:#C2620A; --saffron-bg:#FDF0E2;
  --good:#0F7A55; --good-bg:#E1F4EC; --bad:#B42318; --bad-bg:#FCE8E6;
  --shadow:0 1px 2px rgba(22,26,51,.06),0 4px 14px rgba(22,26,51,.07);
  --f:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --mono:ui-monospace,"Roboto Mono",Consolas,monospace;
  --r:14px; --tab:64px;
}
:root[data-theme="dark"]{
  --bg:#0F1122; --surface:#181B33; --sunk:#22264A; --ink:#E9EBF7; --muted:#A3A8C6; --line:#2D3256;
  --accent:#9C98FF; --accent-2:#B79CFF; --accent-ink:#0F1122; --saffron:#F5A453; --saffron-bg:#3A2614;
  --good:#4FD1A0; --good-bg:#12302A; --bad:#F48B80; --bad-bg:#3A1B1A; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:1rem/1.5 var(--f);-webkit-tap-highlight-color:transparent;padding-bottom:calc(var(--tab) + 12px)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
[hidden]{display:none!important}

.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:12px 16px;
  background:linear-gradient(120deg,#2B2A8C,var(--accent) 60%,var(--accent-2));color:#fff}
.top h1{font-size:1.15rem;margin:0;font-weight:800;letter-spacing:.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topRight{font:700 .9rem var(--mono)}
#topRight.low{color:#FFD0CB}
:root[data-theme="dark"] .top{color:#fff;background:linear-gradient(120deg,#1E1C66,#3F3AC7 60%,#5B34B8)}

main{max-width:680px;margin:0 auto;padding:16px 16px 8px;outline:none}
.loading{color:var(--muted);text-align:center;margin-top:30vh}
h2{font-size:1.35rem;margin:6px 0 4px;text-wrap:balance}
h3{font-size:1rem;margin:20px 0 8px;color:var(--accent)}
.lede{color:var(--muted);margin:0 0 14px}
.label{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;height:var(--tab);display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -2px 10px rgba(22,26,51,.05)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:600}
.tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabbar a[aria-current="page"]{color:var(--accent)}
.tabbar a[aria-current="page"] svg{background:var(--sunk);border-radius:10px;padding:2px 10px;width:44px;box-sizing:content-box}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.stack{display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .v{font-size:1.45rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .v small{font-size:.8rem;color:var(--muted);font-weight:600}
.stat .k{font-size:.8rem;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2))}

.hero{border-radius:20px;padding:18px;color:#fff;background:linear-gradient(135deg,#2B2A8C,var(--accent) 55%,var(--accent-2));display:flex;gap:16px;align-items:center}
:root[data-theme="dark"] .hero{background:linear-gradient(135deg,#1E1C66,#3F3AC7 55%,#5B34B8)}
.hero .big{font-size:2.6rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.hero .big small{display:block;font-size:.72rem;letter-spacing:.12em;font-weight:700;opacity:.85}
.hero p{margin:0}
.hero button{margin-top:8px}

.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 4px 12px rgba(63,58,199,.25)}
:root[data-theme="dark"] .btn{color:#0F1122}
.btn.ghost{background:var(--surface);color:var(--accent);border:1.5px solid var(--accent);box-shadow:none}
.btn.light{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.4);box-shadow:none}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.btn:active{transform:translateY(1px)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:space-between}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:.88rem;font-weight:600;cursor:pointer}
.chip small{color:var(--muted);font-weight:600;margin-left:4px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip[aria-pressed="true"] small{color:rgba(255,255,255,.8)}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0F1122}
select,input[type=text],input[type=date],input[type=number],input[type=time],textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:180px;resize:vertical;line-height:1.55}
label.f{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin:10px 0 4px}

.q{font-size:1.08rem;font-weight:600;margin:6px 0 14px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--sunk);color:var(--accent)}
.tag.draft{background:var(--saffron-bg);color:var(--saffron)}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.opt .k{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--sunk);font-weight:800;font-family:var(--mono)}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.opt.sel .k{background:var(--accent);color:#fff}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:#fff}
.exp{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--sunk)}
.exp p{margin:0 0 6px}
.src{font-size:.82rem;color:var(--muted)}
.verdict{font-weight:800;margin:12px 0 0}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.progress{font:600 .85rem var(--mono);color:var(--muted)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:10px}
.pal button{padding:7px 0;border-radius:8px;border:1px solid var(--line);background:var(--surface);font:600 .8rem var(--mono);cursor:pointer}
.pal button.ans{background:var(--accent);border-color:var(--accent);color:#fff}
.pal button.cur{outline:2px solid var(--ink)}

.model{white-space:pre-wrap;padding:14px;border-radius:12px;background:var(--sunk);border-left:4px solid var(--good)}
.frame{white-space:pre-wrap;font-size:.93rem;padding:14px;border-radius:12px;background:var(--sunk)}
.wc{font:600 .82rem var(--mono);color:var(--muted)}
.wc.ok{color:var(--good)}
.check{display:flex;gap:10px;align-items:flex-start;margin:6px 0}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--good)}

.lock{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--saffron-bg);color:var(--ink)}
.lock b{color:var(--saffron)}
.list a.item,.list button.item{display:flex;align-items:center;gap:12px;width:100%;padding:14px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;text-decoration:none;color:var(--ink);cursor:pointer}
.list .item:last-child{border-bottom:0}
.list .item span{flex:1}
.list .item small{display:block;color:var(--muted)}
.list .item:after{content:"›";color:var(--muted);font-size:1.3rem}
.note-item{border-bottom:1px solid var(--line);padding:10px 0}
.note-item:last-child{border-bottom:0}
.note-item p{margin:4px 0;white-space:pre-wrap}
.linkish{background:none;border:0;padding:4px 0;color:var(--saffron);font-weight:600;cursor:pointer;font-size:.88rem;text-decoration:none}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.debug{border:2px dashed var(--saffron)}
#toast{position:fixed;left:50%;bottom:calc(var(--tab) + 16px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;max-width:90vw;z-index:20}
@media (prefers-reduced-motion:no-preference){.opt,.chip,.btn{transition:background .15s,border-color .15s,transform .1s}}

/* practice mode switcher */
.modes{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;box-shadow:var(--shadow)}
.modes a{text-align:center;padding:9px 4px;border-radius:9px;text-decoration:none;color:var(--muted);font-weight:700;font-size:.9rem}
.modes a[aria-current="page"]{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#fff}
:root[data-theme="dark"] .modes a[aria-current="page"]{color:#0F1122}
/* DI tables */
.di-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 8px;margin:4px 0 6px}
table.di{font-size:.84rem}
table.di th,table.di td{padding:7px 5px}
table.di th{font-size:.72rem;color:var(--accent);vertical-align:bottom}
/* buttons laid out like cards */
button.card.list-like{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;cursor:pointer}
button.card.list-like:disabled{opacity:.5;cursor:default}
/* recall card */
.flash .q{font-size:1.15rem;min-height:4.5em}
.flash .answer{padding:14px;border-radius:12px;background:var(--good-bg);color:var(--good);font-weight:800;font-size:1.1rem}

/* typing test */
.typing-src{margin:10px 0;padding:12px 14px;border-radius:12px;background:var(--sunk);font-size:1.02rem;line-height:1.7;overflow-wrap:anywhere}
.typing-src .ok{color:var(--good)}
.typing-src .err{color:#fff;background:var(--bad);border-radius:3px}
.typing-src .cur{border-bottom:3px solid var(--accent)}
#tin{min-height:140px;font-size:1rem}
.q{white-space:pre-line}
.q.passage{font-weight:400;font-size:1rem;line-height:1.65}

/* ---- v0.10: progress charts, full exam ---- */
.bars{display:flex;flex-direction:column;gap:12px}
.barrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.barrow .bl{grid-column:1/-1;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barrow .bn{color:var(--muted)}
.barrow .track{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.barrow .track i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.barrow .bv{font-variant-numeric:tabular-nums;font-weight:600;font-size:.9rem;min-width:88px;text-align:right}
.barrow .bs{grid-column:1/-1;margin-top:-2px}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 7px;border-radius:999px;vertical-align:1px}
.pill.good{color:var(--good);background:var(--good-bg)}
.pill.fair{color:var(--saffron);background:var(--saffron-bg)}
.pill.weak{color:var(--bad);background:var(--bad-bg)}
details summary{cursor:pointer;color:var(--accent);font-size:.9rem;padding:4px 0}
.tbl{overflow-x:auto}
.chart{margin:0}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ref{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4}
.chart .axis{fill:var(--muted);font-size:10px;font-family:var(--f)}
.chart .val{fill:var(--ink);font-size:11px;font-weight:600;font-family:var(--f)}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .dot.on{r:6}
.chart .hit{fill:transparent;cursor:pointer}
.chart figcaption{margin-top:6px}
.paper-item textarea{min-height:110px}

/* ---- v0.11: stars, daily plan, mock timing ---- */
.star{background:none;border:0;font-size:1.35rem;line-height:1;color:var(--muted);padding:2px 4px;margin-left:6px;cursor:pointer;vertical-align:middle}
.star[aria-pressed="true"]{color:var(--saffron)}
.plan{display:flex;flex-direction:column;gap:2px}
.plan-row{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.plan-row:first-of-type{margin-top:8px}
.plan-row .tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:800;color:#fff}
.plan-row.done .tick{background:var(--good);border-color:var(--good)}
.plan-row.done .pt b{color:var(--muted);text-decoration:line-through}
.plan-row .pt{display:flex;flex-direction:column;min-width:0}
.plan-row .pt small{color:var(--muted);font-size:.8rem;overflow:hidden;text-overflow:ellipsis}
.streak{font-size:.8rem;font-weight:700;color:var(--saffron);background:var(--saffron-bg);padding:3px 10px;border-radius:999px}
.btn.small{padding:7px 14px;font-size:.85rem;min-height:0}
.slowlist{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-top:4px}
td.n.slow{color:var(--bad);font-weight:700}

/* ---- v0.12: readiness, answer check, listen ---- */
.ready .rv{display:flex;align-items:baseline;gap:6px;margin-top:2px}
.ready .rv b{font-size:2.2rem;line-height:1.1}
.ready .rv small{color:var(--muted)}
.ready .rl{margin-left:6px;font-weight:700;color:var(--accent)}
.ready .meter{margin-top:10px}
.delta{font-size:.8rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.delta.up{color:var(--good);background:var(--good-bg)}
.delta.down{color:var(--bad);background:var(--bad-bg)}
.rparts{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.rp .meter{margin-top:4px;height:6px}
.check-box{background:var(--sunk);border-radius:12px;padding:12px 14px;margin:6px 0 12px}
.kp-head{margin-top:10px;font-size:.9rem}
.check-box .meter{margin-top:6px}
.kp{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.kp li{display:grid;grid-template-columns:20px 1fr;gap:6px;color:var(--muted)}
.kp li.ok{color:var(--ink)}
.kp .mk{font-weight:800;color:var(--muted)}
.kp li.ok .mk{color:var(--good)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.listen{white-space:nowrap;margin-left:8px}
.listen.on{color:var(--bad);font-weight:700}
#player{position:fixed;left:8px;right:8px;bottom:calc(var(--tab) + 8px);z-index:20;display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px;box-shadow:var(--shadow);font-size:.88rem}
#player span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}

/* ---- v0.13: guess marks, challenge, final week, calculators ---- */
.guessrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 10px}
.guessrow small{font-size:.78rem}
.chip.guess[aria-pressed="true"]{background:var(--saffron-bg);border-color:var(--saffron);color:var(--saffron)}
.chip.small{padding:4px 10px;font-size:.78rem;margin-left:6px}
.pal button.gs{box-shadow:inset 0 -3px 0 var(--saffron)}
.duelcode{font:800 2rem/1.2 var(--mono);letter-spacing:.12em;text-align:center;padding:14px;border:2px dashed var(--accent);border-radius:14px;color:var(--accent);margin:4px 0 10px;user-select:all}
.rivalin{width:64px;padding:4px 6px;font-size:.9rem}
button.tick{background:none;padding:0;cursor:pointer;font:inherit;font-size:.8rem;font-weight:800;color:#fff}
.plan-row.done button.tick{background:var(--good);border-color:var(--good)}
.card.final{border:2px solid var(--saffron)}
.cres{margin-top:4px}
.cres tr.lead td{font-weight:800;font-size:1.05rem;color:var(--accent)}

/* ---- v0.17: Style B "Indigo + Saffron Gold" (warm surfaces, gold primary actions, indigo structure) ---- */
:root{
  --bg:#FBF7F1; --sunk:#F4ECE1; --line:#EDE3D6; --ink:#1F1A2E; --muted:#6E6459;
  --gold:#D97706; --gold-2:#B45309; --gold-soft:#FFF3E2; --gold-line:#F2C27A;
  --shadow:0 1px 2px rgba(60,40,10,.05),0 6px 18px rgba(60,40,10,.07); --r:16px}
:root[data-theme="dark"]{--gold:#F5B04A; --gold-2:#E08A1A; --gold-soft:#33240F; --gold-line:#6B4A1A}
.top{border-bottom:3px solid transparent;border-image:linear-gradient(90deg,#F2A12B,#FFD27A,#F2A12B) 1}
.btn{background:linear-gradient(135deg,var(--gold),var(--gold-2));box-shadow:0 6px 14px rgba(180,83,9,.28);border-radius:14px}
:root[data-theme="dark"] .btn{color:#2A1800;box-shadow:none}
.btn.ghost{color:var(--accent);border-color:var(--accent);background:var(--surface)}
.btn.light{background:rgba(255,255,255,.16)}
.meter i{background:linear-gradient(90deg,var(--gold),#F2A12B)}
.hero{position:relative;overflow:hidden;box-shadow:0 10px 24px rgba(43,42,140,.25)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,#F2A12B,#FFD27A,#F2A12B)}
.hero .big{color:#FFD27A}
.card{border-color:var(--line)}
.stat .v{color:var(--ink)}
.lock{background:var(--gold-soft);border:1px dashed var(--gold-line)}
.lock b{color:var(--gold-2)}
.streak{color:var(--gold-2);background:var(--gold-soft)}
.star[aria-pressed="true"]{color:var(--gold)}

/* home punchline */
.motto{text-align:center;padding:2px 8px}
.motto b{display:block;font-size:1.12rem;color:var(--gold-2);letter-spacing:.01em}
.motto span{display:block;font-size:.82rem;color:var(--muted)}
:root[data-theme="dark"] .motto b{color:var(--gold)}

/* welcome */
body.no-tabs .tabbar{display:none}
body.no-tabs{padding-bottom:16px}
.welcome{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:8px 0 4px}
.w-badge{width:84px;height:84px;border-radius:24px;background:linear-gradient(135deg,#2B2A8C,#3F3AC7 55%,#6D3FD8);box-shadow:0 10px 24px rgba(43,42,140,.3);display:grid;place-items:center}
.w-badge svg{width:76px;height:76px}
.w-app{margin:0;font-weight:800;font-size:1.15rem;color:var(--accent)}
.couplet{margin:4px 0;padding:16px 18px;border-radius:18px;background:var(--surface);border:1px solid var(--gold-line);box-shadow:var(--shadow);width:100%}
.couplet p{margin:0}
.couplet p[lang="hi"]{font-size:1.06rem;font-weight:700;line-height:1.6;color:var(--ink)}
.couplet .en{margin-top:8px;font-size:.88rem;color:var(--muted);font-style:italic}
.couplet cite{display:block;margin-top:6px;font-size:.75rem;font-style:normal;color:var(--gold-2)}
.w-lede{margin:0;font-weight:600;color:var(--ink)}
.w-feat{list-style:none;padding:0;margin:0;display:grid;gap:8px;text-align:left;width:100%}
.w-feat li,.pw-feat li{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;font-size:.95rem}
.w-feat li::before,.pw-feat li::before{content:"✓";width:22px;height:22px;border-radius:50%;background:var(--gold);color:#fff;font-size:.75rem;font-weight:800;display:grid;place-items:center;margin-top:1px}
.w-date{width:100%;text-align:left}
.w-skip{margin-top:-2px}

/* paywall */
.pw-hero{margin:-16px -16px 14px;padding:22px 20px 20px;text-align:center;color:#fff;position:relative;background:linear-gradient(135deg,#231F6E,#3B33B5 60%,#5A3BB8)}
.pw-hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,#F2A12B,#FFD27A,#F2A12B)}
.pw-hero h2{color:#fff;margin:2px 0 2px;font-size:1.4rem}
.pw-hero p{margin:0;opacity:.9;font-size:.9rem}
.pw-crown{font-size:2rem;line-height:1}
.pw-feat{list-style:none;margin:0 0 12px;padding:14px 16px;display:grid;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pw-offer{text-align:center;padding:14px;border-radius:var(--r);background:var(--gold-soft);border:1.5px dashed var(--gold);margin-bottom:12px}
.pw-offer .o1{font-size:.8rem;font-weight:800;color:var(--gold-2);letter-spacing:.04em}
.pw-offer .o2{font-size:2rem;font-weight:800;line-height:1.2;color:var(--ink)}
.pw-offer .o2 s{font-size:1rem;color:var(--muted);font-weight:500;margin-left:6px}
.pw-offer .o3{font-size:.82rem;color:var(--muted);margin-bottom:8px}
.pw-code{margin-bottom:12px}
.pw-cta{font-size:1.05rem;padding:14px}
.pw-fine{text-align:center;font-size:.8rem;color:var(--muted);margin:8px 0 0}

/* motion: screen fade, answer feedback */
@media (prefers-reduced-motion:no-preference){
  main>*{animation:ppIn .22s ease-out}
  .opt.right{animation:ppPop .35s ease-out}
  .opt.wrong{animation:ppShake .35s ease-out}
}
@keyframes ppIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes ppPop{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes ppShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ---- v0.18: section cards with progress rings, mock result ring and section bars ---- */
.ring{--p:0;--sz:54px;flex:none;width:var(--sz);height:var(--sz);border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--sunk) 0)}
.ring b{width:calc(var(--sz) - 12px);height:calc(var(--sz) - 12px);border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:.78rem;font-weight:800;color:var(--ink)}
.ring.big{--sz:96px}
.ring.big b{font-size:1.35rem}
.secgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec-card{display:flex;gap:8px;align-items:center;text-align:left;padding:10px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;min-width:0}
.sec-card .sc-t{display:flex;flex-direction:column;min-width:0}
.sec-card .sc-t b{color:var(--accent);font-size:.95rem}
.sec-card .sc-t span{font-size:.78rem;line-height:1.25;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sec-card small{font-size:.7rem;color:var(--muted);margin-top:2px}
.sec-card[aria-pressed="true"]{border-color:var(--accent);background:var(--sunk);box-shadow:0 0 0 2px var(--accent) inset}
.sec-card[aria-pressed="true"] .ring b{background:var(--sunk)}
.sec-card .ring{--sz:44px}
.sec-card .ring b{font-size:.68rem}
@media (max-width:340px){.secgrid{grid-template-columns:1fr}}
.res-top{display:flex;gap:16px;align-items:center}
.res-top h2{margin:0}
.res-verdict{margin:4px 0 0;font-weight:700;color:var(--gold-2)}
:root[data-theme="dark"] .res-verdict{color:var(--gold)}
.secbars{display:grid;gap:8px}
.sb{display:grid;grid-template-columns:44px 1fr 52px;gap:8px;align-items:center;font-size:.85rem}
.sb-n{font-weight:700;color:var(--accent)}
.sb-t{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.sb-t i{display:block;height:100%;border-radius:5px}
.sb-t i.g{background:var(--good)} .sb-t i.m{background:var(--gold)} .sb-t i.w{background:var(--bad)}
.sb-v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}

/* ---- v0.19: streak card and milestone celebrations ---- */
.streak-card{padding:14px 16px}
.sc-head{display:flex;align-items:center;gap:12px}
.sc-head b{display:block;font-size:1.05rem}
.sc-head small{display:block;color:var(--muted);font-size:.82rem}
.sc-head>div{flex:1;min-width:0}
.flame{font-size:2.1rem;line-height:1;filter:drop-shadow(0 3px 6px rgba(224,123,0,.35))}
.flame.off{filter:grayscale(1);opacity:.45}
.sc-best{font-size:.75rem;font-weight:800;color:var(--gold-2);background:var(--gold-soft);padding:3px 10px;border-radius:999px;white-space:nowrap}
.sdots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.sd{display:flex;flex-direction:column;align-items:center;gap:3px}
.sd i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:1rem;background:var(--sunk);border:1.5px solid var(--line)}
.sd.on i{background:var(--gold-soft);border-color:var(--gold)}
.sd.today i{box-shadow:0 0 0 2px var(--accent)}
.sd small{font-size:.7rem;color:var(--muted);font-weight:700}
.cele{position:fixed;inset:0;z-index:50;background:rgba(15,17,34,.55);display:grid;place-items:center;padding:24px;overflow:hidden}
.cele-card{position:relative;z-index:1;width:100%;max-width:340px;text-align:center;background:var(--surface);border-radius:22px;padding:22px 20px 18px;box-shadow:0 20px 50px rgba(0,0,0,.3);border-top:5px solid var(--gold)}
.cele-icon{font-size:3.2rem;line-height:1.1}
.cele-card h2{margin:8px 0 6px;color:var(--ink)}
.cele-card p{margin:0 0 16px;color:var(--muted)}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;opacity:.9}
@media (prefers-reduced-motion:no-preference){
  .cele-card{animation:celeIn .4s cubic-bezier(.2,1.4,.4,1)}
  .confetti i{animation:fall 2s linear forwards}
  .flame:not(.off){animation:flick 1.8s ease-in-out infinite}
}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}
@keyframes celeIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(110vh) rotate(540deg);opacity:.2}}
@keyframes flick{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.08) rotate(2deg)}}

/* ---- v0.19.1: speed on low-end phones ---- */
.loading{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:28vh;color:var(--muted);text-align:center}
.loading b{color:var(--accent);font-size:1.1rem}
.ld-badge{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#2B2A8C,#3F3AC7 55%,#6D3FD8);box-shadow:0 8px 20px rgba(43,42,140,.3)}
html.lite *,html.lite *::before,html.lite *::after{animation:none!important;transition:none!important}
html.lite .card,html.lite .sec-card,html.lite .btn,html.lite .hero,html.lite .pw-feat{box-shadow:none!important}
html.lite .confetti{display:none}

/* ---- v0.20: writing toolkit ---- */
.tk-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:4px 0 8px;scrollbar-width:none}
.tk-tabs button{flex:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:700;font-size:.86rem;cursor:pointer}
.tk-tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .tk-tabs button[aria-selected="true"]{color:#0F1122}
.tk-list{margin-top:12px;padding:4px 16px}
.tk-item{padding:12px 0;border-bottom:1px solid var(--line)}
.tk-item:last-child{border-bottom:0}
.tk-item p{margin:0}
.tk-en{font-weight:600;color:var(--ink);line-height:1.45}
.tk-hi{color:var(--gold-2);font-size:.92rem;margin-top:3px!important}
.tk-hi.big{font-size:1.02rem;font-weight:600}
:root[data-theme="dark"] .tk-hi{color:var(--gold)}
.tk-ex{color:var(--muted);font-size:.9rem;margin-top:4px!important;line-height:1.45}
.tk-act{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tk-sec{font:800 .8rem var(--mono);color:#fff;background:var(--accent);border-radius:6px;padding:2px 7px;white-space:nowrap}
:root[data-theme="dark"] .tk-sec{color:#0F1122}

/* ---- v0.21: writing help in the answer screen ---- */
.kw-box{margin:2px 0 10px;padding:10px 12px;border-radius:12px;background:var(--gold-soft);border:1px dashed var(--gold-line)}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.kw-chip{border:1px solid var(--gold-line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:.84rem;font-weight:600;cursor:pointer}
.kw-chip.ok{border-color:var(--good);background:var(--good-bg);color:var(--good);cursor:default}
.kw-chip.miss{border-style:dashed;color:var(--muted);cursor:default}
.phr-box{margin-top:8px;padding:12px;border-radius:12px;background:var(--sunk)}
.phr-box .chips{margin:8px 0}
.phr-list{display:grid;gap:6px;max-height:280px;overflow-y:auto}
.phr{display:flex;flex-direction:column;gap:2px;text-align:left;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.phr span{font-weight:600;color:var(--ink)}
.phr small{color:var(--gold-2)}
:root[data-theme="dark"] .phr small{color:var(--gold)}

/* v0.22 rating card */
.rate-card{margin-top:12px;text-align:center;border:1px solid var(--gold,#F2A12B)}
.rate-card .row{justify-content:center}
.rate-stars{color:#F2A12B;font-size:22px;letter-spacing:4px;margin-bottom:4px}
.rate-card a.btn{text-decoration:none}

/* v0.23 exam tracks, syllabus, difficulty */
body.no-write .tabbar a[data-r="write"]{display:none}
.tp{display:block;width:100%;text-align:left;cursor:pointer;border:2px solid transparent}
.tp b{display:block;font-size:1.02rem}.tp small{display:block;color:var(--muted,#6b6b7b);margin-top:3px}
.tp.on{border-color:var(--gold,#F2A12B)}
.sec-card.soon{opacity:.55;cursor:default}
.tag.lv1{background:#E6F4EC;color:#0F7A55}.tag.lv2{background:#FFF3DC;color:#9A5B00}.tag.lv3{background:#FDE7E7;color:#B42318}
.sy-row{padding:12px 0;border-bottom:1px solid var(--line,#eee)}.sy-row:last-child{border-bottom:0}
.sy-mk{font-weight:700;white-space:nowrap;margin-left:8px}
.sy-bar{height:8px;border-radius:4px;background:var(--line,#eee);margin:6px 0;overflow:hidden}
.sy-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#3F3AC7,#F2A12B)}
.sy-tip{margin:6px 0 0;font-size:.9rem;color:var(--muted,#6b6b7b)}
.sy-link{text-decoration:none;color:inherit}
.ch-sw{justify-content:center}.sy-tabs{margin-bottom:12px;overflow-x:auto;flex-wrap:nowrap}.sy-tabs .chip{white-space:nowrap}
.psg p{margin:0 0 10px;line-height:1.6}.psg{margin-bottom:12px;max-height:46vh;overflow:auto}

/* v0.24 fixes: outlined buttons were invisible in dark mode (the dark .btn text colour also hit .ghost/.light),
   link-buttons wrapped and underlined, and counters inside a selected chip were faint. */
:root[data-theme="dark"] .btn.ghost{color:var(--accent);background:var(--surface);border-color:var(--accent)}
:root[data-theme="dark"] .btn.light{color:#fff}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;line-height:1.3}
.btn.block{display:flex;width:100%}
.chip[aria-pressed="true"] small{color:inherit;opacity:.85}
/* v0.24 Your-exam card and guide */
.pc-card{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit}
.pc-card b{display:block}.pc-card small{display:block;color:var(--muted)}
.pc-ic{font-size:26px;flex:none}
.pc-links{display:block;margin-top:4px;font-size:.92rem}
.pc-new{border:1.5px dashed var(--gold,#F2A12B)}.pc-go{margin-left:auto;font-weight:700;color:var(--accent);white-space:nowrap}
.gd h3{margin:22px 0 8px}
.gd-hero{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border:0}
.gd-hero .lede,.gd-hero h2{color:#fff}
:root[data-theme="dark"] .gd-hero,:root[data-theme="dark"] .gd-hero .lede,:root[data-theme="dark"] .gd-hero h2{color:#0F1122}
.gd-tab{width:100%;border-collapse:collapse;font-size:.92rem}.gd-tab th,.gd-tab td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.gd-no{color:var(--muted)}.gd-yes{color:var(--good)}
.gd-steps,.gd-list{margin:0;padding-left:20px;display:grid;gap:8px}
.gd-dl dt{font-weight:700;margin-top:8px}.gd-dl dd{margin:2px 0 0;color:var(--muted)}

/* v0.25 tap targets (Android guidance: 48dp; 44px minimum here keeps small phones uncluttered), tour sheet, report button */
.chip,.btn.small,.btn.sm,.tk-tabs button,.modes a,.kw-chip,.linkish{min-height:44px}
.chip{display:inline-flex;align-items:center;justify-content:center;padding-left:14px;padding-right:14px}
.chip.small{min-height:40px}
.linkish{display:inline-flex;align-items:center}
.kw-chip{display:inline-flex;align-items:center}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(10,10,30,.45);display:flex;align-items:flex-end;justify-content:center;animation:fadein .15s}
.sheet-card{background:var(--surface);color:var(--ink);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sheet-card h2{margin:0 0 10px}
.tour{display:grid;gap:10px;margin-bottom:14px}
.tour-tip{display:flex;gap:12px;align-items:flex-start;background:var(--sunk);border-radius:14px;padding:10px 12px}
.tour-tip span{font-size:22px}.tour-tip p{margin:0}
.rp-btn{background:transparent;border:0;color:inherit;opacity:.85;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;flex:none;cursor:pointer;margin-right:-8px}
.rp-btn:active{background:rgba(255,255,255,.15)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.pw-life{margin:10px auto 0;display:inline-block;background:rgba(255,255,255,.16);border-radius:12px;padding:8px 12px;font-weight:700;font-size:.95rem}.pw-life span{display:block;font-weight:600;opacity:.9;font-size:.9rem}
/* v0.26 referral rewards */
.rw{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rw:last-of-type{border-bottom:0}.rw b{display:block}.rw small{display:block;color:var(--muted)}
.rw-i{font-size:24px;flex:none}.rw .btn,.rw-lock{margin-left:auto;flex:none;white-space:nowrap}
.rw-lock{color:var(--muted);font-size:.9rem}.rw:not(.on) .rw-i{opacity:.5}
.rb{margin:10px 0 0;padding-left:22px;display:grid;gap:8px}.rb b{color:var(--accent)}
.amb{background:var(--gold,#F2A12B);color:#2A1800;border-radius:999px;padding:1px 8px;font-size:.78rem;margin-right:6px}

/* ---- v0.30: exam-like mock (instructions, section tabs, review palette) ---- */
:root{--pk-ans:#1E8E4E;--pk-rev:#7B3FC4}
:root[data-theme=dark]{--pk-ans:#4CC383;--pk-rev:#B48CF0}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--pk-ans:#4CC383;--pk-rev:#B48CF0}}
.instr{margin:12px 0;padding-left:20px;line-height:1.55}
.instr li{margin-bottom:6px}
.sectabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.sectabs button{flex:0 0 auto;min-height:40px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .85rem var(--mono);cursor:pointer}
.sectabs button small{color:var(--muted);font-weight:500}
.sectabs button[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sectabs button[aria-selected=true] small{color:inherit}
.mockbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.mockbar .btn{flex:1 1 140px;min-height:44px}
.pal button.pk{position:relative;min-height:38px;color:var(--ink)}
.pk.nv{background:var(--sunk);border-color:var(--line)}
.pk.na{background:var(--surface);border:2px solid var(--pk-rev)!important}
.pk.ans{background:var(--pk-ans)!important;border-color:var(--pk-ans)!important;color:#fff!important}
.pk.rev{background:var(--pk-rev)!important;border-color:var(--pk-rev)!important;color:#fff!important}
.pk.ansrev{background:var(--pk-rev)!important;border-color:var(--pk-rev)!important;color:#fff!important}
.pk.ansrev::after{content:"";position:absolute;right:3px;bottom:3px;width:8px;height:8px;border-radius:50%;background:var(--pk-ans);border:1px solid #fff}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i.pk{display:inline-block;position:relative;width:18px;height:18px;border-radius:5px;border:1px solid var(--line)}
.subtab{font-size:.78rem}
.subtab th,.subtab td{padding:6px 4px}
.srclink{display:block;margin-top:6px;padding:6px 0;min-height:32px;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px;word-break:break-word}
.rvnotes summary{cursor:pointer;min-height:40px;display:flex;align-items:center;gap:6px}
.rvnotes summary small{color:var(--muted)}
/* v0.31 polish: small saffron text links reach 4.5:1 on light surfaces */
:root[data-theme=light] .linkish{color:#9A4C05}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]) .linkish{color:#9A4C05}}
/* ---- v0.32: What changed ---- */
.chg-t{display:block;margin:6px 0 8px;font-size:1.02rem}
.chg-ba{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chg-ba>div{padding:8px 10px;border-radius:10px;background:var(--sunk)}
.chg-ba>div:last-child{background:var(--surface);border:1.5px solid var(--pk-ans,#1E8E4E)}
.chg-ba small{display:block;font:700 .7rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chg-ba p{margin:4px 0 0;font-size:.9rem;line-height:1.4}
.chg.up{border-color:var(--accent)}
.tag.new{background:var(--pk-ans,#1E8E4E);color:#fff}
.tag.soon{background:var(--accent);color:var(--accent-ink)}
a.chg-home{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;min-height:56px}
a.chg-home small{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}
a.chg-home>span:nth-child(2){flex:1}
.chg-n{min-width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--saffron);color:#fff;font-weight:700}
@media (max-width:360px){.chg-ba{grid-template-columns:1fr}}
/* letters and e-mails course */
.lesson summary{cursor:pointer;list-style:none}.lesson summary::-webkit-details-marker{display:none}
.lesson{margin-bottom:10px}.lesson-b{margin-top:10px}.lesson-b h4{margin:12px 0 4px}
.lt{width:100%;border-collapse:collapse;font-size:.9rem;margin:6px 0}.lt th,.lt td{border:1px solid var(--line, #ddd);padding:6px 8px;text-align:left;vertical-align:top}.lt th{background:var(--sunk)}
.lesson .frame .lbl{color:var(--muted);font-size:.8rem}
.tip{background:var(--sunk);border-left:3px solid #F2A12B;padding:8px 10px;border-radius:6px}
.drill{margin-bottom:10px}.drill .why{margin:8px 0 0}
/* free vs full table; "checked against the official source" stamp */
.cmp .lt td:nth-child(n+2),.cmp .lt th:nth-child(n+2){text-align:center;white-space:nowrap}
.chk{color:var(--good);font-weight:600}
.tk{margin:8px 0 6px;padding:8px 10px;border-left:3px solid #F2A12B;background:var(--sunk);border-radius:6px}
.why-wrong{margin:8px 0;font-size:.92rem}.why-wrong ul{margin:4px 0 0;padding-left:18px}.why-wrong li{margin:2px 0}

explained as under:", "hi": "इसके पीछे का औचित्य इस प्रकार समझाया जा सकता है:"}], "terms": [{"k": "term", "free": true, "t": "KYC (Know Your Customer)", "hi": "ग्राहक की पहचान की प्रक्रिया", "ex": "KYC protects the bank from being used for money laundering."}, {"k": "term", "free": true, "t": "Due diligence", "hi": "पूरी सावधानी से जाँच", "ex": "Proper due diligence before sanction reduces credit risk."}, {"k": "term", "free": true, "t": "Non-Performing Asset (NPA)", "hi": "अनुत्पादक आस्ति / डूबता ऋण", "ex": "An account becomes an NPA when interest or principal is overdue for more than 90 days."}, {"k": "term", "free": true, "t": "Special Mention Account (SMA)", "hi": "विशेष उल्लेख खाता", "ex": "Early identification of SMA accounts helps prevent slippage to NPA."}, {"k": "term", "free": true, "t": "Provisioning", "hi": "संभावित हानि के लिए प्रावधान", "ex": "Higher provisioning reduces profit but strengthens the balance sheet."}, {"k": "term", "free": true, "t": "Collateral security", "hi": "संपार्श्विक प्रतिभूति", "ex": "Collateral security is an additional cover over the primary security."}], "acts": [{"k": "act", "free": true, "a": "Negotiable Instruments Act, 1881", "s": "Sec 6", "d": "Cheque: a bill of exchange drawn on a specified banker, payable on demand (includes electronic and truncated cheques)."}, {"k": "act", "free": true, "a": "Negotiable Instruments Act, 1881", "s": "Sec 9", "d": "Holder in due course: acquires for consideration, before maturity, in good faith."}, {"k": "act", "free": true, "a": "Negotiable Instruments Act, 1881", "s": "Sec 10", "d": "Payment in due course: as per apparent tenor, in good faith, without negligence."}, {"k": "act", "free": true, "a": "Negotiable Instruments Act, 1881", "s": "Sec 31", "d": "The drawee banker must pay the cheque if funds are sufficient; else compensates the drawer for wrongful dishonour."}, {"k": "act", "free": true, "a": "Negotiable Instruments Act, 1881", "s": "Sec 87", "d": "A material alteration without consent makes the instrument void against non-consenting parties."}, {"k": "act", "free": true, "a": "Negotiable Instruments Act, 1881", "s": "Sec 131", "d": "Protection to the collecting banker who collects in good faith and without negligence."}], "hindi": [{"k": "hindi", "free": true, "hi": "ग्राहक को लिखित में सूचना दी जाएगी।", "en": "The customer will be informed in writing."}, {"k": "hindi", "free": true, "hi": "मामले की जाँच की जाएगी।", "en": "The matter will be investigated thoroughly."}, {"k": "hindi", "free": true, "hi": "दोषी कर्मचारी पर कार्यवाही होगी।", "en": "Action will be taken against the staff member responsible."}, {"k": "hindi", "free": true, "hi": "यह नियम ग्राहक की सुरक्षा के लिए है।", "en": "This rule is meant to protect the customer."}, {"k": "hindi", "free": true, "hi": "इससे बैंक का जोखिम कम होता है।", "en": "This reduces the risk to the bank."}, {"k": "hindi", "free": true, "hi": "खाते पर रोक लगा दी जाएगी।", "en": "The account will be frozen / debit-freeze will be marked."}]}, "content/legal.json": {"asOf": "2026-10", "items": [{"id": "L-001", "w": "Contract", "a": "Indian Contract Act, 1872", "s": "Sec 2(h)", "d": "An agreement enforceable by law.", "free": true, "url": "https://indiacode.gov.in/", "use": "Every loan document is a contract, so it must satisfy Sec 10 of the Contract Act.", "status": "reviewed"}, {"id": "L-003", "w": "Consideration", "a": "Indian Contract Act, 1872", "s": "Sec 2(d)", "d": "Something done, abstained from or promised at the desire of the promisor: the price of the promise.", "free": true, "url": "https://indiacode.gov.in/", "use": "Without consideration an agreement is void (Sec 25), so loan documents record it clearly.", "status": "reviewed"}, {"id": "L-006", "w": "Valid contract", "a": "Indian Contract Act, 1872", "s": "Sec 10", "d": "Free consent of competent parties, lawful consideration and object, and not expressly declared void.", "free": true, "url": "https://indiacode.gov.in/", "use": "The branch must ensure the borrower is competent and gives free consent (Secs 10-14) before execution.", "status": "reviewed"}, {"id": "L-007", "w": "Competent to contract", "a": "Indian Contract Act, 1872", "s": "Sec 11", "d": "A person who is a major, of sound mind and not disqualified by law.", "free": true, "url": "https://indiacode.gov.in/", "use": "A minor's agreement is void, so loans are not given to minors in their own name.", "status": "reviewed"}, {"id": "L-014", "w": "Indemnity", "a": "Indian Contract Act, 1872", "s": "Sec 124", "d": "A contract by which one party promises to save the other from loss caused by the promisor or any other person.", "free": true, "url": "https://indiacode.gov.in/", "use": "Before issuing a duplicate draft, the bank takes an indemnity (Sec 124) from the purchaser.", "status": "reviewed"}, {"id": "L-016", "w": "Guarantee", "a": "Indian Contract Act, 1872", "s": "Sec 126", "d": "A contract to perform the promise, or discharge the liability, of a third person if he defaults.", "free": true, "url": "https://indiacode.gov.in/", "use": "A guarantee (Sec 126) gives the bank a second way out if the borrower defaults.", "status": "reviewed"}, {"id": "L-017", "w": "Surety, principal debtor, creditor", "a": "Indian Contract Act, 1872", "s": "Sec 126", "d": "Surety gives the guarantee; principal debtor is the person whose default is guaranteed; creditor is the person to whom it is given.", "free": true, "url": "https://indiacode.gov.in/", "status": "reviewed"}, {"id": "L-019", "w": "Continuing guarantee", "a": "Indian Contract Act, 1872", "s": "Sec 129", "d": "A guarantee that extends to a series of transactions.", "free": true, "url": "https://indiacode.gov.in/", "use": "For running cash credit limits the bank takes a continuing guarantee (Sec 129).", "status": "reviewed"}, {"id": "L-023", "w": "Bailment", "a": "Indian Contract Act, 1872", "s": "Sec 148", "d": "Delivery of goods by one person to another for a purpose, to be returned or disposed of as directed when the purpose is over.", "free": true, "url": "https://indiacode.gov.in/", "use": "Safe custody of sealed covers is a bailment (Sec 148): the bank must take reasonable care (Sec 151).", "status": "reviewed"}, {"id": "L-026", "w": "General lien", "a": "Indian Contract Act, 1872", "s": "Sec 171", "d": "Bankers, factors, wharfingers, attorneys and policy-brokers may retain goods bailed to them for a general balance of account.", "free": true, "url": "https://indiacode.gov.in/", "use": "A banker's general lien (Sec 171) lets the bank retain securities in its possession for the customer's dues.", "status": "reviewed"}, {"id": "L-027", "w": "Pledge", "a": "Indian Contract Act, 1872", "s": "Sec 172", "d": "Bailment of goods as security for payment of a debt or performance of a promise; pawnor pledges, pawnee receives.", "free": true, "url": "https://indiacode.gov.in/", "use": "In a gold loan the gold is pledged (Sec 172), so the bank keeps possession till repayment.", "status": "reviewed"}, {"id": "L-034", "w": "Mortgage", "a": "Transfer of Property Act, 1882", "s": "Sec 58(a)", "d": "Transfer of an interest in specific immovable property to secure a loan, an existing or future debt, or an engagement that may create a pecuniary liability.", "free": true, "url": "https://indiacode.gov.in/", "use": "A home loan is secured by a mortgage (Sec 58, TPA) of the house.", "status": "reviewed"}, {"id": "L-035", "w": "Mortgagor, mortgagee, mortgage-money, mortgage-deed", "a": "Transfer of Property Act, 1882", "s": "Sec 58(a)", "d": "Mortgagor transfers; mortgagee receives; mortgage-money is the principal and interest secured; mortgage-deed is the instrument.", "free": true, "url": "https://indiacode.gov.in/", "status": "reviewed"}, {"id": "L-040", "w": "Equitable mortgage (deposit of title deeds)", "a": "Transfer of Property Act, 1882", "s": "Sec 58(f)", "d": "Delivery of title deeds with intent to create security, in Kolkata, Chennai, Mumbai and other notified towns.", "free": true, "url": "https://indiacode.gov.in/", "use": "Most branch property loans use an equitable mortgage (Sec 58(f)) by deposit of title deeds.", "status": "reviewed"}, {"id": "L-048", "w": "Promissory note", "a": "Negotiable Instruments Act, 1881", "s": "Sec 4", "d": "A written, signed, unconditional undertaking to pay a certain sum to, or to the order of, a certain person or to the bearer.", "free": true, "url": "https://indiacode.gov.in/", "use": "The demand promissory note is the basic loan document, made under Sec 4 of the NI Act.", "status": "reviewed"}, {"id": "L-050", "w": "Cheque", "a": "Negotiable Instruments Act, 1881", "s": "Sec 6", "d": "A bill of exchange drawn on a specified banker and payable only on demand; includes truncated and electronic cheques.", "free": true, "url": "https://indiacode.gov.in/", "status": "reviewed"}, {"id": "L-053", "w": "Holder in due course", "a": "Negotiable Instruments Act, 1881", "s": "Sec 9", "d": "A holder who took the instrument for consideration, before maturity, and in good faith without cause to believe the title was defective.", "free": true, "url": "https://indiacode.gov.in/", "status": "reviewed"}, {"id": "L-055", "w": "Negotiable instrument", "a": "Negotiable Instruments Act, 1881", "s": "Sec 13", "d": "A promissory note, bill of exchange or cheque payable to order or to bearer.", "free": true, "url": "https://indiacode.gov.in/", "status": "reviewed"}, {"id": "L-063", "w": "Dishonour of cheque for insufficient funds", "a": "Negotiable Instruments Act, 1881", "s": "Sec 138", "d": "An offence: notice within 30 days of the return memo, 15 days to pay, complaint within one month after that.", "free": true, "url": "https://indiacode.gov.in/", "use": "Sec 138 makes cheque bounce a criminal offence, which strengthens recovery.", "status": "reviewed"}, {"id": "L-066", "w": "Banking", "a": "Banking Regulation Act, 1949", "s": "Sec 5(b)", "d": "Accepting deposits of money from the public for lending or investment, repayable on demand or otherwise and withdrawable by cheque, draft, order or otherwise.", "free": true, "url": "https://indiacode.gov.in/", "use": "By Sec 5(b), deposits and lending together make a business \"banking\".", "status": "reviewed"}, {"id": "L-075", "w": "Depositor Education and Awareness Fund", "a": "Banking Regulation Act, 1949", "s": "Sec 26A", "d": "Deposits unclaimed for 10 years go to the DEA Fund; the depositor can still claim them from the bank.", "free": true, "url": "https://indiacode.gov.in/", "use": "Unclaimed deposits move to the DEA Fund under Sec 26A, yet the customer never loses the right to claim.", "status": "reviewed"}, {"id": "L-078", "w": "Nomination for deposits", "a": "Banking Regulation Act, 1949", "s": "Sec 45ZA", "d": "A depositor may nominate up to four persons; on death the bank pays the nominee and gets a valid discharge.", "free": true, "url": "https://indiacode.gov.in/", "use": "Nomination (Sec 45ZA) lets the branch settle deceased claims quickly without legal documents.", "status": "reviewed"}, {"id": "L-091", "w": "Demand notice", "a": "SARFAESI Act, 2002", "s": "Sec 13(2)", "d": "After the account becomes NPA, a notice asking the borrower to repay in full within 60 days.", "free": true, "url": "https://indiacode.gov.in/", "use": "Recovery under SARFAESI starts with a 60-day demand notice under Sec 13(2).", "status": "reviewed"}, {"id": "L-102", "w": "Financial creditor and financial debt", "a": "Insolvency and Bankruptcy Code, 2016", "s": "Secs 5(7), 5(8)", "d": "A person to whom a financial debt (disbursed against the time value of money, e.g. a bank loan) is owed.", "free": true, "url": "https://indiacode.gov.in/", "status": "reviewed"}, {"id": "L-107", "w": "Moratorium", "a": "Insolvency and Bankruptcy Code, 2016", "s": "Sec 14", "d": "On admission, suits, execution of decrees and enforcement of security (including SARFAESI) against the debtor are barred.", "free": true, "url": "https://indiacode.gov.in/", "status": "reviewed"}, {"id": "L-110", "w": "Beneficial owner", "a": "Prevention of Money-laundering Act, 2002", "s": "Sec 2(1)(fa)", "d": "An individual who ultimately owns or controls a client, or on whose behalf a transaction is conducted.", "free": true, "url": "https://indiacode.gov.in/", "use": "KYC is incomplete until the beneficial owner (PMLA Sec 2(1)(fa)) of a company customer is identified.", "status": "reviewed"}, {"id": "L-111", "w": "Client", "a": "Prevention of Money-laundering Act, 2002", "s": "Sec 2(1)(ha)", "d": "A person engaged in a financial transaction or activity with a reporting entity, including a person on whose behalf he acts.", "free": true, "url": "https://indiacode.gov.in/", "status": "reviewed"}, {"id": "L-115", "w": "Offence of money-laundering", "a": "Prevention of Money-laundering Act, 2002", "s": "Sec 3", "d": "Knowingly being involved in any process or activity connected with the proceeds of crime and projecting it as untainted.", "free": true, "url": "https://indiacode.gov.in/", "use": "Under Sec 3 of the PMLA even helping to conceal proceeds of crime is money-laundering, so staff must report suspicion.", "status": "reviewed"}, {"id": "L-123", "w": "Consumer", "a": "Consumer Protection Act, 2019", "s": "Sec 2(7)", "d": "A person who buys goods or hires services for consideration, but not for resale or commercial purpose.", "free": true, "url": "https://indiacode.gov.in/", "use": "A bank customer is a consumer under Sec 2(7), so deficiency in service can reach a Consumer Commission.", "status": "reviewed"}, {"id": "L-124", "w": "Deficiency", "a": "Consumer Protection Act, 2019", "s": "Sec 2(11)", "d": "Any fault, imperfection, shortcoming or inadequacy in the quality, nature or manner of service.", "free": true, "url": "https://indiacode.gov.in/", "status": "reviewed"}, {"id": "L-130", "w": "Acknowledgment of debt", "a": "Limitation Act, 1963", "s": "Sec 18", "d": "A written, signed acknowledgment before the period expires starts a fresh limitation period.", "free": true, "url": "https://indiacode.gov.in/", "use": "A signed balance confirmation is an acknowledgment under Sec 18, so limitation starts afresh.", "status": "reviewed"}]}, "content/confuse.json": {"asOf": "2026-10", "items": [{"id": "CB-001", "area": "Securities", "a": "Pledge", "b": "Hypothecation", "ad": "Bailment of goods as security; the lender holds the goods (Sec 172, Contract Act).", "bd": "A charge on movable property; the borrower keeps possession (Sec 2(1)(n), SARFAESI Act).", "key": "Who holds the goods: lender in pledge, borrower in hypothecation.", "ca": ["Gold ornaments kept in the bank's safe against a loan", "The lender has possession of the goods"], "cb": ["Vehicle loan where the car stays with the borrower", "Stocks in the borrower's godown charged to the bank"], "free": true, "status": "reviewed"}, {"id": "CB-002", "area": "Contract Act", "a": "Sec 130", "b": "Sec 131", "ad": "Revocation of a continuing guarantee by the surety's notice, for future transactions.", "bd": "Revocation of a continuing guarantee by the surety's death, for future transactions, unless the contract says otherwise.", "key": "Notice = Sec 130; death = Sec 131.", "ca": ["The guarantor writes to the bank withdrawing the guarantee for future advances"], "cb": ["The guarantor dies and the guarantee stops for future transactions"], "free": true, "status": "reviewed"}, {"id": "CB-003", "area": "Contract Act", "a": "Particular lien (Sec 170)", "b": "General lien (Sec 171)", "ad": "Right to keep only the goods on which work was done, until paid for that work.", "bd": "Right of bankers, factors, wharfingers, attorneys and policy-brokers to keep goods for a general balance of account.", "key": "Particular: only for that work; general: for any balance due (bankers have it).", "ca": ["A tailor keeps the suit until his stitching charges are paid"], "cb": ["A bank retains a customer's securities for dues on another account"], "free": true, "status": "reviewed"}, {"id": "CB-004", "area": "Contract Act", "a": "Indemnity (Sec 124)", "b": "Guarantee (Sec 126)", "ad": "Two parties: one promises to save the other from loss.", "bd": "Three parties: creditor, principal debtor and surety; surety pays if the debtor defaults.", "key": "Indemnity has two parties and a primary liability; guarantee has three and a secondary liability.", "ca": ["Bank takes a promise to save it from loss before issuing a duplicate draft", "Only two parties are involved"], "cb": ["A third person promises to repay if the borrower defaults", "The liability arises only on the debtor's default"], "free": true, "status": "reviewed"}, {"id": "CB-008", "area": "Transfer of Property Act", "a": "Simple mortgage", "b": "Equitable mortgage", "ad": "No possession; the mortgagor binds himself personally and agrees to sale on default (Sec 58(b)).", "bd": "Created by deposit of title deeds with intent to create security, in notified towns (Sec 58(f)).", "key": "Equitable mortgage is by deposit of title deeds; simple mortgage needs a registered deed.", "ca": ["A registered mortgage deed, borrower keeps possession and is personally liable"], "cb": ["The borrower hands over the title deeds of his flat to the bank"], "free": true, "status": "reviewed"}, {"id": "CB-011", "area": "NI Act", "a": "Promissory note (Sec 4)", "b": "Bill of exchange (Sec 5)", "ad": "An unconditional promise to pay; two parties (maker and payee).", "bd": "An unconditional order to pay; three parties (drawer, drawee, payee).", "key": "Note = promise (2 parties); bill = order (3 parties).", "ca": ["\"I promise to pay ₹1 lakh on demand\"", "The basic loan document a borrower signs"], "cb": ["The drawer directs another person to pay a third person", "Needs acceptance by the drawee"], "free": true, "status": "reviewed"}, {"id": "CB-018", "area": "Accounts", "a": "Inoperative account", "b": "Unclaimed deposit", "ad": "No customer-induced transaction for two years.", "bd": "Not operated for ten years; transferred to the DEA Fund.", "key": "Two years = inoperative; ten years = unclaimed, DEA Fund.", "ca": ["A savings account without a customer-induced transaction for 24 months"], "cb": ["A deposit untouched for ten years moves to the DEA Fund"], "free": true, "status": "reviewed"}, {"id": "CB-019", "area": "Accounts", "a": "NRE account", "b": "NRO account", "ad": "Rupee account for income earned abroad; fully repatriable; interest tax-free.", "bd": "Rupee account for income in India (rent, dividend); repatriation within limits; interest taxable.", "key": "NRE: foreign earnings, repatriable, tax-free; NRO: Indian income, taxable.", "ca": ["Salary earned in Dubai is credited here and can be sent back freely"], "cb": ["Rent from a flat in India is credited here"], "free": true, "status": "reviewed"}, {"id": "CB-021", "area": "Monetary policy", "a": "CRR", "b": "SLR", "ad": "Cash kept with RBI as a share of net demand and time liabilities (Sec 42, RBI Act).", "bd": "Liquid assets (cash, gold, approved securities) kept by the bank itself (Sec 24, BR Act).", "key": "CRR is cash with RBI; SLR is liquid assets with the bank.", "ca": ["Maintained as a balance with the Reserve Bank"], "cb": ["Can be kept in government securities"], "free": true, "status": "reviewed"}, {"id": "CB-024", "area": "AML / KYC", "a": "CTR", "b": "STR", "ad": "Cash transactions above ₹10 lakh (or connected series in a month); due by the 15th of the next month.", "bd": "Any suspicious transaction, whatever the amount; within 7 working days of concluding it is suspicious.", "key": "CTR is about cash size; STR is about suspicion, of any amount.", "ca": ["A customer deposits ₹12 lakh in cash in a month"], "cb": ["Unusual transactions with no clear purpose, even small ones"], "free": true, "status": "reviewed"}, {"id": "CB-026", "area": "Asset quality", "a": "SMA-1", "b": "SMA-2", "ad": "Principal or interest overdue 31-60 days.", "bd": "Principal or interest overdue 61-90 days.", "key": "31-60 days = SMA-1; 61-90 = SMA-2; beyond 90 = NPA.", "ca": ["A term loan instalment overdue for 45 days"], "cb": ["A term loan instalment overdue for 75 days"], "free": true, "status": "reviewed"}, {"id": "CB-028", "area": "Insolvency", "a": "Financial creditor", "b": "Operational creditor", "ad": "Owed a financial debt: money lent against the time value of money (e.g. a bank).", "bd": "Owed for goods, services, employment or government dues (e.g. a supplier).", "key": "Lender = financial; supplier = operational.", "ca": ["A bank that gave a term loan to the company"], "cb": ["A raw-material supplier with unpaid bills"], "free": true, "status": "reviewed"}, {"id": "CB-030", "area": "Recovery", "a": "SARFAESI Sec 13(2)", "b": "SARFAESI Sec 13(4)", "ad": "Demand notice giving the borrower 60 days to repay.", "bd": "Recovery measures: take possession, take over management, appoint a manager.", "key": "13(2) is the notice; 13(4) is the action.", "ca": ["The borrower is given 60 days to clear the dues"], "cb": ["The bank takes possession of the mortgaged property"], "free": true, "status": "reviewed"}, {"id": "CB-033", "area": "Social security", "a": "PMSBY", "b": "PMJJBY", "ad": "Accident cover of ₹2 lakh, ages 18-70.", "bd": "Life cover of ₹2 lakh for death from any cause, ages 18-50.", "key": "PMSBY = accident (Suraksha); PMJJBY = life (Jeevan Jyoti).", "ca": ["Pays only if death or disability is due to an accident"], "cb": ["Pays on death from any cause, including illness"], "free": true, "status": "reviewed"}]}, "content/interview.json": {"asOf": "2026-10", "items": [{"id": "IV-001", "area": "About you", "q": "Introduce yourself.", "pts": ["Name, present posting and role in two lines", "Years of service and the kinds of branches or desks handled", "One or two achievements with numbers (e.g. recovery, CASA growth, audit rating)", "Why you are ready for the next scale"], "tip": "Keep it under 90 seconds; end with why you want the higher role.", "free": true, "status": "reviewed"}, {"id": "IV-002", "area": "About you", "q": "Why do you want this promotion?", "pts": ["To take larger responsibility and lead a bigger team", "To use my experience in credit, operations or customer service at a wider level", "To contribute to the bank's business goals and grow professionally"], "tip": "Talk about contribution and responsibility, not only pay or status.", "free": true, "status": "reviewed"}, {"id": "IV-003", "area": "About you", "q": "What are your strengths and one weakness?", "pts": ["Two strengths with a short real example each", "One genuine weakness that is not critical to the role", "What you are doing to improve it"], "tip": "Never say \"I have no weakness\"; show self-awareness.", "free": true, "status": "reviewed"}, {"id": "IV-006", "area": "Leadership", "q": "How will you motivate a team that is not meeting targets?", "pts": ["Understand reasons team member by member", "Break the target into daily, person-wise goals", "Remove hurdles: training, leads, system issues", "Recognise progress publicly; review weekly"], "tip": "Show both empathy and follow-up.", "free": true, "status": "reviewed"}, {"id": "IV-010", "area": "Customer service", "q": "An angry customer shouts at the counter. What do you do?", "pts": ["Stay calm; listen fully without interrupting", "Take the customer aside if needed; apologise for the inconvenience", "Solve the issue or give a clear timeline", "Record the complaint in the system and follow up"], "tip": "Listen, empathise, act, follow up.", "free": true, "status": "reviewed"}, {"id": "IV-012", "area": "Customer service", "q": "A customer reports an unauthorised digital transaction. What will you do?", "pts": ["Block the card/channel at once and register the complaint", "Give acknowledgement with complaint number", "Explain liability rules: zero liability if reported quickly and not due to customer negligence", "Shadow credit within 10 working days as per RBI rules; resolve within 90 days"], "tip": "Act fast, then explain rules.", "free": true, "status": "reviewed"}, {"id": "IV-014", "area": "Credit", "q": "What do you check before sanctioning a loan?", "pts": ["Character: KYC, credit history (CIC report), conduct", "Capacity: income, cash flows, repayment ability (DSCR)", "Capital and collateral: margin, security value", "Conditions: purpose, industry, viability"], "tip": "The 5 Cs of credit: Character, Capacity, Capital, Collateral, Conditions.", "free": true, "status": "reviewed"}, {"id": "IV-015", "area": "Credit", "q": "What are early warning signals of a stressed account?", "pts": ["Delays in instalments or interest; SMA status", "Frequent cheque returns and ad hoc limit requests", "Delayed stock statements; falling sales routed through the account", "Diversion of funds; adverse news about the borrower"], "tip": "Spotting early saves the account.", "free": true, "status": "reviewed"}, {"id": "IV-019", "area": "Compliance", "q": "Why is KYC important?", "pts": ["Prevents misuse of the bank for money laundering and terror financing", "Legal obligation under PMLA and RBI KYC Directions", "Helps know the customer's risk profile and serve better", "Protects the bank from frauds and penalties"], "tip": "Mention both law and business benefit.", "free": true, "status": "reviewed"}, {"id": "IV-023", "area": "Banking concepts", "q": "Explain NPA in simple words.", "pts": ["A loan where interest or instalment is overdue for more than 90 days", "Stops earning income for the bank; needs provisioning", "Classified as sub-standard, doubtful and loss", "Reduces profit and lending capacity"], "tip": "Explain as if to a customer, then add the technical term.", "free": true, "status": "reviewed"}, {"id": "IV-024", "area": "Banking concepts", "q": "What is CASA and why does it matter?", "pts": ["Current Account and Savings Account deposits", "Low-cost funds for the bank", "Higher CASA lowers the cost of funds and improves margins", "Ways to grow: salary packages, digital onboarding, customer service"], "tip": "Link cost of funds to profit.", "free": true, "status": "reviewed"}, {"id": "IV-027", "area": "Banking concepts", "q": "What is digital banking fraud and how can customers be protected?", "pts": ["Phishing, vishing, fake apps, OTP and UPI PIN fraud", "Never share OTP, PIN or card details; banks never ask", "Use official apps; set limits; enable alerts", "Report fast: national cyber helpline 1930 and the bank"], "tip": "Give customers a 3-point safety message.", "free": true, "status": "reviewed"}, {"id": "IV-031", "area": "Situation", "q": "A customer offers you a costly gift after a loan is sanctioned. What will you do?", "pts": ["Politely refuse", "Explain the bank's code of ethics", "Report to the controller if needed"], "tip": "Integrity is non-negotiable.", "free": true, "status": "reviewed"}, {"id": "IV-035", "area": "About you", "q": "Why should we promote you?", "pts": ["Two achievements with numbers from your present role", "Skills that match the higher role: credit, people handling, compliance", "Readiness to take responsibility and move anywhere", "What you will deliver in the first year"], "tip": "Prove it with results, not adjectives.", "free": true, "status": "reviewed"}, {"id": "IV-039", "area": "About you", "q": "Are you ready for a transfer to a remote or hilly area?", "pts": ["Yes: postings are part of a banker's career", "A new place means new learning and new customers", "Mention family arrangements briefly if asked"], "tip": "A clear yes, with a positive reason.", "free": true, "status": "reviewed"}, {"id": "IV-042", "area": "About you", "q": "How do you keep yourself updated?", "pts": ["Read a business newspaper daily", "Follow RBI press releases and the bank's own circulars", "Online courses and banking certifications", "Discuss changes with colleagues"], "tip": "Be ready for \"what is today's headline?\".", "free": true, "status": "reviewed"}, {"id": "IV-043", "area": "About you", "q": "What should you know about your own branch before the interview?", "pts": ["Location, type and key business of the branch", "Deposits, advances, CASA share and NPA level (latest figures)", "Main customer segments, competitors and market potential", "Last audit or inspection rating and your role in it"], "tip": "Panels often start here; know your figures.", "free": true, "status": "reviewed"}, {"id": "IV-044", "area": "Banking concepts", "q": "What is NIM and how can a branch improve it?", "pts": ["Net interest margin: interest earned minus interest paid, as a share of average earning assets", "Raise low-cost CASA deposits", "Grow good-quality loans and recover NPAs", "Price loans correctly and avoid idle funds"], "tip": "Define it, then give three levers.", "free": true, "status": "reviewed"}, {"id": "IV-053", "area": "Banking concepts", "q": "How is the digital rupee (CBDC) different from UPI and cryptocurrency?", "pts": ["e₹ is legal tender issued by RBI: a digital form of cash", "UPI is a payment system that moves bank deposits; e₹ is money itself", "Cryptocurrencies are not issued or backed by any central bank", "e₹ in a wallet earns no interest, like cash"], "tip": "Money vs payment rail vs unregulated asset.", "free": true, "status": "reviewed"}, {"id": "IV-058", "area": "Situation", "q": "A customer comes with ₹10 lakh to invest. How will you advise?", "pts": ["Ask about goal, time period, risk appetite and age", "Safe options: term deposits, government small savings, senior citizen schemes where eligible", "Market-linked options only if they understand the risk", "Suggest a mix; explain charges and risks honestly"], "tip": "Need first, product later.", "free": true, "status": "reviewed"}]}, "content/changes.json": {"updated": "2026-10-24", "items": [{"id": "c31", "date": "2027-04-01", "area": "NPA & provisioning", "title": "Expected Credit Loss (ECL) provisioning starts", "before": "Provisions on the incurred-loss IRAC basis", "now": "Three-stage ECL framework; the 90-day NPA test stays", "q": ["S9-032 LR redefined", "before": "Saturday to alternate Friday", "now": "1st-15th and 16th-last day of each month", "q": ["S7-0220"], "url": "https://www.rbi.org.in/"}, {"id": "c09", "date": "2025-12-01", "area": "SBI charges", "title": "Other-bank ATM charge for SBI savings accounts", "before": "₹21 + GST per cash withdrawal", "now": "₹23 + GST (non-financial ₹11 + GST)", "q": ["S3-0255"], "url": "https://sbi.bank.in/documents/16012/22770835/NOTICE++REVISION+IN+ATM++ADWM+TRANSACTION+SERVICE+CHARGES.pdf/7c66ae2b-74ba-67cc-dbfa-01725136c709"}, {"id": "c08", "date": "2025-11-30", "area": "Digital", "title": "SBI mCash discontinued", "before": "Send money by mobile number/email with a passcode", "now": "Use UPI, IMPS, NEFT or RTGS", "q": ["S3-0319"], "url": "https://sbi.bank.in/web/home/announcements"}, {"id": "c07", "date": "2025-11-21", "area": "HR", "title": "Four Labour Codes in force", "before": "29 central labour laws", "now": "Codes on Wages, Industrial Relations, Social Security and OSH", "q": ["S4-0352", "S4-0355"], "url": "https://labour.gov.in/"}, {"id": "c06", "date": "2025-11-01", "area": "Deposits", "title": "New nomination rules (Banking Laws Amendment Act, 2025)", "before": "One nominee per account", "now": "Up to four nominees; simultaneous or successive for deposits, successive only for lockers", "q": ["S7-0221", "S1-0328", "S1-0329", "S1-0330"], "url": "https://www.rbi.org.in/"}, {"id": "c05", "date": "2025-08-01", "area": "Laws", "title": "Director's \"substantial interest\" threshold raised", "before": "₹5 lakh (since 1968)", "now": "₹2 crore", "q": ["S7-0318"], "url": "https://indiacode.gov.in/"}, {"id": "c04", "date": "2025-04-01", "area": "MSME", "title": "MSME definitions revised; CGTMSE cover raised", "before": "Micro: investment ₹1 crore, turnover ₹5 crore; CGTMSE up to ₹5 crore", "now": "Micro ₹2.5 crore / ₹10 crore; small ₹25 / ₹100 crore; medium ₹125 / ₹500 crore; CGTMSE up to ₹10 crore", "q": ["S2-0004", "S2-0339"], "url": "https://msme.gov.in/"}, {"id": "c03", "date": "2025-03-26", "area": "Govt schemes", "title": "Gold Monetisation Scheme narrowed", "before": "Short, medium and long-term gold deposits", "now": "Only Short Term Bank Deposits (1-3 years)", "q": ["S6-0280", "S6-0329"], "url": "https://sbi.bank.in/web/personal-banking/investments-deposits/govt-schemes/gold-banking/revamped-gold-deposit-scheme-r-gds"}, {"id": "c02", "date": "2025-01-01", "area": "Credit information", "title": "Credit reporting made fortnightly", "before": "Monthly reporting to credit bureaus", "now": "Fortnightly: 15th and last day of each month", "q": ["S9-0019"], "url": "https://www.rbi.org.in/"}]}, "content/mcq.json": {"pack": "mcq", "items": [{"id": "S1-0001", "sec": "S1", "q": "Under the DICGC deposit insurance scheme, a depositor's deposits in one insured bank, held in the same right and capacity, are covered up to:", "opts": ["₹1 lakh", "₹2 lakh", "₹5 lakh", "₹10 lakh", "₹5 lakh per account"], "ans": 2, "exp": "The cover is ₹5 lakh per depositor per bank (not per account or per branch), for principal and interest together, across all accounts held in the same right and capacity. It was raised from ₹1 lakh with effect from 4 February 2020.", "src": "DICGC Act, 1961; DICGC cover revision effective 4 Feb 2020", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://www.dicgc.org.in/"}, {"id": "S1-0002", "sec": "S1", "q": "A savings or current account is treated as inoperative when there has been no customer-induced transaction for more than:", "opts": ["1 year", "2 years", "3 years", "Over 2 years, counting interest credits as transactions", "18 months"], "ans": 1, "exp": "An account with no customer-induced transaction for over two years is classified as inoperative. Interest credited by the bank does not count as a customer-induced transaction.", "src": "RBI circular on Inoperative Accounts and Unclaimed Deposits, 1 Jan 2024", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://www.rbi.org.in/"}, {"id": "S1-0005", "sec": "S1", "q": "RBI deregulated the interest rate on savings bank deposits with effect from:", "opts": ["1 April 2010", "1 April 2011", "25 October 2011", "1 April 2016", "16 December 2019"], "ans": 2, "exp": "Banks have been free to set their savings bank rate since 25 October 2011. Conditions: a Board-approved comprehensive policy on deposit rates; a uniform rate for balances up to ₹1 lakh; and above ₹1 lakh banks may give differential rates, but must not discriminate between similar deposits of the same size accepted on the same date at any of their offices.", "src": "RBI Master Direction - Interest Rate on Deposits, 2016 (as amended)", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=10296", "tk": "SB rate deregulated: 25 Oct 2011."}, {"id": "S1-0013", "sec": "S1", "q": "Interest earned on an NRE account is:", "opts": ["Taxable at the normal slab rates", "Taxed at a flat 30%", "Exempt from income tax in India", "Taxable only above ₹50,000 a year", "Exempt only if the depositor is a resident"], "ans": 2, "exp": "Interest on NRE balances is exempt from income tax in India (Income-tax Act, 2025, Schedule IV, item 1; formerly Sec 10(4)(ii) of the 1961 Act) for an individual who is a person resident outside India under FEMA, or who is permitted by RBI to maintain the account. When the holder returns and becomes resident, RBI requires the NRE account to be redesignated as a resident account (or the funds moved to an RFC account), and the interest thereafter is taxable.", "src": "Income-tax Act, 2025 (exemption formerly Sec 10(4)(ii) of the 1961 Act)", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://indiacode.gov.in/"}, {"id": "S4-0379", "sec": "S4", "q": "For a customer classified as high risk, periodic updation of KYC must be done at least once every:", "opts": ["1 year", "2 years", "8 years", "5 years", "10 years"], "ans": 1, "exp": "Periodic KYC updation is due every 2 years for high-risk, 8 years for medium-risk and 10 years for low-risk customers.", "src": "RBI Master Direction - Know Your Customer (KYC) Direction, 2016 (as amended)", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=13141", "tk": "KYC updation: high risk 2 yrs · medium 8 yrs · low 10 yrs."}, {"id": "S1-0022", "sec": "S1", "q": "In a joint term deposit with the mandate \"Former or Survivor\", who can withdraw the matured deposit while both holders are alive?", "opts": ["Either holder", "Both holders jointly", "Only the first-named holder", "Only the second-named holder", "The first-named holder, or the second with a written mandate from the first"], "ans": 2, "exp": "Under \"Former or Survivor\", only the first-named holder can operate/withdraw the deposit on maturity while both are alive; premature withdrawal may need the signature of both. On the death of the former, the survivor receives the proceeds; payment to the survivor gives the bank a valid discharge, and the survivor holds the money as trustee for the legal heirs of the deceased.", "src": "RBI (Commercial Banks – Responsible Business Conduct) Directions, 2025 (joint deposits / settlement of claims of deceased depositors)", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasterDirections.aspx", "tk": "\"Former or Survivor\": only the first holder withdraws while both alive."}, {"id": "S1-0028", "sec": "S1", "q": "Before DICGC's Risk-Based Premium Framework took effect on 1 April 2026, the flat deposit insurance premium paid by every insured bank was:", "opts": ["5 paise per ₹100 of assessable deposits", "15 paise per ₹100", "10 paise per ₹100", "12 paise per ₹100", "25 paise per ₹100"], "ans": 3, "exp": "From 1 April 2020 the flat premium was 12 paise per ₹100 of assessable deposits (raised from 10 paise). From 1 April 2026 DICGC moved to a Risk-Based Premium Framework: 12 paise is the card rate, and better-rated banks pay less (rates vary by bank, with a vintage adjustment). The premium is borne by the bank and cannot be passed on to depositors.", "src": "DICGC Act, 1961; DICGC Risk-Based Premium Framework; DICGC Annual Report 2025-26", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://www.dicgc.org.in/", "tk": "DICGC premium: flat 12 paise per ₹100 till March 2026; risk-based from 1 Apr 2026."}, {"id": "S1-0053", "sec": "S1", "q": "The rate of interest on a recurring deposit is generally:", "opts": ["The savings bank rate", "The term deposit rate applicable for the same tenor", "Fixed by RBI for all banks", "The term deposit rate minus 1%", "Zero for the first year"], "ans": 1, "exp": "Recurring deposits are a form of term deposit, and banks usually pay the term deposit rate for the corresponding maturity.", "src": "RBI Master Direction - Interest Rate on Deposits, 2016 (as amended)", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=10296"}, {"id": "S1-0201", "sec": "S1", "q": "Under SBI's Savings Bank Rules, a minor of 10 years or more who can sign uniformly may open an account in his or her single name with a maximum balance of ____; if the minor opens a joint account with the guardian, the cap is ____.", "opts": ["₹5 lakh; ₹10 lakh", "₹10 lakh; ₹20 lakh", "₹10 lakh; no limit", "₹2 lakh; ₹5 lakh", "₹20 lakh; ₹50 lakh"], "ans": 1, "exp": "The SB Rules (abridged) cap a minor's single account at ₹10 lakh and a joint account with the guardian at ₹20 lakh. Apart from these and the small account, there is no ceiling on SB balances.", "src": "SBI website (sbi.bank.in): Savings Bank Rules (Abridged) page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/web/personal-banking/account
