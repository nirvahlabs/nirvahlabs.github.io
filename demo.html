th at least 3 months to maturity, OD up to 12 months and DL up to 3 years, processing fee 0.10% (minimum USD 100). Loan proceeds cannot be used in India.", "src": "SBI website (sbi.bank.in): International Banking - Retail Banking (GIFT City loan against FCNR(B)) page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/web/international-banking/banking/retail-banking"}, {"id": "S5-0227", "sec": "S5", "q": "On SBI's e-Forex portal (YONO Business), once a live rate is displayed, the booking must be completed within:", "opts": ["10 seconds", "30 seconds", "60 seconds", "2 minutes", "5 minutes"], "ans": 1, "exp": "Live rate valid 30 seconds. Minimum booking USD 1 / EUR 3 / GBP 3; maximum USD 5 million / EUR 3 million / GBP 3 million. Pairs: USD/INR, GBP/INR, EUR/INR, GBP/USD, EUR/USD. A booked deal cannot be deleted online; on cancellation through the branch any gain is not passed on and any loss is recovered.", "src": "SBI website (sbi.bank.in): Business - Global Markets - FAQs page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/web/business/information/global-markets"}, {"id": "S5-0243", "sec": "S5", "q": "Which remittance is NOT permitted under the Liberalised Remittance Scheme?", "opts": ["Gift to a relative abroad", "Studies abroad", "Margin or margin calls to an overseas exchange", "Maintenance of a close relative abroad", "Purchase of property abroad"], "ans": 2, "exp": "Margin or margin calls to overseas exchanges are not allowed under LRS. Also barred: items prohibited under Schedule I or restricted under Schedule II of the Current Account Transaction Rules, and capital-account remittances to countries identified by FATF as non-cooperative. LRS is open to resident individuals including minors (Form A2 signed by the natural guardian).", "src": "RBI Master Direction - Liberalised Remittance Scheme, upd. 6 Sep 2024 (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://rbi.org.in/scripts/BS_ViewMasDirections.aspx?id=10192"}, {"id": "S6-0001", "sec": "S6", "q": "Pradhan Mantri Jeevan Jyoti Bima Yojana (PMJJBY) gives a life cover of:", "opts": ["₹1 lakh", "₹2 lakh", "₹5 lakh", "₹10 lakh", "₹2.5 lakh"], "ans": 1, "exp": "PMJJBY offers ₹2 lakh life cover for death due to any cause, at an annual premium of ₹436 (revised from 1 June 2022).", "src": "PMJJBY scheme rules, revised 1 Jun 2022", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://jansuraksha.gov.in/"}, {"id": "S6-0003", "sec": "S6", "q": "Pradhan Mantri Jan Dhan Yojana (PMJDY) was launched on:", "opts": ["15 August 2014", "28 August 2014", "2 October 2014", "1 April 2015", "26 January 2015"], "ans": 1, "exp": "PMJDY was launched on 28 August 2014 to give every household access to a bank account.", "src": "PMJDY scheme document, Department of Financial Services", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://pmjdy.gov.in/"}, {"id": "S6-0009", "sec": "S6", "q": "A Sukanya Samriddhi account can be opened for a girl child below the age of:", "opts": ["5 years", "10 years", "12 years", "18 years", "8 years"], "ans": 1, "exp": "The account can be opened for a girl below 10, with deposits from ₹250 to ₹1.5 lakh a year.", "src": "Sukanya Samriddhi Account Scheme, 2019", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://www.nsiindia.gov.in/"}, {"id": "S6-0025", "sec": "S6", "q": "The annual premium for Pradhan Mantri Jeevan Jyoti Bima Yojana (PMJJBY) is:", "opts": ["₹20", "₹330", "₹436", "₹1,000", "₹456"], "ans": 2, "exp": "PMJJBY gives ₹2 lakh life cover for ₹436 a year, revised from ₹330 with effect from 1 June 2022.", "src": "PMJJBY scheme rules, revised 1 Jun 2022", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://jansuraksha.gov.in/"}, {"id": "S6-0053", "sec": "S6", "q": "A PPF account can be opened:", "opts": ["By a single person or jointly with a minor child", "Jointly by husband and wife", "Only in a single name (with a guardian for a minor)", "By an HUF", "By an NRI"], "ans": 2, "exp": "PPF accounts are single-holder only; a person can have one account, plus accounts on behalf of minors.", "src": "Public Provident Fund Scheme, 2019", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://www.nsiindia.gov.in/"}, {"id": "S6-0201", "sec": "S6", "q": "The Lead Bank Scheme was introduced in ____, and SBI has lead bank responsibility in ____ districts.", "opts": ["1969; 281", "1971; 350", "1969; 175", "1980; 275", "1975; 300"], "ans": 0, "exp": "The Lead Bank Scheme began in 1969, with the district as the basic unit. SBI is lead bank in 281 districts and convenes the SLBC in 12 States and 2 Union Territories.", "src": "SBI website (sbi.bank.in): Lead Bank Scheme & SLBC page, re-checked 24 Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/agri-rural/rural/lead-bank-scheme"}, {"id": "S6-0210", "sec": "S6", "q": "Under PM-KUSUM Component B or C financed by SBI (stand-alone solar agriculture pumps), the funding pattern for a farmer in a general-category State is:", "opts": ["CFA 30%, State 30%, farmer 10%, bank loan 30%", "CFA 50%, State 30%, farmer 10%, bank loan 10%", "CFA 30%, State 40%, farmer 10%, bank loan 20%", "CFA 60%, farmer 10%, bank loan 30%", "CFA 30%, State 30%, farmer 30%, bank loan 10%"], "ans": 0, "exp": "General States: Central Financial Assistance 30%, State 30%, farmer 10%, bank finance 30%. North-Eastern States, Sikkim, J&K, HP, Uttarakhand, Lakshadweep and A&N Islands: CFA 50% and bank finance 10%.", "src": "SBI website (sbi.bank.in): PM-KUSUM Scheme B and C page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/web/agri-rural/agriculture-banking/government-schemes/pm-kusum-scheme-b-and-c"}, {"id": "S6-0217", "sec": "S6", "q": "Under PMMY, the \"Tarun Plus\" category covers loans of ____, available to entrepreneurs who have ____.", "opts": ["Above ₹5 lakh up to ₹10 lakh; never borrowed before", "Above ₹10 lakh up to ₹20 lakh; availed and successfully repaid earlier loans under Tarun", "Above ₹10 lakh up to ₹25 lakh; a GST registration", "Above ₹20 lakh up to ₹50 lakh; Udyam registration", "Above ₹10 lakh up to ₹20 lakh; any business, first-time borrowers included"], "ans": 1, "exp": "Tarun Plus, announced in the Union Budget 2024-25 and notified in October 2024, extends MUDRA loans above ₹10 lakh up to ₹20 lakh for entrepreneurs who have availed and successfully repaid previous loans under the Tarun category.", "src": "Ministry of Finance (Department of Financial Services): Tarun Plus category under PMMY, notified October 2024 (Union Budget 2024-25)", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.mudra.org.in/"}, {"id": "S6-0221", "sec": "S6", "q": "Under the Animal Husbandry Infrastructure Development Fund (AHIDF), interest subvention of 3% a year is available for up to:", "opts": ["5 years", "7 years", "8 years", "10 years", "3 years"], "ans": 2, "exp": "AHIDF: 3% subvention for regular repayment, up to 8 years including moratorium. Contrast AIF: 3% for up to 7 years on loans up to ₹2 crore. AHIDF is run by the Department of Animal Husbandry and Dairying.", "src": "SBI website (sbi.bank.in): Agri & Rural - AHIDF page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/"}, {"id": "S6-0241", "sec": "S6", "q": "Under PMJJBY (rules w.e.f. 1 June 2022), a person enrolling in December, January or February pays a pro-rata premium of:", "opts": ["₹436", "₹342", "₹228", "₹114", "₹218"], "ans": 2, "exp": "June-August: full ₹436; September-November: ₹342; December-February: ₹228; March-May: ₹114. The cover year runs 1 June to 31 May.", "src": "Revised Rules for PMJJBY w.e.f. 01.06.2022 (PDF on SBI's Financial Inclusion page), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://jansuraksha.gov.in/"}, {"id": "S6-0264", "sec": "S6", "q": "Under PM SVANidhi (as extended), the lending period for street vendors has been extended up to:", "opts": ["31 March 2026", "31 December 2027", "31 March 2030", "31 March 2033", "31 March 2035"], "ans": 2, "exp": "Lending runs till 31 March 2030; credit guarantee, interest subsidy and digital incentives are serviced till 31 March 2033, and credit-card guarantee claims till 31 March 2035. Eligible: street vendors vending in urban areas on or before 24 March 2020.", "src": "SBI website (sbi.bank.in): Get Business Product Information - PM SVANidhi page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/get-business-product-information/pm-svanidhi"}, {"id": "S6-0270", "sec": "S6", "q": "As shown on SBI's NPS page, the minimum contribution to open an NPS Tier I account is now:", "opts": ["₹500", "₹1,000", "₹250", "₹100", "₹6,000 a year"], "ans": 2, "exp": "Minimum ₹250 at opening for Tier I and for Tier II; subsequent contributions ₹10 minimum, no maximum. (Earlier ₹500 and ₹1,000.)", "src": "SBI website (sbi.bank.in): Personal Banking - National Pension Scheme (NPS) page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/personal-banking/investments-deposits/govt-schemes/nps"}, {"id": "S6-0288", "sec": "S6", "q": "SBI processes pensions electronically through how many Centralised Pension Processing Centres (CPPCs)?", "opts": ["6", "12", "18", "22", "36"], "ans": 2, "exp": "SBI serves more than 41 lakh pensioners through 18 CPPCs. With e-PPOs, pension usually starts automatically; printed PPOs go directly to the CPPC.", "src": "SBI website (sbi.bank.in): Personal Banking - Government Business - Pension page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/web/personal-banking/information-services/government-business/pension"}, {"id": "S6-0298", "sec": "S6", "q": "Under SBI's pension payment arrangements, when is the pension for the month of March credited?", "opts": ["On the last working day of March", "Over the last four working days of March", "On or after the first working day of April", "On 15 April", "Along with May pension"], "ans": 2, "exp": "Normally pension is credited over the last four working days of each month; March pension is credited on or after the first working day of April. PPOs and arrears reaching the CPPC up to one week before month-end are paid in the same month.", "src": "SBI website (sbi.bank.in): FAQs - Centralized Pension Processing page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/faq-s/faq-centralized-pension-processing"}, {"id": "S6-0306", "sec": "S6", "q": "A person aged 57 who retired on superannuation wants to open an SCSS account. Which condition applies?", "opts": ["No condition", "Only retirement benefits can be invested, and the account must be opened within one month of receiving them", "Must wait until 60", "May invest any funds within six months", "Only with a spouse as joint holder"], "ans": 1, "exp": "Age 55-60 (retired): only retirement benefits, within one month of receipt. 60+: any source, no time limit. Retired defence personnel (not civilians): from 50. Loans against SCSS are not allowed; agents' commission was discontinued from 1 December 2011.", "src": "SBI website (sbi.bank.in): FAQs - SCSS page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/web/nri/information/faqs"}, {"id": "S6-0317", "sec": "S6", "q": "The Lead Bank Scheme (December 1969) grew out of the recommendations of the:", "opts": ["Narasimham Committee", "Gadgil Study Group and the Nariman Committee (\"area approach\")", "Tandon Committee", "Rangarajan Committee", "Khan Working Group"], "ans": 1, "exp": "The Gadgil Study Group (October 1969) proposed the area approach; the Nariman Committee (November 1969) endorsed it for public sector banks. The scheme was last reviewed comprehensively by the High Level Committee under Usha Thorat in 2009.", "src": "RBI Master Circular - Lead Bank Scheme, 1 Apr 2024 (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasCirculardetails.aspx?id=12478"}, {"id": "S7-0001", "sec": "S7", "q": "Under Section 138 of the NI Act, the payee must send a written demand to the drawer within how many days of receiving information that the cheque was dishonoured?", "opts": ["15 days", "60 days", "30 days", "45 days", "90 days"], "ans": 2, "exp": "The demand notice must go within 30 days of receiving information of dishonour. The drawer then has 15 days to pay, after which the offence is complete.", "src": "Negotiable Instruments Act, 1881, Sec 138(b)", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://indiacode.gov.in/"}, {"id": "S7-0005", "sec": "S7", "q": "Under Section 13 of the NI Act, which of the following is NOT a negotiable instrument?", "opts": ["Bill of exchange payable to bearer on demand", "Promissory note", "Bill of exchange", "Cheque", "Share certificate"], "ans": 4, "exp": "Section 13 names three negotiable instruments: promissory notes, bills of exchange and cheques, payable to order or bearer.", "src": "Negotiable Instruments Act, 1881, Sec 13", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://indiacode.gov.in/"}, {"id": "S7-0010", "sec": "S7", "q": "The punishment for dishonour of a cheque under Section 138 of the NI Act can extend to:", "opts": ["1 year's imprisonment or a fine up to twice the cheque amount", "6 months' imprisonment", "1 year's imprisonment or a fine equal to the cheque amount", "2 years' imprisonment, or a fine up to twice the cheque amount, or both", "5 years' imprisonment"], "ans": 3, "exp": "Section 138 provides for imprisonment up to two years, or a fine up to twice the amount of the cheque, or both.", "src": "Negotiable Instruments Act, 1881, Sec 138", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://indiacode.gov.in/"}, {"id": "S7-0019", "sec": "S7", "q": "The SARFAESI Act does NOT apply to a security interest created on:", "opts": ["A residential house", "A commercial shop", "Agricultural land", "Plant and machinery", "A vacant urban plot"], "ans": 2, "exp": "Section 31(i) excludes any security interest created on agricultural land.", "src": "SARFAESI Act, 2002, Sec 31(i)", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://indiacode.gov.in/"}, {"id": "S7-0033", "sec": "S7", "q": "Under Section 4 of the NI Act, a promissory note is an instrument in writing containing an unconditional undertaking by the maker to pay. A bank note or currency note is:", "opts": ["A promissory note", "A promissory note payable to bearer on demand", "Excluded from the definition", "A bill of exchange", "A cheque"], "ans": 2, "exp": "Section 4 expressly excludes bank notes and currency notes from the definition of a promissory note.", "src": "Negotiable Instruments Act, 1881, Sec 4", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://indiacode.gov.in/"}, {"id": "S7-0061", "sec": "S7", "q": "Under Section 31 of the NI Act, a drawee bank that wrongly dishonours a cheque despite sufficient funds:", "opts": ["Has no liability", "Must compensate the drawer for any loss caused", "Must compensate the payee for the cheque amount", "Must pay a fine to RBI", "Is liable to the payee only"], "ans": 1, "exp": "The paying banker is liable to the drawer for loss or damage caused by wrongful dishonour.", "src": "Negotiable Instruments Act, 1881, Sec 31", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://indiacode.gov.in/"}, {"id": "S7-0201", "sec": "S7", "q": "Under the State Bank of India Act, 1955 (as amended), the Central Government must at all times hold at least what share of SBI's issued equity capital?", "opts": ["26%", "51%", "55%", "60%", "74%"], "ans": 1, "exp": "Section 5 requires the Central Government to hold not less than 51% of the issued equity capital, and Section 10 bars transfers that would take it below 51%. The figure was 55% before the 2010 amendment, a common trap.", "src": "State Bank of India Act, 1955 (as amended), text published on SBI's website", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://indiacode.gov.in/"}, {"id": "S7-0210", "sec": "S7", "q": "A contract by which one party promises to save the other from loss caused by the conduct of the promisor himself or of any other person is a contract of:", "opts": ["Guarantee (Section 126)", "Indemnity (Section 124)", "Bailment (Section 148)", "Agency (Section 182)", "Pledge (Section 172)"], "ans": 1, "exp": "Indemnity has two parties (indemnifier and indemnity-holder); guarantee has three (creditor, principal debtor, surety). Banks take indemnities, for example, when issuing a duplicate draft or paying a deceased depositor's claim without succession papers.", "src": "Indian Contract Act, 1872, Secs 124-125", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://indiacode.gov.in/"}, {"id": "S7-0226", "sec": "S7", "q": "An endorsement reading \"Pay to Ravi only\" is a:", "opts": ["Blank endorsement", "Special (full) endorsement", "Restrictive endorsement", "Conditional endorsement", "Sans recourse endorsement"], "ans": 2, "exp": "A restrictive endorsement prohibits further negotiation. Special/full: \"Pay to Ravi or order\" (names the endorsee). Blank: only the signature. Conditional: liability depends on an event. Sans recourse: \"without recourse to me\", excluding the endorser's liability (Sec 52).", "src": "Negotiable Instruments Act, 1881", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://indiacode.gov.in/"}, {"id": "S8-0001", "sec": "S8", "q": "The Monetary Policy Committee that fixes the policy repo rate has how many members?", "opts": ["Six, of whom four are external", "Four", "Five", "Six", "Seven"], "ans": 3, "exp": "The MPC has six members: three from RBI, including the Governor who chairs it, and three external members appointed by the Central Government.", "src": "RBI Act, 1934, Sec 45ZB", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://indiacode.gov.in/"}, {"id": "S8-0004", "sec": "S8", "q": "Under the flexible inflation targeting framework first notified in 2016, the CPI inflation target was:", "opts": ["2% with a band of 1% to 3%", "4% with a band of 2% to 6%", "5% with a band of 3% to 7%", "4% with a band of 3% to 5%", "6% with a band of 4% to 8%"], "ans": 1, "exp": "The Government set the target at 4% CPI inflation, with an upper tolerance of 6% and a lower tolerance of 2%. Failure is defined as inflation outside the band for three consecutive quarters.", "src": "RBI Act, 1934, Chapter IIIF (Monetary Policy), Sec 45ZA; Government notification of 5 Aug 2016", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://indiacode.gov.in/"}, {"id": "S8-0010", "sec": "S8", "q": "GST was introduced in India from:", "opts": ["1 April 2017", "1 July 2017", "1 July 2016", "1 October 2017", "1 April 2018"], "ans": 1, "exp": "GST came into force on 1 July 2017, after the Constitution (101st Amendment) Act, 2016.", "src": "Constitution (101st Amendment) Act, 2016; CGST Act, 2017", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://indiacode.gov.in/"}, {"id": "S8-0024", "sec": "S8", "q": "The external members of the Monetary Policy Committee are appointed for a term of:", "opts": ["Four years, renewable once", "Two years", "Three years", "Four years", "Five years"], "ans": 3, "exp": "External members hold office for four years and are not eligible for reappointment.", "src": "RBI Act, 1934, Sec 45ZC and 45ZE", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://indiacode.gov.in/"}, {"id": "S8-0201", "sec": "S8", "q": "SBI's vision for climate finance is a pathway to Net Zero (Scope 1, 2 and 3) by ____, which marks ____.", "opts": ["2047; 100 years of independence", "2055; the centenary of SBI's formation", "2070; India's national net-zero year", "2050; the Paris Agreement target", "2030; SBI's 75th year"], "ans": 1, "exp": "SBI aims at Net Zero across Scopes 1, 2 and 3 by 2055, the centenary of its formation in 1955. By 2030 it targets Net Zero in Scope 1 and 2 emissions. India's national target is 2070, a close distractor.", "src": "SBI website (sbi.bank.in): About ESG & CFU page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/sbi-green/about-esg-cfu"}, {"id": "S8-0205", "sec": "S8", "q": "SBI's standalone net profit for FY 2025-26 was about:", "opts": ["₹61,077 crore", "₹70,901 crore", "₹80,032 crore", "₹85,168 crore", "₹1,05,477 crore"], "ans": 2, "exp": "Standalone net profit for FY26 was ₹80,032.01 crore, up from ₹70,900.63 crore in FY25. ₹85,168 crore is the consolidated figure and ₹1,05,477 crore the standalone profit before tax.", "src": "SBI audited financial results for the quarter and year ended 31 March 2026 (standalone), SBI website", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://sbi.bank.in/web/investor-relations/investor-relations"}, {"id": "S8-0213", "sec": "S8", "q": "SBI's CHAKRA Centre of Excellence has been set up within which part of the Bank?", "opts": ["Corporate Accounts Group", "Project Finance & Structuring SBU", "Commercial Clients Group", "Global Markets Unit", "SME Business Unit"], "ans": 1, "exp": "SBI conceptualised the CHAKRA Centre of Excellence within the Project Finance & Structuring SBU to support the vision of Viksit Bharat 2047. It was launched on 31 January 2026.", "src": "SBI website (sbi.bank.in): CoE CHAKRA - Vision and Ambition of CoE page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/web/coe-chakra/vision-and-ambition-of-coe"}, {"id": "S8-0228", "sec": "S8", "q": "SBI's stated Vision is:", "opts": ["To be the most trusted bank of every Indian", "Be the Bank of Choice for a Transforming India", "Banking for a Viksit Bharat 2047", "The Banker to Every Indian", "Pure Banking, Nothing Else"], "ans": 1, "exp": "Vision: \"Be the Bank of Choice for a Transforming India\". Mission: committed to providing simple, responsive and innovative financial solutions. Values: Service, Transparency, Ethics, Politeness, Sustainability. \"The banker to every Indian\" is the tagline.", "src": "SBI website (sbi.bank.in): About Us page (Vision Mission Values, Awards, Coffee Table Book tabs), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://sbi.bank.in/web/about-us"}, {"id": "S8-0242", "sec": "S8", "q": "SBI Life Insurance was incorporated in ____ and registered with IRDAI in ____.", "opts": ["October 2000; March 2001", "March 2001; October 2001", "October 1999; March 2000", "April 2000; December 2000", "October 2001; March 2002"], "ans": 0, "exp": "SBI Life was incorporated in October 2000 and registered with IRDAI in March 2001. SBI General Insurance was established in 2009.", "src": "SBI website (sbi.bank.in): Affiliates - Subsidiaries/Joint Ventures and Foreign Subsidiaries page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/affiliates"}, {"id": "S8-0266", "sec": "S8", "q": "At the Q1FY27 analyst meet (August 2026), SBI's Chairman gave a credit-growth guidance for FY27 of:", "opts": ["10-12%", "12-13%", "14-15%", "16-18%", "20% plus"], "ans": 2, "exp": "The Chairman reaffirmed 14-15% credit growth, anchored on nominal GDP growth of about 12-12.5% with SBI growing 2-3% faster (in May 2026 the guidance had been 13-15%). Other guidance: full-year domestic NIM of about 3%, credit cost about 50 bps, ROA above 1%.", "src": "SBI Q1FY27 analyst meet transcript, 7 Aug 2026 (Chairman's remarks), SBI website - Investor Relations", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/investor-relations/investor-relations"}, {"id": "S8-0288", "sec": "S8", "q": "In its policy of 7 October 2026, RBI's Monetary Policy Committee:", "opts": ["Cut the repo rate by 25 bps to 5.25%", "Raised the repo rate by 25 bps to 5.50%, the first hike in about four years", "Kept the repo rate unchanged at 5.50%", "Raised the repo rate by 50 bps to 6.00%", "Raised CRR by 50 bps"], "ans": 1, "exp": "The MPC unanimously raised the repo rate by 25 bps to 5.50%, the first hike since 8 February 2023, and changed the stance from neutral to \"calibrated tightening\" (two external members preferred neutral).", "src": "SBI Research, Ecowrap 7 Oct 2026: \"RBI Policy: 25 bps rate hike\", SBI website - Research Desk", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://sbi.bank.in/documents/13958/14472/07102026_Ecowrap_20261007.pdf/adde856e-cf32-885d-cccd-796f9ae5ec6e"}, {"id": "S8-0299", "sec": "S8", "q": "SBI CHAKRA Centre of Excellence was inaugurated in January 2026 by:", "opts": ["The Union Finance Minister", "Shri M. Nagaraju, Secretary, Department of Financial Services", "The RBI Governor", "The Prime Minister", "The SBI Chairman alone"], "ans": 1, "exp": "It was inaugurated in Mumbai by DFS Secretary M. Nagaraju, with CNBC-TV18 as media partner. He said CHAKRA will enable co-lending and risk-sharing across public sector banks, and cited India's ambition of a USD 30 trillion economy with manufacturing at 25% of GDP by 2047.", "src": "SBI website (sbi.bank.in): CoE CHAKRA - Past Events - SBI Chakra Launch, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/web/coe-chakra/events-and-conferences/past-events/sbi-chakra-launch"}, {"id": "S8-0317", "sec": "S8", "q": "Under SBI's Climate Change Risk Management Policy, the time horizons used for climate risks and opportunities are:", "opts": ["Short up to 1 year, medium 1-5 years, long above 5 years", "Short up to 3 years, medium 3 to 10 years, long above 10 years", "Short up to 5 years, medium 5-15, long above 15", "Short up to 2 years, medium 2-7, long above 7", "Single horizon of 2030"], "ans": 1, "exp": "Climate risk reaches the bank through physical risks (acute: extreme weather; chronic: long-term change) and transition risks (policy, technology, preferences). Approach follows TCFD, BCBS and NGFS; stress tests use NGFS scenarios. Policy reviewed biennially by the Central Board.", "src": "SBI document on sbi.bank.in: Climate Change Risk Management Policy V3 (abridged), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/documents/17826/21183/291024-Climate+Change+Risk+Management+Policy+V3+-+Abridged+Final.pdf/f99bb5a2-98f3-9393-f4db-645936fde8b8"}, {"id": "S8-0321", "sec": "S8", "q": "Under SBI's Whistle Blower Policy, the investigation of a complaint must be completed within:", "opts": ["30 days, with no extension", "60 days", "90 days of receipt, failing which an interim report with a tentative completion date is mandatory", "6 months", "45 days, extendable by the ACB"], "ans": 2, "exp": "Investigation of a whistle-blower complaint must be completed within 90 days of receipt; if not, an interim report with a tentative completion date is mandatory. The policy is reviewed every year.", "src": "SBI document on sbi.bank.in: Whistle Blower Policy (ver 6.0), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/webfiles/uploads/files_2425/Whistle%20Blower%20%20Policy-2024.pdf"}, {"id": "S8-0331", "sec": "S8", "q": "As on 30 June 2026 (Q1FY27), SBI's Gross NPA and Net NPA ratios were:", "opts": ["1.83% and 0.47%", "1.47% and 0.38%", "1.57% and 0.39%", "1.49% and 0.37%", "2.07% and 0.53%"], "ans": 1, "exp": "Described by SBI as its lowest NPA ratios in over two decades. Credit cost 0.27%, PCR 74.20% (91.82% including AUCA), slippage ratio 0.57%. A year earlier (June 2025) GNPA was 1.83% and NNPA 0.47%.", "src": "SBI Q1FY27 analyst presentation on sbi.bank.in (Investor Relations), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://sbi.bank.in/web/investor-relations/investor-relations"}, {"id": "S8-0335", "sec": "S8", "q": "The discipline \"ABCD\", institutionalised by SBI in FY 2026 to strengthen CASA mobilisation, stands for:", "opts": ["Always Be Customer-Driven", "All Branches to Contribute to Deposits", "Assets, Borrowings, Capital, Deposits", "Account-Based Customer Development", "Aggressive Branch-level CASA Drive"], "ans": 1, "exp": "The idea: every branch, whatever its size or location, adds to the deposit base, making deposit growth more granular and resilient. In FY 2026 deposits grew 11.03% to ₹59.76 lakh crore and CASA 9.53% to ₹22.62 lakh crore (CASA ratio 39.46%), with SB deposits growing fastest in four years.", "src": "SBI Annual Report 2025-26, Chairman's Message (sbi.bank.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/investor-relations/annual-report"}, {"id": "S8-0342", "sec": "S8", "q": "SBI's sustainability target for green advances is at least ____ of gross domestic advances by ____; at 31 March 2026 the share was ____.", "opts": ["5%; 2030; 2.83%", "7.5%; 2030; 2.83%", "7.5%; 2047; 4.5%", "10%; 2035; 2.83%", "7.5%; 2055; 1.9%"], "ans": 1, "exp": "Other targets: carbon neutrality in internal operations (Scope 1 and 2) by 2030; 100% renewable energy across corporate offices and ATMs by 2030; Net Zero (Scope 1, 2 and 3) by 2055, SBI's centenary year. Do not mix up 7.5% green with the 7.5% PSL sub-target for micro enterprises.", "src": "SBI Sustainability Report FY 2025-26 (sbi.bank.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/investor-relations/annual-report"}, {"id": "S9-0001", "sec": "S9", "q": "A term loan becomes a non-performing asset when interest or instalment remains overdue for more than:", "opts": ["30 days", "60 days", "90 days", "90 days, counted from the date of sanction", "180 days"], "ans": 2, "exp": "Under the IRAC norms, a term loan is an NPA when interest or instalment remains overdue for more than 90 days.", "src": "RBI Master Circular, Prudential norms on Income Recognition, Asset Classification and Provisioning", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasterCirculars.aspx"}, {"id": "S9-0004", "sec": "S9", "q": "Asset classification of a borrower with several facilities at the same bank is done:", "opts": ["Account-wise, except for agricultural loans", "Facility-wise", "Borrower-wise", "Branch-wise", "Security-wise"], "ans": 2, "exp": "If any one facility of a borrower becomes NPA, all facilities granted by the bank to that borrower are treated as NPA.", "src": "RBI Master Circular - Prudential norms on Income Recognition, Asset Classification and Provisioning", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasterCirculars.aspx"}, {"id": "S9-0013", "sec": "S9", "q": "An award passed by a Lok Adalat is:", "opts": ["Appealable to the High Court", "Appealable to the DRT", "Appealable to the District Court within 30 days", "Deemed to be a decree of a civil court, final and not appealable", "Only advisory"], "ans": 3, "exp": "Under Section 21 of the Legal Services Authorities Act, a Lok Adalat award is deemed a civil court decree, is final and binding, and no appeal lies against it.", "src": "Legal Services Authorities Act, 1987, Sec 21", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://indiacode.gov.in/"}, {"id": "S9-0020", "sec": "S9", "q": "The provision on the secured portion of a doubtful asset that has been doubtful for more than one year and up to three years (D2) is:", "opts": ["25%", "50%", "40%", "75%", "100%"], "ans": 2, "exp": "Secured portion: D1 25%, D2 40%, D3 100%. The unsecured portion needs 100% in all doubtful categories.", "src": "RBI Master Circular - Prudential norms on Income Recognition, Asset Classification and Provisioning", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasterCirculars.aspx"}, {"id": "S9-0049", "sec": "S9", "q": "Under RBI's wilful defaulter direction, \"diversion of funds\" includes:", "opts": ["Using working capital funds for creating long-term assets or for purposes other than those sanctioned", "Paying statutory dues out of the cash credit account", "Repaying another lender on time", "Paying salaries", "Buying raw material"], "ans": 0, "exp": "Diversion covers use of funds for purposes other than sanctioned, such as short-term funds for long-term assets or investment in other companies.", "src": "RBI Master Direction on Treatment of Wilful Defaulters and Large Defaulters, 30 Jul 2024", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=12946&Mode=0"}, {"id": "S9-0324", "sec": "S9", "q": "A public sector bank detects a fraud of ₹8 crore. Under RBI's 2024 fraud directions it must be reported to:", "opts": ["State/UT Police", "The Central Bureau of Investigation (CBI)", "The Serious Fraud Investigation Office only", "The Enforcement Directorate", "The RBI Ombudsman"], "ans": 1, "exp": "PSBs and RRBs: below ₹6 crore to State/UT Police; ₹6 crore and above to the CBI. Private and foreign banks: below ₹1 crore to State/UT Police; ₹1 crore and above to State/UT Police and also the SFIO (in FMR format). FMR to RBI within 14 days of classification, whatever the amount.", "src": "RBI Master Direction - Fraud Risk Management in Commercial Banks (including RRBs) and AIFIs Directions, 2024 (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=12702"}, {"id": "S9-0329", "sec": "S9", "q": "Under RBI's Asset Classification, Provisioning and Income Recognition Directions, 2026, banks move to expected-credit-loss (ECL) provisioning from:", "opts": ["1 April 2026", "1 October 2026", "1 April 2027", "1 April 2028", "1 April 2030"], "ans": 2, "exp": "The directions add a three-stage ECL framework while retaining the existing norms for classifying NPAs (the 90-day overdue test). On 1 April 2027 banks must fair-value their entire loan portfolio; loans outstanding on 31 March 2027 must move to the effective interest rate (EIR) method by 31 March 2030.", "src": "RBI (Commercial Banks - Asset Classification, Provisioning and Income Recognition) Directions, 2026, effective 1 Apr 2027 (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=13400"}, {"id": "S9-0335", "sec": "S9", "q": "Under RBI's framework for resolution of stressed assets, once a borrower is in default with any lender, lenders must make a prima facie review of the account within a \"Review Period\" of:", "opts": ["15 days", "30 days", "60 days", "90 days", "180 days"], "ans": 1, "exp": "During the 30-day Review Period, lenders decide the resolution strategy; where a plan is pursued for a borrower with multiple lenders, they sign an inter-creditor agreement. For accounts above the specified exposure threshold, the plan must be implemented within 180 days from the end of the Review Period, failing which additional provisions apply.", "src": "RBI Prudential Framework for Resolution of Stressed Assets (7 June 2019), consolidated in the RBI (Commercial Banks - Resolution of Stressed Assets) Directions, 2025 (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=11580"}, {"id": "S9-0339", "sec": "S9", "q": "Under RBI's Credit Information Reporting Directions (as amended from 1 July 2026), data rejected by a CIC must be corrected and re-submitted by the credit institution:", "opts": ["Within 3 days", "Within 7 days", "Before or along with its submission for the next reporting date", "Within 21 days", "Only at the year-end"], "ans": 2, "exp": "The amended Directions (effective 1 July 2026) do not set a fixed number of days: the credit institution must rectify rejected data and re-submit it before, or along with, its submission for the next reporting reference date. CICs share their validation logic so that rejections are minimised.", "src": "RBI (Commercial Banks – Credit Information Reporting) Amendment Directions, 2025", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=12764"}, {"id": "S9-0344", "sec": "S9", "q": "Under RBI's Wilful Defaulters Directions, 2024, a wilful defaulter whose name has been removed from the List of Wilful Defaulters (LWD) remains barred from additional credit facilities from lenders for ____ after removal, and from credit for new ventures for ____ after removal.", "opts": ["6 months; 3 years", "1 year; 5 years", "2 years; 5 years", "1 year; 3 years", "3 years; 7 years"], "ans": 1, "exp": "While listed, no lender may grant additional credit to the wilful defaulter or to any entity with which it is associated. These restrictions on further financial accommodation apply to ALL entities regulated by RBI, not just \"lenders\" as defined.", "src": "RBI (Treatment of Wilful Defaulters and Large Defaulters) Directions, 2024, as carried into the 2025 Directions (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=12946&Mode=0"}, {"id": "S9-0347", "sec": "S9", "q": "A cash credit account is treated as 'out of order' (and hence NPA) when:", "opts": ["The balance is within the limit and credits cover interest", "The outstanding stays continuously above the limit/drawing power for 90 days, or (within limits) there are no credits for 90 days or credits do not cover the interest debited", "The borrower changes address", "One cheque is returned", "The stock statement is delayed by 15 days"], "ans": 1, "exp": "A CC/OD account is out of order if the outstanding remains continuously above the sanctioned limit or drawing power for 90 days; or, where it is within limits, there are no credits continuously for 90 days, or credits during that period are not enough to cover the interest debited. Such an account is NPA. Term loans become NPA when interest or instalment is overdue for more than 90 days.", "src": "RBI Master Circular - Prudential norms on Income Recognition, Asset Classification and Provisioning (in force until the 2026 ECL Directions take effect on 1 Apr 2027)", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=13400"}, {"id": "S9-0357", "sec": "S9", "q": "A borrower has current assets of ₹100 lakh and current liabilities (other than bank borrowings) of ₹40 lakh. MPBF under the FIRST method of lending is:", "opts": ["₹30 lakh", "₹35 lakh", "₹45 lakh", "₹60 lakh", "₹75 lakh"], "ans": 2, "exp": "First method: MPBF = 75% of the working capital gap = 0.75 x (100 - 40) = ₹45 lakh (borrower funds 25% of the gap). Second method: MPBF = 75% of current assets - other current liabilities = 75 - 40 = ₹35 lakh.", "src": "Tandon Committee (1975) and Chore Committee norms; Nayak Committee (1992) norms adopted by RBI for MSE working capital", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3}, {"id": "S10-0101", "sec": "S10", "q": "Consider the statements on periodic updation of KYC for individual customers:\nI. High-risk customers: at least once every 2 years\nII. Medium-risk customers: at least once every 8 years\nIII. Low-risk customers: at least once every 5 years\nWhich are correct?", "opts": ["I and II only", "II and III only", "I and III only", "I, II and III", "I only"], "ans": 0, "exp": "Periodic updation is 2 / 8 / 10 years for high / medium / low risk. Statement III is wrong: low-risk customers are updated at least once every 10 years.", "src": "RBI Master Direction - Know Your Customer (KYC) Direction, 2016 (as amended)", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=13141"}, {"id": "S10-0113", "sec": "S10", "q": "As per RBI's 2024 directions on fraud risk management, before declaring an account as fraud, a bank must issue a show-cause notice and allow the person a reply period of not less than:", "opts": ["7 days", "15 days", "21 days", "30 days", "45 days"], "ans": 2, "exp": "The 2024 directions build in natural justice, following the Supreme Court in SBI v. Rajesh Agarwal (2023): a detailed show-cause notice, at least 21 days to reply, and a reasoned order.", "src": "RBI Master Directions on Fraud Risk Management in Commercial Banks (including RRBs), 15 July 2024", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=12702"}, {"id": "S10-0121", "sec": "S10", "q": "A savings account holder (not BSBD) reports an unauthorised internet-banking debit on the 6th working day after receiving the bank's alert. The fraud arose from a third-party breach, with no fault of the bank or the customer. The customer's maximum liability is:", "opts": ["Zero", "₹5,000", "₹10,000", "₹25,000", "₹15,000"], "ans": 2, "exp": "Reported within 4 to 7 working days (third-party breach): limited liability, the transaction value or a cap, whichever is lower. The cap is ₹5,000 for BSBD accounts and ₹10,000 for other savings accounts (higher, up to ₹25,000, for certain current/business accounts and high-limit cards). Reported within 3 working days, liability would be zero.", "src": "RBI circular: Customer Protection - Limiting Liability of Customers in Unauthorised Electronic Banking Transactions, 6 July 2017", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://www.rbi.org.in/"}, {"id": "S10-0181", "sec": "S10", "q": "Under RBI's KYC Directions, 2025, which statement about the PMLA \"Designated Director\" and \"Principal Officer\" is correct?", "opts": ["One person may hold both posts", "The Principal Officer must NOT be nominated as Designated Director, and the details of both must be sent to FIU-IND and RBI", "Only the Principal Officer is reported to FIU-IND", "The Designated Director is appointed by FIU-IND", "A branch manager is the Designated Director for the branch"], "ans": 1, "exp": "The Designated Director (MD or a whole-time director nominated by the Board) ensures overall PMLA compliance. The Principal Officer, at management level, is responsible for monitoring transactions and furnishing information to FIU-IND under Rule 8 of the PML Rules.", "src": "RBI (Commercial Banks - Know Your Customer) Directions, 2025, updated 1 Oct 2026 (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=13141"}, {"id": "S10-0189", "sec": "S10", "q": "Under RBI's currency management directions, surprise verification of currency chest balances must be done:", "opts": ["Only by RBI", "At bimonthly intervals by officials not connected with chest operations, and six-monthly by officials from the Controlling Office", "Once a year by the branch manager", "Monthly by the joint custodians themselves", "Only during statutory audit"], "ans": 1, "exp": "Non-conduct of these surprise verifications attracts a penalty of ₹5,000 per instance (₹10,000 on repetition). Joint custodians cannot verify their own chest.", "src": "RBI Master Direction on Incentives for Currency Distribution and Exchange and Penalties, 1 Apr 2026 (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=13360"}, {"id": "S10-0201", "sec": "S10", "q": "Under SBI's customer rights policy, a customer who is not satisfied at the counter can ask for the complaint book, which every branch keeps with the:", "opts": ["Cashier", "Branch Manager / Service Manager", "Security guard", "Controlling office only", "Business correspondent"], "ans": 1, "exp": "Customers may first approach the Service Manager, Customer Relations Executive or Branch Manager. Complaints can also be lodged on the web-based complaint form or by e-mail, which generates a ticket number sent by SMS/e-mail.", "src": "SBI document on sbi.bank.in: Customer Rights, Grievance Redressal and Compensation Policy, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/documents/53471/263971/12052026_Customer+Rights%2CGrievance+Redressal+and+Compensation+Policy.pdf/834818f3-4529-ca6b-5203-e8f1cfd6b2d5"}, {"id": "E1-0001", "sec": "E1", "psgId": "E1-P01", "psgTitle": "Digital payments and trust", "psg": "Ten years ago, most small shopkeepers in India preferred cash. They trusted what they could hold, and a digital payment felt like a promise rather than money. Today the same shopkeepers display a QR code beside the cash box, and many customers pay for a cup of tea with their phones.\n\nThe change did not happen because people suddenly loved technology. It happened because the system proved itself, one small payment at a time. Money reached the shopkeeper's account within seconds, there was no charge for ordinary transfers, and a sound box announced each payment aloud so that the shopkeeper did not have to check the phone.\n\nTrust, however, is easier to lose than to build. Every fraud story that spreads on social media makes some users hesitant again. Banks therefore have a double task: they must keep the system fast and convenient, and they must teach customers simple habits, such as never sharing a PIN and never scanning a QR code to receive money. Convenience brought people in; only safety will keep them.", "q": "According to the passage, why did shopkeepers finally accept digital payments?", "opts": ["Because the government made cash illegal", "Because the system proved reliable through everyday use", "Because customers refused to carry cash", "Because banks paid them to use QR codes", "Because they enjoyed using new technology"], "ans": 1, "exp": "The passage says the change happened \"because the system proved itself, one small payment at a time\", not because people loved technology.", "src": "Original passage written for Unnati Promotion Prep", "asOf": "2026-10", "free": true, "lvl": 1, "status": "reviewed"}, {"id": "E1-0002", "sec": "E1", "psgId": "E1-P01", "psgTitle": "Digital payments and trust", "psg": "Ten years ago, most small shopkeepers in India preferred cash. They trusted what they could hold, and a digital payment felt like a promise rather than money. Today the same shopkeepers display a QR code beside the cash box, and many customers pay for a cup of tea with their phones.\n\nThe change did not happen because people suddenly loved technology. It happened because the system proved itself, one small payment at a time. Money reached the shopkeeper's account within seconds, there was no charge for ordinary transfers, and a sound box announced each payment aloud so that the shopkeeper did not have to check the phone.\n\nTrust, however, is easier to lose than to build. Every fraud story that spreads on social media makes some users hesitant again. Banks therefore have a double task: they must keep the system fast and convenient, and they must teach customers simple habits, such as never sharing a PIN and never scanning a QR code to receive money. Convenience brought people in; only safety will keep them.", "q": "What was the purpose of the sound box mentioned in the passage?", "opts": ["To advertise the shop", "To warn the shopkeeper about fraud", "To announce each payment so the phone need not be checked", "To print a receipt for the customer", "To connect the shop to the internet"], "ans": 2, "exp": "The sound box \"announced each payment aloud so that the shopkeeper did not have to check the phone\".", "src": "Original passage written for Unnati Promotion Prep", "asOf": "2026-10", "free": true, "lvl": 1, "status": "reviewed"}, {"id": "E1-0003", "sec": "E1", "psgId": "E1-P01", "psgTitle": "Digital payments and trust", "psg": "Ten years ago, most small shopkeepers in India preferred cash. They trusted what they could hold, and a digital payment felt like a promise rather than money. Today the same shopkeepers display a QR code beside the cash box, and many customers pay for a cup of tea with their phones.\n\nThe change did not happen because people suddenly loved technology. It happened because the system proved itself, one small payment at a time. Money reached the shopkeeper's account within seconds, there was no charge for ordinary transfers, and a sound box announced each payment aloud so that the shopkeeper did not have to check the phone.\n\nTrust, however, is easier to lose than to build. Every fraud story that spreads on social media makes some users hesitant again. Banks therefore have a double task: they must keep the system fast and convenient, and they must teach customers simple habits, such as never sharing a PIN and never scanning a QR code to receive money. Convenience brought people in; only safety will keep them.", "q": "The 'double task' of banks, as described in the passage, is to:", "opts": ["increase charges and reduce fraud", "replace cash and close branches", "keep the system convenient and teach customers safe habits", "train shopkeepers and print QR codes", "build trust and advertise on social media"], "ans": 2, "exp": "The banks \"must keep the system fast and convenient, and they must teach customers simple habits\".", "src": "Original passage written for Unnati Promotion Prep", "asOf": "2026-10", "free": true, "lvl": 2, "status": "reviewed"}, {"id": "E1-0004", "sec": "E1", "psgId": "E1-P01", "psgTitle": "Digital payments and trust", "psg": "Ten years ago, most small shopkeepers in India preferred cash. They trusted what they could hold, and a digital payment felt like a promise rather than money. Today the same shopkeepers display a QR code beside the cash box, and many customers pay for a cup of tea with their phones.\n\nThe change did not happen because people suddenly loved technology. It happened because the system proved itself, one small payment at a time. Money reached the shopkeeper's account within seconds, there was no charge for ordinary transfers, and a sound box announced each payment aloud so that the shopkeeper did not have to check the phone.\n\nTrust, however, is easier to lose than to build. Every fraud story that spreads on social media makes some users hesitant again. Banks therefore have a double task: they must keep the system fast and convenient, and they must teach customers simple habits, such as never sharing a PIN and never scanning a QR code to receive money. Convenience brought people in; only safety will keep them.", "q": "Which of the following is closest in meaning to 'hesitant' as used in the passage?", "opts": ["Confident", "Unwilling or doubtful", "Angry", "Careless", "Excited"], "ans": 1, "exp": "Fraud stories make some users unsure about paying digitally again: hesitant means doubtful or unwilling to act.", "src": "Original passage written for Unnati Promotion Prep", "asOf": "2026-10", "free": true, "lvl": 1, "status": "reviewed"}, {"id": "E1-0005", "sec": "E1", "psgId": "E1-P01", "psgTitle": "Digital payments and trust", "psg": "Ten years ago, most small shopkeepers in India preferred cash. They trusted what they could hold, and a digital payment felt like a promise rather than money. Today the same shopkeepers display a QR code beside the cash box, and many customers pay for a cup of tea with their phones.\n\nThe change did not happen because people suddenly loved technology. It happened because the system proved itself, one small payment at a time. Money reached the shopkeeper's account within seconds, there was no charge for ordinary transfers, and a sound box announced each payment aloud so that the shopkeeper did not have to check the phone.\n\nTrust, however, is easier to lose than to build. Every fraud story that spreads on social media makes some users hesitant again. Banks therefore have a double task: they must keep the system fast and convenient, and they must teach customers simple habits, such as never sharing a PIN and never scanning a QR code to receive money. Convenience brought people in; only safety will keep them.", "q": "Which sentence best states the main idea of the passage?", "opts": ["Cash will soon disappear from India.", "Shopkeepers dislike technology.", "Digital payments grew through proven reliability, but lasting trust depends on safety.", "Fraud has stopped the growth of digital payments.", "Sound boxes are the most important invention in banking."], "ans": 2, "exp": "The passage explains how reliability built trust and ends with \"Convenience brought people in; only safety will keep them.\"", "src": "Original passage written for Unnati Promotion Prep", "asOf": "2026-10", "free": true, "lvl": 2, "status": "reviewed"}, {"id": "G1-0001", "sec": "G1", "psgId": "G1-P01", "psgTitle": "The unauthorised debit", "psg": "Ramesh, a farmer, comes to the branch on Monday morning. He shows an SMS received on Saturday night: ₹18,000 has been debited from his savings account through an online transaction he never made. He has not shared his OTP or PIN with anyone and still has his debit card with him. He reported the matter to the bank's toll-free number on Sunday and has the complaint reference number.\n\nHe is worried and angry. The clerk at the counter tells him to \"come back after the bank finishes its investigation\" and turns to the next customer. Ramesh insists on meeting the officer. The officer checks the records and finds that the complaint was indeed registered on Sunday.", "q": "Under RBI's customer-protection rules, what is Ramesh's liability if the bank finds there was no negligence on his part and he reported within three working days?", "opts": ["The full ₹18,000", "Half the amount", "Zero", "₹5,000", "₹10,000"], "ans": 2, "exp": "With no negligence by the customer and reporting within three working days of the bank's communication, the customer's liability is zero.", "src": "Original case passage · rules from RBI directions (customer service, KYC, frauds, currency, lockers, Integrated Ombudsman Scheme)", "asOf": "2026-10", "free": true, "lvl": 1, "status": "reviewed"}, {"id": "G1-0002", "sec": "G1", "psgId": "G1-P01", "psgTitle": "The unauthorised debit", "psg": "Ramesh, a farmer, comes to the branch on Monday morning. He shows an SMS received on Saturday night: ₹18,000 has been debited from his savings account through an online transaction he never made. He has not shared his OTP or PIN with anyone and still has his debit card with him. He reported the matter to the bank's toll-free number on Sunday and has the complaint reference number.\n\nHe is worried and angry. The clerk at the counter tells him to \"come back after the bank finishes its investigation\" and turns to the next customer. Ramesh insists on meeting the officer. The officer checks the records and finds that the complaint was indeed registered on Sunday.", "q": "Within how many working days of the customer's report must the bank credit (shadow-reverse) the disputed amount to his account?", "opts": ["3", "5", "7", "10", "30"], "ans": 3, "exp": "RBI requires the bank to credit the amount within 10 working days of the customer reporting the unauthorised transaction.", "src": "Original case passage · rules from RBI directions (customer service, KYC, frauds, currency, lockers, Integrated Ombudsman Scheme)", "asOf": "2026-10", "free": true, "lvl": 2, "status": "reviewed"}, {"id": "G1-0003", "sec": "G1", "psgId": "G1-P01", "psgTitle": "The unauthorised debit", "psg": "Ramesh, a farmer, comes to the branch on Monday morning. He shows an SMS received on Saturday night: ₹18,000 has been debited from his savings account through an online transaction he never made. He has not shared his OTP or PIN with anyone and still has his debit card with him. He reported the matter to the bank's toll-free number on Sunday and has the complaint reference number.\n\nHe is worried and angry. The clerk at the counter tells him to \"come back after the bank finishes its investigation\" and turns to the next customer. Ramesh insists on meeting the officer. The officer checks the records and finds that the complaint was indeed registered on Sunday.", "q": "What was wrong with the clerk's response?", "opts": ["Nothing; investigation must finish first", "He should have refused to accept any complaint", "He dismissed a genuine complaint without guiding the customer or escalating it", "He should have asked Ramesh to file a police case first", "He should have closed the account"], "ans": 2, "exp": "A complaint must be heard, acknowledged and escalated; sending the customer away without help is poor service.", "src": "Original case passage · rules from RBI directions (customer service, KYC, frauds, currency, lockers, Integrated Ombudsman Scheme)", "asOf": "2026-10", "free": true, "lvl": 1, "status": "reviewed"}, {"id": "G1-0004", "sec": "G1", "psgId": "G1-P01", "psgTitle": "The unauthorised debit", "psg": "Ramesh, a farmer, comes to the branch on Monday morning. He shows an SMS received on Saturday night: ₹18,000 has been debited from his savings account through an online transaction he never made. He has not shared his OTP or PIN with anyone and still has his debit card with him. He reported the matter to the bank's toll-free number on Sunday and has the complaint reference number.\n\nHe is worried and angry. The clerk at the counter tells him to \"come back after the bank finishes its investigation\" and turns to the next customer. Ramesh insists on meeting the officer. The officer checks the records and finds that the complaint was indeed registered on Sunday.", "q": "Which national helpline should Ramesh also use to report the cyber fraud quickly?", "opts": ["100", "1930", "112", "155260", "181"], "ans": 1, "exp": "1930 is the national cyber-fraud helpline; quick reporting improves the chance of freezing the money.", "src": "Original case passage · rules from RBI directions (customer service, KYC, frauds, currency, lockers, Integrated Ombudsman Scheme)", "asOf": "2026-10", "free": true, "lvl": 1, "status": "reviewed"}, {"id": "G1-0005", "sec": "G1", "psgId": "G1-P01", "psgTitle": "The unauthorised debit", "psg": "Ramesh, a farmer, comes to the branch on Monday morning. He shows an SMS received on Saturday night: ₹18,000 has been debited from his savings account through an online transaction he never made. He has not shared his OTP or PIN with anyone and still has his debit card with him. He reported the matter to the bank's toll-free number on Sunday and has the complaint reference number.\n\nHe is worried and angry. The clerk at the counter tells him to \"come back after the bank finishes its investigation\" and turns to the next customer. Ramesh insists on meeting the officer. The officer checks the records and finds that the complaint was indeed registered on Sunday.", "q": "What is the best immediate action for the officer?", "opts": ["Ask Ramesh to wait a month", "Block the card and online access, record the complaint, and start the shadow-reversal process", "Tell him to approach the RBI Ombudsman straight away", "Close the account and open a new one", "Ask him to give his PIN to check the transaction"], "ans": 1, "exp": "The officer should prevent further loss, record the complaint and follow the customer-protection timelines.", "src": "Original case passage · rules from RBI directions (customer service, KYC, frauds, currency, lockers, Integrated Ombudsman Scheme)", "asOf": "2026-10", "free": true, "lvl": 2, "status": "reviewed"}, {"id": "P1-0001", "sec": "P1", "q": "A savings account had ₹50,000 for 30 days and ₹80,000 for the next 61 days of a quarter. At 3% p.a., interest for the quarter (daily product, 365 days) is about:", "opts": ["₹524", "₹600", "₹480", "₹656", "₹437"], "ans": 0, "exp": "(50,000 × 30 + 80,000 × 61) = 63,80,000 rupee-days × 3% ÷ 365 = ₹524.38, so about ₹524.", "src": "Original problem · interest calculated on daily product, 365-day year (RBI deposit interest directions)", "asOf": "2026-10", "free": true, "lvl": 2, "status": "reviewed"}, {"id": "P1-0002", "sec": "P1", "q": "A demand loan of ₹50,000 at 10% p.a. is repaid after 73 days. Simple interest payable is:", "opts": ["₹500", "₹1,000", "₹1,250", "₹5,000", "₹730"], "ans": 1, "exp": "50,000 × 10% × 73 ÷ 365 = ₹1,000.", "src": "Original problem · interest calculated on daily product, 365-day year (RBI deposit interest directions)", "asOf": "2026-10", "free": true, "lvl": 1, "status": "reviewed"}, {"id": "P1-0003", "sec": "P1", "q": "A cash credit account had an average debit balance of ₹4,00,000 for a 30-day month. At 12% p.a., interest for the month is about:", "opts": ["₹4,000", "₹3,945", "₹4,800", "₹3,600", "₹4,380"], "ans": 1, "exp": "4,00,000 × 12% × 30 ÷ 365 = ₹3,945.21.", "src": "Original problem · interest calculated on daily product, 365-day year (RBI deposit interest directions)", "asOf": "2026-10", "free": true, "lvl": 2, "status": "reviewed"}, {"id": "IT1-0001", "sec": "IT1", "q": "In banking, \"CBS\" stands for:", "opts": ["Central Branch System", "Core Banking Solution", "Computerised Book System", "Customer Billing Service", "Common Bank Switch"], "ans": 1, "exp": "Core Banking Solution: all branches work on one centralised database in a data centre, so a customer can transact at any branch (\"anywhere banking\"). Accounts are no longer branch-bound.", "src": "Standard computer and banking-technology concept", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1}, {"id": "IT1-0002", "sec": "IT1", "q": "In a CBS environment, the principle that one person enters a transaction and another authorises it is called:", "opts": ["Single sign-on", "Maker-checker (dual control)", "Round robin", "Mirroring", "Batch processing"], "ans": 1, "exp": "Maker-checker separates entry and authorisation, reducing errors and fraud. Users must never share passwords, since every entry is logged against the user ID.", "src": "Standard computer and banking-technology concept", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1}, {"id": "B2-0001", "sec": "B2", "q": "SBI's administrative structure in India consists of the Corporate Centre in Mumbai and how many Local Head Offices (Circles)?", "opts": ["12", "14", "17", "21", "24"], "ans": 2, "exp": "Corporate Centre (Mumbai), 17 Local Head Offices and about 101 Zonal Offices oversee the branch network in India and abroad.", "src": "SBI website (sbi.bank.in): administrative structure (Contact Us) and Grievance Redressal Cells at Local Head Offices pages, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://sbi.bank.in/web/customer-care/citizens-charter/addresses-and-helpline-nos-of-grievances-redressal-cell-at-local-head-offices"}, {"id": "B2-0002", "sec": "B2", "q": "Below SBI's 17 Local Head Offices, about how many Zonal Offices are spread across important cities?", "opts": ["51", "75", "101", "150", "210"], "ans": 2, "exp": "About 101 Zonal Offices; below them Regional Business Offices (RBOs) supervise branches.", "src": "SBI website (sbi.bank.in): administrative structure (Contact Us) and Grievance Redressal Cells at Local Head Offices pages, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/"}]}, "content/descriptive.json": {"pack": "descriptive", "items": [{"id": "RAT-0001", "type": "RAT", "q": "The nominee is not required to sign the nomination form for a deposit account.", "ans": "• The nominee is not a party to the deposit contract, so the nominee's consent or signature is not required.\n• Nomination is the act of the depositor(s) under Sec 45ZA of the BR Act and the Banking Companies (Nomination) Rules, 2025: the form is signed (or e-authenticated) by the depositor(s); a thumb impression must be attested by two witnesses.\n• The nominee may be a minor, or may live elsewhere; for a minor nominee the depositor may appoint a person to receive the amount during minority.\n• The nominee only receives the money as trustee of the legal heirs; the nomination gives the bank a valid discharge.\n• Note: the nominee's name is now shown on the passbook/statement/term deposit receipt (with the customer's consent), so nomination is no longer kept confidential.\nHence the bank obtains only the depositor(s)' signature, not the nominee's.", "src": "Original model answer · BR Act 1949, Sec 45ZA; Banking Companies (Nomination) Rules, 2025; RBI Nomination Facility Directions, 2025", "asOf": "2026-10", "free": true, "status": "reviewed"}, {"id": "RAT-1001", "type": "RAT", "q": "Staff in sensitive positions must take compulsory leave every year.", "ans": "• RBI requires banks to identify sensitive positions/areas of operation under a Board-approved policy and send staff posted there on mandatory leave of at least 10 working days in one spell every year.\n• The leave is given without prior notice to the employee, and during it the employee must have no access to the bank's work resources (physical or system access), except routine internal e-mail.\n• It is an operational-risk and preventive-vigilance measure: when another official handles the seat, irregularities concealed by the incumbent come to light.\n• Compliance is checked by the bank's audit and by RBI's supervisory review.\n• It also reduces dependence on one person and builds back-up and job rotation.\nHence strict compliance protects both the Bank and its staff.", "src": "Original model answer · RBI, Mandatory Leave for Employees Posted in Sensitive Positions or Areas of Operation (9 Jul 2021); RBI (Commercial Banks – Miscellaneous) Directions, 2025", "asOf": "2026-10", "free": true, "status": "reviewed"}, {"id": "RAT-2001", "type": "RAT", "q": "Banks must give every retail and MSME borrower a Key Fact Statement before the loan agreement is signed.", "ans": "• RBI requires all regulated entities to give a Key Facts Statement (KFS) to prospective borrowers of all retail and MSME term loans sanctioned on or after 1 October 2024, before the loan contract is executed.\n• It gives, in a standard format, the Annual Percentage Rate (APR) covering interest and all fees/charges, plus the repayment schedule.\n• Charges not stated in the KFS cannot be levied later without the borrower's explicit consent.\n• Credit card receivables are exempt.\n• Lets customers compare offers and reduces disputes later.\nHence the KFS makes lending transparent.", "src": "Original model answer · RBI circular, Key Facts Statement (KFS) for Loans & Advances, 15 Apr 2024", "asOf": "2026-10", "free": true, "status": "reviewed"}, {"id": "RAT-2006", "type": "RAT", "q": "A customer must give PAN, or Form 60 if he has no PAN, when opening a deposit account or depositing cash of more than ₹50,000 in a day.", "ans": "• Required by the Income-tax Rules (formerly Rule 114B) for specified transactions.\n• Links high-value transactions to the customer's tax record, discouraging tax evasion and unaccounted cash.\n• Supports the bank's KYC and anti-money-laundering checks.\n• Form 60 lets genuine customers without PAN still bank, with their details on record.\nHence the rule balances access to banking with transparency.", "src": "Original model answer · Income-tax Rules (requirement formerly Rule 114B of the 1962 Rules)", "asOf": "2026-10", "free": true, "status": "reviewed"}, {"id": "FA-0001", "type": "FA", "q": "Interest should be paid on current accounts.", "ans": "FOR:\n1. Businesses keep large balances; paying interest would reward them and attract stable funds.\n2. Banks would compete on service and pricing, which benefits customers.\n3. Reduces the incentive to move idle money out of the banking system.\n\nAGAINST:\n1. RBI directions do not permit interest on current accounts; the balances are payable on demand and highly volatile.\n2. Current accounts are the cheapest source of funds; paying interest would raise the cost of funds and lending rates.\n3. Banks already give free transaction services in return for these balances.\n\nCONCLUSION:\nPaying interest would raise the cost of funds for the whole system. Customers with surplus funds can use auto-sweep facilities instead.", "src": "Original model answer · RBI Master Direction on Interest Rate on Deposits", "asOf": "2026-10", "free": true, "status": "reviewed"}, {"id": "FA-1001", "type": "FA", "q": "Farm loan waivers are good for the economy.", "ans": "FOR:\n1. Gives immediate relief to farmers hit by drought, floods or price crashes, and prevents distress sales of land.\n2. Revives rural demand, which supports the wider economy.\n3. Restores eligibility for fresh institutional credit and keeps farmers away from moneylenders.\n\nAGAINST:\n1. Damages credit discipline: borrowers who can repay wait for the next waiver (moral hazard).\n2. Strains government finances and delays reimbursement to banks.\n3. Does not fix the root causes: low productivity, poor irrigation, weak market access.\n\nCONCLUSION:\nA waiver is a short-term relief, not a reform. Targeted relief for genuine distress, with crop insurance and better market linkage, serves the economy better.", "src": "Original model answer", "asOf": "2026-10", "free": true, "status": "reviewed"}, {"id": "FA-2001", "type": "FA", "q": "Bank branches will become unnecessary in the digital age.", "ans": "FOR:\n1. Most routine transactions (transfers, bill payments, deposits, even loans) can now be done through mobile banking and UPI.\n2. Branches are costly to run; digital channels cut costs and work 24x7.\n3. Young customers rarely visit branches.\n\nAGAINST:\n1. Many customers, especially the elderly, rural and less literate, still need personal help.\n2. Complex products (home loans, MSME credit, trade finance) and dispute resolution need face-to-face advice.\n3. Branches build trust and handle cash, KYC and account-opening needs that digital channels cannot fully meet.\n\nCONCLUSION:\nBranches will become fewer and smaller, focused on advice and complex services, but they will not disappear. A mix of digital and physical channels serves customers best.", "src": "Original model answer", "asOf": "2026-10", "free": true, "status": "reviewed"}, {"id": "FA-2003", "type": "FA", "q": "Banks should charge customers for cash transactions at branches.", "ans": "FOR:\n1. Handling cash is costly for banks (staff time, security, transport).\n2. Charges would nudge customers to cheaper digital channels.\n3. The cost of cash is now borne by all customers, including those who never use it.\n\nAGAINST:\n1. Many customers, such as small traders, the elderly and rural people, depend on cash.\n2. Charges would hurt financial inclusion and push people to informal channels.\n3. Customer goodwill and deposits may be lost to competitors.\n\nCONCLUSION:\nA few free cash transactions should remain for every customer, with reasonable charges beyond that, while digital options are actively promoted.", "src": "Original model answer", "asOf": "2026-10", "free": true, "status": "reviewed"}, {"id": "SIT-1001", "type": "SIT", "q": "A gold loan borrower has died. His widow asks the branch to return the pledged ornaments so that she can pay hospital bills. How will you handle the request?", "ans": "1. Facts: the borrower has died; his widow wants the pledged ornaments back to pay hospital dues.\n2. Issue: can the ornaments be released to her?\n3. Legal position: the ornaments are pledged security (Sec 172, Contract Act) and can be released only when the loan is repaid in full, and then only to the person entitled to them: the nominee, if any, or the legal heirs.\n4. Action:\n a) Express sympathy and explain the position politely.\n b) Ask her to repay the loan (from her own funds or the deceased's deposits after claim settlement), or the heirs may request that the bank sell the ornaments, adjust the dues and pay the surplus to them.\n c) Obtain the death certificate and the claim papers under the Bank's deceased-claim procedure: legal-heir declaration, letter of disclaimer from other heirs, and indemnity.\n d) Release the ornaments to her against acknowledgement once these are complete.\n5. Conclusion: help her quickly within the rules, without releasing the security before the loan is closed.", "src": "Original model answer · Indian Contract Act, 1872, Sec 172", "asOf": "2026-10", "free": true, "status": "reviewed"}, {"id": "SIT-2001", "type": "SIT", "q": "A customer complains that ₹40,000 was debited from her savings account through UPI payments she did not make. She reports it on the same day and says she never shared her PIN or OTP. How will you handle the complaint?", "ans": "1. Facts: unauthorised UPI debits of ₹40,000, reported on the same day.\n2. Issue: the bank's and the customer's liability, and immediate protection.\n3. Rule: under RBI's 2017 directions, if a third-party breach is reported within 3 working days, the customer's liability is nil. If she is found to have shared credentials, she bears the loss until she reports it.\n4. Action:\n a) Register the complaint at once, give an acknowledgement and reference number, and block UPI and other channels on the account.\n b) Credit the amount to her account (shadow reversal) within 10 working days of her report.\n c) Advise her to report on 1930 or cybercrime.gov.in and lodge a police complaint; the bank also reports the fraud through its channels.\n d) Investigate the transaction trail with NPCI and the beneficiary banks to trace and freeze the funds.\n e) Resolve the complaint and fix liability within 90 days.\n5. Conclusion: prompt blocking, shadow credit and investigation protect the customer and limit the bank's loss.", "src": "Original model answer · RBI circular on Limiting Liability of Customers in Unauthorised Electronic Banking Transactions, 6 Jul 2017", "asOf": "2026-10", "free": true, "status": "reviewed"}, {"id": "SIT-2003", "type": "SIT", "q": "A customer phones the branch and asks you to stop payment of a cheque he issued yesterday. How will you deal with the request?", "ans": "1. Facts: an oral stop-payment request by phone.\n2. Issue: whether the bank can act on it.\n3. Position: only the drawer can stop payment, and the instruction should be in writing (or through the bank's authenticated digital channel), giving the cheque number, date, amount and payee.\n4. Action:\n a) Check at once whether the cheque has already been paid; if so, inform the customer.\n b) If not, note the request with date and time and flag the account, as a precaution, while asking the customer to confirm in writing or through net/mobile banking immediately.\n c) On receiving written confirmation, record the stop-payment in the system and recover the applicable charges.\n d) If the cheque is presented, return it with the reason \"Payment stopped by drawer\".\n5. Conclusion: acting carefully on the call protects the customer, while written confirmation protects the bank.", "src": "Original model answer · Negotiable Instruments Act, 1881, Sec 31", "asOf": "2026-10", "free": true, "status": "reviewed"}, {"id": "BC-1001", "type": "BC", "q": "As Branch Manager, write to your Regional Manager about the steps your branch has taken to move customers to digital channels.", "ans": "[Bank name]\nXYZ Branch (Branch Code ____)\nLetter No. ____/2026-27                                  Date: __.__.2026\n\nThe Regional Manager,\n[Bank name],\nRegional Business Office, ABC\n\nDear Sir/Madam,\n\nPROMOTION OF ALTERNATE DELIVERY CHANNELS (ADC) AT XYZ BRANCH\n\nWe are pleased to report the steps taken by the branch to migrate customers to Alternate Delivery Channels during the quarter.\n\n1. Desk-wise campaign: every SB/CA customer visiting the branch for routine transactions is guided to YONO, internet banking and debit card usage. ___ YONO registrations and ___ INB activations were done.\n2. Green Channel/BNA/ATM: staff help customers at the e-lobby; footfall at the cash counter has come down by __%.\n3. Merchant acquiring: ___ BHIM-the bank Pay/QR codes and ___ POS machines were placed with traders in the market area.\n4. Literacy camps were held at two colleges and one RWA to explain safe digital banking.\n\nADC transactions now form __% of total transactions, against __% last quarter. We request one additional cash deposit machine at the e-lobby to sustain this growth.\n\nWe assure you of our continued efforts.\n\nYours faithfully,\n\n(Name)\nBranch Manager\nContact No.", "src": "Original model answer", "asOf": "2026-10", "free": true, "status": "reviewed"}, {"id": "COMP-2001", "type": "COMP", "q": "Read the passage and answer the questions that follow.\n\nTen years ago, Ramesh, a vegetable seller in a small town, kept his earnings in a tin box at home. Today he receives most payments through a QR code pasted on his cart, and a business correspondent visits his lane twice a week. With a record of steady receipts in his account, he recently obtained a small working capital loan, the first in his family's history.\n\nHis story is common. The spread of basic accounts, mobile phones and low-cost digital payments has drawn millions of people into formal finance. Yet access is only the first step. Many accounts remain dormant, and new users are easy targets for fraud. A message promising a prize, or a caller claiming to be from the bank, can wipe out savings that took years to build.\n\nFor inclusion to be meaningful, people must use their accounts regularly, borrow responsibly and protect themselves. Banks, business correspondents and community groups therefore have to teach as well as serve. A customer who understands why a PIN must never be shared is worth more to the system than ten customers whose accounts lie unused.\n\nQuestions:\n1. How did Ramesh obtain his first loan?\n2. According to the passage, why is access \"only the first step\"?\n3. What role does the passage give to banks and business correspondents?\n4. What is the meaning of \"dormant\" as used in the passage?", "ans": "1. Regular receipts through his QR code built a record of steady income in his account, which helped him get a small working capital loan.\n2. Because many new accounts are not used, and new users are vulnerable to fraud; inclusion needs regular use, responsible borrowing and self-protection.\n3. They must educate customers, not only provide services, for example teaching why a PIN must never be shared.\n4. \"Dormant\" means inactive, not being used (here, accounts with no transactions).", "src": "Original model answer · original passage written for this app", "asOf": "2026-10", "free": true, "status": "reviewed"}, {"id": "COMP-2004", "type": "COMP", "q": "Read the passage and answer the questions that follow.\n\nMost digita
