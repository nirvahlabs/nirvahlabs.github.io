ision is:", "opts": ["To be the most trusted bank of every Indian", "Be the Bank of Choice for a Transforming India", "Banking for a Viksit Bharat 2047", "The Banker to Every Indian", "Pure Banking, Nothing Else"], "ans": 1, "exp": "Vision: \"Be the Bank of Choice for a Transforming India\". Mission: committed to providing simple, responsive and innovative financial solutions. Values: Service, Transparency, Ethics, Politeness, Sustainability. \"The banker to every Indian\" is the tagline.", "src": "SBI website (sbi.bank.in): About Us page (Vision Mission Values, Awards, Coffee Table Book tabs), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://sbi.bank.in/web/about-us"}, {"id": "S8-0242", "sec": "S8", "q": "SBI Life Insurance was incorporated in ____ and registered with IRDAI in ____.", "opts": ["October 2000; March 2001", "March 2001; October 2001", "October 1999; March 2000", "April 2000; December 2000", "October 2001; March 2002"], "ans": 0, "exp": "SBI Life was incorporated in October 2000 and registered with IRDAI in March 2001. SBI General Insurance was established in 2009.", "src": "SBI website (sbi.bank.in): Affiliates - Subsidiaries/Joint Ventures and Foreign Subsidiaries page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/affiliates", "tk": "SBI Life: incorporated Oct 2000; IRDAI registration Mar 2001."}, {"id": "S8-0266", "sec": "S8", "q": "At the Q1FY27 analyst meet (August 2026), SBI's Chairman gave a credit-growth guidance for FY27 of:", "opts": ["10-12%", "12-13%", "14-15%", "16-18%", "20% plus"], "ans": 2, "exp": "The Chairman reaffirmed 14-15% credit growth, anchored on nominal GDP growth of about 12-12.5% with SBI growing 2-3% faster (in May 2026 the guidance had been 13-15%). Other guidance: full-year domestic NIM of about 3%, credit cost about 50 bps, ROA above 1%.", "src": "SBI Q1FY27 analyst meet transcript, 7 Aug 2026 (Chairman's remarks), SBI website - Investor Relations", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/investor-relations/investor-relations", "checked": "2026-10-24", "tk": "SBI FY27 credit growth guidance: 14-15%."}, {"id": "S8-0288", "sec": "S8", "q": "In its policy of 7 October 2026, RBI's Monetary Policy Committee:", "opts": ["Cut the repo rate by 25 bps to 5.25%", "Raised the repo rate by 25 bps to 5.50%, the first hike in about four years", "Kept the repo rate unchanged at 5.50%", "Raised the repo rate by 50 bps to 6.00%", "Raised CRR by 50 bps"], "ans": 1, "exp": "The MPC unanimously raised the repo rate by 25 bps to 5.50%, the first hike since 8 February 2023, and changed the stance from neutral to \"calibrated tightening\" (two external members preferred neutral).", "src": "SBI Research, Ecowrap 7 Oct 2026: \"RBI Policy: 25 bps rate hike\", SBI website - Research Desk", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://sbi.bank.in/documents/13958/14472/07102026_Ecowrap_20261007.pdf/adde856e-cf32-885d-cccd-796f9ae5ec6e"}, {"id": "S8-0299", "sec": "S8", "q": "SBI CHAKRA Centre of Excellence was inaugurated in January 2026 by:", "opts": ["The Union Finance Minister", "Shri M. Nagaraju, Secretary, Department of Financial Services", "The RBI Governor", "The Prime Minister", "The SBI Chairman alone"], "ans": 1, "exp": "It was inaugurated in Mumbai by DFS Secretary M. Nagaraju, with CNBC-TV18 as media partner. He said CHAKRA will enable co-lending and risk-sharing across public sector banks, and cited India's ambition of a USD 30 trillion economy with manufacturing at 25% of GDP by 2047.", "src": "SBI website (sbi.bank.in): CoE CHAKRA - Past Events - SBI Chakra Launch, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/web/coe-chakra/events-and-conferences/past-events/sbi-chakra-launch", "tk": "CHAKRA CoE inaugurated by DFS Secretary M. Nagaraju."}, {"id": "S8-0317", "sec": "S8", "q": "Under SBI's Climate Change Risk Management Policy, the time horizons used for climate risks and opportunities are:", "opts": ["Short up to 1 year, medium 1-5 years, long above 5 years", "Short up to 3 years, medium 3 to 10 years, long above 10 years", "Short up to 5 years, medium 5-15, long above 15", "Short up to 2 years, medium 2-7, long above 7", "Single horizon of 2030"], "ans": 1, "exp": "Climate risk reaches the bank through physical risks (acute: extreme weather; chronic: long-term change) and transition risks (policy, technology, preferences). Approach follows TCFD, BCBS and NGFS; stress tests use NGFS scenarios. Policy reviewed biennially by the Central Board.", "src": "SBI document on sbi.bank.in: Climate Change Risk Management Policy V3 (abridged), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/documents/17826/21183/291024-Climate+Change+Risk+Management+Policy+V3+-+Abridged+Final.pdf/f99bb5a2-98f3-9393-f4db-645936fde8b8", "tk": "SBI climate horizons: short ≤3 · medium 3-10 · long above 10 years."}, {"id": "S10-0242", "sec": "S10", "q": "Under SBI's Whistle Blower Policy, the investigation of a complaint must be completed within:", "opts": ["30 days, with no extension", "60 days", "90 days of receipt, failing which an interim report with a tentative completion date is mandatory", "6 months", "45 days, extendable by the ACB"], "ans": 2, "exp": "Investigation of a whistle-blower complaint must be completed within 90 days of receipt; if not, an interim report with a tentative completion date is mandatory. The policy is reviewed every year.", "src": "SBI document on sbi.bank.in: Whistle Blower Policy (ver 6.0), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/webfiles/uploads/files_2425/Whistle%20Blower%20%20Policy-2024.pdf", "tk": "Whistle-blower investigation: within 90 days."}, {"id": "S8-0331", "sec": "S8", "q": "As on 30 June 2026 (Q1FY27), SBI's Gross NPA and Net NPA ratios were:", "opts": ["1.83% and 0.47%", "1.47% and 0.38%", "1.57% and 0.39%", "1.49% and 0.37%", "2.07% and 0.53%"], "ans": 1, "exp": "Described by SBI as its lowest NPA ratios in over two decades. Credit cost 0.27%, PCR 74.20% (91.82% including AUCA), slippage ratio 0.57%. A year earlier (June 2025) GNPA was 1.83% and NNPA 0.47%.", "src": "SBI Q1FY27 analyst presentation on sbi.bank.in (Investor Relations), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://sbi.bank.in/web/investor-relations/investor-relations"}, {"id": "S8-0335", "sec": "S8", "q": "The discipline \"ABCD\", institutionalised by SBI in FY 2026 to strengthen CASA mobilisation, stands for:", "opts": ["Always Be Customer-Driven", "All Branches to Contribute to Deposits", "Assets, Borrowings, Capital, Deposits", "Account-Based Customer Development", "Aggressive Branch-level CASA Drive"], "ans": 1, "exp": "The idea: every branch, whatever its size or location, adds to the deposit base, making deposit growth more granular and resilient. In FY 2026 deposits grew 11.03% to ₹59.76 lakh crore and CASA 9.53% to ₹22.62 lakh crore (CASA ratio 39.46%), with SB deposits growing fastest in four years.", "src": "SBI Annual Report 2025-26, Chairman's Message (sbi.bank.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/investor-relations/annual-report", "tk": "ABCD = All Branches to Contribute to Deposits."}, {"id": "S8-0342", "sec": "S8", "q": "SBI's sustainability target for green advances is at least ____ of gross domestic advances by ____; at 31 March 2026 the share was ____.", "opts": ["5%; 2030; 2.83%", "7.5%; 2030; 2.83%", "7.5%; 2047; 4.5%", "10%; 2035; 2.83%", "7.5%; 2055; 1.9%"], "ans": 1, "exp": "Other targets: carbon neutrality in internal operations (Scope 1 and 2) by 2030; 100% renewable energy across corporate offices and ATMs by 2030; Net Zero (Scope 1, 2 and 3) by 2055, SBI's centenary year. Do not mix up 7.5% green with the 7.5% PSL sub-target for micro enterprises.", "src": "SBI Sustainability Report FY 2025-26 (sbi.bank.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/investor-relations/annual-report", "tk": "SBI green advances: 7.5% by 2030; 2.83% in Mar 2026."}, {"id": "S9-0001", "sec": "S9", "q": "A term loan becomes a non-performing asset when interest or instalment remains overdue for more than:", "opts": ["30 days", "60 days", "90 days", "90 days, counted from the date of sanction", "180 days"], "ans": 2, "exp": "Under the IRAC norms, a term loan is an NPA when interest or instalment remains overdue for more than 90 days.", "src": "RBI Master Circular, Prudential norms on Income Recognition, Asset Classification and Provisioning", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasterCirculars.aspx"}, {"id": "S9-0004", "sec": "S9", "q": "Asset classification of a borrower with several facilities at the same bank is done:", "opts": ["Account-wise, except for agricultural loans", "Facility-wise", "Borrower-wise", "Branch-wise", "Security-wise"], "ans": 2, "exp": "If any one facility of a borrower becomes NPA, all facilities granted by the bank to that borrower are treated as NPA.", "src": "RBI Master Circular - Prudential norms on Income Recognition, Asset Classification and Provisioning", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasterCirculars.aspx"}, {"id": "S7-0342", "sec": "S7", "q": "An award passed by a Lok Adalat is:", "opts": ["Appealable to the High Court", "Appealable to the DRT", "Appealable to the District Court within 30 days", "Deemed to be a decree of a civil court, final and not appealable", "Only advisory"], "ans": 3, "exp": "Under Section 21 of the Legal Services Authorities Act, a Lok Adalat award is deemed a civil court decree, is final and binding, and no appeal lies against it.", "src": "Legal Services Authorities Act, 1987, Sec 21", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://indiacode.gov.in/"}, {"id": "S9-0020", "sec": "S9", "q": "The provision on the secured portion of a doubtful asset that has been doubtful for more than one year and up to three years (D2) is:", "opts": ["25%", "50%", "40%", "75%", "100%"], "ans": 2, "exp": "Secured portion: D1 25%, D2 40%, D3 100%. The unsecured portion needs 100% in all doubtful categories.", "src": "RBI Master Circular - Prudential norms on Income Recognition, Asset Classification and Provisioning", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasterCirculars.aspx", "tk": "D2 (doubtful 1-3 years): secured portion 40%."}, {"id": "S9-0049", "sec": "S9", "q": "Under RBI's wilful defaulter direction, \"diversion of funds\" includes:", "opts": ["Using working capital funds for creating long-term assets or for purposes other than those sanctioned", "Paying statutory dues out of the cash credit account", "Repaying another lender on time", "Paying salaries", "Buying raw material"], "ans": 0, "exp": "Diversion covers use of funds for purposes other than sanctioned, such as short-term funds for long-term assets or investment in other companies.", "src": "RBI Master Direction on Treatment of Wilful Defaulters and Large Defaulters, 30 Jul 2024", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=12946&Mode=0", "tk": "Diversion: short-term funds for long-term assets or other purposes."}, {"id": "S9-0324", "sec": "S9", "q": "A public sector bank detects a fraud of ₹8 crore. Under RBI's 2024 fraud directions it must be reported to:", "opts": ["State/UT Police", "The Central Bureau of Investigation (CBI)", "The Serious Fraud Investigation Office only", "The Enforcement Directorate", "The RBI Ombudsman"], "ans": 1, "exp": "PSBs and RRBs: below ₹6 crore to State/UT Police; ₹6 crore and above to the CBI. Private and foreign banks: below ₹1 crore to State/UT Police; ₹1 crore and above to State/UT Police and also the SFIO (in FMR format). FMR to RBI within 14 days of classification, whatever the amount.", "src": "RBI Master Direction - Fraud Risk Management in Commercial Banks (including RRBs) and AIFIs Directions, 2024 (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=12702", "tk": "PSB fraud ₹6 crore+: report to CBI (below: State Police)."}, {"id": "S9-0329", "sec": "S9", "q": "Under RBI's Asset Classification, Provisioning and Income Recognition Directions, 2026, banks move to expected-credit-loss (ECL) provisioning from:", "opts": ["1 April 2026", "1 October 2026", "1 April 2027", "1 April 2028", "1 April 2030"], "ans": 2, "exp": "The directions add a three-stage ECL framework while retaining the existing norms for classifying NPAs (the 90-day overdue test). On 1 April 2027 banks must fair-value their entire loan portfolio; loans outstanding on 31 March 2027 must move to the effective interest rate (EIR) method by 31 March 2030.", "src": "RBI (Commercial Banks - Asset Classification, Provisioning and Income Recognition) Directions, 2026, effective 1 Apr 2027 (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=13400", "tk": "ECL provisioning starts 1 April 2027."}, {"id": "S9-0335", "sec": "S9", "q": "Under RBI's framework for resolution of stressed assets, once a borrower is in default with any lender, lenders must make a prima facie review of the account within a \"Review Period\" of:", "opts": ["15 days", "30 days", "60 days", "90 days", "180 days"], "ans": 1, "exp": "During the 30-day Review Period, lenders decide the resolution strategy; where a plan is pursued for a borrower with multiple lenders, they sign an inter-creditor agreement. For accounts above the specified exposure threshold, the plan must be implemented within 180 days from the end of the Review Period, failing which additional provisions apply.", "src": "RBI Prudential Framework for Resolution of Stressed Assets (7 June 2019), consolidated in the RBI (Commercial Banks - Resolution of Stressed Assets) Directions, 2025 (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=11580", "tk": "Stressed assets: 30-day review period after default with any lender."}, {"id": "S9-0339", "sec": "S9", "q": "Under RBI's Credit Information Reporting Directions (as amended from 1 July 2026), data rejected by a CIC must be corrected and re-submitted by the credit institution:", "opts": ["Within 3 days", "Within 7 days", "Before or along with its submission for the next reporting date", "Within 21 days", "Only at the year-end"], "ans": 2, "exp": "The amended Directions (effective 1 July 2026) do not set a fixed number of days: the credit institution must rectify rejected data and re-submit it before, or along with, its submission for the next reporting reference date. CICs share their validation logic so that rejections are minimised.", "src": "RBI (Commercial Banks – Credit Information Reporting) Amendment Directions, 2025", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=12764", "tk": "Rejected credit data: correct by the next reporting date."}, {"id": "S9-0344", "sec": "S9", "q": "Under RBI's Wilful Defaulters Directions, 2024, a wilful defaulter whose name has been removed from the List of Wilful Defaulters (LWD) remains barred from additional credit facilities from lenders for ____ after removal, and from credit for new ventures for ____ after removal.", "opts": ["6 months; 3 years", "1 year; 5 years", "2 years; 5 years", "1 year; 3 years", "3 years; 7 years"], "ans": 1, "exp": "While listed, no lender may grant additional credit to the wilful defaulter or to any entity with which it is associated. These restrictions on further financial accommodation apply to ALL entities regulated by RBI, not just \"lenders\" as defined.", "src": "RBI (Treatment of Wilful Defaulters and Large Defaulters) Directions, 2024, as carried into the 2025 Directions (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=12946&Mode=0", "tk": "Removed wilful defaulter: no extra credit for 1 year; no new-venture credit for 5 years."}, {"id": "S9-0347", "sec": "S9", "q": "A cash credit account is treated as 'out of order' (and hence NPA) when:", "opts": ["The balance is within the limit and credits cover interest", "The outstanding stays continuously above the limit/drawing power for 90 days, or (within limits) there are no credits for 90 days or credits do not cover the interest debited", "The borrower changes address", "One cheque is returned", "The stock statement is delayed by 15 days"], "ans": 1, "exp": "A CC/OD account is out of order if the outstanding remains continuously above the sanctioned limit or drawing power for 90 days; or, where it is within limits, there are no credits continuously for 90 days, or credits during that period are not enough to cover the interest debited. Such an account is NPA. Term loans become NPA when interest or instalment is overdue for more than 90 days.", "src": "RBI Master Circular - Prudential norms on Income Recognition, Asset Classification and Provisioning (in force until the 2026 ECL Directions take effect on 1 Apr 2027)", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=13400"}, {"id": "S9-0357", "sec": "S9", "q": "A borrower has current assets of ₹100 lakh and current liabilities (other than bank borrowings) of ₹40 lakh. MPBF under the FIRST method of lending is:", "opts": ["₹30 lakh", "₹35 lakh", "₹45 lakh", "₹60 lakh", "₹75 lakh"], "ans": 2, "exp": "First method: MPBF = 75% of the working capital gap = 0.75 x (100 - 40) = ₹45 lakh (borrower funds 25% of the gap). Second method: MPBF = 75% of current assets - other current liabilities = 75 - 40 = ₹35 lakh.", "src": "Tandon Committee (1975) and Chore Committee norms; Nayak Committee (1992) norms adopted by RBI for MSE working capital", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "tk": "Tandon method I: MPBF = 75% of (current assets − other current liabilities)."}, {"id": "S4-0387", "sec": "S4", "q": "Consider the statements on periodic updation of KYC for individual customers:\nI. High-risk customers: at least once every 2 years\nII. Medium-risk customers: at least once every 8 years\nIII. Low-risk customers: at least once every 5 years\nWhich are correct?", "opts": ["I and II only", "II and III only", "I and III only", "I, II and III", "I only"], "ans": 0, "exp": "Periodic updation is 2 / 8 / 10 years for high / medium / low risk. Statement III is wrong: low-risk customers are updated at least once every 10 years.", "src": "RBI Master Direction - Know Your Customer (KYC) Direction, 2016 (as amended)", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=13141", "tk": "KYC updation: high 2 · medium 8 · low 10 years."}, {"id": "S10-0113", "sec": "S10", "q": "As per RBI's 2024 directions on fraud risk management, before declaring an account as fraud, a bank must issue a show-cause notice and allow the person a reply period of not less than:", "opts": ["7 days", "15 days", "21 days", "30 days", "45 days"], "ans": 2, "exp": "The 2024 directions build in natural justice, following the Supreme Court in SBI v. Rajesh Agarwal (2023): a detailed show-cause notice, at least 21 days to reply, and a reasoned order.", "src": "RBI Master Directions on Fraud Risk Management in Commercial Banks (including RRBs), 15 July 2024", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=12702", "tk": "Before fraud tag: show-cause notice, at least 21 days to reply."}, {"id": "S3-0366", "sec": "S3", "q": "A savings account holder (not BSBD) reports an unauthorised internet-banking debit on the 6th working day after receiving the bank's alert. The fraud arose from a third-party breach, with no fault of the bank or the customer. The customer's maximum liability is:", "opts": ["Zero", "₹5,000", "₹10,000", "₹25,000", "₹15,000"], "ans": 2, "exp": "Reported within 4 to 7 working days (third-party breach): limited liability, the transaction value or a cap, whichever is lower. The cap is ₹5,000 for BSBD accounts and ₹10,000 for other savings accounts (higher, up to ₹25,000, for certain current/business accounts and high-limit cards). Reported within 3 working days, liability would be zero.", "src": "RBI circular: Customer Protection - Limiting Liability of Customers in Unauthorised Electronic Banking Transactions, 6 July 2017", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://www.rbi.org.in/", "tk": "Third-party breach reported in 4-7 days: lower of value or cap."}, {"id": "S4-0403", "sec": "S4", "q": "Under RBI's KYC Directions, 2025, which statement about the PMLA \"Designated Director\" and \"Principal Officer\" is correct?", "opts": ["One person may hold both posts", "The Principal Officer must NOT be nominated as Designated Director, and the details of both must be sent to FIU-IND and RBI", "Only the Principal Officer is reported to FIU-IND", "The Designated Director is appointed by FIU-IND", "A branch manager is the Designated Director for the branch"], "ans": 1, "exp": "The Designated Director (MD or a whole-time director nominated by the Board) ensures overall PMLA compliance. The Principal Officer, at management level, is responsible for monitoring transactions and furnishing information to FIU-IND under Rule 8 of the PML Rules.", "src": "RBI (Commercial Banks - Know Your Customer) Directions, 2025, updated 1 Oct 2026 (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=13141", "tk": "Principal Officer cannot be Designated Director; both reported to FIU-IND and RBI."}, {"id": "S10-0189", "sec": "S10", "q": "Under RBI's currency management directions, surprise verification of currency chest balances must be done:", "opts": ["Only by RBI", "At bimonthly intervals by officials not connected with chest operations, and six-monthly by officials from the Controlling Office", "Once a year by the branch manager", "Monthly by the joint custodians themselves", "Only during statutory audit"], "ans": 1, "exp": "Non-conduct of these surprise verifications attracts a penalty of ₹5,000 per instance (₹10,000 on repetition). Joint custodians cannot verify their own chest.", "src": "RBI Master Direction on Incentives for Currency Distribution and Exchange and Penalties, 1 Apr 2026 (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=13360", "tk": "Chest surprise checks: bimonthly (non-chest staff); six-monthly (controller)."}, {"id": "S4-0416", "sec": "S4", "q": "Under SBI's customer rights policy, a customer who is not satisfied at the counter can ask for the complaint book, which every branch keeps with the:", "opts": ["Cashier", "Branch Manager / Service Manager", "Security guard", "Controlling office only", "Business correspondent"], "ans": 1, "exp": "Customers may first approach the Service Manager, Customer Relations Executive or Branch Manager. Complaints can also be lodged on the web-based complaint form or by e-mail, which generates a ticket number sent by SMS/e-mail.", "src": "SBI document on sbi.bank.in: Customer Rights, Grievance Redressal and Compensation Policy, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/documents/53471/263971/12052026_Customer+Rights%2CGrievance+Redressal+and+Compensation+Policy.pdf/834818f3-4529-ca6b-5203-e8f1cfd6b2d5", "tk": "SBI complaint book: with Branch Manager / Service Manager."}, {"id": "E1-0001", "sec": "E1", "psgId": "E1-P01", "psgTitle": "Digital payments and trust", "psg": "Ten years ago, most small shopkeepers in India preferred cash. They trusted what they could hold, and a digital payment felt like a promise rather than money. Today the same shopkeepers display a QR code beside the cash box, and many customers pay for a cup of tea with their phones.\n\nThe change did not happen because people suddenly loved technology. It happened because the system proved itself, one small payment at a time. Money reached the shopkeeper's account within seconds, there was no charge for ordinary transfers, and a sound box announced each payment aloud so that the shopkeeper did not have to check the phone.\n\nTrust, however, is easier to lose than to build. Every fraud story that spreads on social media makes some users hesitant again. Banks therefore have a double task: they must keep the system fast and convenient, and they must teach customers simple habits, such as never sharing a PIN and never scanning a QR code to receive money. Convenience brought people in; only safety will keep them.", "q": "According to the passage, why did shopkeepers finally accept digital payments?", "opts": ["Because the government made cash illegal", "Because the system proved reliable through everyday use", "Because customers refused to carry cash", "Because banks paid them to use QR codes", "Because they enjoyed using new technology"], "ans": 1, "exp": "The passage says the change happened \"because the system proved itself, one small payment at a time\", not because people loved technology.", "src": "Original passage written for Unnati Promotion Prep", "asOf": "2026-10", "free": true, "lvl": 1, "status": "reviewed"}, {"id": "E1-0002", "sec": "E1", "psgId": "E1-P01", "psgTitle": "Digital payments and trust", "psg": "Ten years ago, most small shopkeepers in India preferred cash. They trusted what they could hold, and a digital payment felt like a promise rather than money. Today the same shopkeepers display a QR code beside the cash box, and many customers pay for a cup of tea with their phones.\n\nThe change did not happen because people suddenly loved technology. It happened because the system proved itself, one small payment at a time. Money reached the shopkeeper's account within seconds, there was no charge for ordinary transfers, and a sound box announced each payment aloud so that the shopkeeper did not have to check the phone.\n\nTrust, however, is easier to lose than to build. Every fraud story that spreads on social media makes some users hesitant again. Banks therefore have a double task: they must keep the system fast and convenient, and they must teach customers simple habits, such as never sharing a PIN and never scanning a QR code to receive money. Convenience brought people in; only safety will keep them.", "q": "What was the purpose of the sound box mentioned in the passage?", "opts": ["To advertise the shop", "To warn the shopkeeper about fraud", "To announce each payment so the phone need not be checked", "To print a receipt for the customer", "To connect the shop to the internet"], "ans": 2, "exp": "The sound box \"announced each payment aloud so that the shopkeeper did not have to check the phone\".", "src": "Original passage written for Unnati Promotion Prep", "asOf": "2026-10", "free": true, "lvl": 1, "status": "reviewed"}, {"id": "E1-0003", "sec": "E1", "psgId": "E1-P01", "psgTitle": "Digital payments and trust", "psg": "Ten years ago, most small shopkeepers in India preferred cash. They trusted what they could hold, and a digital payment felt like a promise rather than money. Today the same shopkeepers display a QR code beside the cash box, and many customers pay for a cup of tea with their phones.\n\nThe change did not happen because people suddenly loved technology. It happened because the system proved itself, one small payment at a time. Money reached the shopkeeper's account within seconds, there was no charge for ordinary transfers, and a sound box announced each payment aloud so that the shopkeeper did not have to check the phone.\n\nTrust, however, is easier to lose than to build. Every fraud story that spreads on social media makes some users hesitant again. Banks therefore have a double task: they must keep the system fast and convenient, and they must teach customers simple habits, such as never sharing a PIN and never scanning a QR code to receive money. Convenience brought people in; only safety will keep them.", "q": "The 'double task' of banks, as described in the passage, is to:", "opts": ["increase charges and reduce fraud", "replace cash and close branches", "keep the system convenient and teach customers safe habits", "train shopkeepers and print QR codes", "build trust and advertise on social media"], "ans": 2, "exp": "The banks \"must keep the system fast and convenient, and they must teach customers simple habits\".", "src": "Original passage written for Unnati Promotion Prep", "asOf": "2026-10", "free": true, "lvl": 2, "status": "reviewed"}, {"id": "E1-0004", "sec": "E1", "psgId": "E1-P01", "psgTitle": "Digital payments and trust", "psg": "Ten years ago, most small shopkeepers in India preferred cash. They trusted what they could hold, and a digital payment felt like a promise rather than money. Today the same shopkeepers display a QR code beside the cash box, and many customers pay for a cup of tea with their phones.\n\nThe change did not happen because people suddenly loved technology. It happened because the system proved itself, one small payment at a time. Money reached the shopkeeper's account within seconds, there was no charge for ordinary transfers, and a sound box announced each payment aloud so that the shopkeeper did not have to check the phone.\n\nTrust, however, is easier to lose than to build. Every fraud story that spreads on social media makes some users hesitant again. Banks therefore have a double task: they must keep the system fast and convenient, and they must teach customers simple habits, such as never sharing a PIN and never scanning a QR code to receive money. Convenience brought people in; only safety will keep them.", "q": "Which of the following is closest in meaning to 'hesitant' as used in the passage?", "opts": ["Confident", "Unwilling or doubtful", "Angry", "Careless", "Excited"], "ans": 1, "exp": "Fraud stories make some users unsure about paying digitally again: hesitant means doubtful or unwilling to act.", "src": "Original passage written for Unnati Promotion Prep", "asOf": "2026-10", "free": true, "lvl": 1, "status": "reviewed"}, {"id": "E1-0005", "sec": "E1", "psgId": "E1-P01", "psgTitle": "Digital payments and trust", "psg": "Ten years ago, most small shopkeepers in India preferred cash. They trusted what they could hold, and a digital payment felt like a promise rather than money. Today the same shopkeepers display a QR code beside the cash box, and many customers pay for a cup of tea with their phones.\n\nThe change did not happen because people suddenly loved technology. It happened because the system proved itself, one small payment at a time. Money reached the shopkeeper's account within seconds, there was no charge for ordinary transfers, and a sound box announced each payment aloud so that the shopkeeper did not have to check the phone.\n\nTrust, however, is easier to lose than to build. Every fraud story that spreads on social media makes some users hesitant again. Banks therefore have a double task: they must keep the system fast and convenient, and they must teach customers simple habits, such as never sharing a PIN and never scanning a QR code to receive money. Convenience brought people in; only safety will keep them.", "q": "Which sentence best states the main idea of the passage?", "opts": ["Cash will soon disappear from India.", "Shopkeepers dislike technology.", "Digital payments grew through proven reliability, but lasting trust depends on safety.", "Fraud has stopped the growth of digital payments.", "Sound boxes are the most important invention in banking."], "ans": 2, "exp": "The passage explains how reliability built trust and ends with \"Convenience brought people in; only safety will keep them.\"", "src": "Original passage written for Unnati Promotion Prep", "asOf": "2026-10", "free": true, "lvl": 2, "status": "reviewed"}, {"id": "G1-0001", "sec": "G1", "psgId": "G1-P01", "psgTitle": "The unauthorised debit", "psg": "Ramesh, a farmer, comes to the branch on Monday morning. He shows an SMS received on Saturday night: ₹18,000 has been debited from his savings account through an online transaction he never made. He has not shared his OTP or PIN with anyone and still has his debit card with him. He reported the matter to the bank's toll-free number on Sunday and has the complaint reference number.\n\nHe is worried and angry. The clerk at the counter tells him to \"come back after the bank finishes its investigation\" and turns to the next customer. Ramesh insists on meeting the officer. The officer checks the records and finds that the complaint was indeed registered on Sunday.", "q": "Under RBI's customer-protection rules, what is Ramesh's liability if the bank finds there was no negligence on his part and he reported within three working days?", "opts": ["The full ₹18,000", "Half the amount", "Zero", "₹5,000", "₹10,000"], "ans": 2, "exp": "With no negligence by the customer and reporting within three working days of the bank's communication, the customer's liability is zero.", "src": "Original case passage · rules from RBI directions (customer service, KYC, frauds, currency, lockers, Integrated Ombudsman Scheme)", "asOf": "2026-10", "free": true, "lvl": 1, "status": "reviewed"}, {"id": "G1-0002", "sec": "G1", "psgId": "G1-P01", "psgTitle": "The unauthorised debit", "psg": "Ramesh, a farmer, comes to the branch on Monday morning. He shows an SMS received on Saturday night: ₹18,000 has been debited from his savings account through an online transaction he never made. He has not shared his OTP or PIN with anyone and still has his debit card with him. He reported the matter to the bank's toll-free number on Sunday and has the complaint reference number.\n\nHe is worried and angry. The clerk at the counter tells him to \"come back after the bank finishes its investigation\" and turns to the next customer. Ramesh insists on meeting the officer. The officer checks the records and finds that the complaint was indeed registered on Sunday.", "q": "Within how many working days of the customer's report must the bank credit (shadow-reverse) the disputed amount to his account?", "opts": ["3", "5", "7", "10", "30"], "ans": 3, "exp": "RBI requires the bank to credit the amount within 10 working days of the customer reporting the unauthorised transaction.", "src": "Original case passage · rules from RBI directions (customer service, KYC, frauds, currency, lockers, Integrated Ombudsman Scheme)", "asOf": "2026-10", "free": true, "lvl": 2, "status": "reviewed"}, {"id": "G1-0003", "sec": "G1", "psgId": "G1-P01", "psgTitle": "The unauthorised debit", "psg": "Ramesh, a farmer, comes to the branch on Monday morning. He shows an SMS received on Saturday night: ₹18,000 has been debited from his savings account through an online transaction he never made. He has not shared his OTP or PIN with anyone and still has his debit card with him. He reported the matter to the bank's toll-free number on Sunday and has the complaint reference number.\n\nHe is worried and angry. The clerk at the counter tells him to \"come back after the bank finishes its investigation\" and turns to the next customer. Ramesh insists on meeting the officer. The officer checks the records and finds that the complaint was indeed registered on Sunday.", "q": "What was wrong with the clerk's response?", "opts": ["Nothing; investigation must finish first", "He should have refused to accept any complaint", "He dismissed a genuine complaint without guiding the customer or escalating it", "He should have asked Ramesh to file a police case first", "He should have closed the account"], "ans": 2, "exp": "A complaint must be heard, acknowledged and escalated; sending the customer away without help is poor service.", "src": "Original case passage · rules from RBI directions (customer service, KYC, frauds, currency, lockers, Integrated Ombudsman Scheme)", "asOf": "2026-10", "free": true, "lvl": 1, "status": "reviewed"}, {"id": "G1-0004", "sec": "G1", "psgId": "G1-P01", "psgTitle": "The unauthorised debit", "psg": "Ramesh, a farmer, comes to the branch on Monday morning. He shows an SMS received on Saturday night: ₹18,000 has been debited from his savings account through an online transaction he never made. He has not shared his OTP or PIN with anyone and still has his debit card with him. He reported the matter to the bank's toll-free number on Sunday and has the complaint reference number.\n\nHe is worried and angry. The clerk at the counter tells him to \"come back after the bank finishes its investigation\" and turns to the next customer. Ramesh insists on meeting the officer. The officer checks the records and finds that the complaint was indeed registered on Sunday.", "q": "Which national helpline should Ramesh also use to report the cyber fraud quickly?", "opts": ["100", "1930", "112", "155260", "181"], "ans": 1, "exp": "1930 is the national cyber-fraud helpline; quick reporting improves the chance of freezing the money.", "src": "Original case passage · rules from RBI directions (customer service, KYC, frauds, currency, lockers, Integrated Ombudsman Scheme)", "asOf": "2026-10", "free": true, "lvl": 1, "status": "reviewed"}, {"id": "G1-0005", "sec": "G1", "psgId": "G1-P01", "psgTitle": "The unauthorised debit", "psg": "Ramesh, a farmer, comes to the branch on Monday morning. He shows an SMS received on Saturday night: ₹18,000 has been debited from his savings account through an online transaction he never made. He has not shared his OTP or PIN with anyone and still has his debit card with him. He reported the matter to the bank's toll-free number on Sunday and has the complaint reference number.\n\nHe is worried and angry. The clerk at the counter tells him to \"come back after the bank finishes its investigation\" and turns to the next customer. Ramesh insists on meeting the officer. The officer checks the records and finds that the complaint was indeed registered on Sunday.", "q": "What is the best immediate action for the officer?", "opts": ["Ask Ramesh to wait a month", "Block the card and online access, record the complaint, and start the shadow-reversal process", "Tell him to approach the RBI Ombudsman straight away", "Close the account and open a new one", "Ask him to give his PIN to check the transaction"], "ans": 1, "exp": "The officer should prevent further loss, record the complaint and follow the customer-protection timelines.", "src": "Original case passage · rules from RBI directions (customer service, KYC, frauds, currency, lockers, Integrated Ombudsman Scheme)", "asOf": "2026-10", "free": true, "lvl": 2, "status": "reviewed"}, {"id": "P1-0001", "sec": "P1", "q": "A savings account had ₹50,000 for 30 days and ₹80,000 for the next 61 days of a quarter. At 3% p.a., interest for the quarter (daily product, 365 days) is about:", "opts": ["₹524", "₹600", "₹480", "₹656", "₹437"], "ans": 0, "exp": "(50,000 × 30 + 80,000 × 61) = 63,80,000 rupee-days × 3% ÷ 365 = ₹524.38, so about ₹524.", "src": "Original problem · interest calculated on daily product, 365-day year (RBI deposit interest directions)", "asOf": "2026-10", "free": true, "lvl": 2, "status": "reviewed"}, {"id": "P1-0002", "sec": "P1", "q": "A demand loan of ₹50,000 at 10% p.a. is repaid after 73 days. Simple interest payable is:", "opts": ["₹500", "₹1,000", "₹1,250", "₹5,000", "₹730"], "ans": 1, "exp": "50,000 × 10% × 73 ÷ 365 = ₹1,000.", "src": "Original problem · interest calculated on daily product, 365-day year (RBI deposit interest directions)", "asOf": "2026-10", "free": true, "lvl": 1, "status": "reviewed"}, {"id": "P1-0003", "sec": "P1", "q": "A cash credit account had an average debit balance of ₹4,00,000 for a 30-day month. At 12% p.a., interest for the month is about:", "opts": ["₹4,000", "₹3,945", "₹4,800", "₹3,600", "₹4,380"], "ans": 1, "exp": "4,00,000 × 12% × 30 ÷ 365 = ₹3,945.21.", "src": "Original problem · interest calculated on daily product, 365-day year (RBI deposit interest directions)", "asOf": "2026-10", "free": true, "lvl": 2, "status": "reviewed"}, {"id": "IT1-0001", "sec": "IT1", "q": "In banking, \"CBS\" stands for:", "opts": ["Central Branch System", "Core Banking Solution", "Computerised Book System", "Customer Billing Service", "Common Bank Switch"], "ans": 1, "exp": "Core Banking Solution: all branches work on one centralised database in a data centre, so a customer can transact at any branch (\"anywhere banking\"). Accounts are no longer branch-bound.", "src": "Standard computer and banking-technology concept", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1}, {"id": "IT1-0002", "sec": "IT1", "q": "In a CBS environment, the principle that one person enters a transaction and another authorises it is called:", "opts": ["Single sign-on", "Maker-checker (dual control)", "Round robin", "Mirroring", "Batch processing"], "ans": 1, "exp": "Maker-checker separates entry and authorisation, reducing errors and fraud. Users must never share passwords, since every entry is logged against the user ID.", "src": "Standard computer and banking-technology concept", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1}, {"id": "B2-0001", "sec": "B2", "q": "SBI's administrative structure in India consists of the Corporate Centre in Mumbai and how many Local Head Offices (Circles)?", "opts": ["12", "14", "17", "21", "24"], "ans": 2, "exp": "Corporate Centre (Mumbai), 17 Local Head Offices and about 101 Zonal Offices oversee the branch network in India and abroad.", "src": "SBI website (sbi.bank.in): administrative structure (Contact Us) and Grievance Redressal Cells at Local Head Offices pages, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://sbi.bank.in/web/customer-care/citizens-charter/addresses-and-helpline-nos-of-grievances-redressal-cell-at-local-head-offices", "checked": "2026-10-24"}, {"id": "B2-0002", "sec": "B2", "q": "Below SBI's 17 Local Head Offices, about how many Zonal Offices are spread across important cities?", "opts": ["51", "75", "101", "150", "210"], "ans": 2, "exp": "About 101 Zonal Offices; below them Regional Business Offices (RBOs) supervise branches.", "src": "SBI website (sbi.bank.in): administrative structure (Contact Us) and Grievance Redressal Cells at Local Head Offices pages, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/"}]}, "content/descriptive.json": {"pack": "descriptive", "items": [{"id": "RAT-0001", "type": "RAT", "q": "The nominee is not required to sign the nomination form for a deposit account.", "ans": "• Nominee is not a party to the deposit contract; nomination is the depositor's own act (Sec 45ZA, BR Act; Banking Companies (Nomination) Rules, 2025).\n• Depositor's freedom: can nominate a minor or a person living elsewhere.\n• Nominee receives only as trustee of legal heirs; payment gives the bank a valid discharge.\n• Only the depositor signs; thumb impression attested by two witnesses.\nHence the nominee's signature is not needed.", "src": "Original model answer · BR Act 1949, Sec 45ZA; Banking Companies (Nomination) Rules, 2025; RBI Nomination Facility Directions, 2025", "asOf": "2026-10", "free": true, "status": "reviewed"}, {"id": "RAT-1001", "type": "RAT", "q": "Staff in sensitive positions must take compulsory leave every year.", "ans": "• Preventive vigilance / operational risk: when another official handles the seat, irregularities concealed by the incumbent come to light.\n• RBI: Board-approved list of sensitive posts; mandatory leave of at least 10 working days in one spell, without notice and with no system access.\n• Builds back-up and reduces dependence on one person.\nHence compulsory leave deters and detects hidden frauds.", "src": "Original model answer · RBI, Mandatory Leave for Employees Posted in Sensitive Positions or Areas of Operation (9 Jul 2021); RBI (Commercial Banks – Miscellaneous) Directions, 2025", "asOf": "2026-10", "free": true, "status": "reviewed"}, {"id": "RAT-2001", "type": "RAT", "q": "Banks must give every retail and MSME borrower a Key Fact Statement before the loan agreement is signed.", "ans": "• Transparency: KFS shows the Annual Percentage Rate (APR), all fees and the repayment schedule in a standard format.\n• Rule: RBI, for all retail and MSME term loans from 1 Oct 2024, before the contract.\n• Charges not in the KFS cannot be levied later without consent.\n• Borrower can compare offers; fewer disputes.\nHence the KFS makes lending transparent.", "src": "Original model answer · RBI circular, Key Facts Statement (KFS) for Loans & Advances, 15 Apr 2024", "asOf": "2026-10", "free": true, "status": "reviewed"}, {"id": "RAT-2006", "type": "RAT", "q": "A customer must give PAN, or Form 60 if he has no PAN, when opening a deposit account or depositing cash of more than ₹50,000 in a day.", "ans": "• Required by the Income-tax Rules (formerly Rule 114B) for specified transactions.\n• Links high-value transactions to the customer's tax record, discouraging tax evasion and unaccounted cash.\n• Supports the bank's KYC and anti-money-laundering checks.\n• Form 60 lets genuine customers without PAN still bank, with their details on record.\nHence the rule balances access to banking with transparency.", "src": "Original model answer · Income-tax Rules (requirement formerly Rule 114B of the 1962 Rules)", "asOf": "2026-10", "free": true, "status": "reviewed"}, {"id": "FA-0001", "type": "FA", "q": "Interest should be paid on current accounts.", "ans": "FOR:\n1. Deposit mobilisation: attracts large, stable business balances.\n2. Competition: banks compete on price and service.\n3. Keeps idle money inside the banking system.\n\nAGAINST:\n1. Rule: RBI does not permit interest on current accounts.\n2. Cost of funds: cheapest source; interest raises lending rates.\n3. Volatility: balances payable on demand; free services already given.\n\nCONCLUSION: Not advisable; auto-sweep serves customers with surplus funds.", "src": "Original model answer · RBI Master Direction on Interest Rate on Deposits", "asOf": "2026-10", "free": true, "status": "reviewed"}, {"id": "FA-1001", "type": "FA", "q": "Farm loan waivers are good for the economy.", "ans": "FOR:\n1. Distress relief: drought, floods, price crashes; prevents land sales.\n2. Rural demand revives the wider economy.\n3. Restores access to bank credit; avoids moneylenders.\n\nAGAINST:\n1. Moral hazard: damages credit discipline.\n2. Fiscal strain; delayed reimbursement to banks.\n3. Root causes untouched: productivity, irrigation, markets.\n\nCONCLUSION: Short-term relief, not reform; prefer targeted relief with crop insurance.", "src": "Original model answer", "asOf": "2026-10", "free": true, "status": "reviewed"}, {"id": "FA-2001", "type": "FA", "q": "Bank branches will become unnecessary in the digital age.", "ans": "FOR:\n1. Digital: UPI and mobile banking handle most transactions.\n2. Cost: branches costly; digital is 24x7.\n3. Young customers rarely visit.\n\nAGAINST:\n1. Elderly, rural, less literate need help.\n2. Complex loans and disputes need advice.\n3. Trust, cash, KYC and account opening.\n\nCONCLUSION: Branches will be fewer and advisory, not extinct.", "src": "Original model answer", "asOf": "2026-10", "free": true, "status": "reviewed"}, {"id": "FA-2003", "type": "FA", "q": "Banks should charge customers for cash transactions at branches.", "ans": "FOR:\n1. Cost of cash: staff, security, transport.\n2. Nudge to cheaper digital channels.\n3. Fairness: non-cash users now bear the cost.\n\nAGAINST:\n1. Small traders, elderly, rural depend on cash.\n2. Hurts financial inclusion.\n3. Goodwill and deposits may be lost.\n\nCONCLUSION: Some free transactions; reasonable charges beyond.", "src": "Original model answer", "asOf": "2026-10", "free": true, "status": "reviewed"}, {"id": "SIT-1001", "type": "SIT", "q": "A gold loan borrower has died. His widow asks the branch to return the pledged ornaments so that she can pay hospital bills. How will you handle the request?", "ans": "Facts: gold-loan borrower has died; widow wants the ornaments to pay hospital bills.\nIssue: can the pledge be released?\nLaw/rule: pledge (Sec 172, Contract Act): released only on full repayment, to the nominee or legal heirs.\nAction:\na) Empathy: explain the position politely.\nb) Repayment: from her funds, or the deceased's deposits after claim settlement.\nc) Option: heirs may ask the bank to sell, adjust dues and pay the surplus.\nd) Documents: death certificate, legal-heir declaration, disclaimer from other heirs, indemnity.\ne) Release against acknowledgement once complete.\nConclusion: help quickly, but never release security before the loan is closed.", "src": "Original model answer · Indian Contract Act, 1872, Sec 172", "asOf": "2026-10", "free": true, "status": "reviewed"}, {"id": "SIT-2001", "type": "SIT", "q": "A customer complains that ₹40,000 was debited from her savings account through UPI payments she did not make. She reports it on the same day and says she never shared her PIN or OTP. How will you handle the complaint?", "ans": "Facts: ₹40,000 unauthorised UPI debits, reported the same day; PIN/OTP not shared.\nIssue: liability and immediate protection.\nLaw/rule: RBI 2017 customer-liability directions: third-party breach reported within 3 working days means zero liability.\nAction:\na) Register complaint; acknowledgement; block UPI and other channels.\nb) Shadow credit within 10 working days of report.\nc) Advise 1930 / cybercrime.gov.in and police complaint.\nd) Trace funds with NPCI and beneficiary banks; seek freeze.\ne) Resolve within 90 days.\nConclusion: quick blocking and shadow credit protect the customer and limit loss.", "src": "Original model answer · RBI circular on Limiting Liability of Customers in Unauthorised Electronic Banking Transactions, 6 Jul 2017", "asOf": "2026-10", "free": true, "status": "reviewed"}, {"id": "SIT-2003", "type": "SIT", "q": "A customer phones the branch and asks you to stop payment of a cheque he issued yesterday. How will you deal with the request?", "ans": "Facts: a customer phones to stop payment of a cheque issued yesterday.\nIssue: can the bank act on a phone call?\nLaw/rule: only the drawer can stop payment; instruction in writing or through an authenticated digital channel, with cheque details.\nAction:\na) Check at once whether the cheque is already paid.\nb) If not: note the call with time; flag the account as precaution.\nc) Ask for written or net/mobile banking confirmation immediately.\nd) Record stop payment in CBS; recover charges.\ne) If presented: return \"Payment stopped by drawer\".\nConclusion: care on the call protects the customer; written confirmation protects the bank.", "src": "Original model answer · Negotiable Instruments Act, 1881, Sec 31", "asOf": "2026-10", "free": true, "status": "reviewed"}, {"id": "BC-1001", "type": "BC", "q": "As Branch Manager, write to your Regional Manager about the steps your branch has taken to move customers to digital channels.", "ans": "[Bank name]\nXYZ Branch (Branch Code ____)\nLetter No. ____/2026-27                                  Date: __.__.2026\n\nThe Regional Manager,\n[Bank name],\nRegional Business Office, ABC\n\nDear Sir/Madam,\n\nPROMOTION OF ALTERNATE DELIVERY CHANNELS (ADC) AT XYZ BRANCH\n\nWe are pleased to report the steps taken by the branch to migrate customers to Alternate Delivery Channels during the quarter.\n\n1. Desk-wise campaign: every SB/CA customer visiting the branch for routine transactions is guided to YONO, internet banking and debit card usage. ___ YONO registrations and ___ INB activations were done.\n2. Green Channel/BNA/ATM: staff help customers at the e-lobby; footfall at the cash counter has come down by __%.\n3. Merchant acquiring: ___ BHIM-the bank Pay/QR codes and ___ POS machines were placed with traders in the market area.\n4. Literacy camps were held at two colleges and one RWA to explain safe digital banking.\n\nADC transactions now form __% of total transactions, against __% last quarter. We request one additional cash deposit machine at the e-lobby to sustain this growth.\n\nWe assure you of our continued efforts.\n\nYours faithfully,\n\n(Name)\nBranch Manager\nContact No.", "src": "Original model answer", "asOf": "2026-10", "free": true, "status": "reviewed"}, {"id": "COMP-2001", "type": "COMP", "q": "Read the passage and choose the correct option for each question. Type the option you choose.\n\nTen years ago, Ramesh, a vegetable seller in a small town, kept his earnings in a tin box at home. Today he receives most payments through a QR code pasted on his cart, and a business correspondent visits his lane twice a week. With a record of steady receipts in his account, he recently obtained a small working capital loan, the first in his family's history.\n\nHis story is common. The spread of basic accounts, mobile phones and low-cost digital payments has drawn millions of people into formal finance. Yet access is only the first step. Many accounts remain dormant, and new users are easy targets for fraud. A message promising a prize, or a caller claiming to be from the bank, can wipe out savings that took years to build.\n\nThe change did not happen by itself. A few years earlier, a camp held by the local branch had helped every family in Ramesh's lane open a basic account, and a business correspondent showed them how to receive payments on a phone. At first most people used the account only to collect government benefits, withdrawing the whole amount the same day. Trust in the system grew slowly, one successful transaction at a time.\n\nBankers who work in such areas say that the hardest part is not opening accounts but keeping them alive. A customer who is charged an unexpected fee, or who is turned away at a counter, may never come back. Small courtesies, clear explanations and quick resolution of problems do more to build the habit of banking than any advertisement.\n\nFor inclusion to be meaningful, people must use their accounts regularly, borrow responsibly and protect themselves. Banks, business correspondents and community groups therefore have to teach as well as serve. A customer who understands why a PIN must never be shared is worth more to the system than ten customers whose accounts lie unused.\n\nQuestions:\n1. How did Ramesh obtain his first loan?\n(a) By pledging his cart\n(b) Through a record of steady receipts in his account\n(c) Through a moneylender in his lane\n(d) By a government subsidy\n(e) Through his family's savings in a tin box\n\n2. According to the passage, access is \"only the first step\" because:\n(a) banks charge high fees\n(b) many accounts stay unused and new users are easily cheated\n(c) mobile phones are costly\n(d) business correspondents visit rarely\n(e) loans are hard to get\n\n3. What role does the passage give to banks and business correspondents?\n(a) Only opening new accounts\n(b) Collecting deposits from the poor\n(c) Teaching customers as well as serving them\n(d) Closing dormant accounts\n(e) Selling insurance\n\n4. The word \"dormant\" as used in the passage means:\n(a) dangerous\n(b) closed\n(c) inactive\n(d) overdrawn\n(e) secret", "ans": "1. (b) Through a record of steady receipts in his account\n2. (b) many accounts stay unused and new users are easily cheated\n3. (c) Teaching customers as well as serving them\n4. (c) inactive", "src": "Original model answer · original passage written for this app", "asOf": "2026-10", "free": true, "status": "reviewed"}, {"id": "COMP-2004", "type": "COMP", "q": "Read the passage and choose the correct option for each question. Type the option you choose.\n\nMost digital frauds today do not break into bank systems; they break into people's trust. A caller claiming to be from the bank warns that an account will be blocked unless the customer shares an OTP. A message offers a refund that can be claimed only by scanning a QR code. A video call shows a uniformed \"officer\" accusing the victim of a crime. In each case the fraudster creates fear or greed so that the victim acts before thinking.\n\nTechnology alone cannot stop such social engineering. Banks have added alerts, limits and cooling periods, but the decisive moment is when the customer chooses to share a code or approve a payment. Awareness is therefore the strongest defence.\n\nThe methods keep changing. When customers learn to distrust calls, fraudsters move to messaging apps; when they learn to ignore messages, the fraudsters send links that look like official websites. Some use stolen data to sound convincing, quoting the last few digits of an account or a recent transaction. Each new trick works for a while, until enough people learn to recognise it.\n\nVictims are often reluctant to report what happened, out of embarrassment. This delay helps the fraudster, because money moves quickly through a chain of accounts. Reporting at once to the bank and to the national cyber-crime helpline gives the best chance of stopping the transfer and recovering at least part of the amount.\n\nSimple rules help. A bank never asks for a PIN, OTP or password. Scanning a QR code is for paying, never for receiving money. Government agencies do not arrest people on video calls. When in doubt, the customer should disconnect and call the bank's official number. Every staff member who explains these rules to one customer may protect a whole family.\n\nQuestions:\n1. According to the passage, most digital frauds today:\n(a) break into bank systems\n(b) exploit people's trust\n(c) are done by bank staff\n(d) happen only at ATMs\n(e) target large companies\n\n2. Technology alone cannot stop social engineering because:\n(a) banks have no technology\n(b) the customer takes the decisive step of sharing a code or approving a payment\n(c) alerts are too slow\n(d) fraudsters are always caught\n(e) regulators forbid limits\n\n3. According to the passage, scanning a QR code is meant for:\n(a) receiving money\n(b) paying\n(c) checking balance\n(d) claiming refunds\n(e) opening an account\n\n4. \"Social engineering\" in the passage means:\n(a) building community centres\n(b) hacking computer networks\n(c) tricking people through fear, greed or false authority\n(d) designing bank software\n(e) training staff", "ans": "1. (b) exploit people's trust\n2. (b) the customer takes the decisive step of sharing a code or approving a payment\n3. (b) paying\n4. (c) tricking people through fear, greed or false authority", "src": "Original model answer · original passage written for this app", "asOf": "2026-10", "free": true, "status": "reviewed"}, {"id": "ESSAY-0001", "type": "ESSAY", "q": "Digital banking: opportunities and challenges", "ans": "Digital banking has changed the way Indians handle money. A farmer can receive a subsidy directly in his account, a shopkeeper accepts payment through a QR code, and a student pays fees from a mobile phone in seconds. UPI, internet banking and mobile apps have made banking available every hour of every day.\n\nThe opportunities are large. Digital channels reduce the cost of each transaction, so banks can serve small customers profitably. Customers save time and travel. Every digital payment also leaves a record, which helps small borrowers build a credit history and get loans more easily. For the Government, direct benefit transfer has reduced leakages.\n\nThe challenges are equally real. Cyber fraud is rising, and many victims are new users who do not know that a bank never asks for a PIN or OTP. Elderly customers and people in remote areas may lack smartphones, connectivity or confidence. System failures, even for a few hours, can stop payments across the country.\n\nBanks must therefore grow digital services and safety together. Strong systems, quick reversal of failed transactions, simple apps in local languages and regular awareness campaigns are essential. Branch staff have a role too: they should help first-time users and explain safe habits patiently.\n\nIn conclusion, digital banking is not a replacement for trust but a new way of earning it. If convenience is matched by security and inclusion, digital banking can bring every Indian into the formal financial system.", "src": "Original model essay written for Unnati Promotion Prep", "asOf": "2026-10", "free": true, "status": "reviewed", "tracks": ["jm"]}, {"id": "ESSAY-0002", "type": "ESSAY", "q": "Financial inclusion: the road ahead", "ans": "Financial inclusion means that every individual, especially the poor and those in rural areas, has access to affordable financial services such as a savings account, credit, insurance, pension and payment facilities. India has made remarkable progress. Crores of accounts were opened under the Jan Dhan Yojana, and schemes such as PMJJBY, PMSBY and Atal Pension Yojana provide low-cost insurance and pensions.\n\nAccess, however, is only the first step. Many accounts remain unused, and a large number of families still borrow from moneylenders at high interest. Real inclusion means that people use their accounts regularly for saving, receiving payments and borrowing at fair rates.\n\nSeveral steps can take inclusion forward. Business correspondents should be trained and paid fairly so that they serve villages reliably. Financial literacy, in the local language and through practical examples, helps people understand interest, insurance and fraud. Small loans for self-help groups, small farmers and micro-enterprises should be easy to obtain, with simple documentation. Digital tools such as Aadhaar-based payments and UPI can lower costs further.\n\nWomen deserve special attention. When women control savings and credit, families spend more on education and health. Self-help groups have shown how powerful this can be.\n\nBanks gain as well. Today's small customer is tomorrow's home-loan borrower and investor. Inclusion therefore builds a larger and more stable business.\n\nIn conclusion, financial inclusion is both a social duty and a sound business choice. Its success should be measured not by accounts opened but by lives improved.", "src": "Original model essay written for Unnati Promotion Prep", "asOf": "2026-10", "free": true, "status": "reviewed", "tracks": ["jm"]}, {"id": "EM-1001", "type": "EM", "q": "Write an e-mail to your Regional Manager reporting that your branch's cash deposit machine has been out of order for four days and the vendor has not repaired it.", "ans": "To: rm.abc@[bank domain]\nCc: atm.cell@[bank domain]\nSubject: CDM at XYZ Branch (Code ____) out of order since __.__.2026, vendor not responding\n\nDear Sir/Madam,\n\nThe cash deposit machine (ID ______) at our e-lobby has been out of order since __.__.2026, four days now.\n\n1. The fault (cash module jam) was logged with the vendor on the same day, docket no. ______.\n2. Two reminders were sent; the engineer has not visited.\n3. Counter deposits have risen by about ___ a day and customers are complaining.\n\nPlease ask the vendor to repair the machine within 24 hours, and consider the penalty under the service agreement for the delay.\n\nThe complaint log is attached.\n\nRegards,\n(Name)\nBranch Manager, XYZ Branch (Code ____)\nPhone: ________", "src": "Original model answer", "asOf": "2026-10", "free": true, "status": "reviewed"}]}};

<script>/* Exam tracks: one app, three promotion exams (official structure, Promotion Year 2027-28 guidelines).
   Loaded after config.js and before app.js. The active track rewrites the exam pattern, the sections, the price and

const PASSAGES = [

  'A cheque presented for payment must be examined for the date, the amount in words and figures, the signature, and any alteration. If the amount in words differs from the figures, the cheque is returned with a request for the drawer to confirm. A post-dated cheque must never be paid before its date, as such payment is not in due course.',
  'Early warning signals help the branch notice stress in an account before it becomes a non-performing asset. Frequent returns of cheques, delay in submitting stock statements, and a steady fall in turnover routed through the account are common signals. The branch should meet the borrower promptly, find the cause, and agree on corrective steps.',

let tMins = store.get('tMins', 3);
function typing() {

    <p class="lede">The descriptive paper is typed. To write about 1,200 words in 64 working minutes you need about <b>20 words a minute</b>; aim for 28 or more so that you have time to think. Practise on a keyboard if you can: phone typing is slower than exam typing.</p>
    ${H.length ? `<div class="grid2"><div class="card stat"><div class="v">${best}</div><div class="k">Best net WPM</div></div><div class="card stat"><div class="v">${last.acc}%</div><div class="k">Last accuracy</div></div></div>` : ''}

function runTyping() {

Close: "Regards," then name, designation, branch, phone.
Attachments: mention them in the body and attach.
Target 100–160 words.`,
  COMP: `1. Read the four questions and their options first; underline key words (names, numbers, NOT).
2. Skim: first and last line of each paragraph; one-word map per paragraph.
3. Scan for each answer; read that sentence closely; strike out trap options.

};
function frames() {

// ================= DI GENERATOR =================
// Every data set is generated on the phone, so DI content is original and unlimited.
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const round5 = x => Math.round(x / 5) * 5;
const fmt = (x, d = 1) => Number(x.toFixed(d)).toLocaleString('en-IN', { minimumFractionDigits: d, maximumFractionDigits: d });
const pick = (arr, n) => shuffle(arr).slice(0, n);
/** Five distinct options, as in the exam: the right value plus typical-mistake values, topped up with near misses. */
function numOpts(right, wrong, d, unit = '') {
  const f = x => fmt(x, d) + unit, seen = new Set([f(right)]), out = [];
  for (const w of wrong) { if (isFinite(w) && w > 0 && !seen.has(f(w)) && out.length < 4) { seen.add(f(w)); out.push(f(w)); } }
  const step = Math.max(Math.abs(right) * 0.06, 1);
  for (let k = 1; out.length < 4 && k < 40; k++) { const w = right + (k % 2 ? 1 : -1) * step * Math.ceil(k / 2); if (w >= 0 && !seen.has(f(w))) { seen.add(f(w)); out.push(f(w)); } }
  const opts = shuffle([f(right), ...out]);
  return { opts, ans: opts.indexOf(f(right)) };
}
// with only four candidates (e.g. four quarters) the fifth option is "cannot be determined", always wrong because near-ties are re-rolled
function labelOpts(right, others) { const w = pick(others.filter(o => o !== right), 4); if (w.length < 4) w.push('Cannot be determined from the data'); const opts = shuffle([right, ...w]); return { opts, ans: opts.indexOf(right) }; }
const tbl = (head, rows) => `<div class="di-wrap"><table class="di"><thead><tr>${head.map((h, k) => `<th${k ? ' class="n"' : ''}>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, k) => `<td${k ? ' class="n"' : ''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

function diBranchSet() {
  const names = ['P', 'Q', 'R', 'S', 'T'].map(x => 'Branch ' + x), Y1 = 'FY 2024-25', Y2 = 'FY 2025-26';
  const rows = names.map(nm => { const d1 = round5(rnd(400, 1200)), d2 = round5(d1 * rnd(1.03, 1.25)), a1 = round5(d1 * rnd(0.55, 0.85)), a2 = round5(d2 * rnd(0.55, 0.9)); return { nm, d1, d2, a1, a2 }; });
  const table = `<p class="src">Deposits and advances of Branches P to T, ${Y1} and ${Y2} (₹ crore)</p>` + tbl(['Branch', 'Deposits<br>24-25', 'Deposits<br>25-26', 'Advances<br>24-25', 'Advances<br>25-26'], rows.map(r => [r.nm.replace('Branch ', ''), r.d1, r.d2, r.a1, r.a2]));
  const [b1, b2, b3] = pick(rows, 3), sumD2 = rows.reduce((s, r) => s + r.d2, 0), avgA1 = rows.reduce((s, r) => s + r.a1, 0) / 5;
  const growth = r => (r.a2 - r.a1) / r.a1 * 100, byG = rows.slice().sort((a, b) => growth(b) - growth(a)), best = byG[0];
  if (growth(byG[0]) - growth(byG[1]) < 0.2) return diBranchSet();   // near-tie would make "highest" ambiguous
  const g = (b1.d2 - b1.d1) / b1.d1 * 100, cd = b2.a2 / b2.d2 * 100, sh = b3.d2 / sumD2 * 100;
  const qs = [
    { q: `What is the percentage growth in deposits of ${b1.nm} from ${Y1} to ${Y2}?`, ...numOpts(g, [(b1.d2 - b1.d1) / b1.d2 * 100, b1.d2 / b1.d1 * 100, g + 1.5], 1, '%'),
      exp: `Growth = (${b1.d2} − ${b1.d1}) ÷ ${b1.d1} × 100 = ${b1.d2 - b1.d1} ÷ ${b1.d1} × 100 = ${fmt(g)}%. Divide by the earlier year, not the later one.` },
    { q: `What is the credit-deposit (CD) ratio of ${b2.nm} in ${Y2}?`, ...numOpts(cd, [b2.d2 / b2.a2 * 100, b2.a1 / b2.d1 * 100, cd + 2.5], 1, '%'),
      exp: `CD ratio = Advances ÷ Deposits × 100 = ${b2.a2} ÷ ${b2.d2} × 100 = ${fmt(cd)}%.` },
    { q: `What are the average advances per branch in ${Y1}?`, ...numOpts(avgA1, [avgA1 * 1.25, rows.reduce((s, r) => s + r.a2, 0) / 5, avgA1 * 0.8], 1, ' cr'),
      exp: `Average = (${rows.map(r => r.a1).join(' + ')}) ÷ 5 = ${rows.reduce((s, r) => s + r.a1, 0)} ÷ 5 = ₹${fmt(avgA1)} crore.` },
    { q: `Which branch recorded the highest percentage growth in advances from ${Y1} to ${Y2}?`, ...labelOpts(best.nm, names),
      exp: `Growth in advances: ${rows.map(r => `${r.nm.slice(-1)} ${fmt(growth(r))}%`).join(', ')}. Highest: ${best.nm}. Compare percentages, not the absolute increase.` },
    { q: `What is the share of ${b3.nm} in the total deposits of the five branches in ${Y2}?`, ...numOpts(sh, [b3.d2 / (sumD2 - b3.d2) * 100, b3.d1 / rows.reduce((s, r) => s + r.d1, 0) * 100, sh + 3], 1, '%'),
      exp: `Total ${Y2} deposits = ${sumD2}. Share = ${b3.d2} ÷ ${sumD2} × 100 = ${fmt(sh)}%.` }
  ];
  return { title: 'Branch business', table, qs };
}

function diNpaSet() {
  const Q = ['Q1 (Jun)', 'Q2 (Sep)', 'Q3 (Dec)', 'Q4 (Mar)'];
  let adv = round5(rnd(8000, 12000));
  const rows = Q.map(nm => { adv = round5(adv * rnd(1.0, 1.06)); const gnpa = round5(adv * rnd(0.03, 0.07)); const prov = round5(gnpa * rnd(0.5, 0.8)); return { nm, adv, gnpa, prov }; });
  const table = `<p class="src">Quarterly figures of a bank, FY 2025-26 (₹ crore)</p>` + tbl(['Quarter', 'Gross<br>advances', 'Gross<br>NPA', 'Provisions<br>held'], rows.map(r => [r.nm, r.adv, r.gnpa, r.prov]));
  const [x, y, z] = pick(rows, 3), ratio = r => r.gnpa / r.adv * 100, byR = rows.slice().sort((a, b) => ratio(a) - ratio(b)), lowest = byR[0];
  if (ratio(byR[1]) - ratio(byR[0]) < 0.05) return diNpaSet();      // near-tie would make "lowest" ambiguous
  const gr = ratio(x), pcr = y.prov / y.gnpa * 100, nnpa = (z.gnpa - z.prov) / (z.adv - z.prov) * 100, ch = (rows[3].gnpa - rows[0].gnpa) / rows[0].gnpa * 100;
  const qs = [
    { q: `What is the gross NPA ratio in ${x.nm}?`, ...numOpts(gr, [x.prov / x.adv * 100, (x.gnpa - x.prov) / x.adv * 100, gr + 0.6], 2, '%'),
      exp: `Gross NPA ratio = Gross NPA ÷ Gross advances × 100 = ${x.gnpa} ÷ ${x.adv} × 100 = ${fmt(gr, 2)}%.` },
    { q: `What is the provision coverage ratio (excluding technical write-offs) in ${y.nm}?`, ...numOpts(pcr, [y.gnpa / y.prov * 100, y.prov / y.adv * 100, pcr + 4], 1, '%'),
      exp: `PCR = Provisions ÷ Gross NPA × 100 = ${y.prov} ÷ ${y.gnpa} × 100 = ${fmt(pcr)}%.` },
    { q: `What is the net NPA ratio in ${z.nm}?`, ...numOpts(nnpa, [(z.gnpa - z.prov) / z.adv * 100, z.gnpa / z.adv * 100, nnpa + 0.5], 2, '%'),
      exp: `Net NPA = ${z.gnpa} − ${z.prov} = ${z.gnpa - z.prov}. Net advances = ${z.adv} − ${z.prov} = ${z.adv - z.prov}. Net NPA ratio = ${z.gnpa - z.prov} ÷ ${z.adv - z.prov} × 100 = ${fmt(nnpa, 2)}%. Deduct provisions from both numerator and denominator.` },
    { q: `By what percentage did gross NPA change from ${rows[0].nm} to ${rows[3].nm}?`, ...(() => { const o = numOpts(Math.abs(ch), [Math.abs((rows[3].gnpa - rows[0].gnpa) / rows[3].gnpa * 100), Math.abs(ch) + 2, rows[3].gnpa / rows[0].gnpa * 100], 1, '%'); o.opts = o.opts.map(s => (ch < 0 ? 'Fell ' : 'Rose ') + s); return o; })(),
      exp: `Change = (${rows[3].gnpa} − ${rows[0].gnpa}) ÷ ${rows[0].gnpa} × 100 = ${fmt(ch)}%, so gross NPA ${ch < 0 ? 'fell' : 'rose'} by ${fmt(Math.abs(ch))}%.` },
    { q: 'In which quarter was the gross NPA ratio the lowest?', ...labelOpts(lowest.nm, Q),
      exp: `Gross NPA ratios: ${rows.map(r => `${r.nm.split(' ')[0]} ${fmt(ratio(r), 2)}%`).join(', ')}. Lowest: ${lowest.nm}. Compare ratios, not the absolute NPA amount.` }
  ];
  return { title: 'Asset quality', table, qs };
}
const DI_SETS = [diBranchSet, diNpaSet];
/** n questions for the mock's S11 section, built from whole sets so each question has its table. */
function diForMock(n) {
  const out = []; while (out.length < n) { const s = DI_SETS[out.length / 5 % DI_SETS.length](); s.qs.forEach((q, k) => out.push({ ...q, id: 'DI-' + Date.now() + '-' + out.length, sec: 'S11', table: s.table, gen: true, src: 'Generated data set' })); }
  return out.slice(0, n);
}

const DI_FREE_PER_DAY = 3;
function di() {
  const today = new Date().toISOString().slice(0, 10), used = store.get('diDay', {});

    ${full() ? '' : `<p class="src" style="margin-top:10px">${left} free set${left === 1 ? '' : 's'} left today.</p>${left ? '' : lockCard(1).replace('1 more', 'Unlimited sets')}`}

}
function runDI(set) {

}

// Leitner boxes: a card you know moves up a box and comes back later; a miss sends it to box 0 for this session.
const BOX_DAYS = [0, 1, 3, 7, 15, 30];
function recall() {
  const CARDS = store.get('cards', {}), now = Date.now();
  const pool = MCQ.filter(unlocked).filter(q => !pSel.length || pSel.includes(q.sec));
  const due = pool.filter(q => CARDS[q.id] && CARDS[q.id][1] <= now), fresh = pool.filter(q => !CARDS[q.id]);
  const mastered = pool.filter(q => CARDS[q.id] && CARDS[q.id][0] >= 4).length;
  V.innerHTML = modeBar('recall') + `<h2>Recall cards</h2><p class="lede">See the question, answer it in your head, then check. Cards you know come back after longer gaps; cards you miss come back soon.${pSel.length ? ` Showing sections chosen in Practice: ${esc(pSel.join(', '))}.` : ''}</p>
    <div class="grid2"><div class="card stat"><div class="v">${due.length}</div><div class="k">Due for review</div></div><div class="card stat"><div class="v">${fresh.length}</div><div class="k">New cards</div></div></div>
    <div class="card stat" style="margin-top:10px"><div class="v">${mastered} <small>/ ${pool.length}</small></div><div class="k">Well known (seen correctly 4+ times in a row)</div><div class="meter"><i style="width:${pool.length ? Math.round(mastered / pool.length * 100) : 0}%"></i></div></div>
    <div style="margin-top:14px"><button class="btn block" id="go" ${due.length + fresh.length ? '' : 'disabled'}>${due.length + fresh.length ? `Start: ${Math.min(30, due.length + fresh.length)} cards` : 'Nothing due. Come back tomorrow'}</button></div>
    <div style="margin-top:12px">${lockCard(MCQ.length - MCQ.filter(unlocked).length)}</div>`;
  $('#go').onclick = () => runRecall(shuffle(due).concat(shuffle(fresh)).slice(0, 30));
}
function runRecall(queue) {
  const CARDS = store.get('cards', {}), missed = new Set(); let done = 0, known = 0;
  const show = () => {
    if (!queue.length) {
      V.innerHTML = `<div class="card"><h2>Session done</h2><p class="lede">${done} cards reviewed, ${known} known first time.</p><button class="btn" onclick="route()">Back to recall</button></div>`; return;
    }
    const q = queue[0];
    V.innerHTML = `<div class="card flash"><div class="row end"><span class="progress">${queue.length} left</span><span class="tag">${esc(q.sec)}</span></div>
      <p class="q">${esc(q.q)}</p><div id="back" hidden><div class="answer">${esc(q.opts[q.ans])}</div>${q.exp ? `<p class="src" style="margin-top:8px">${esc(q.exp)}</p>` : ''}${listenBtn(q.q + '. Answer: ' + q.opts[q.ans] + '. ' + (q.exp || ''))}</div></div>
      <div style="margin-top:12px" id="act"><button class="btn block" id="flip">Show answer</button></div>`;
    $('#flip').onclick = () => {
      $('#back').hidden = false;
      $('#act').innerHTML = `<div class="grid2"><button class="btn ghost" id="again">Didn't know</button><button class="btn" id="gotit">Knew it</button></div>`;
      $('#again').onclick = () => { CARDS[q.id] = [0, Date.now()]; store.set('cards', CARDS); if (!missed.has(q.id)) { missed.add(q.id); done++; } queue.push(queue.shift()); show(); };
      $('#gotit').onclick = () => {
        const box = missed.has(q.id) ? 1 : Math.min(5, ((CARDS[q.id] || [0])[0]) + 1);   // a card missed this session restarts low
        CARDS[q.id] = [box, Date.now() + BOX_DAYS[box] * 864e5]; store.set('cards', CARDS);
        if (!missed.has(q.id)) { done++; known++; } queue.shift(); show();
      };
    };
  };
  show();
}

// ================= PROGRESS CHARTS =================
function sectionStats() {

    const qs = MCQ.filter(q => q.sec === s.code); let tried = 0, att = 0, ok = 0;
    qs.forEach(q => { const r = ST[q.id]; if (r) { tried++; att += r[0]; ok += r[1]; } });

  const x = i => L + (pts.length < 2 ? iw / 2 : i * iw / (pts.length - 1)), y = v => T + ih - Math.min(v, max) / max * ih;
  const ticks = [0, max / 2, max];

  return `<figure class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(pts.map(p => p.d + ': ' + p.v + unit).join(', '))}">
    ${ticks.map(t => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`).join('')}
    ${ref !== null ? `<line class="ref" x1="${L}" x2="${W - R}" y1="${y(ref)}" y2="${y(ref)}"/><text class="axis" x="${L + 4}" y="${y(ref) - 5}" text-anchor="start">${esc(refLabel)}</text>` : ''}

    <text class="val" x="${x(pts.length - 1)}" y="${y(pts[pts.length - 1].v) - 10}" text-anchor="${pts.length > 1 ? 'end' : 'middle'}">${pts[pts.length - 1].v}${unit}</text>
  </svg><figcaption class="src" data-read>Tap a point to see its value.</figcaption></figure>`;

// ================= FULL EXAM: Part A objective + Part B descriptive =================
const MOCK_MODES = [['mock', 'Objective'], ['sectional', 'Sectional'], ['duel', 'Challenge'], ['exam', 'Full exam']];
const PAPER = TR.paper || { RAT: { offer: 6, attempt: 4, marks: 2 }, FA: { offer: 6, attempt: 4, marks: 2 }, SIT: { offer: 3, attempt: 2, marks: 3 }, COMP: { offer: 1, attempt: 1, marks: 4 }, BC: { offer: 2, attempt: 1, marks: 4 } };
function buildObjective(mix) {
  const pool = mcqPool().filter(q => q.sec !== 'MY' && unlocked(q));
  const qs = M.sections.flatMap(s => s.code === 'S11' ? diForMock(s.examQs) : shuffle(pool.filter(q => q.sec === s.code)).slice(0, s.examQs));
