s/saving-account/savings-bank-rulesabridged", "checked": "2026-10-24", "tk": "Minor (10+) SB cap: ₹10 lakh single · ₹20 lakh joint with guardian."}, {"id": "S1-0230", "sec": "S1", "q": "Arrange SBI's current account variants in ascending order of Monthly Average Balance required:", "opts": ["Silver, Gold, Diamond, Platinum, Palladium, Rhodium", "Gold, Silver, Platinum, Diamond, Rhodium, Palladium", "Silver, Gold, Platinum, Diamond, Palladium, Rhodium", "Silver, Diamond, Gold, Platinum, Rhodium, Palladium", "Gold, Silver, Diamond, Palladium, Platinum, Rhodium"], "ans": 0, "exp": "MAB: Regular ₹5,000; Silver ₹50,000; Gold ₹1 lakh; Diamond ₹5 lakh; Platinum ₹10 lakh; Palladium ₹25 lakh; Rhodium ₹50 lakh.", "src": "SBI website (sbi.bank.in): Compare Current Accounts page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/business/sme/current-accounts/compare-current-accounts", "tk": "CA MAB order: Silver, Gold, Diamond, Platinum, Palladium, Rhodium."}, {"id": "S1-0259", "sec": "S1", "q": "Under SBI's Corporate Salary Package, an employee with a net monthly salary of ₹75,000 falls in which variant?", "opts": ["Silver", "Gold", "Diamond", "Platinum", "Rhodium"], "ans": 2, "exp": "By net salary: Silver ₹10,000 to ₹25,000; Gold above ₹25,000 to ₹50,000; Diamond above ₹50,000 to ₹1 lakh; Platinum above ₹1 lakh to ₹2 lakh; Rhodium above ₹2 lakh.", "src": "SBI website (sbi.bank.in): Salary Accounts - Corporate Salary Package page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/salary-account/corporate-salary-package", "tk": "CSP variant by salary: ₹50,000-1 lakh is Diamond."}, {"id": "S1-0275", "sec": "S1", "q": "For an existing SBI customer, the minimum Total Relationship Value (TRV) required to become an SBI Wealth client is:", "opts": ["₹10 lakh", "₹25 lakh", "₹30 lakh", "₹50 lakh", "₹1 crore"], "ans": 3, "exp": "Existing-to-Bank clients need a minimum TRV of ₹50 lakh. Clients may also qualify through an SBI Home Loan of ₹2 crore and above, or an Auto or Education Loan of ₹30 lakh and above.", "src": "SBI website (sbi.bank.in): SBI Wealth - Eligibility / Individual Clients page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/", "tk": "SBI Wealth for existing customers: TRV ₹50 lakh+."}, {"id": "S1-0289", "sec": "S1", "q": "Which SBI current-account variant gives free cash deposit of 30 times the previous month's MAB, up to ₹25 lakh a month?", "opts": ["Regular", "Silver", "Gold", "Diamond", "Rhodium"], "ans": 1, "exp": "Silver: 30 times MAB, max ₹25 lakh. Regular: 100 times, max ₹5 lakh. Gold, Diamond, Platinum and Palladium: 15 times (max ₹100, 250, 500 and 800 lakh). Rhodium: 12 times, max ₹1,500 lakh. All limits include CDM, recycler, GCC and non-home branch deposits.", "src": "SBI website (sbi.bank.in): Business - Current Accounts - Compare Current Accounts page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/web/business/sme/current-accounts/compare-current-accounts", "why": {"0": "Regular: 100 times MAB, max ₹5 lakh", "2": "Gold: 15 times MAB", "3": "Diamond: 15 times MAB", "4": "Rhodium: 12 times, max ₹1,500 lakh"}, "tk": "Silver CA: 30 × MAB, up to ₹25 lakh."}, {"id": "S1-0309", "sec": "S1", "q": "As per SBI's eligibility table, which of these persons can open an NRO account but NOT an NRE or FCNR(B) account?", "opts": ["An NRI working in the UAE", "A PIO living in the UK", "A foreign student studying in India", "An OCI card holder living abroad", "An Indian seafarer on a foreign ship"], "ans": 2, "exp": "Foreign students and foreign tourists can open NRO accounts only (tourists' accounts need RBI approval beyond 6 months). NRIs, PIOs and OCIs can generally open NRO, NRE and FCNR(B) accounts; however, NRIs residing in Nepal or Bhutan cannot open NRO accounts. Foreign nationals employed in India open domestic accounts.", "src": "SBI website (sbi.bank.in): NRI - Eligibility for Account Opening (NRE / NRO / FCNR(B)) page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/nri/accounts/eligibility-fcnr", "tk": "Foreign students: NRO only, not NRE/FCNR."}, {"id": "S1-0328", "sec": "S1", "q": "The Banking Companies (Nomination) Rules, 2025, along with the amended nomination sections of the Banking Regulation Act, came into force from:", "opts": ["1 April 2025", "1 August 2025", "1 November 2025", "1 January 2026", "16 December 2025"], "ans": 2, "exp": "Effective 1 November 2025, following the Banking Laws (Amendment) Act, 2025, which amended Sections 45ZA, 45ZC and 45ZE of the BR Act. RBI issued matching Nomination Directions, 2025.", "src": "SBI website (sbi.bank.in): Personal Banking - Nomination Facility page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/personal-banking/nomination-facility", "tk": "New nomination law and Rules in force: 1 Nov 2025."}, {"id": "S1-0351", "sec": "S1", "q": "For calculating interest on INR domestic deposits, SBI reckons the number of days in a year as:", "opts": ["360 days", "365 days, including in a leap year", "366 days in a leap year, 365 otherwise", "Actual days / 364", "360 days for TDR, 365 for SB"], "ans": 1, "exp": "365 days for all INR domestic deposits, leap year included. FCNR(B): interest calculated at 180-day intervals and then actual days, on a 360-day year. STDR: compounded quarterly, broken period on 365 days; TDR below 3 months: actual days / 365.", "src": "SBI website (sbi.bank.in): Interest Rates - Deposit Rates - Method of Calculation page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/interest-rates/interest-rates/deposit-rates", "checked": "2026-10-24", "tk": "Domestic deposit interest: 365-day year, leap year included."}, {"id": "S1-0362", "sec": "S1", "q": "Under SBI's revised locker agreement, before breaking open a locker of an untraceable hirer, the bank must issue a public notice of at least ____ in at least ____ newspapers.", "opts": ["1 month; one", "3 months; two (one English and one local language)", "6 months; three", "15 days; two", "2 months; one national"], "ans": 1, "exp": "Break-open happens before a committee of two bank officers and two independent witnesses; an inventory is made, contents are valued and kept sealed in a fireproof safe. Before any auction of contents, a further notice of at least 3 months is sent. The licence runs one year and is auto-extended; rent is recovered every 2 April.", "src": "SBI document on sbi.bank.in: Revised Safe Deposit Locker Agreement, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/documents/16012/22770835/050723-Revised+Locker+Agreement.pdf/267aa854-5133-9f9a-e1ed-80bc134d5898", "tk": "Locker break-open: public notice of 3 months in 2 newspapers (English + local)."}, {"id": "S1-0367", "sec": "S1", "q": "Under RBI's deposit-interest directions, banks may accept interest-free deposits only in:", "opts": ["Savings accounts of minors", "Current accounts", "Term deposits below 7 days", "Escrow accounts", "Any account, at the depositor's request"], "ans": 1, "exp": "RBI prohibits interest-free deposits other than in current accounts; banks may not accept interest-free deposits in any other account. (Savings deposits always earn interest, calculated on the daily balance.)", "src": "RBI FAQ on Interest Rate on Deposits Directions, 2025, and MD Interest Rate on Deposits (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://www.rbi.org.in/commonman/Upload/English/FAQs/PDFs/FAQIRD01042025.pdf"}, {"id": "S9-0414", "sec": "S9", "q": "Under RBI's framework for early recognition of stress, an account with principal or interest overdue for 61 to 90 days is classified as:", "opts": ["SMA-0", "SMA-1", "SMA-2", "Sub-standard asset", "NPA"], "ans": 2, "exp": "SMA-0 is up to 30 days overdue, SMA-1 is 31 to 60 days, and SMA-2 is 61 to 90 days. Beyond 90 days the account becomes an NPA.", "src": "RBI Prudential Framework for Resolution of Stressed Assets, 7 Jun 2019", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=11580"}, {"id": "S2-0004", "sec": "S2", "q": "Under the MSME classification revised with effect from 1 April 2025, a micro enterprise has investment and turnover not exceeding:", "opts": ["₹1 crore and ₹5 crore", "₹2.5 crore and ₹10 crore", "₹2 crore and ₹10 crore", "₹5 crore and ₹25 crore", "₹10 crore and ₹50 crore"], "ans": 1, "exp": "From 1 April 2025, micro means investment up to ₹2.5 crore and turnover up to ₹10 crore; small up to ₹25 crore and ₹100 crore; medium up to ₹125 crore and ₹500 crore.", "src": "Ministry of MSME notification revising MSME criteria, effective 1 Apr 2025", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://msme.gov.in/", "tk": "MSME from 1 Apr 2025: micro ₹2.5 cr / ₹10 cr · small ₹25 / ₹100 cr · medium ₹125 / ₹500 cr."}, {"id": "S2-0007", "sec": "S2", "q": "For an individual housing loan of ₹25 lakh, the maximum loan-to-value (LTV) ratio permitted is:", "opts": ["75%", "90%, including stamp duty and registration charges", "80%", "85%", "90%"], "ans": 4, "exp": "LTV caps are 90% for loans up to ₹30 lakh, 80% above ₹30 lakh up to ₹75 lakh, and 75% above ₹75 lakh.", "src": "RBI Master Circular - Housing Finance", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasterCirculars.aspx", "tk": "Housing LTV: up to ₹30 lakh 90% · ₹30-75 lakh 80% · above 75%."}, {"id": "S9-0420", "sec": "S9", "q": "Interest on a non-performing asset is recognised as income:", "opts": ["When it falls due", "When it is debited to the account", "Only when it is actually realised", "On accrual, if security value covers the loan", "At the end of each quarter"], "ans": 2, "exp": "Income from NPAs is recognised only on realisation, not on accrual.", "src": "RBI Master Circular - Prudential norms on Income Recognition, Asset Classification and Provisioning", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasterCirculars.aspx"}, {"id": "S2-0022", "sec": "S2", "q": "After a loan is fully repaid, the original property documents must be released within 30 days. If the delay beyond that is attributable to the bank, it must compensate the borrower, for each day of delay:", "opts": ["₹1,000", "₹500", "₹2,500", "₹5,000", "₹10,000"], "ans": 3, "exp": "For delay attributable to the bank beyond 30 days, compensation is ₹5,000 per day, for cases where release is due on or after 1 December 2023. If documents are lost or damaged, the bank must help obtain duplicates and pay the compensation, with a further 30 days allowed.", "src": "RBI circular on Responsible Lending Conduct - Release of property documents, 13 Sep 2023", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/", "tk": "Property papers late beyond 30 days: ₹5,000 a day."}, {"id": "S2-0025", "sec": "S2", "q": "For an individual housing loan of ₹50 lakh, the maximum loan-to-value ratio permitted is:", "opts": ["75%", "80% plus stamp duty and registration charges", "80%", "85%", "90%"], "ans": 2, "exp": "The LTV cap is 80% for loans above ₹30 lakh and up to ₹75 lakh; 90% up to ₹30 lakh; 75% above ₹75 lakh.", "src": "RBI Master Circular - Housing Finance", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasterCirculars.aspx", "tk": "Housing loan of ₹50 lakh: LTV 80%."}, {"id": "S7-0302", "sec": "S7", "q": "A bill of exchange payable after a stated period (for example, 90 days after sight) is a:", "opts": ["Demand bill", "Usance bill", "Accommodation bill", "Documentary demand bill", "Clean bill"], "ans": 1, "exp": "Usance bills are payable after a period and are financed by discounting; demand bills are payable on presentation and are financed by purchase.", "src": "Negotiable Instruments Act, 1881", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://indiacode.gov.in/"}, {"id": "S2-0201", "sec": "S2", "q": "For SBI's Personal Loan to salaried employees with a salary package account, the minimum service required is ____ for Government and Defence employees and ____ for Corporate-sector employees.", "opts": ["3 months; 6 months", "6 months; 12 months", "1 year; 2 years", "6 months; 24 months", "12 months; 12 months"], "ans": 1, "exp": "Government/Defence: 6 months; Corporate: 12 months. Age 21 to 60 years; loan up to ₹50 lakh, without security or guarantor, as a term loan or an overdraft with reducing drawing power.", "src": "SBI website (sbi.bank.in): SBI Personal Loan (Loans to Salaried Employees) page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/personal-banking/loans/personal-loans/sbi-personal-loan", "checked": "2026-10-24", "tk": "Salary personal loan: service 6 months (Govt/Defence) · 12 months (corporate)."}, {"id": "S2-0228", "sec": "S2", "q": "Under SBI's Kisan Credit Card, collateral security is waived for limits up to ____, and up to ____ where there is a tie-up arrangement.", "opts": ["₹1.60 lakh; ₹2 lakh", "₹2 lakh; ₹3 lakh", "₹3 lakh; ₹5 lakh", "₹1.60 lakh; ₹3 lakh", "₹2 lakh; ₹5 lakh"], "ans": 1, "exp": "SBI waives collateral for KCC limits up to ₹2 lakh, and up to ₹3 lakh with a tie-up arrangement. Above that, a mortgage of land or property worth 100% of the loan is taken.", "src": "SBI website (sbi.bank.in): Agri & Rural - Kisan Credit Card page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/agri-rural/yuva-kisan-credit-card", "tk": "KCC collateral waived: up to ₹2 lakh; ₹3 lakh with tie-up."}, {"id": "S2-0263", "sec": "S2", "q": "SBI's Shaurya Education Loan is available to wards or spouses of serving or retired personnel of which forces, maintaining their salary or pension account with SBI?", "opts": ["Only Army", "Defence, Indian Coast Guard and Central Armed Police Forces", "State Police", "Railways and Defence", "All Central Government employees"], "ans": 1, "exp": "Shaurya: wards/spouses (or the personnel themselves) of Defence, Coast Guard and CAPF with DSP/ICGSP/CAPSP salary or pension accounts. Margin nil up to ₹4 lakh, 5% above; processing fee nil up to ₹20 lakh, ₹10,000 above; repayment up to 15 years; 6 months' grace to create a mortgage.", "src": "SBI website (sbi.bank.in): Personal Banking - Shaurya Education Loan page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/personal-banking/shaurya-education-loan", "tk": "Shaurya Education Loan: Defence, Coast Guard, CAPF families."}, {"id": "S2-0280", "sec": "S2", "q": "Under SBI's MSME Udaan (finance to start-ups), the maximum loan and the door-to-door repayment period are:", "opts": ["₹10 crore; 60 months", "₹50 crore; 120 months", "₹25 crore; 84 months", "₹100 crore; 180 months", "₹5 crore; 120 months"], "ans": 1, "exp": "Up to ₹50 crore (two bands: up to ₹50 lakh and above), repayment up to 120 months including moratorium, bullet allowed; nil margin up to ₹10 lakh. For DPIIT-recognised start-ups with Udyam registration, up to 10 years old, turnover not above ₹100 crore in any year, backed by a recognised incubator/accelerator/investor.", "src": "SBI website (sbi.bank.in): Business - SME - Finance to Start-ups (MSME UDAAN) page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/web/business/s/sme/sme-loans/finance-to-start-ups-msme-udaan", "checked": "2026-10-24", "tk": "MSME Udaan: up to ₹50 crore; 120 months."}, {"id": "S2-0323", "sec": "S2", "q": "Per SBI's Commercial Loan FAQ (citing RBI's MSME Master Direction), the time limit for conveying a credit decision on an MSME loan up to ₹25 lakh is:", "opts": ["7 days", "14 days", "21 days", "30 days", "45 days"], "ans": 1, "exp": "14 days for loans up to ₹25 lakh. Through psbloansin59minutes.com, in-principle digital approval comes in 59 minutes, with sanction/disbursal generally in 7-8 working days. Collateral is not required for MSE loans up to ₹20 lakh (for loans sanctioned or renewed from 1 April 2026; earlier ₹10 lakh); with CGTMSE cover SBI lends collateral-free up to ₹500 lakh.", "src": "SBI website (sbi.bank.in): FAQs - Commercial Loan page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/faq-s/faqs-on-commercial-loan", "checked": "2026-10-24", "tk": "MSME credit decision up to ₹25 lakh: 14 days."}, {"id": "S2-0329", "sec": "S2", "q": "Under SBI's Policy on Penal Charges (w.e.f. 01.01.2026), total penal charges on a borrower cannot exceed, whatever the number of non-compliances:", "opts": ["2% a year of the outstanding", "5% a year of the sanctioned limit or outstanding balance, whichever is higher", "5% a year of the outstanding, whichever is lower", "10% of the sanctioned limit", "1% a month of the overdue amount"], "ans": 1, "exp": "Overall cap 5% p.a. of sanctioned limit/outstanding (whichever is higher). Charges are applied monthly for the actual period, and GST does not apply to penal charges except prepayment/foreclosure and commitment charges. Irregularity: 2.40% p.a. up to 60 days, 5% p.a. beyond.", "src": "SBI document on sbi.bank.in: Policy on Penal Charges in Loans and Advances w.e.f. 01.01.2026, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/documents/16012/22770835/Penal+Charges+Website+Display.pdf/3c6461ec-4e4a-fb18-3c5c-46b7a2ab0850", "tk": "Penal charges cap: 5% a year of limit or outstanding, higher."}, {"id": "S2-0335", "sec": "S2", "q": "Under ECLGS 5.0, after an account turns NPA, NCGTC pays the interim claim of ____ of the amount in default within ____ of the claim.", "opts": ["50%; 60 days", "75%; 30 days", "90%; 30 days", "100%; 90 days", "75%; 90 days"], "ans": 1, "exp": "75% interim within 30 days (after legal action has been initiated - a recall notice alone is not enough); the balance 25% on conclusion of recovery or three years from the first settlement, whichever is earlier. NPA must be marked on the portal within 90 days. Recoveries must be remitted within 30 days, else interest at repo + 4%.", "src": "SBI document on sbi.bank.in: FAQs on ECLGS 5.0 (updated 07.07.2026), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/", "tk": "ECLGS 5.0 claim: 75% interim within 30 days."}, {"id": "S2-0343", "sec": "S2", "q": "Under the SBI Scholar Loan MITC, the maximum loan WITHOUT security for institutes in List AA, A, B and C respectively is:", "opts": ["₹50 lakh; ₹40 lakh; ₹30 lakh; ₹7.5 lakh", "₹40 lakh; ₹30 lakh; ₹20 lakh; ₹7.5 lakh", "₹50 lakh; ₹30 lakh; ₹20 lakh; ₹10 lakh", "₹1 crore; ₹50 lakh; ₹30 lakh; ₹7.5 lakh", "₹50 lakh; ₹40 lakh; ₹20 lakh; ₹4 lakh"], "ans": 0, "exp": "With tangible collateral, List AA/A/B are need-based and List C goes above ₹7.5 lakh up to ₹1 crore. Parent/guardian co-obligation is optional for List AA institutes. Penal charges: 2.40% p.a. on the irregular portion up to 60 days; 5% p.a. on the outstanding if continuously irregular beyond 60 days.", "src": "SBI document on sbi.bank.in: SBI Scholar Loan - Most Important Terms and Conditions, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/documents/16012/75685/210224-MITC_17.02.2024.pdf/83069b89-7e74-a690-9031-db33c522cdd1", "tk": "Scholar Loan without security: AA ₹50 L · A ₹40 L · B ₹30 L · C ₹7.5 L."}, {"id": "S2-0345", "sec": "S2", "q": "For loans up to ____ to Micro and Small Enterprise borrowers, the credit decision must be taken within at most ____.", "opts": ["₹10 lakh; 7 working days", "₹25 lakh; 14 working days", "₹25 lakh; 21 days", "₹50 lakh; 14 working days", "₹1 crore; 30 days"], "ans": 1, "exp": "This assumes a complete application with all documents. The 21-day figure is the time for a lender to convey consent or objection to a request to transfer or take over an MSME loan. A composite loan of up to ₹1 crore (working capital plus term loan) can be sanctioned through a single window.", "src": "Ministry of MSME handbook \"Know Your Lender, Grow Your Business\" (on sbi.bank.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/", "tk": "MSE loans up to ₹25 lakh: decision within 14 working days."}, {"id": "S2-0349", "sec": "S2", "q": "As of March 2026, SBI's market share in education loans among all scheduled commercial banks was about:", "opts": ["18.5%", "24.6%", "32.9%", "41.2%", "50.3%"], "ans": 2, "exp": "SBI is India's largest education-loan lender (32.94% among ASCBs). It offers collateral-free loans of up to ₹50 lakh for admission to the top 100 global institutions, and Digital Document Execution for unsecured education loans.", "src": "SBI Annual Report 2025-26 (sbi.bank.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/web/investor-relations/annual-report", "tk": "SBI education-loan market share: about 32.9% (March 2026)."}, {"id": "S2-0350", "sec": "S2", "q": "Within the 18% agriculture target for domestic commercial banks, the sub-targets under the PSL Directions, 2025 are:", "opts": ["10% for non-corporate farmers, of which 8% for small and marginal farmers", "14% for non-corporate farmers, of which 10% for small and marginal farmers", "12% for small and marginal farmers only", "14% for small and marginal farmers, of which 10% for marginal farmers", "8% for small and marginal farmers"], "ans": 1, "exp": "Non-corporate farmers include individual farmers, proprietorship firms of farmers, and SHGs/JLGs of farmers. The same 18/14/10 structure applies to RRBs and SFBs; foreign banks with fewer than 20 branches have no agriculture target.", "src": "RBI Master Direction - Priority Sector Lending (Targets and Classification) Directions, 2025, updated 11 Sept 2026 (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=12799", "tk": "PSL agriculture: 18%, of which 14% non-corporate, 10% small/marginal."}, {"id": "S2-0369", "sec": "S2", "q": "Under RBI's co-lending directions effective 1 January 2026, each regulated entity in a co-lending arrangement must retain at least ____ of each individual loan in its books.", "opts": ["5%", "10%", "20%", "25%", "30%"], "ans": 1, "exp": "The old 2020 bank-NBFC model required the NBFC to retain at least 20%. The new framework applies to arrangements between banks, AIFIs and NBFCs (including HFCs), for any loan type, PSL or not, but not to consortium, multiple banking or syndicated loans. Banks can claim PSL status for their share of PSL-eligible co-lent loans.", "src": "RBI (Commercial Banks - Transfer and Distribution of Credit Risk) Directions, 2025, updated 1 Oct 2026 (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=13151", "tk": "Co-lending from 1 Jan 2026: each partner keeps at least 10%."}, {"id": "S2-0373", "sec": "S2", "q": "Under RBI's 2025 directions on lending against gold and silver, the maximum LTV for consumption loans where the total loan per borrower is above ₹2.5 lakh and up to ₹5 lakh is:", "opts": ["75%", "80%", "85%", "90%", "70%"], "ans": 1, "exp": "Up to ₹2.5 lakh: 85%; above ₹2.5 lakh up to ₹5 lakh: 80%; above ₹5 lakh: 75%. For bullet-repayment loans, both the loan amount and the LTV are calculated on the total amount payable at maturity (principal plus interest). LTV must be maintained throughout the tenor.", "src": "RBI (Lending Against Gold and Silver Collateral) Directions, 2025, updated 29 Sept 2025 (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://rbi.org.in/scripts/NotificationUser.aspx?Mode=0&Id=12859", "why": {"0": "Loans above ₹5 lakh", "2": "Loans up to ₹2.5 lakh"}, "tk": "Gold loan LTV: ≤₹2.5 lakh 85% · ₹2.5-5 lakh 80% · above 75%."}, {"id": "S2-0380", "sec": "S2", "q": "Under RBI's KCC Scheme Directions, 2026, applicable to KCC loans sanctioned from 1 January 2027, the composite KCC facility has a tenure of:", "opts": ["3 years", "5 years", "6 years", "7 years", "10 years"], "ans": 2, "exp": "Under the KCC Directions, 2026, KCCs sanctioned from 1 January 2027 have a six-year tenure. The KCC limit (Composite Maximum Permissible Limit) is the short-term limit fixed for the sixth year plus the estimated long-term (investment) limit. Under the earlier scheme, banks decided the card's validity and the limit was projected over 5 years. Loans sanctioned before 1 January 2027 follow the old guidelines till maturity or next renewal.", "src": "RBI [Commercial Banks - Kisan Credit Card (KCC) Scheme] Directions, 2026 (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/scripts/BS_ViewMasDirections.aspx?id=13522", "tk": "KCC sanctioned from 1 Jan 2027: 6-year tenure."}, {"id": "S2-0388", "sec": "S2", "q": "Under RBI's Interest Rates on Advances Directions, 2025, floating-rate loans that MUST be linked to an external benchmark are:", "opts": ["All corporate loans", "Personal/retail loans (housing, auto, etc.) and loans to MSMEs", "Only home loans", "All loans above ₹1 crore", "Agricultural loans only"], "ans": 1, "exp": "Permitted external benchmarks: RBI's policy repo rate, the 3-month or 6-month Treasury Bill yield published by FBIL, or any other FBIL benchmark. A bank must use one uniform external benchmark within a loan category. Banks may also offer EBLR loans to other borrowers.", "src": "RBI (Commercial Banks - Interest Rates on Advances) Directions, 2025 (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=13149&Mode=0", "tk": "External benchmark mandatory: retail and MSME floating loans."}, {"id": "S3-0001", "sec": "S3", "q": "The minimum amount that can be sent through RTGS is:", "opts": ["₹50,000", "No minimum", "₹1 lakh", "₹2 lakh", "₹5 lakh"], "ans": 3, "exp": "RTGS is meant for large-value payments, with a minimum of ₹2 lakh and no upper limit. NEFT has no minimum.", "src": "RBI RTGS System Regulations", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://www.rbi.org.in/"}, {"id": "S7-0311", "sec": "S7", "q": "Payment systems in India are regulated and supervised by RBI under:", "opts": ["The Banking Regulation Act, 1949", "The Payment and Settlement Systems Act, 2007", "The Information Technology Act, 2000", "The RBI Act, 1934, Section 45L", "The FEMA, 1999"], "ans": 1, "exp": "The Payment and Settlement Systems Act, 2007 designates RBI as the authority to regulate and supervise payment systems. RBI exercises these powers through the Payments Regulatory Board (PRB), which replaced the Board for Regulation and Supervision of Payment and Settlement Systems (BPSS) from 9 May 2025.", "src": "Payment and Settlement Systems Act, 2007", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://indiacode.gov.in/", "tk": "RBI regulates payment systems under the PSS Act, 2007."}, {"id": "S3-0008", "sec": "S3", "q": "A customer reports an unauthorised electronic debit within 3 working days of receiving the bank's communication about it, and the fraud was due to a third-party breach (neither the bank nor the customer at fault). The customer's liability is:", "opts": ["Nil", "The transaction value or ₹5,000, whichever is lower", "Up to ₹5,000", "Up to ₹10,000", "The full amount"], "ans": 0, "exp": "Zero liability: where the deficiency lies elsewhere in the system (third-party breach) and the customer reports within 3 working days of receiving the bank's communication (the day of receipt excluded). If reported in 4-7 working days, liability is limited to the transaction value or a fixed cap (₹5,000 to ₹25,000 depending on account type), whichever is lower.", "src": "RBI circular on Customer Protection - Limiting Liability of Customers in Unauthorised Electronic Banking Transactions, 6 Jul 2017", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/", "tk": "Third-party breach reported within 3 working days: zero liability."}, {"id": "S3-0011", "sec": "S3", "q": "The national helpline number for reporting cyber financial fraud is:", "opts": ["100", "1800-11-0001", "112", "1930", "14440"], "ans": 3, "exp": "Victims can call 1930 or report at cybercrime.gov.in under the Citizen Financial Cyber Fraud Reporting and Management System.", "src": "Ministry of Home Affairs, Indian Cyber Crime Coordination Centre (I4C)", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1}, {"id": "S3-0025", "sec": "S3", "q": "Unified Payments Interface (UPI) was launched by NPCI in:", "opts": ["2010", "2015", "2014", "2016", "2019"], "ans": 3, "exp": "UPI was launched in April 2016 and became the dominant retail payment system within a few years.", "src": "NPCI - UPI product overview", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://www.npci.org.in/"}, {"id": "S3-0201", "sec": "S3", "q": "SBI Green Remit Card is used for:", "opts": ["International ATM withdrawals", "Cash deposits by non-account holders into a designated SBI account through Green Channel Counters or CDMs", "Contactless metro travel", "Online shopping without PIN", "Paying utility bills through POS"], "ans": 1, "exp": "The Green Remit Card is a magstripe card without PIN, mapped to one beneficiary's SBI account, for cash deposits at Green Channel Counters and Cash Deposit Machines. Issue charge ₹20 + GST.", "src": "SBI website (sbi.bank.in): Green Remit Card page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://sbi.bank.in/web/personal-banking/cards/debit-card/green-remit-card"}, {"id": "S3-0209", "sec": "S3", "q": "To register for SBI WhatsApp Banking, a customer sends \"Hi\" to:", "opts": ["+91 72089 33148", "+91 90226 90226", "+91 80082 02020", "+91 94491 12211", "+91 72089 33145"], "ans": 1, "exp": "SBI WhatsApp Banking: send 'Hi' to +91 90226 90226 and complete OTP authentication. It supports voice commands and 8 languages (English, Hindi, Tamil, Telugu, Bengali, Marathi, Gujarati and Punjabi).", "src": "SBI website (sbi.bank.in): WhatsApp Banking page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://sbi.bank.in/web/personal-banking/digital/whatsapp-banking", "checked": "2026-10-24"}, {"id": "S3-0223", "sec": "S3", "q": "YONO Cash allows cardless cash withdrawal at which SBI touch points?", "opts": ["SBI ATMs only", "SBI ATMs, SBI merchant POS terminals and SBI Customer Service Points", "Any bank's ATM through UPI", "SBI branches only", "SBI ATMs and other banks' ATMs"], "ans": 1, "exp": "YONO Cash works at SBI ATMs, SBI merchant POS terminals and SBI CSPs in India, without a card or withdrawal slip. Cardless deposits can also be made at SBI cash deposit machines.", "src": "SBI website (sbi.bank.in): YONO - What is YONO Cash page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://sbi.bank.in/web/yono/what-is-yono-cash"}, {"id": "S3-0254", "sec": "S3", "q": "From 1 October 2026, SBI Salary Package account holders get how many free transactions a month at other banks' ATMs?", "opts": ["Unlimited", "10", "5", "3", "Nil"], "ans": 2, "exp": "Salary package accounts: unlimited until November 2025, 10 from 1 December 2025, and 5 from 1 October 2026 (financial plus non-financial). After that, ₹23 + GST per cash withdrawal and ₹11 + GST per non-financial transaction.", "src": "SBI public notice on its website: Revision in number of free monthly ATM transactions at other bank ATMs for Salary Package accounts w.e.f. 1 October 2026, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/documents/16012/22770835/01092026_Revision+in+monthly+FREE+ATM+transactions+of+Salary+Package+Accounts+w.e.f.+1st+October+2026.pdf/1669118d-50df-808a-077f-1a6246447354", "tk": "Salary package free other-bank ATM transactions: 5 a month from 1 Oct 2026."}, {"id": "S3-0262", "sec": "S3", "q": "On SBI's Visa Infinite debit card, the complimentary personal accident cover for air accident death is:", "opts": ["₹10 lakh", "₹20 lakh", "₹50 lakh", "₹1 crore", "₹2 crore"], "ans": 3, "exp": "Visa Infinite: non-air ₹50 lakh, air ₹1 crore, purchase protection ₹1 lakh; 2 domestic lounge visits a quarter. Mastercard World: ₹10 lakh / ₹20 lakh. HPCL Everyday card: ₹5 lakh / ₹10 lakh. Cover needs at least one financial transaction in the 90 days before the accident (air cover also needs the ticket bought on the card).", "src": "SBI website (sbi.bank.in): Personal Banking - VISA Infinite Debit Card page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/web/personal-banking/cards/debit-card/visa-infinite-debit-card", "why": {"0": "Mastercard World, non-air", "1": "Mastercard World, air", "2": "Visa Infinite non-air cover"}, "tk": "Visa Infinite debit card: air accident ₹1 crore · non-air ₹50 lakh."}, {"id": "S3-0274", "sec": "S3", "q": "For foreign Visa and Mastercard cardholders, SBI ATMs offer Dynamic Currency Conversion (DCC) in how many currencies?", "opts": ["5", "10", "15", "21", "30"], "ans": 3, "exp": "DCC lets foreign cardholders transact in their home currency (21 currencies). SBI has 64,000+ ATMs/ADWMs (about 12,000+ ADWMs that also accept cash deposits), connected to NFS (including RuPay), Visa and Mastercard.", "src": "SBI website (sbi.bank.in): Personal Banking - ATM Services page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/web/personal-banking/information-services/kyc-guidelines/atm-services", "checked": "2026-10-24", "tk": "SBI ATM Dynamic Currency Conversion: 21 currencies."}, {"id": "S3-0287", "sec": "S3", "q": "For an Insta Plus (Video KYC) savings account on YONO, the video call must be completed within ____ of token generation, and slots can be booked for the next ____.", "opts": ["2 days; 7 days", "5 days; 3 working days", "7 days; 5 working days", "30 days; 10 days", "24 hours; 1 day"], "ans": 1, "exp": "Video calls only in office hours on working days; resumable if dropped. Single mode of operation only; new-to-bank resident literate adults; nomination mandatory; RuPay Classic card; account active for debits after verification by bank officials.", "src": "SBI website (sbi.bank.in): YONO - Savings Account through Video KYC (Insta Plus) page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/web/yono/insta-plus-savings-bank-account", "tk": "Video KYC call: within 5 days of token; book 3 working days ahead."}, {"id": "S3-0298", "sec": "S3", "q": "After setting or resetting the UPI PIN on SBI apps, an Android user can transact at most ____ in the first ____.", "opts": ["₹1,000; 12 hours", "₹5,000; 24 hours", "₹10,000; 24 hours", "₹5,000; 5 days", "₹25,000; 48 hours"], "ans": 1, "exp": "Android: ₹5,000 in total for the first 24 hours; iOS: ₹5,000 a day for the first 5 days. Then ₹1 lakh per transaction and per day on BHIM SBI Pay, UPI on YONO or YFEI.", "src": "SBI website (sbi.bank.in): YONO Blog - Secure Every UPI Payment: Limits and Cooling Periods, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/yono/blog/understand-upi-transaction-limits-cooling-period-and-payment-tips", "checked": "2026-10-24", "tk": "New UPI PIN on Android: ₹5,000 in the first 24 hours."}, {"id": "S3-0312", "sec": "S3", "q": "On BHIM SBI Pay / YONO UPI, a user can create at most ____ VPAs, and a self-chosen numeric \"UPI number\" (mapper) must be ____ digits long.", "opts": ["1; 6", "3; 8 to 10 (a 10-digit number must be the user's own mobile number)", "5; 10 only", "3; 6 to 8", "10; 12"], "ans": 1, "exp": "Max 3 VPAs; one VPA can be linked to several accounts, with a default/primary account receiving credits. UPI numbers are 8-10 digits; a 10-digit one must be the user's mobile number. VPA handles: @sbi or @oksbi.", "src": "SBI website (sbi.bank.in): Customer Care - FAQ - UPI page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/web/customer-care/upi", "checked": "2026-10-24", "tk": "BHIM SBI Pay: up to 3 VPAs; UPI number 8-10 digits."}, {"id": "S3-0320", "sec": "S3", "q": "Per SBI's RTGS/NEFT FAQ, a beneficiary bank must credit an RTGS remittance within ____ of receiving it, and if it cannot, return it within ____.", "opts": ["2 hours; 4 hours", "30 minutes; one hour or before end of the RTGS business day, whichever is earlier", "1 hour; same day", "15 minutes; 30 minutes", "Immediately; T+1"], "ans": 1, "exp": "RTGS: credit within 30 minutes, return within 1 hour (or end of day). NEFT: half-hourly batches 24x7; credit expected within 2 hours of the batch; failed credits returned within B+2 hours. RTGS minimum ₹2 lakh, no maximum; NEFT from ₹1, no maximum. LEI is required for eligible large-value transactions.", "src": "SBI website (sbi.bank.in): FAQs - RTGS/NEFT page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/personal-banking/rtgs-neft", "checked": "2026-10-24", "tk": "RTGS: credit in 30 minutes, return within 1 hour."}, {"id": "S3-0324", "sec": "S3", "q": "Which SBI Corporate Internet Banking product is a complete multi-user suite for large corporates and government bodies, allowing up to ₹2,000 crore per transaction across accounts at many branches?", "opts": ["Khata", "Saral", "Vyapaar", "Vistaar", "Two User"], "ans": 3, "exp": "Khata: single-user enquiry only (cannot be upgraded). Khata Plus: multi-user enquiry, many branches. Saral: single-user transactional for proprietors/micro units. Two User: ₹50 lakh per transaction, single or joint authorisation. Vyapaar: multi-user transactional, single branch, ₹2 crore per transaction. Vistaar: multi-branch, ₹2,000 crore per transaction, no daily count limit.", "src": "SBI website (sbi.bank.in): FAQs - Corporate Internet Banking page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/faq-s/-faq-corporate-internet-banking", "tk": "CINB Vistaar: multi-user suite, up to ₹2,000 crore a transaction."}, {"id": "S3-0333", "sec": "S3", "q": "If a bank issues an unsolicited credit card (or upgrades a card) and activates and bills it without the recipient's explicit consent, it must reverse the charges and also pay the recipient a penalty of:", "opts": ["₹500", "An amount equal to the charges", "Twice the value of the charges reversed", "₹100 per day", "Nothing more"], "ans": 2, "exp": "The recipient may also approach the RBI Ombudsman for compensation. Any loss from misuse of unsolicited cards before delivery is the card-issuer's responsibility. Renewal or replacement cards are not \"unsolicited\"; on renewal the holder must be given the option to decline.", "src": "RBI Credit Card and Debit Card - Issuance and Conduct Directions, 2022 (upd. 7 Mar 2024), consolidated in the 2025 Commercial Banks card Directions (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=12300", "tk": "Unsolicited card billed: reverse charges + penalty twice the amount."}, {"id": "S3-0341", "sec": "S3", "q": "Under RBI's Digital Lending Directions, 2025, a borrower may exit a digital loan without penalty during a \"cooling-off period\" of at least:", "opts": ["1 day, as fixed by the lender's Board", "3 days", "7 days", "15 days", "30 days"], "ans": 0, "exp": "The borrower repays the principal and the proportionate APR; the lender may keep a reasonable one-time processing fee if disclosed upfront in the Key Fact Statement. After the cooling-off period, prepayment follows normal RBI rules.", "src": "RBI (Digital Lending) Directions, 2025, 8 May 2025 (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=12848", "tk": "Digital loan cooling-off: at least 1 day."}, {"id": "S4-0001", "sec": "S4", "q": "The Reserve Bank - Integrated Ombudsman Scheme, 2026 came into force on:", "opts": ["12 November 2021", "1 April 2026", "1 July 2026", "1 October 2026", "1 January 2026"], "ans": 2, "exp": "RB-IOS 2026 came into force on 1 July 2026 and repealed RB-IOS 2021 (which had started on 12 November 2021). Complaints received before 1 July 2026 continue under the 2021 scheme.", "src": "Reserve Bank - Integrated Ombudsman Scheme, 2026 (in force from 1 July 2026), as published on SBI's website", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/", "tk": "RB-IOS 2026 in force: 1 July 2026 (replaced RB-IOS 2021)."}, {"id": "S1-0438", "sec": "S1", "q": "The RBI portal that lets the public search for their unclaimed deposits across several banks in one place is called:", "opts": ["SAMPARK", "UDGAM", "PRAVAAH", "SACHET", "DAKSH"], "ans": 1, "exp": "UDGAM (Unclaimed Deposits - Gateway to Access inforMation) was launched in August 2023.", "src": "RBI press release on UDGAM portal, 17 Aug 2023", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://www.rbi.org.in/"}, {"id": "S4-0053", "sec": "S4", "q": "A CTS-2010 standard cheque carries security features such as:", "opts": ["A magnetic stripe", "A \"VOID\" pantograph and the bank's logo in ultraviolet ink", "A hologram of the RBI Governor", "A QR code for the payee", "A microchip embedded in the leaf"], "ans": 1, "exp": "Features include a VOID pantograph that shows up on photocopies, the bank logo printed in invisible UV ink, and standard field placement for image-based clearing.", "src": "RBI instructions on CTS-2010 standard cheque features", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/", "tk": "CTS-2010 cheque: VOID pantograph and UV-ink bank logo."}, {"id": "S4-0083", "sec": "S4", "q": "When a customer deposits money in a savings or current account, the relationship between banker and customer is primarily that of:", "opts": ["Trustee and beneficiary", "Debtor and creditor", "Pledgee and pledgor", "Agent and principal", "Bailee and bailor"], "ans": 1, "exp": "The bank becomes the debtor and the customer the creditor; the bank need not keep the same notes and may use the money, repaying on demand.", "src": "Banker-customer relationship (case law and standard practice)", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1}, {"id": "S4-0201", "sec": "S4", "q": "The origin of State Bank of India goes back to the establishment of which bank, and when?", "opts": ["Bank of Bengal, 2 January 1809", "Bank of Calcutta, 2 June 1806", "Bank of Bombay, 15 April 1840", "Bank of Hindostan, 1770", "General Bank of India, 1786"], "ans": 1, "exp": "SBI traces its origin to the Bank of Calcutta, set up on 2 June 1806. Three years later it received its charter and was re-designated the Bank of Bengal (2 January 1809), the first joint-stock bank of British India sponsored by the Government of Bengal.", "src": "SBI website (sbi.bank.in): About Us - Evolution of SBI, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://sbi.bank.in/web/about-us", "checked": "2026-10-24"}, {"id": "S4-0227", "sec": "S4", "q": "In SBI's grievance redressal and escalation mechanism, the correct order of levels is:", "opts": ["Branch → DGM (CX) → AGM (CX) → Banking Ombudsman", "Branch → AGM (CX) → DGM (CX) → Banking Ombudsman", "Branch → Banking Ombudsman → AGM (CX) → DGM (CX)", "Contact Centre → Chairman → Banking Ombudsman", "Branch → Regional Manager → Local Head Office → Corporate Centre"], "ans": 1, "exp": "Level 1 is the branch, Level 2 the AGM (Customer Experience), Level 3 the DGM (Customer Experience), and Level 4 the Banking Ombudsman, with complaints to RBI through the CMS portal.", "src": "SBI website (sbi.bank.in): Customer Care - Grievance Redressal and Escalation Mechanism page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/customer-care/grievance-redressal-and-escalation-mechanism", "tk": "SBI escalation: Branch → AGM (CX) → DGM (CX) → Ombudsman."}, {"id": "S4-0245", "sec": "S4", "q": "Under SBI's RTI arrangement, who has been designated as Assistant Central Public Information Officers (ACPIOs)?", "opts": ["Regional Managers", "All Branch Managers of SBI branches", "Chief Managers (Customer Service) only", "The Chief General Manager of each circle", "Compliance officers at LHOs"], "ans": 1, "exp": "All SBI Branch Managers are ACPIOs; they receive applications, enter them in a register, acknowledge them, and forward them to the concerned CPIO. Information can be given only to citizens of India.", "src": "SBI website (sbi.bank.in): Corporate Governance - Information page (G-SIB indicators, CSR, FEDAI/FIMMDA, RTI), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://sbi.bank.in/web/corporate-governance/information"}, {"id": "S7-0338", "sec": "S7", "q": "Under the RTI Act, information concerning the life or liberty of a person must be supplied within:", "opts": ["24 hours", "48 hours", "72 hours", "5 days", "7 days"], "ans": 1, "exp": "Life or liberty: 48 hours. Normal course: 30 days. When received through a CAPIO, 5 days are added to either limit. If the time limit is missed, the information must be given free of charge.", "src": "SBI website (sbi.bank.in): Corporate Governance - Right to Information Act 2005 page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/corporate-governance/right-to-information-act-2005", "checked": "2026-10-24", "tk": "RTI life or liberty: 48 hours · normal 30 days (+5 via CAPIO)."}, {"id": "S4-0267", "sec": "S4", "q": "Under SBI's cheque collection policy, the outer time limit for collecting an outstation cheque drawn on an SBI branch between two metro / major \"A\" class cities is ____, against ____ for a cheque drawn on another bank.", "opts": ["3 days; 5 days", "6 days; 7 days", "7 days; 10 days", "8 days; 10 days", "10 days; 14 days"], "ans": 1, "exp": "SBI branches / other banks: metros and major A-class cities 6/7 days; between those and state capitals or Area I cities (Pune, Nagpur, Kanpur, Surat, Agra, Varanasi etc.) 8/10 days; all other centres 10/14 days. These are outer limits; credit is given as soon as proceeds are realised.", "src": "SBI website (sbi.bank.in): Customer Care - Arrangements For Collection Of Domestic Cheques page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/web/customer-care/arrangements-for-collection-of-domestic-cheques", "tk": "Outstation cheques metro/A-class: SBI 6 days · other banks 7."}, {"id": "S4-0283", "sec": "S4", "q": "Under RBI's Internal Ombudsman Directions, 2026, a bank's Internal Ombudsman must be of rank equivalent to ____ with at least ____ of relevant experience.", "opts": ["AGM; 5 years", "General Manager; 7 years", "Chief General Manager; 10 years", "DGM; 5 years", "Executive Director; 15 years"], "ans": 1, "exp": "IO: GM-equivalent (retired or serving, from an RE or a financial-sector regulator), 7 years' experience, never employed by the bank or its group, not over 70 at end of tenure. Deputy IO: DGM-equivalent, 5 years. Tenure fixed at not less than 3 years, total not more than 5. The IO reports administratively to the WTD/ED in charge of customer service and functionally to the Customer Service Committee of the Board.", "src": "RBI (Commercial Banks - Internal Ombudsman) Directions, 2026 (14 Jan 2026), as hosted on sbi.bank.in Customer Service Policies, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/", "tk": "Internal Ombudsman: GM-rank, 7 years' experience."}, {"id": "S4-0286", "sec": "S4", "q": "Under SBI's Compensation Policy, where a fraud in a customer's account is established to have been committed by a member of staff, the bank will:", "opts": ["Restore the amount only after the police case is closed", "Restore the amount and also pay compensation at 1% above the applicable interest rate for the period, on the amount involved", "Restore 50% of the amount", "Pay ₹100 per day of delay", "Restore the amount at Savings Bank rate only"], "ans": 1, "exp": "Where fraud by a staff member is established, SBI restores the amount and pays compensation at 1% above the rate applicable to the deposit, overdraft or loan account concerned, for the period involved. Separately, for an unauthorised or erroneous debit, the bank refunds the amount and, if a cheque was returned or a direct debit not executed as a result, pays the financial loss plus interest at SB rate (minimum ₹100) and refunds cheque return charges.", "src": "SBI document on sbi.bank.in: Customer Rights, Grievance Redressal and Compensation Policy, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/documents/53471/263971/12052026_Customer+Rights%2CGrievance+Redressal+and+Compensation+Policy.pdf/834818f3-4529-ca6b-5203-e8f1cfd6b2d5", "tk": "Staff fraud in customer account: restore amount + 1% above the account rate."}, {"id": "S4-0295", "sec": "S4", "q": "Under the amended Note Refund Rules (2018), a mutilated ₹500 note whose single largest undivided piece is 70% of the note's area is paid:", "opts": ["Full value", "Half value", "Nothing (rejected)", "Three-quarters of the value", "Full value only at an RBI Issue Office"], "ans": 1, "exp": "For ₹50 and above: more than 80% = full value; 40% to 80% (inclusive) = half value; less than 40% = rejected. The 2018 amendment raised the full-value threshold from 65% to 80% because Mahatma Gandhi (New) series notes are smaller. For notes up to ₹20: more than 50% = full value, otherwise rejected.", "src": "RBI FAQ \"Indian Currency\" (updated 15 Apr 2025), rbi.org.in, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://www.rbi.org.in/commonman/Upload/English/FAQs/PDFs/INDIANCURRENCY15042025.pdf", "tk": "Mutilated ₹50+ notes: >80% full · 40-80% half · <40% rejected."}, {"id": "S1-0447", "sec": "S1", "q": "After every locker operation, RBI requires the bank to:", "opts": ["Send a monthly statement of operations", "Send an email and SMS alert to the registered ID/mobile before the end of the day, confirming the date and time of operation and the redressal mechanism", "Inform the nominee", "Record the contents", "Do nothing unless the hirer asks"], "ans": 1, "exp": "After every locker operation, the bank must send an email and SMS alert to the hirer's registered email ID and mobile number before the end of the day, confirming the date and time of operation and the redressal mechanism. It also keeps a check-in/check-out register signed by everyone who accesses the locker.", "src": "RBI Safe Deposit Locker / Safe Custody Article Facility - Revised Instructions (RBI/2021-22/86), consolidated in RBI Responsible Business Conduct Directions, 2025 (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=12146&Mode=0"}, {"id": "S4-0323", "sec": "S4", "q": "Under RBI's KYC Directions, 2025, a bank must upload a customer's KYC records to the Central KYC Records Registry (CKYCR) within ____ of starting the account-based relationship.", "opts": ["3 days", "7 days", "10 days", "15 days", "30 days"], "ans": 2, "exp": "This follows Rule 9(1A) of the PML Rules. Older accounts are uploaded at the time of periodic updation. The KYC Identifier is 14 digits; CKYCR is run by CERSAI.", "src": "RBI (Commercial Banks - Know Your Customer) Directions, 2025, updated 1 Oct 2026 (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=13141", "tk": "Upload KYC to CKYCR: within 10 days."}, {"id": "S4-0329", "sec": "S4", "q": "Under RB-IOS 2026, an Award by the RBI Ombudsman lapses unless the complainant gives the bank a letter of acceptance (in full and final settlement) within:", "opts": ["15 days of receiving the Award", "30 days of receiving the Award", "45 days", "60 days", "90 days"], "ans": 1, "exp": "The bank must then comply and inform the Ombudsman, or appeal, within 30 days of receiving the acceptance letter. A complainant who has filed an appeal cannot also furnish acceptance.", "src": "Reserve Bank - Integrated Ombudsman Scheme, 2026 (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.rbi.org.in/", "tk": "RB-IOS 2026 award: accept within 30 days or it lapses."}, {"id": "S5-0001", "sec": "S5", "q": "Under the Liberalised Remittance Scheme, a resident individual can remit abroad up to:", "opts": ["USD 1,00,000 per year", "USD 2,50,000 per financial year", "USD 2,50,000 per calendar year", "USD 5,00,000 per financial year", "No limit for permitted purposes"], "ans": 1, "exp": "The LRS limit is USD 2,50,000 per financial year for permitted current and capital account transactions.", "src": "RBI Master Direction, Liberalised Remittance Scheme (FEMA, 1999)", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://rbi.org.in/scripts/BS_ViewMasDirections.aspx?id=10192"}, {"id": "S5-0002", "sec": "S5", "q": "FEMA, which replaced FERA, came into force on:", "opts": ["1 April 1999", "1 June 2000", "1 January 2001", "15 August 2000", "29 December 1999"], "ans": 1, "exp": "The Foreign Exchange Management Act, 1999 came into force on 1 June 2000. Unlike FERA, FEMA generally treats contraventions as civil matters with monetary penalties; the exception is Sec 13(1C), under which specified contraventions involving foreign assets can attract imprisonment up to 5 years.", "src": "Foreign Exchange Management Act, 1999", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://indiacode.gov.in/"}, {"id": "S5-0023", "sec": "S5", "q": "When the forward rate of the US dollar against the rupee is higher than the spot rate, the dollar is said to be at a:", "opts": ["Forward discount", "Forward premium", "Par", "Swap discount", "Cross rate"], "ans": 1, "exp": "The forward premium usually reflects the interest rate difference between the two currencies.", "src": "Standard foreign exchange practice", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "tk": "Forward rate above spot: forward premium."}, {"id": "S5-0201", "sec": "S5", "q": "Under SBI's \"Fxout\" platform, a resident individual sending money abroad through Internet Banking may remit up to ____ per transaction / per day, within the overall LRS limit of ____ per financial year.", "opts": ["USD 25,000; USD 2,50,000", "USD 40,000; USD 2,50,000", "USD 50,000; USD 1,00,000", "USD 2,50,000; USD 2,50,000", "USD 40,000; USD 1 million"], "ans": 1, "exp": "Fxout limits: through a branch, USD 2,50,000 per transaction/day; through INB or YONO, USD 40,000 per transaction/day; all within the LRS limit of USD 2,50,000 a financial year.", "src": "SBI website (sbi.bank.in): Remittance From India page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/web/international-banking/services/remmitance-from-india", "checked": "2026-10-24", "tk": "Fxout: INB/YONO USD 40,000 · branch USD 2,50,000 (within LRS)."}, {"id": "S5-0215", "sec": "S5", "q": "SBI's IFSC Banking Unit at GIFT City gives NRIs an overdraft or demand loan against their FCNR(B) deposits. The minimum loan and the margin are:", "opts": ["USD 10,000; 10%", "USD 25,000; 15% on principal plus accrued interest", "USD 50,000; 25%", "USD 25,000; 5%", "USD 1,000; nil"], "ans": 1, "exp": "Minimum USD 25,000 (no maximum), margin 15%, lien on FCNR(B) deposits with at least 3 months to maturity, OD up to 12 months and DL up to 3 years, processing fee 0.10% (minimum USD 100). Loan proceeds cannot be used in India.", "src": "SBI website (sbi.bank.in): International Banking - Retail Banking (GIFT City loan against FCNR(B)) page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/web/international-banking/banking/retail-banking", "checked": "2026-10-24", "tk": "GIFT City loan against FCNR(B): minimum USD 25,000; margin 15%."}, {"id": "S5-0227", "sec": "S5", "q": "On SBI's e-Forex portal (YONO Business), once a live rate is displayed, the booking must be completed within:", "opts": ["10 seconds", "30 seconds", "60 seconds", "2 minutes", "5 minutes"], "ans": 1, "exp": "Live rate valid 30 seconds. Minimum booking USD 1 / EUR 3 / GBP 3; maximum USD 5 million / EUR 3 million / GBP 3 million. Pairs: USD/INR, GBP/INR, EUR/INR, GBP/USD, EUR/USD. A booked deal cannot be deleted online; on cancellation through the branch any gain is not passed on and any loss is recovered.", "src": "SBI website (sbi.bank.in): Business - Global Markets - FAQs page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/web/business/information/global-markets", "checked": "2026-10-24", "tk": "e-Forex live rate: book within 30 seconds."}, {"id": "S5-0243", "sec": "S5", "q": "Which remittance is NOT permitted under the Liberalised Remittance Scheme?", "opts": ["Gift to a relative abroad", "Studies abroad", "Margin or margin calls to an overseas exchange", "Maintenance of a close relative abroad", "Purchase of property abroad"], "ans": 2, "exp": "Margin or margin calls to overseas exchanges are not allowed under LRS. Also barred: items prohibited under Schedule I or restricted under Schedule II of the Current Account Transaction Rules, and capital-account remittances to countries identified by FATF as non-cooperative. LRS is open to resident individuals including minors (Form A2 signed by the natural guardian).", "src": "RBI Master Direction - Liberalised Remittance Scheme, upd. 6 Sep 2024 (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://rbi.org.in/scripts/BS_ViewMasDirections.aspx?id=10192", "tk": "LRS bars margin payments to overseas exchanges."}, {"id": "S6-0001", "sec": "S6", "q": "Pradhan Mantri Jeevan Jyoti Bima Yojana (PMJJBY) gives a life cover of:", "opts": ["₹1 lakh", "₹2 lakh", "₹5 lakh", "₹10 lakh", "₹2.5 lakh"], "ans": 1, "exp": "PMJJBY offers ₹2 lakh life cover for death due to any cause, at an annual premium of ₹436 (revised from 1 June 2022).", "src": "PMJJBY scheme rules, revised 1 Jun 2022", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://jansuraksha.gov.in/"}, {"id": "S6-0003", "sec": "S6", "q": "Pradhan Mantri Jan Dhan Yojana (PMJDY) was launched on:", "opts": ["15 August 2014", "28 August 2014", "2 October 2014", "1 April 2015", "26 January 2015"], "ans": 1, "exp": "PMJDY was launched on 28 August 2014 to give every household access to a bank account.", "src": "PMJDY scheme document, Department of Financial Services", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://pmjdy.gov.in/"}, {"id": "S6-0009", "sec": "S6", "q": "A Sukanya Samriddhi account can be opened for a girl child below the age of:", "opts": ["5 years", "10 years", "12 years", "18 years", "8 years"], "ans": 1, "exp": "The account can be opened for a girl below 10, with deposits from ₹250 to ₹1.5 lakh a year.", "src": "Sukanya Samriddhi Account Scheme, 2019", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://www.nsiindia.gov.in/"}, {"id": "S6-0025", "sec": "S6", "q": "The annual premium for Pradhan Mantri Jeevan Jyoti Bima Yojana (PMJJBY) is:", "opts": ["₹20", "₹330", "₹436", "₹1,000", "₹456"], "ans": 2, "exp": "PMJJBY gives ₹2 lakh life cover for ₹436 a year, revised from ₹330 with effect from 1 June 2022.", "src": "PMJJBY scheme rules, revised 1 Jun 2022", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://jansuraksha.gov.in/"}, {"id": "S6-0053", "sec": "S6", "q": "A PPF account can be opened:", "opts": ["By a single person or jointly with a minor child", "Jointly by husband and wife", "Only in a single name (with a guardian for a minor)", "By an HUF", "By an NRI"], "ans": 2, "exp": "PPF accounts are single-holder only; a person can have one account, plus accounts on behalf of minors.", "src": "Public Provident Fund Scheme, 2019", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://www.nsiindia.gov.in/"}, {"id": "S6-0201", "sec": "S6", "q": "The Lead Bank Scheme was introduced in ____, and SBI has lead bank responsibility in ____ districts.", "opts": ["1969; 281", "1971; 350", "1969; 175", "1980; 275", "1975; 300"], "ans": 0, "exp": "The Lead Bank Scheme began in 1969, with the district as the basic unit. SBI is lead bank in 281 districts and convenes the SLBC in 12 States and 2 Union Territories.", "src": "SBI website (sbi.bank.in): Lead Bank Scheme & SLBC page, re-checked 24 Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/agri-rural/rural/lead-bank-scheme", "checked": "2026-10-24", "tk": "Lead Bank Scheme: 1969; SBI lead bank in 281 districts."}, {"id": "S6-0217", "sec": "S6", "q": "Under PMMY, the \"Tarun Plus\" category covers loans of ____, available to entrepreneurs who have ____.", "opts": ["Above ₹5 lakh up to ₹10 lakh; never borrowed before", "Above ₹10 lakh up to ₹20 lakh; availed and successfully repaid earlier loans under Tarun", "Above ₹10 lakh up to ₹25 lakh; a GST registration", "Above ₹20 lakh up to ₹50 lakh; Udyam registration", "Above ₹10 lakh up to ₹20 lakh; any business, first-time borrowers included"], "ans": 1, "exp": "Tarun Plus, announced in the Union Budget 2024-25 and notified in October 2024, extends MUDRA loans above ₹10 lakh up to ₹20 lakh for entrepreneurs who have availed and successfully repaid previous loans under the Tarun category.", "src": "Ministry of Finance (Department of Financial Services): Tarun Plus category under PMMY, notified October 2024 (Union Budget 2024-25)", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://www.mudra.org.in/", "tk": "MUDRA Tarun Plus: ₹10-20 lakh for repaid Tarun borrowers."}, {"id": "S6-0221", "sec": "S6", "q": "Under the Animal Husbandry Infrastructure Development Fund (AHIDF), interest subvention of 3% a year is available for up to:", "opts": ["5 years", "7 years", "8 years", "10 years", "3 years"], "ans": 2, "exp": "AHIDF: 3% subvention for regular repayment, up to 8 years including moratorium. Contrast AIF: 3% for up to 7 years on loans up to ₹2 crore. AHIDF is run by the Department of Animal Husbandry and Dairying.", "src": "SBI website (sbi.bank.in): Agri & Rural - AHIDF page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/", "tk": "AHIDF: 3% subvention up to 8 years (AIF: 7 years)."}, {"id": "S6-0241", "sec": "S6", "q": "Under PMJJBY (rules w.e.f. 1 June 2022), a person enrolling in December, January or February pays a pro-rata premium of:", "opts": ["₹436", "₹342", "₹228", "₹114", "₹218"], "ans": 2, "exp": "June-August: full ₹436; September-November: ₹342; December-February: ₹228; March-May: ₹114. The cover year runs 1 June to 31 May.", "src": "Revised Rules for PMJJBY w.e.f. 01.06.2022 (PDF on SBI's Financial Inclusion page), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://jansuraksha.gov.in/", "tk": "PMJJBY Dec-Feb enrolment: ₹228."}, {"id": "S6-0264", "sec": "S6", "q": "Under PM SVANidhi (as extended), the lending period for street vendors has been extended up to:", "opts": ["31 March 2026", "31 December 2027", "31 March 2030", "31 March 2033", "31 March 2035"], "ans": 2, "exp": "Lending runs till 31 March 2030; credit guarantee, interest subsidy and digital incentives are serviced till 31 March 2033, and credit-card guarantee claims till 31 March 2035. Eligible: street vendors vending in urban areas on or before 24 March 2020.", "src": "SBI website (sbi.bank.in): Get Business Product Information - PM SVANidhi page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/get-business-product-information/pm-svanidhi", "checked": "2026-10-24", "tk": "PM SVANidhi lending: till 31 March 2030."}, {"id": "S6-0270", "sec": "S6", "q": "As shown on SBI's NPS page, the minimum contribution to open an NPS Tier I account is now:", "opts": ["₹500", "₹1,000", "₹250", "₹100", "₹6,000 a year"], "ans": 2, "exp": "Minimum ₹250 at opening for Tier I and for Tier II; subsequent contributions ₹10 minimum, no maximum. (Earlier ₹500 and ₹1,000.)", "src": "SBI website (sbi.bank.in): Personal Banking - National Pension Scheme (NPS) page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/personal-banking/investments-deposits/govt-schemes/nps", "checked": "2026-10-24", "tk": "NPS Tier I minimum: ₹250."}, {"id": "S6-0288", "sec": "S6", "q": "SBI processes pensions electronically through how many Centralised Pension Processing Centres (CPPCs)?", "opts": ["6", "12", "18", "22", "36"], "ans": 2, "exp": "SBI serves more than 41 lakh pensioners through 18 CPPCs. With e-PPOs, pension usually starts automatically; printed PPOs go directly to the CPPC.", "src": "SBI website (sbi.bank.in): Personal Banking - Government Business - Pension page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/web/personal-banking/information-services/government-business/pension", "checked": "2026-10-24", "tk": "SBI pensions: 18 CPPCs."}, {"id": "S6-0298", "sec": "S6", "q": "Under SBI's pension payment arrangements, when is the pension for the month of March credited?", "opts": ["On the last working day of March", "Over the last four working days of March", "On or after the first working day of April", "On 15 April", "Along with May pension"], "ans": 2, "exp": "Normally pension is credited over the last four working days of each month; March pension is credited on or after the first working day of April. PPOs and arrears reaching the CPPC up to one week before month-end are paid in the same month.", "src": "SBI website (sbi.bank.in): FAQs - Centralized Pension Processing page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/faq-s/faq-centralized-pension-processing", "tk": "March pension: credited on or after 1st working day of April."}, {"id": "S6-0306", "sec": "S6", "q": "A person aged 57 who retired on superannuation wants to open an SCSS account. Which condition applies?", "opts": ["No condition", "Only retirement benefits can be invested, and the account must be opened within one month of receiving them", "Must wait until 60", "May invest any funds within six months", "Only with a spouse as joint holder"], "ans": 1, "exp": "Age 55-60 (retired): only retirement benefits, within one month of receipt. 60+: any source, no time limit. Retired defence personnel (not civilians): from 50. Loans against SCSS are not allowed; agents' commission was discontinued from 1 December 2011.", "src": "SBI website (sbi.bank.in): FAQs - SCSS page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/web/nri/information/faqs", "tk": "SCSS at 55-60: only retirement benefits, within one month."}, {"id": "S6-0317", "sec": "S6", "q": "The Lead Bank Scheme (December 1969) grew out of the recommendations of the:", "opts": ["Narasimham Committee", "Gadgil Study Group and the Nariman Committee (\"area approach\")", "Tandon Committee", "Rangarajan Committee", "Khan Working Group"], "ans": 1, "exp": "The Gadgil Study Group (October 1969) proposed the area approach; the Nariman Committee (November 1969) endorsed it for public sector banks. The scheme was last reviewed comprehensively by the High Level Committee under Usha Thorat in 2009.", "src": "RBI Master Circular - Lead Bank Scheme, 1 Apr 2024 (rbi.org.in), read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://www.rbi.org.in/Scripts/BS_ViewMasCirculardetails.aspx?id=12478", "tk": "Lead Bank Scheme: Gadgil Group and Nariman Committee."}, {"id": "S7-0001", "sec": "S7", "q": "Under Section 138 of the NI Act, the payee must send a written demand to the drawer within how many days of receiving information that the cheque was dishonoured?", "opts": ["15 days", "60 days", "30 days", "45 days", "90 days"], "ans": 2, "exp": "The demand notice must go within 30 days of receiving information of dishonour. The drawer then has 15 days to pay, after which the offence is complete.", "src": "Negotiable Instruments Act, 1881, Sec 138(b)", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://indiacode.gov.in/"}, {"id": "S7-0005", "sec": "S7", "q": "Under Section 13 of the NI Act, which of the following is NOT a negotiable instrument?", "opts": ["Bill of exchange payable to bearer on demand", "Promissory note", "Bill of exchange", "Cheque", "Share certificate"], "ans": 4, "exp": "Section 13 names three negotiable instruments: promissory notes, bills of exchange and cheques, payable to order or bearer.", "src": "Negotiable Instruments Act, 1881, Sec 13", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://indiacode.gov.in/"}, {"id": "S7-0010", "sec": "S7", "q": "The punishment for dishonour of a cheque under Section 138 of the NI Act can extend to:", "opts": ["1 year's imprisonment or a fine up to twice the cheque amount", "6 months' imprisonment", "1 year's imprisonment or a fine equal to the cheque amount", "2 years' imprisonment, or a fine up to twice the cheque amount, or both", "5 years' imprisonment"], "ans": 3, "exp": "Section 138 provides for imprisonment up to two years, or a fine up to twice the amount of the cheque, or both.", "src": "Negotiable Instruments Act, 1881, Sec 138", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://indiacode.gov.in/"}, {"id": "S7-0019", "sec": "S7", "q": "The SARFAESI Act does NOT apply to a security interest created on:", "opts": ["A residential house", "A commercial shop", "Agricultural land", "Plant and machinery", "A vacant urban plot"], "ans": 2, "exp": "Section 31(i) excludes any security interest created on agricultural land.", "src": "SARFAESI Act, 2002, Sec 31(i)", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://indiacode.gov.in/"}, {"id": "S7-0033", "sec": "S7", "q": "Under Section 4 of the NI Act, a promissory note is an instrument in writing containing an unconditional undertaking by the maker to pay. A bank note or currency note is:", "opts": ["A promissory note", "A promissory note payable to bearer on demand", "Excluded from the definition", "A bill of exchange", "A cheque"], "ans": 2, "exp": "Section 4 expressly excludes bank notes and currency notes from the definition of a promissory note.", "src": "Negotiable Instruments Act, 1881, Sec 4", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://indiacode.gov.in/", "tk": "Bank and currency notes are not promissory notes (Sec 4)."}, {"id": "S7-0061", "sec": "S7", "q": "Under Section 31 of the NI Act, a drawee bank that wrongly dishonours a cheque despite sufficient funds:", "opts": ["Has no liability", "Must compensate the drawer for any loss caused", "Must compensate the payee for the cheque amount", "Must pay a fine to RBI", "Is liable to the payee only"], "ans": 1, "exp": "The paying banker is liable to the drawer for loss or damage caused by wrongful dishonour.", "src": "Negotiable Instruments Act, 1881, Sec 31", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://indiacode.gov.in/", "tk": "Wrongful dishonour: bank compensates the drawer (Sec 31)."}, {"id": "S7-0201", "sec": "S7", "q": "Under the State Bank of India Act, 1955 (as amended), the Central Government must at all times hold at least what share of SBI's issued equity capital?", "opts": ["26%", "51%", "55%", "60%", "74%"], "ans": 1, "exp": "Section 5 requires the Central Government to hold not less than 51% of the issued equity capital, and Section 10 bars transfers that would take it below 51%. The figure was 55% before the 2010 amendment, a common trap.", "src": "State Bank of India Act, 1955 (as amended), text published on SBI's website", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://indiacode.gov.in/"}, {"id": "S7-0210", "sec": "S7", "q": "A contract by which one party promises to save the other from loss caused by the conduct of the promisor himself or of any other person is a contract of:", "opts": ["Guarantee (Section 126)", "Indemnity (Section 124)", "Bailment (Section 148)", "Agency (Section 182)", "Pledge (Section 172)"], "ans": 1, "exp": "Indemnity has two parties (indemnifier and indemnity-holder); guarantee has three (creditor, principal debtor, surety). Banks take indemnities, for example, when issuing a duplicate draft or paying a deceased depositor's claim without succession papers.", "src": "Indian Contract Act, 1872, Secs 124-125", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://indiacode.gov.in/", "tk": "Indemnity Sec 124 (2 parties) · guarantee (3 parties)."}, {"id": "S7-0226", "sec": "S7", "q": "An endorsement reading \"Pay to Ravi only\" is a:", "opts": ["Blank endorsement", "Special (full) endorsement", "Restrictive endorsement", "Conditional endorsement", "Sans recourse endorsement"], "ans": 2, "exp": "A restrictive endorsement prohibits further negotiation. Special/full: \"Pay to Ravi or order\" (names the endorsee). Blank: only the signature. Conditional: liability depends on an event. Sans recourse: \"without recourse to me\", excluding the endorser's liability (Sec 52).", "src": "Negotiable Instruments Act, 1881", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://indiacode.gov.in/"}, {"id": "S8-0001", "sec": "S8", "q": "The Monetary Policy Committee that fixes the policy repo rate has how many members?", "opts": ["Six, of whom four are external", "Four", "Five", "Six", "Seven"], "ans": 3, "exp": "The MPC has six members: three from RBI, including the Governor who chairs it, and three external members appointed by the Central Government.", "src": "RBI Act, 1934, Sec 45ZB", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://indiacode.gov.in/"}, {"id": "S8-0004", "sec": "S8", "q": "Under the flexible inflation targeting framework first notified in 2016, the CPI inflation target was:", "opts": ["2% with a band of 1% to 3%", "4% with a band of 2% to 6%", "5% with a band of 3% to 7%", "4% with a band of 3% to 5%", "6% with a band of 4% to 8%"], "ans": 1, "exp": "The Government set the target at 4% CPI inflation, with an upper tolerance of 6% and a lower tolerance of 2%. Failure is defined as inflation outside the band for three consecutive quarters.", "src": "RBI Act, 1934, Chapter IIIF (Monetary Policy), Sec 45ZA; Government notification of 5 Aug 2016", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://indiacode.gov.in/"}, {"id": "S8-0010", "sec": "S8", "q": "GST was introduced in India from:", "opts": ["1 April 2017", "1 July 2017", "1 July 2016", "1 October 2017", "1 April 2018"], "ans": 1, "exp": "GST came into force on 1 July 2017, after the Constitution (101st Amendment) Act, 2016.", "src": "Constitution (101st Amendment) Act, 2016; CGST Act, 2017", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://indiacode.gov.in/"}, {"id": "S8-0024", "sec": "S8", "q": "The external members of the Monetary Policy Committee are appointed for a term of:", "opts": ["Four years, renewable once", "Two years", "Three years", "Four years", "Five years"], "ans": 3, "exp": "External members hold office for four years and are not eligible for reappointment.", "src": "RBI Act, 1934, Sec 45ZC and 45ZE", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://indiacode.gov.in/", "tk": "MPC external members: 4 years, no reappointment."}, {"id": "S8-0201", "sec": "S8", "q": "SBI's vision for climate finance is a pathway to Net Zero (Scope 1, 2 and 3) by ____, which marks ____.", "opts": ["2047; 100 years of independence", "2055; the centenary of SBI's formation", "2070; India's national net-zero year", "2050; the Paris Agreement target", "2030; SBI's 75th year"], "ans": 1, "exp": "SBI aims at Net Zero across Scopes 1, 2 and 3 by 2055, the centenary of its formation in 1955. By 2030 it targets Net Zero in Scope 1 and 2 emissions. India's national target is 2070, a close distractor.", "src": "SBI website (sbi.bank.in): About ESG & CFU page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 2, "url": "https://sbi.bank.in/web/sbi-green/about-esg-cfu", "tk": "SBI Net Zero (Scopes 1-3): 2055, its centenary."}, {"id": "S8-0205", "sec": "S8", "q": "SBI's standalone net profit for FY 2025-26 was about:", "opts": ["₹61,077 crore", "₹70,901 crore", "₹80,032 crore", "₹85,168 crore", "₹1,05,477 crore"], "ans": 2, "exp": "Standalone net profit for FY26 was ₹80,032.01 crore, up from ₹70,900.63 crore in FY25. ₹85,168 crore is the consolidated figure and ₹1,05,477 crore the standalone profit before tax.", "src": "SBI audited financial results for the quarter and year ended 31 March 2026 (standalone), SBI website", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 1, "url": "https://sbi.bank.in/web/investor-relations/investor-relations"}, {"id": "S8-0213", "sec": "S8", "q": "SBI's CHAKRA Centre of Excellence has been set up within which part of the Bank?", "opts": ["Corporate Accounts Group", "Project Finance & Structuring SBU", "Commercial Clients Group", "Global Markets Unit", "SME Business Unit"], "ans": 1, "exp": "SBI conceptualised the CHAKRA Centre of Excellence within the Project Finance & Structuring SBU to support the vision of Viksit Bharat 2047. It was launched on 31 January 2026.", "src": "SBI website (sbi.bank.in): CoE CHAKRA - Vision and Ambition of CoE page, read Oct 2026", "asOf": "2026-10", "free": true, "status": "reviewed", "lvl": 3, "url": "https://sbi.bank.in/web/coe-chakra/vision-and-ambition-of-coe", "tk": "CHAKRA CoE: within Project Finance & Structuring SBU."}, {"id": "S8-0228", "sec": "S8", "q": "SBI's stated V
