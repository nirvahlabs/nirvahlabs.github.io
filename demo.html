<script>/* v0.13: banking calculators. Each one shows its formula and a worked example, so it doubles as S11 practice.
   Pure arithmetic on the phone; the IRAC figures carry their source and "as of" month like the questions do. */
'use strict';

const inr = (x, d = 0) => isFinite(x) ? '₹ ' + Number(x).toLocaleString('en-IN', { minimumFractionDigits: d, maximumFractionDigits: d }) : '–';
const num = (x, d = 2) => isFinite(x) ? Number(x).toLocaleString('en-IN', { maximumFractionDigits: d }) : '–';
const pc = (x, d = 2) => isFinite(x) ? num(x, d) + '%' : '–';
const IRAC_SRC = 'RBI Master Circular, Prudential norms on Income Recognition, Asset Classification and Provisioning (IRAC)', IRAC_ASOF = '2026-10';

// f: [key, label, example, kind]  kind: money | pct | int | date | select:opt1/opt2
const CALCS = [
  { id: 'emi', name: 'EMI', sub: 'Loan instalment, total interest', f: [['p', 'Loan amount (₹)', 2500000, 'money'], ['r', 'Interest rate (% a year)', 8.5, 'pct'], ['n', 'Tenure (months)', 240, 'int']],
    calc: v => { const r = v.r / 1200, n = v.n, e = r ? v.p * r * (1 + r) ** n / ((1 + r) ** n - 1) : v.p / n;
      return [['EMI', inr(e)], ['Total payment', inr(e * n)], ['Total interest', inr(e * n - v.p)], ['First EMI: interest part', inr(v.p * r)], ['First EMI: principal part', inr(e - v.p * r)]]; },
    formula: 'EMI = P × r × (1 + r)ⁿ ÷ [(1 + r)ⁿ − 1], where r = annual rate ÷ 12 ÷ 100 and n = months.' },
  { id: 'int', name: 'Simple and compound interest', sub: 'Deposit or loan growth', f: [['p', 'Principal (₹)', 100000, 'money'], ['r', 'Rate (% a year)', 7, 'pct'], ['t', 'Period (years)', 3, 'num'], ['m', 'Compounding', 'Quarterly', 'select:Yearly/Half-yearly/Quarterly/Monthly']],
    calc: v => { const m = { Yearly: 1, 'Half-yearly': 2, Quarterly: 4, Monthly: 12 }[v.m], si = v.p * v.r * v.t / 100, a = v.p * (1 + v.r / (100 * m)) ** (m * v.t);
      return [['Simple interest', inr(si, 2)], ['Compound interest', inr(a - v.p, 2)], ['Maturity value (compound)', inr(a, 2)], ['Effective annual rate', pc(((1 + v.r / (100 * m)) ** m - 1) * 100, 3)]]; },
    formula: 'SI = P × R × T ÷ 100.   Compound amount A = P × (1 + R ÷ (100 × m))^(m × T), where m = compounding periods a year.' },
  { id: 'rd', name: 'Recurring deposit', sub: 'Maturity with quarterly compounding', f: [['i', 'Monthly instalment (₹)', 5000, 'money'], ['r', 'Rate (% a year)', 6.8, 'pct'], ['n', 'Period (months)', 36, 'int']],
    calc: v => { const q = v.r / 400; let m = 0; for (let k = 1; k <= v.n; k++) m += v.i * (1 + q) ** ((v.n - k + 1) / 3);
      return [['Maturity value', inr(m, 2)], ['Total deposited', inr(v.i * v.n)], ['Interest earned', inr(m - v.i * v.n, 2)]]; },
    formula: 'Each instalment grows for the months it stays: A = R × (1 + r/400)^(months left ÷ 3), summed over all instalments (quarterly compounding, as banks apply it).' },
  { id: 'mpbf', name: 'MPBF (Tandon methods)', sub: 'Working capital bank finance', f: [['ca', 'Current assets (₹)', 1000000, 'money'], ['ocl', 'Current liabilities other than bank borrowings (₹)', 300000, 'money'], ['cca', 'Core current assets (₹, for Method III)', 200000, 'money']],
    calc: v => { const g = v.ca - v.ocl, m1 = .75 * g, m2 = .75 * v.ca - v.ocl, m3 = .75 * (v.ca - v.cca) - v.ocl, z = x => x > 0 ? inr(x) : 'Nil';
      return [['Working capital gap (CA − OCL)', inr(g)], ['Method I: 75% of the gap', z(m1)], ['Method II: 75% of CA − OCL', z(m2)], ['Method III: 75% of (CA − core CA) − OCL', z(m3)], ['Current ratio after Method II', num((v.ca) / (v.ocl + Math.max(0, m2)))]]; },
    formula: 'Method I: 0.75 × (CA − OCL).   Method II: 0.75 × CA − OCL (gives a current ratio of 1.33).   Method III: 0.75 × (CA − core CA) − OCL.' },
  { id: 'turn', name: 'Turnover method', sub: 'Working capital for smaller MSE limits (Nayak Committee)', f: [['t', 'Projected annual turnover (₹)', 4000000, 'money']],
    calc: v => [['Working capital requirement (25%)', inr(v.t * .25)], ['Borrower\'s margin (5% of turnover)', inr(v.t * .05)], ['Bank finance (20% of turnover)', inr(v.t * .20)]],
    formula: 'Working capital = 25% of projected turnover; the borrower brings 5% and the bank finances 20%. Check your bank\'s loan policy for the limits it applies to.' },
  { id: 'dp', name: 'Drawing power', sub: 'From the stock statement', f: [['st', 'Value of stock (₹)', 800000, 'money'], ['cr', 'Unpaid stock: creditors for goods (₹)', 150000, 'money'], ['ms', 'Margin on stock (%)', 25, 'pct'], ['bd', 'Eligible book debts (within the age limit) (₹)', 300000, 'money'], ['mb', 'Margin on book debts (%)', 40, 'pct'], ['lim', 'Sanctioned limit (₹)', 600000, 'money']],
    calc: v => { const s = Math.max(0, v.st - v.cr) * (1 - v.ms / 100), b = v.bd * (1 - v.mb / 100), dp = s + b;
      return [['DP on stock: (stock − creditors) × (1 − margin)', inr(s)], ['DP on book debts', inr(b)], ['Total drawing power', inr(dp)], ['Operable limit: lower of DP and sanctioned limit', inr(Math.min(dp, v.lim))]]; },
    formula: 'DP = (Stock − unpaid stock) × (1 − stock margin) + eligible book debts × (1 − book-debt margin). The borrower may draw up to the lower of DP and the sanctioned limit.' },
  { id: 'dscr', name: 'DSCR', sub: 'Debt service coverage for a year', f: [['pat', 'Profit after tax (₹)', 600000, 'money'], ['dep', 'Depreciation (₹)', 200000, 'money'], ['int', 'Interest on term loan (₹)', 250000, 'money'], ['prn', 'Term loan instalments due (₹)', 500000, 'money']],
    calc: v => { const d = (v.pat + v.dep + v.int) / (v.int + v.prn); return [['DSCR', num(d)], ['Cash available for debt service', inr(v.pat + v.dep + v.int)], ['Debt to be serviced', inr(v.int + v.prn)], ['Reading', d >= 1 ? 'Cash covers the debt due this year' : 'Cash does not cover the debt due this year']]; },
    formula: 'DSCR = (PAT + depreciation + interest on term loan) ÷ (interest on term loan + instalments due). Above 1 means the cash generated covers the debt; your bank\'s loan policy sets the minimum average it accepts.' },
  { id: 'ratio', name: 'Balance sheet ratios', sub: 'Current, quick, TOL/TNW', f: [['ca', 'Current assets (₹)', 1200000, 'money'], ['cl', 'Current liabilities (₹)', 900000, 'money'], ['inv', 'Inventory (₹)', 500000, 'money'], ['tol', 'Total outside liabilities (₹)', 2400000, 'money'], ['tnw', 'Tangible net worth (₹)', 1000000, 'money']],
    calc: v => [['Current ratio (CA ÷ CL)', num(v.ca / v.cl)], ['Quick ratio ((CA − inventory) ÷ CL)', num((v.ca - v.inv) / v.cl)], ['TOL ÷ TNW', num(v.tol / v.tnw)], ['Net working capital (CA − CL)', inr(v.ca - v.cl)]],
    formula: 'Current ratio = CA ÷ CL.   Quick ratio = (CA − inventory) ÷ CL.   TOL/TNW = total outside liabilities ÷ tangible net worth.' },
  { id: 'npa', name: 'NPA status and provision', sub: 'SMA, sub-standard, doubtful; provision required', f: [['os', 'Outstanding (₹)', 1000000, 'money'], ['sec', 'Realisable value of security (₹)', 600000, 'money'], ['od', 'Overdue since', '', 'date'], ['ty', 'Standard asset type', 'Other advances', 'select:Other advances/Farm credit and SME/Commercial real estate']],
    calc: v => {
      if (!v.od) return [['Enter the date', 'from which the account is overdue']];
      const dpd = Math.floor((Date.now() - new Date(v.od + 'T00:00:00')) / 864e5);
      if (dpd < 0) return [['Days past due', 'Date is in the future']];
      const secd = Math.min(v.os, v.sec), uns = v.os - secd;
      let cls, prov;
      if (dpd <= 90) {
        cls = dpd === 0 ? 'Standard' : dpd <= 30 ? 'SMA-0 (standard)' : dpd <= 60 ? 'SMA-1 (standard)' : 'SMA-2 (standard)';
        prov = v.os * ({ 'Other advances': .004, 'Farm credit and SME': .0025, 'Commercial real estate': .01 }[v.ty]);
      } else {
        const m = (dpd - 90) / 30.44;                                  // months since it became NPA
        if (m <= 12) { cls = 'Sub-standard'; prov = secd * .15 + uns * .25; }
        else { const y = (m - 12) / 12, r = y <= 1 ? .25 : y <= 3 ? .40 : 1; cls = y <= 1 ? 'Doubtful D1' : y <= 3 ? 'Doubtful D2' : 'Doubtful D3'; prov = uns + secd * r; }
      }
      return [['Days past due', num(dpd, 0)], ['Classification', cls], ['NPA date (90 days overdue)', dpd > 90 ? new Date(new Date(v.od + 'T00:00:00').getTime() + 90 * 864e5).toLocaleDateString('en-IN') : '–'], ['Secured portion', inr(secd)], ['Unsecured portion', inr(uns)], ['Minimum provision', inr(prov)], ['Provision as % of outstanding', pc(prov / v.os * 100)]];
    },
    formula: 'NPA after 90 days overdue. Sub-standard for 12 months as NPA, then doubtful: D1 up to 1 year, D2 1–3 years, D3 over 3 years. Provision: standard 0.40% (farm credit and SME 0.25%, commercial real estate 1%); sub-standard 15% (25% on the unsecured part); doubtful: 100% of the unsecured part plus 25% / 40% / 100% of the secured part for D1 / D2 / D3. Loss assets: 100%.',
    note: 'Minimum provisions under the RBI IRAC norms; your bank may provide more. Crop loans follow crop-season rules, not the 90-day rule. Check the latest RBI circular before relying on these figures.', src: true },
  { id: 'grow', name: 'Growth, CAGR and CD ratio', sub: 'For data interpretation', f: [['a', 'Earlier value', 1250, 'num'], ['b', 'Later value', 1680, 'num'], ['y', 'Years between them', 3, 'num'], ['dep', 'Deposits', 5400, 'num'], ['adv', 'Advances', 3900, 'num']],
    calc: v => [['Growth', pc((v.b - v.a) / v.a * 100)], ['CAGR', pc(((v.b / v.a) ** (1 / v.y) - 1) * 100)], ['CD ratio (advances ÷ deposits)', pc(v.adv / v.dep * 100)], ['Advances as a share of deposits + advances', pc(v.adv / (v.adv + v.dep) * 100)]],
    formula: 'Growth = (later − earlier) ÷ earlier × 100.   CAGR = (later ÷ earlier)^(1 ÷ years) − 1.   CD ratio = advances ÷ deposits × 100.' },
];

function calc() {
  const sel = store.get('calcSel', 'emi'), c = CALCS.find(x => x.id === sel) || CALCS[0], saved = store.get('calcVals', {})[c.id] || {};
  V.innerHTML = `<h2>Banking calculators</h2>
    <div class="chips" id="cpick">${CALCS.map(x => `<button class="chip" data-c="${x.id}" aria-pressed="${x.id === c.id}">${esc(x.name)}</button>`).join('')}</div>
    <div class="card stack" style="margin-top:12px"><div><b>${esc(c.name)}</b><div class="src">${esc(c.sub)}</div></div>
      ${c.f.map(([k, label, ex, kind]) => {
        const val = saved[k] ?? (kind === 'date' ? '' : ex);
        if (kind.startsWith('select:')) return `<label class="f" for="c_${k}">${esc(label)}</label><select id="c_${k}" data-k="${k}">${kind.slice(7).split('/').map(o => `<option${o === val ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
        return `<label class="f" for="c_${k}">${esc(label)}</label><input id="c_${k}" data-k="${k}" type="${kind === 'date' ? 'date' : 'number'}" ${kind === 'date' ? '' : 'inputmode="decimal" step="any"'} value="${esc(val)}">`;
      }).join('')}
      <div class="row"><button class="btn small ghost" id="cex">Example</button><button class="btn small ghost" id="cclr">Clear</button></div>
      <table class="cres"><tbody id="cout"></tbody></table>
      <div class="frame" style="margin:0">${esc(c.formula)}</div>
      ${c.note ? `<p class="src" style="margin:0">${esc(c.note)}${c.src ? ` Source: ${esc(IRAC_SRC)} · checked ${monthName(IRAC_ASOF)}.` : ''}</p>` : ''}</div>`;
  const read = () => { const v = {}; V.querySelectorAll('[data-k]').forEach(el => { const kind = c.f.find(f => f[0] === el.dataset.k)[3]; v[el.dataset.k] = ['date'].includes(kind) || kind.startsWith('select:') ? el.value : parseFloat(el.value); }); return v; };
  const run = () => {
    const v = read(), A = store.get('calcVals', {}); A[c.id] = v; store.set('calcVals', A);
    const missing = c.f.some(([k, , , kind]) => kind !== 'date' && !kind.startsWith('select:') && !isFinite(v[k]));
    $('#cout').innerHTML = missing ? `<tr><td colspan="2" class="src">Fill in every box to see the result.</td></tr>`
      : c.calc(v).map(([a, b], k) => `<tr${k === 0 ? ' class="lead"' : ''}><td>${esc(a)}</td><td class="n">${esc(b)}</td></tr>`).join('');
  };
  V.querySelectorAll('[data-k]').forEach(el => el.oninput = el.onchange = run);
  $('#cpick').onclick = e => { const b = e.target.closest('.chip'); if (b) { store.set('calcSel', b.dataset.c); calc(); } };
  $('#cex').onclick = () => {
    c.f.forEach(([k, , ex, kind]) => { const el = $('#c_' + k); el.value = kind === 'date' ? new Date(Date.now() - 200 * 864e5).toISOString().slice(0, 10) : ex; });
    run();
  };
  $('#cclr').onclick = () => { c.f.forEach(([k, , , kind]) => { if (!kind.startsWith('select:')) $('#c_' + k).value = ''; }); run(); };
  run();
}

Object.assign(HI, {
  'Banking calculators': 'बैंकिंग कैलकुलेटर', 'Example': 'उदाहरण', 'Clear': 'साफ़ करें', 'Fill in every box to see the result.': 'परिणाम देखने के लिए हर खाना भरें।',
});
Object.assign(ROUTES, { calc });
Object.assign(TITLES, { calc: 'Calculators' });
</script>
<script>/* v0.41 Law Dictionary (#legal): which word is defined in which Act and section. Word -> Act -> Section -> meaning,
   with a ready line for the descriptive paper, search, Act filters, A-Z or by-Act view, and a 10-question quiz.
   Content: content/legal.json (tools/build_legal.py). Drafts show only in debug builds. */
'use strict';

let LEG = null, legShown = 30;
const LEG_SHORT = a => a.replace(/,? (Act|Code)?,? ?\d{4}$/, '').replace(/^Indian /, '').replace('Prevention of Money-laundering', 'PMLA')
  .replace('Insolvency and Bankruptcy', 'IBC').replace('Reserve Bank of India', 'RBI Act').replace('Banking Regulation', 'BR Act')
  .replace('Negotiable Instruments', 'NI Act').replace('Transfer of Property', 'TPA').replace('Information Technology', 'IT Act')
  .replace('Right to Information', 'RTI').replace('Consumer Protection', 'Consumer').replace("Bankers' Books Evidence", "Bankers' Books");
async function loadLegal() {
  if (LEG) return LEG;
  try { const d = await (await fetch('content/legal.json')).json(); LEG = d.items.filter(x => x.status === 'reviewed' || DEBUG); }
  catch (e) { LEG = []; }
  return LEG;
}

async function legal() {
  V.innerHTML = '<p class="lede">Loading…</p>';
  const all = await loadLegal();
  if (location.hash.slice(1).split('/')[0] !== 'legal') return;
  if (location.hash === '#legal/quiz') return legalQuiz(all);
  const acts = [...new Set(all.map(x => x.a))];
  let act = store.get('legA', ''); if (act && !acts.includes(act)) act = '';
  const view = store.get('legV', 'az'), term = (store.get('legQ', '') || '').trim().toLowerCase();
  const match = all.filter(x => (!act || x.a === act) &&
    (!term || [x.w, x.a, x.s, x.d, x.use].join(' ').toLowerCase().includes(term)));
  const open = match.filter(unlocked), shut = match.length - open.length;
  const sorted = view === 'az' ? [...open].sort((a, b) => a.w.localeCompare(b.w)) : open;   // by-Act keeps Act and section order
  const card = x => `<div class="card leg">
      <div class="row end"><b class="leg-w">${esc(x.w)}</b>${x.status === 'draft' ? '<span class="tag draft">DRAFT</span>' : ''}</div>
      <p class="leg-s"><span class="tk-sec">${esc(x.s)}</span>${esc(x.a)}</p>
      <p class="leg-d">${esc(x.d)}</p>
      ${x.use ? `<p class="leg-u"><b>In your answer:</b> ${esc(x.use)}</p>` : ''}</div>`;
  let body = '', last = '';
  for (const x of sorted.slice(0, legShown)) {
    if (view === 'act' && x.a !== last) { body += `<h3 class="leg-h">${esc(x.a)}</h3>`; last = x.a; }
    body += card(x);
  }
  V.innerHTML = (DESC.length ? modeBar('legal', WRITE_MODES) : '') + `<h2>Law Dictionary</h2>
    <p class="lede">Which word is defined in which Act and section, in one line. Good for objective questions, for quoting a section in the descriptive paper, and for interviews.</p>
    <div class="row" style="gap:8px"><input id="lq" type="search" placeholder="Search: pledge, Sec 126, guarantee, NI Act…" value="${esc(store.get('legQ', ''))}" style="flex:1">
      <button class="btn small" id="lquiz">Quiz me</button></div>
    <div class="chips" id="lv" style="margin-top:10px"><button class="chip" data-v="az" aria-pressed="${view === 'az'}">A–Z</button><button class="chip" data-v="act" aria-pressed="${view === 'act'}">By Act</button></div>
    <div class="chips" id="la"><button class="chip" data-a="" aria-pressed="${!act}">All Acts</button>${acts.map(a => `<button class="chip" data-a="${esc(a)}" aria-pressed="${a === act}" title="${esc(a)}">${esc(LEG_SHORT(a))}</button>`).join('')}</div>
    <p class="progress" style="margin:10px 0">${open.length} word${open.length === 1 ? '' : 's'}${act ? ' · ' + esc(act) : ''}</p>
    <div class="stack">${body}
      ${sorted.length > legShown ? `<button class="btn ghost block" id="lmore">Show ${Math.min(30, sorted.length - legShown)} more</button>` : ''}
      ${!open.length && !shut ? '<p class="lede">No word matches. Try a shorter word or a section number.</p>' : ''}</div>
    <div style="margin-top:12px">${shut ? lockCard(shut).replace('more</b> in Full access', 'more legal words</b> in Full access') : ''}</div>
    <p class="src" style="margin-top:12px">Meanings are short paraphrases of the bare Acts on India Code and RBI. Read the section itself before quoting it word for word.</p>`;
  const lq = $('#lq'); let t;
  lq.oninput = () => { clearTimeout(t); t = setTimeout(() => { store.set('legQ', lq.value); legShown = 30; legal().then(() => { const n = $('#lq'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }); }, 300); };
  $('#la').onclick = e => { const b = e.target.closest('[data-a]'); if (b) { store.set('legA', b.dataset.a); legShown = 30; legal(); } };
  $('#lv').onclick = e => { const b = e.target.closest('[data-v]'); if (b) { store.set('legV', b.dataset.v); legal(); } };
  $('#lquiz').onclick = () => { location.hash = 'legal/quiz'; };
  const more = $('#lmore'); if (more) more.onclick = () => { legShown += 30; legal(); };
  if (typeof translateTree === 'function') translateTree(V);
}

// Quiz: "Which Act and section defines X?", four options, ten questions from the words open to the user
function legalQuiz(all) {
  const pool = all.filter(unlocked);
  const shuffle = a => a.map(v => [Math.random(), v]).sort((p, q) => p[0] - q[0]).map(p => p[1]);
  const lab = x => `${x.s}, ${x.a}`;
  const qs = shuffle(pool).slice(0, Math.min(10, pool.length)).map(x => {
    const wrong = shuffle(pool.filter(y => lab(y) !== lab(x))).sort((p, q) => (q.a === x.a) - (p.a === x.a)).slice(0, 3);   // same Act first: harder
    return { x, opts: shuffle([x, ...wrong]) };
  });
  let i = 0, score = 0;
  const show = () => {
    if (i >= qs.length) {
      V.innerHTML = `<h2>Law quiz</h2><div class="card"><div class="big">${score} / ${qs.length}</div><p>${score >= qs.length * 0.8 ? 'Strong. You can quote sections with confidence.' : 'Read the words you missed once more, then try again.'}</p>
        <div class="grid2" style="margin-top:10px"><button class="btn" id="qa">Another 10</button><button class="btn ghost" id="qb">Back to dictionary</button></div></div>`;
      $('#qa').onclick = () => legalQuiz(all); $('#qb').onclick = () => { location.hash = 'legal'; };
      return;
    }
    const { x, opts } = qs[i];
    V.innerHTML = `<h2>Law quiz</h2><p class="progress">Question ${i + 1} of ${qs.length} · score ${score}</p>
      <div class="card"><p class="q">Which Act and section defines or deals with <b>${esc(x.w)}</b>?</p>
      <div class="opts" id="qo">${opts.map((o, k) => `<button class="opt" data-k="${k}"><span class="k">${LETTERS[k]}</span><span>${esc(lab(o))}</span></button>`).join('')}</div><div id="qx"></div></div>`;
    $('#qo').onclick = e => {
      const b = e.target.closest('[data-k]'); if (!b || $('#qo').dataset.done) return; $('#qo').dataset.done = 1;
      const ok = opts[+b.dataset.k] === x; if (ok) score++;
      V.querySelectorAll('#qo .opt').forEach((el, k) => { if (opts[k] === x) el.classList.add('right'); else if (el === b) el.classList.add('wrong'); });
      $('#qx').innerHTML = `<p class="leg-d" style="margin-top:10px">${esc(x.d)}</p>${x.use ? `<p class="leg-u"><b>In your answer:</b> ${esc(x.use)}</p>` : ''}<button class="btn block" id="qn" style="margin-top:8px">${i + 1 < qs.length ? 'Next' : 'See score'}</button>`;
      $('#qn').onclick = () => { i++; show(); };
    };
  };
  if (pool.length < 4) { V.innerHTML = '<h2>Law quiz</h2><p class="lede">Not enough words yet.</p>'; return; }
  show();
}

Object.assign(HI, { 'Law Dictionary': 'कानूनी शब्दकोश', 'Quiz me': 'क्विज़', 'All Acts': 'सभी अधिनियम', 'In your answer:': 'उत्तर में:' });

<script>/* v0.43 Learning tools, all built from the app's own reviewed questions (no new facts):
   #tools    hub that lists every tool
   #blitz    Figure Blitz: 60 seconds, the number in a "Remember" line is blanked, pick it from four
   #planner  Marks Planner: expected marks per section from your own accuracy, and where the next hour earns most
   #capsule  Daily Capsule: 10 questions by spaced repetition (old mistakes, a week-old memory check, new facts)
   Free users use them on free questions; Marks Planner works for everyone. */
'use strict';

const TOOL_LIST = () => [
  ['capsule', '💊', 'Daily Capsule', '10 questions picked for today: old mistakes, a memory check, new facts', capsuleDone() ? 'Done today ✓' : 'About 5 minutes'],
  ['blitz', '⚡', 'Figure Blitz', '60-second rapid fire on amounts, days, ages and %', store.get('blitzBest', 0) ? 'Best ' + store.get('blitzBest', 0) : 'Beat your best'],
  ['planner', '🎯', 'Marks Planner', 'Your likely score by section, and where the next hour earns most marks', ''],

  ['interview', '🎤', 'Interview Prep', 'Panel questions, model points and a timed mock interview', ''],
  ['facts', '🔎', 'Fact Finder', 'Search every amount, deadline, tenure, age limit and %', ''],

function tools() {

// ---------------------------------------------------------------- Figure Blitz
const BLITZ_RE = /₹\s?[\d,.]+(\s?(lakh|crore))?|\$\s?[\d,.]+(\s?(million|billion))?|\b\d[\d,.]*\s?(%|bps|lakh|crore|working days|days|hours|months|years|weeks)?(?![\w\d])/gi;
const blitzUnit = t => (t.match(/₹|\$|%|bps|lakh|crore|day|hour|month|year|week/i) || ['n'])[0].toLowerCase().replace(/s$/, '');
function blitzItems() {
  const facts = MCQ.filter(q => q.tk && unlocked(q));
  const all = [];
  facts.forEach(q => { const m = [...q.tk.matchAll(BLITZ_RE)].map(x => x[0].trim()).filter(t => /\d/.test(t) && !/^\d{4}$/.test(t)); if (m.length) all.push({ q, toks: m }); });
  const byUnit = {};
  all.forEach(f => f.toks.forEach(t => { const u = blitzUnit(t); (byUnit[u] = byUnit[u] || new Set()).add(t); }));
  return all.map(f => {
    const ans = f.toks[Math.floor(Math.random() * f.toks.length)], pool = [...(byUnit[blitzUnit(ans)] || [])].filter(t => t !== ans && !f.toks.includes(t));
    if (pool.length < 3) return null;
    const wrong = pool.sort(() => Math.random() - .5).slice(0, 3);
    return { q: f.q, ans, text: f.q.tk.replace(ans, '_____'), opts: [ans, ...wrong].sort(() => Math.random() - .5) };
  }).filter(Boolean).sort(() => Math.random() - .5);
}
function blitz() {
  const items = blitzItems();
  if (items.length < 5) { V.innerHTML = '<h2>Figure Blitz</h2><p class="lede">Not enough facts yet. Unlock Full access for every fact.</p>'; return; }
  const best = store.get('blitzBest', 0);
  V.innerHTML = `<h2>Figure Blitz</h2>
    <p class="lede">60 seconds. A fact appears with its number missing; tap the right one. A wrong tap costs 3 seconds. Figures are where most marks slip.</p>
    <div class="card" style="text-align:center"><div class="big">${best}<small>YOUR BEST</small></div>
    <button class="btn block" id="bgo" style="margin-top:10px">Start</button></div>
    <p class="src" style="margin-top:10px">${items.length.toLocaleString('en-IN')} facts in the pool${full() ? '' : ' · Full access opens every fact'}.</p>`;
  $('#bgo').onclick = () => blitzRun(items);
}
function blitzRun(items) {
  let i = 0, score = 0, left = 60, missed = [];
  const tick = setInterval(() => { left--; const t = $('#bt'); if (t) t.textContent = Math.max(0, left) + 's'; if (left <= 0) end(); }, 1000);
  stopTimer = () => clearInterval(tick);
  function end() {
    clearInterval(tick); stopTimer = () => { };
    const best = store.get('blitzBest', 0), nb = score > best; if (nb) store.set('blitzBest', score);
    V.innerHTML = `<h2>Figure Blitz</h2><div class="card" style="text-align:center"><div class="big">${score}<small>${nb ? 'NEW BEST!' : 'CORRECT · BEST ' + best}</small></div></div>
      ${missed.length ? `<h3>Read these once more</h3><div class="stack">${missed.map(m => `<div class="card fact"><b class="fact-t">${esc(m.q.tk)}</b></div>`).join('')}</div>
      <button class="btn ghost block" id="bpr" style="margin-top:10px">Practise these ${missed.length} questions</button>` : ''}
      <button class="btn block" id="bag" style="margin-top:10px">Play again</button>`;
    $('#bag').onclick = () => blitzRun(blitzItems());
    const pr = $('#bpr'); if (pr) pr.onclick = () => runPractice(missed.map(m => m.q));
  }
  function show() {
    if (left <= 0) return;
    if (i >= items.length) { i = 0; items = blitzItems(); }
    const it = items[i];
    V.innerHTML = `<div class="row end"><h2 style="margin:0">Figure Blitz</h2><span class="tag" id="bt">${left}s</span></div>
      <p class="progress">Score ${score} · ${esc(it.q.sec)}</p>
      <div class="card"><p class="q" style="font-size:1.1rem">${esc(it.text)}</p>
      <div class="opts" id="bo">${it.opts.map((o, k) => `<button class="opt" data-k="${k}"><span class="k">${LETTERS[k]}</span><span>${esc(o)}</span></button>`).join('')}</div></div>`;
    $('#bo').onclick = e => {
      const b = e.target.closest('[data-k]'); if (!b || $('#bo').dataset.done) return; $('#bo').dataset.done = 1;
      const ok = it.opts[+b.dataset.k] === it.ans;
      if (ok) score++; else { left -= 3; missed.push(it); }
      b.classList.add(ok ? 'right' : 'wrong');
      if (!ok) V.querySelectorAll('#bo .opt').forEach((el, k) => { if (it.opts[k] === it.ans) el.classList.add('right'); });
      setTimeout(() => { i++; show(); }, ok ? 350 : 1100);
    };
  }
  show();
}

// ---------------------------------------------------------------- Marks Planner
function planner() {
  const P = C.examPattern, me = P.marksEach || 1;
  const maxObj = (TR.sections || M.sections || []).reduce((t, s) => t + s.examQs * (s.mk || me), 0) || P.questions * me;
  const rows = (TR.sections || M.sections || []).map(s => {
    const qs = MCQ.filter(q => q.sec === s.code), seen = qs.filter(q => ST[q.id]);
    let a = 0, o = 0; seen.forEach(q => { const f = firstOk(ST[q.id]); if (f !== null) { a++; o += f; } });
    const acc = a >= 10 ? o / a : null, marks = s.examQs * (s.mk || me);
    return { s, total: qs.length, seen: seen.length, acc, marks, exp: acc === null ? null : marks * acc, gain: acc === null ? marks * 0.5 : marks * (1 - acc) };
  }).filter(r => r.s.examQs);
  const known = rows.filter(r => r.exp !== null), expObj = known.reduce((t, r) => t + r.exp, 0), knownMax = known.reduce((t, r) => t + r.marks, 0);
  const proj = known.length ? expObj / knownMax * maxObj : null;
  const target = store.get('planTarget', Math.round(maxObj * 0.6));
  const order = [...rows].sort((x, y) => y.gain - x.gain);
  const pct = v => Math.round(v * 100) + '%', f1 = v => (Math.round(v * 10) / 10).toLocaleString('en-IN');
  V.innerHTML = `<h2>Marks Planner</h2>
    <p class="lede">An estimate of your objective score from your own first-attempt accuracy, section by section, weighted by how many questions each section carries in ${esc(TR.full)}.</p>
    <div class="grid2">
      <div class="card stat"><div class="v">${proj === null ? '–' : f1(proj)} <small>/ ${f1(maxObj)}</small></div><div class="k">Likely objective marks${known.length < rows.length && known.length ? ` (from ${known.length} of ${rows.length} sections)` : ''}</div></div>
      <div class="card stat"><div class="v"><input id="ptg" type="number" min="1" max="${maxObj}" step="${me}" value="${target}" style="width:5.5em;font:inherit"></div><div class="k">Your target marks${proj !== null ? ` · ${proj >= target ? 'on track ✓' : 'gap ' + f1(target - proj)}` : ''}</div></div>
    </div>
    <h3>Where the next hour earns most</h3>
    <div class="stack">${order.slice(0, 3).map((r, k) => `<div class="card"><div class="row end"><b>${k + 1}. ${esc(r.s.name)}</b><span class="tag">up to +${f1(r.gain)} marks</span></div>
      <p class="src" style="margin:6px 0">${r.acc === null ? `Not enough practice yet (${r.seen} seen). ${r.s.examQs} questions in the exam.` : `Accuracy ${pct(r.acc)} · ${r.s.examQs} questions in the exam · ${r.seen} of ${r.total} practised.`}</p>
      <button class="btn small" data-ps="${r.s.code}">Practise 20 now</button></div>`).join('')}</div>
    <h3>All sections</h3>
    <div class="card tw"><table class="gd-tab"><thead><tr><th>Section</th><th>Exam Qs</th><th>Accuracy</th><th>Likely marks</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td>${esc(r.s.code)} · ${esc(r.s.name)}</td><td>${r.s.examQs}</td><td>${r.acc === null ? '–' : pct(r.acc)}</td><td>${r.exp === null ? '–' : f1(r.exp) + ' / ' + f1(r.marks)}</td></tr>`).join('')}</tbody></table></div>
    <p class="src" style="margin-top:10px">A section needs at least 10 first attempts before it is counted. This is a guide from your practice, not an official cut-off or a promise of marks.${P.descMarks ? ' The descriptive paper is not included.' : ''}</p>`;
  $('#ptg').onchange = e => { const v = +e.target.value; if (v > 0) { store.set('planTarget', v); planner(); } };
  V.querySelectorAll('[data-ps]').forEach(b => b.onclick = () => {
    const s = rows.find(r => r.s.code === b.dataset.ps).s, qs = MCQ.filter(q => q.sec === s.code && unlocked(q));
    const pick = [...qs.filter(q => !ST[q.id]), ...qs.filter(q => ST[q.id] && ST[q.id][2])].slice(0, 20);
    if (pick.length) runPractice(pick.length >= 5 ? pick : qs.slice(0, 20)); else location.hash = 'unlock';
  });
  if (typeof translateTree === 'function') translateTree(V);
}

// ---------------------------------------------------------------- Daily Capsule
const capsuleDone = () => store.get('capsuleDay', '') === todayIST();
function capsulePick() {
  const pool = MCQ.filter(unlocked), now = Date.now(), day = 864e5;
  const miss = pool.filter(q => ST[q.id] && ST[q.id][2] && now - (ST[q.id][4] || 0) >= day).sort((a, b) => (ST[a.id][4] || 0) - (ST[b.id][4] || 0)).slice(0, 4);
  const old = pool.filter(q => ST[q.id] && !ST[q.id][2] && now - (ST[q.id][4] || 0) >= 7 * day).sort((a, b) => (ST[a.id][4] || 0) - (ST[b.id][4] || 0)).slice(0, 3);
  const acc = {}; pool.forEach(q => { const s = ST[q.id]; if (s) { const a = acc[q.sec] = acc[q.sec] || [0, 0]; a[0] += s[0]; a[1] += s[1]; } });
  const weak = Object.keys(acc).sort((x, y) => acc[x][1] / acc[x][0] - acc[y][1] / acc[y][0])[0];
  const fresh = pool.filter(q => !ST[q.id] && q.tk && (!weak || q.sec === weak));
  const fill = pool.filter(q => !ST[q.id] && q.tk);
  const out = [...miss, ...old];
  for (const q of [...fresh.sort(() => Math.random() - .5), ...fill.sort(() => Math.random() - .5)]) { if (out.length >= 10) break; if (!out.includes(q)) out.push(q); }
  return { qs: out, miss: miss.length, old: old.length, weak };
}
function capsule() {
  const c = capsulePick(), streak = store.get('capsuleStreak', 0);
  V.innerHTML = `<h2>Daily Capsule</h2>
    <p class="lede">Ten questions chosen for today by spaced repetition, the way memory actually works: see a fact again just before you would forget it.</p>

      <li><b>${c.miss}</b> old mistake${c.miss === 1 ? '' : 's'} to fix</li>

      <li><b>${c.qs.length - c.miss - c.old}</b> new fact${c.qs.length - c.miss - c.old === 1 ? '' : 's'}${c.weak ? ` from your weakest section (${esc(c.weak)})` : ''}</li></ul>
    <button class="btn block" id="cgo" style="margin-top:10px"${c.qs.length ? '' : ' disabled'}>${capsuleDone() ? 'Take another capsule' : 'Start today\'s capsule'}</button></div>
    <p class="src" style="margin-top:10px">${capsuleDone() ? 'Today\'s capsule is done ✓ · ' : ''}Capsule streak: ${streak} day${streak === 1 ? '' : 's'}.</p>`;
  $('#cgo').onclick = () => {
    if (!capsuleDone()) {
      const y = new Date(Date.now() + 5.5 * 3600e3 - 864e5).toISOString().slice(0, 10);
      store.set('capsuleStreak', store.get('capsuleDay', '') === y ? streak + 1 : 1); store.set('capsuleDay', todayIST());
    }
    runPractice(c.qs);
  };
  if (typeof translateTree === 'function') translateTree(V);
}

// ---------------------------------------------------------------- entry points
const _homeTools = ROUTES.home;
ROUTES.home = function () {
  _homeTools();
  const anchor = V.querySelector('a[href="#facts"]') || V.querySelector('.grid2'); if (!anchor) return;
  anchor.insertAdjacentHTML('beforebegin', `<a class="card chg-home tools-home" href="#tools"><span class="chg-n">🧰</span><span><b>Learning tools</b><small>${capsuleDone() ? 'Capsule done today ✓ · ' : 'Daily Capsule · '}Figure Blitz · Marks Planner · Confusion Buster · Interview Prep</small></span><span aria-hidden="true">›</span></a>`);
};

Object.assign(ROUTES, { tools, blitz, planner, capsule });
Object.assign(TITLES, { tools: 'Learning tools', blitz: 'Figure Blitz', planner: 'Marks Planner', capsule: 'Daily Capsule' });
Object.assign(HI, { 'Learning tools': 'सीखने के टूल', 'Figure Blitz': 'आंकड़ा ब्लिट्ज़', 'Marks Planner': 'अंक योजना', 'Daily Capsule': 'दैनिक कैप्सूल', 'Start': 'शुरू करें', 'Play again': 'फिर खेलें' });

<script>/* v0.44 Confusion Buster (#confuse) and Interview Prep (#interview).
   Content: content/confuse.json and content/interview.json (tools/build_coach_content.py). Drafts show only in debug. */
'use strict';

const PREP = {};
async function loadPrep(name) {
  if (PREP[name]) return PREP[name];
  try { const d = await (await fetch('content/' + name + '.json')).json(); PREP[name] = d.items.filter(x => x.status === 'reviewed' || DEBUG); }
  catch (e) { PREP[name] = []; }
  return PREP[name];
}
const shuf = a => a.map(v => [Math.random(), v]).sort((p, q) => p[0] - q[0]).map(p => p[1]);
const onRoute = r => location.hash.slice(1).split('/')[0] === r;
const draftTag = x => x.status === 'draft' ? '<span class="tag draft">DRAFT</span>' : '';

// ---------------------------------------------------------------- Confusion Buster
async function confuse() {
  V.innerHTML = '<p class="lede">Loading…</p>';
  const all = await loadPrep('confuse'); if (!onRoute('confuse')) return;
  if (location.hash === '#confuse/quiz') return confuseQuiz(all);
  const areas = ['All', ...new Set(all.map(x => x.area))];
  let area = store.get('cbArea', 'All'); if (!areas.includes(area)) area = 'All';
  const term = (store.get('cbQ', '') || '').trim().toLowerCase();
  const match = all.filter(x => (area === 'All' || x.area === area) && (!term || [x.a, x.b, x.ad, x.bd, x.key, x.area].join(' ').toLowerCase().includes(term)));
  const open = match.filter(unlocked), shut = match.length - open.length;
  V.innerHTML = `<h2>Confusion Buster</h2>
    <p class="lede">Pairs that examiners use to trap you: pledge or hypothecation, Sec 130 or 131, CTR or STR. See the one difference, then test yourself.</p>
    <div class="row" style="gap:8px"><input id="cq" type="search" placeholder="Search: pledge, lien, NRE, SMA…" value="${esc(store.get('cbQ', ''))}" style="flex:1"><button class="btn small" id="cquiz">Quiz me</button></div>
    <div class="chips" id="ca" style="margin-top:10px">${areas.map(a => `<button class="chip" data-a="${esc(a)}" aria-pressed="${a === area}">${esc(a)}</button>`).join('')}</div>
    <p class="progress" style="margin:10px 0">${open.length} pair${open.length === 1 ? '' : 's'}</p>
    <div class="stack">${open.map(x => `<div class="card cb">
      <div class="row end"><span class="progress">${esc(x.area)}</span>${draftTag(x)}</div>
      <div class="cb-vs"><div><b>${esc(x.a)}</b><p>${esc(x.ad)}</p></div><span class="cb-x">vs</span><div><b>${esc(x.b)}</b><p>${esc(x.bd)}</p></div></div>
      <p class="leg-u"><b>Remember:</b> ${esc(x.key)}</p></div>`).join('')}
      ${!open.length && !shut ? '<p class="lede">No pair matches.</p>' : ''}</div>
    <div style="margin-top:12px">${shut ? lockCard(shut).replace('more</b> in Full access', 'more pairs</b> in Full access') : ''}</div>`;
  const cq = $('#cq'); let t;
  cq.oninput = () => { clearTimeout(t); t = setTimeout(() => { store.set('cbQ', cq.value); confuse().then(() => { const n = $('#cq'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }); }, 300); };
  $('#ca').onclick = e => { const b = e.target.closest('[data-a]'); if (b) { store.set('cbArea', b.dataset.a); confuse(); } };
  $('#cquiz').onclick = () => { location.hash = 'confuse/quiz'; };
  if (typeof translateTree === 'function') translateTree(V);
}
function confuseQuiz(all) {
  const pool = all.filter(unlocked);
  const qs = shuf(pool.flatMap(x => [...x.ca.map(c => ({ x, c, side: 'a' })), ...x.cb.map(c => ({ x, c, side: 'b' }))])).slice(0, 12);
  let i = 0, score = 0;
  const show = () => {
    if (i >= qs.length) {
      V.innerHTML = `<h2>Confusion quiz</h2><div class="card" style="text-align:center"><div class="big">${score} / ${qs.length}</div><p>${score >= qs.length * .8 ? 'No trap can catch you now.' : 'Read the pairs you missed once more.'}</p>
        <div class="grid2"><button class="btn" id="qa">Another round</button><button class="btn ghost" id="qb">Back to pairs</button></div></div>`;
      $('#qa').onclick = () => confuseQuiz(all); $('#qb').onclick = () => { location.hash = 'confuse'; }; return;
    }
    const { x, c, side } = qs[i];
    V.innerHTML = `<h2>Confusion quiz</h2><p class="progress">Question ${i + 1} of ${qs.length} · score ${score}</p>
      <div class="card"><p class="q">${esc(c)}</p><p class="src">Which one is this?</p>
      <div class="grid2" id="co"><button class="opt cb-opt" data-s="a">${esc(x.a)}</button><button class="opt cb-opt" data-s="b">${esc(x.b)}</button></div><div id="cx"></div></div>`;
    $('#co').onclick = e => {
      const b = e.target.closest('[data-s]'); if (!b || $('#co').dataset.done) return; $('#co').dataset.done = 1;
      const ok = b.dataset.s === side; if (ok) score++;
      V.querySelectorAll('#co .opt').forEach(el => { if (el.dataset.s === side) el.classList.add('right'); else if (el === b) el.classList.add('wrong'); });
      $('#cx').innerHTML = `<p class="leg-u" style="margin-top:10px"><b>Remember:</b> ${esc(x.key)}</p><button class="btn block" id="cn" style="margin-top:8px">${i + 1 < qs.length ? 'Next' : 'See score'}</button>`;
      $('#cn').onclick = () => { i++; show(); };
    };
  };
  if (!qs.length) { V.innerHTML = '<h2>Confusion quiz</h2><p class="lede">No pairs yet.</p>'; return; }
  show();
}

// ---------------------------------------------------------------- Interview Prep
const ivMarks = () => store.get('ivMark', {});
async function interview() {
  V.innerHTML = '<p class="lede">Loading…</p>';
  const all = await loadPrep('interview'); if (!onRoute('interview')) return;
  if (location.hash === '#interview/practice') return interviewPractice(all);
  const marks = ivMarks(), areas = ['All', 'Needs work', ...new Set(all.map(x => x.area))];
  let area = store.get('ivArea', 'All'); if (!areas.includes(area)) area = 'All';
  const term = (store.get('ivQ', '') || '').trim().toLowerCase();
  const match = all.filter(x => (area === 'All' || x.area === area || (area === 'Needs work' && marks[x.id] === 0)) &&
    (!term || [x.q, x.tip, ...x.pts].join(' ').toLowerCase().includes(term)));
  const open = match.filter(unlocked), shut = match.length - open.length;
  const ready = all.filter(x => unlocked(x) && marks[x.id] === 1).length, avail = all.filter(unlocked).length;
  V.innerHTML = `<h2>Interview Prep</h2>
    <p class="lede">Questions promotion interview panels commonly ask, with the points a good answer covers. Practise aloud, then mark yourself.</p>
    <div class="card stat"><div class="v">${ready} <small>/ ${avail}</small></div><div class="k">Questions you are confident on</div><div class="meter"><i style="width:${avail ? Math.round(ready / avail * 100) : 0}%"></i></div></div>
    <button class="btn block" id="ivgo" style="margin-top:10px">Practise aloud (mock interview)</button>
    <input id="iq" type="search" placeholder="Search: NPA, customer, team, KYC…" value="${esc(store.get('ivQ', ''))}" style="width:100%;margin-top:12px">
    <div class="chips" id="ia" style="margin-top:10px">${areas.map(a => `<button class="chip" data-a="${esc(a)}" aria-pressed="${a === area}">${esc(a)}</button>`).join('')}</div>
    <div class="stack" style="margin-top:10px">${open.map(x => `<details class="card iv"><summary><b>${esc(x.q)}</b> ${marks[x.id] === 1 ? '<span class="tag">✓</span>' : marks[x.id] === 0 ? '<span class="tag soon">practise</span>' : ''}${draftTag(x)}<small>${esc(x.area)}</small></summary>
      <ul class="gd-list">${x.pts.map(p => `<li>${esc(p)}</li>`).join('')}</ul><p class="leg-u"><b>Tip:</b> ${esc(x.tip)}</p></details>`).join('')}
      ${!open.length && !shut ? '<p class="lede">Nothing here yet.</p>' : ''}</div>
    <div style="margin-top:12px">${shut ? lockCard(shut).replace('more</b> in Full access', 'more interview questions</b> in Full access') : ''}</div>
    <p class="src" style="margin-top:12px">Model points are a guide; answer in your own words with examples from your own work.</p>`;
  const iq = $('#iq'); let t;
  iq.oninput = () => { clearTimeout(t); t = setTimeout(() => { store.set('ivQ', iq.value); interview().then(() => { const n = $('#iq'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }); }, 300); };
  $('#ia').onclick = e => { const b = e.target.closest('[data-a]'); if (b) { store.set('ivArea', b.dataset.a); interview(); } };
  $('#ivgo').onclick = () => { location.hash = 'interview/practice'; };
  if (typeof translateTree === 'function') translateTree(V);
}
function interviewPractice(all) {
  const marks = ivMarks(), pool = all.filter(unlocked);
  const qs = [...shuf(pool.filter(x => marks[x.id] === 0)), ...shuf(pool.filter(x => marks[x.id] === undefined)), ...shuf(pool.filter(x => marks[x.id] === 1))].slice(0, 5);
  let i = 0;
  const show = () => {
    if (i >= qs.length) {
      V.innerHTML = `<h2>Mock interview</h2><div class="card" style="text-align:center"><p class="lede">Round done. Questions marked "practise" come first next time.</p>
        <div class="grid2"><button class="btn" id="pa">Another round</button><button class="btn ghost" id="pb">All questions</button></div></div>`;
      $('#pa').onclick = () => interviewPractice(all); $('#pb').onclick = () => { location.hash = 'interview'; }; return;
    }
    const x = qs[i]; let left = 90;
    V.innerHTML = `<div class="row end"><h2 style="margin:0">Mock interview</h2><span class="tag" id="pt">90s</span></div>
      <p class="progress">Question ${i + 1} of ${qs.length} · ${esc(x.area)}</p>
      <div class="card"><p class="q" style="font-size:1.15rem">${esc(x.q)}</p><p class="src">Answer aloud as if facing the panel. Aim for 60-90 seconds.</p>
      <button class="btn block" id="pshow">Show model points</button><div id="ppts"></div></div>`;
    const tk = setInterval(() => { left--; const el = $('#pt'); if (el) el.textContent = Math.max(0, left) + 's'; if (left <= 0) clearInterval(tk); }, 1000);
    stopTimer = () => clearInterval(tk);
    $('#pshow').onclick = () => {
      clearInterval(tk); $('#pshow').remove();
      $('#ppts').innerHTML = `<ul class="gd-list">${x.pts.map(p => `<li>${esc(p)}</li>`).join('')}</ul><p class="leg-u"><b>Tip:</b> ${esc(x.tip)}</p>
        <p class="src" style="margin-top:10px">Did your answer cover these points?</p>
        <div class="grid2"><button class="btn ghost" data-m="0">Needs practice</button><button class="btn" data-m="1">I covered it</button></div>`;
      V.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { const m = ivMarks(); m[x.id] = +b.dataset.m; store.set('ivMark', m); i++; show(); });
    };
  };
  if (!qs.length) { V.innerHTML = '<h2>Mock interview</h2><p class="lede">No questions yet.</p>'; return; }
  show();
}

// ---------------------------------------------------------------- entry points (the Tools hub lists both too)
const _moreIv = ROUTES.more;
ROUTES.more = function () {
  _moreIv();
  const list = V.querySelector('.card.list');
  if (list) list.insertAdjacentHTML('afterbegin', `<a class="item" href="#interview"><span>Interview Prep<small>Panel questions with model points and a mock interview</small></span></a><a class="item" href="#confuse"><span>Confusion Buster<small>Look-alike pairs that trap candidates</small></span></a>`);
};
Object.assign(ROUTES, { confuse, interview });
Object.assign(TITLES, { confuse: 'Confusion Buster', interview: 'Interview Prep' });
Object.assign(HI, { 'Confusion Buster': 'भ्रम दूर करें', 'Interview Prep': 'इंटरव्यू तैयारी', 'Needs work': 'अभ्यास बाकी', 'Remember:': 'याद रखें:', 'Tip:': 'सुझाव:' });
</script>
