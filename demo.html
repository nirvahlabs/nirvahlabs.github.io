    <input id="fq" type="search" placeholder="Search: locker, 90 days, ₹5 lakh, KYC…" value="${esc(store.get('factQ', ''))}" style="width:100%">
    <div class="chips" id="fk" style="margin-top:10px">${FK.map(([k, n]) => `<button class="chip" data-k="${k}" aria-pressed="${k === kind}">${esc(n)}</button>`).join('')}</div>
    <div class="chips" id="fs"><button class="chip" data-s="" aria-pressed="${!sec}">All subjects</button>${secs.map(s => `<button class="chip" data-s="${s}" aria-pressed="${s === sec}" title="${esc((SEC[s] || {}).name || s)}">${s}</button>`).join('')}</div>
    <p class="progress" style="margin:10px 0">${open.length.toLocaleString('en-IN')} fact${open.length === 1 ? '' : 's'}${sec ? ' · ' + esc((SEC[sec] || {}).name || sec) : ''}${kind === 'last' ? ' · tough figures to read the day before the exam' : ''}</p>
    <div class="stack">${open.slice(0, factShown).map(q => `<div class="card fact">
      <b class="fact-t">${esc(q.tk)}</b>
      <p class="fact-a">${esc(q.opts[q.ans])}</p>
      <div class="row end"><span class="src">${esc(q.sec)} · ${typeof factDate === 'function' ? factDate(q) : 'true as of ' + esc(q.asOf || '')}</span><button class="btn small ghost" data-fp="${q.id}">Practise</button></div></div>`).join('')}
      ${open.length > factShown ? `<button class="btn ghost block" id="fmore">Show ${Math.min(40, open.length - factShown)} more</button>` : ''}
      ${!open.length && !shut ? '<p class="lede">No fact matches. Try a shorter word.</p>' : ''}</div>
    <div style="margin-top:12px">${shut ? lockCard(shut).replace('more</b> in Full access', 'more facts</b> in Full access') : ''}</div>`;
  const fq = $('#fq'); let t;
  fq.oninput = () => { clearTimeout(t); t = setTimeout(() => { store.set('factQ', fq.value); factShown = 40; facts(); const n = $('#fq'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 300); };
  $('#fk').onclick = e => { const b = e.target.closest('[data-k]'); if (b) { store.set('factK', b.dataset.k); factShown = 40; facts(); } };
  $('#fs').onclick = e => { const b = e.target.closest('[data-s]'); if (b) { store.set('factS', b.dataset.s); factShown = 40; facts(); } };
  const more = $('#fmore'); if (more) more.onclick = () => { factShown += 40; facts(); };
  V.querySelectorAll('[data-fp]').forEach(b => b.onclick = () => runPractice([MCQ.find(q => q.id === b.dataset.fp)]));
  if (typeof translateTree === 'function') translateTree(V);
}

<script>/* Writing toolkit (#toolkit) for the descriptive paper: phrase bank, key terms, Acts and sections, Hindi -> English.
   Content in content/toolkit.json (built by tools/build_toolkit.py), loaded on first visit. */
'use strict';

let TK = null, tkTab = store.get('tkTab', 'phrases'), tkGroup = 'All', tkQ = '';
const TK_TABS = [['phrases', 'Phrases'], ['terms', 'Key terms'], ['acts', 'Acts & sections'], ['hindi', 'Hindi → English']];
const TK_HELP = {
  phrases: 'Ready sentences for every part of an answer. Learn a few from each group and use them as they are.',
  terms: 'Banking words examiners look for, with Hindi meaning and a model sentence.',
  acts: 'Quote one section in an answer and it immediately looks stronger.',
  hindi: 'Think it in Hindi, write it in correct exam English.'

async function toolkit() {
  if (!TK) {
    V.innerHTML = modeBar('toolkit', WRITE_MODES) + '<p class="loading">Loading…</p>';
    try { TK = await (await fetch('content/toolkit.json')).json(); }
    catch (e) { V.innerHTML = modeBar('toolkit', WRITE_MODES) + '<div class="card">Could not load the toolkit.</div>'; return; }
  }
  const list = tkQ ? TK_TABS.flatMap(([k]) => TK[k] || []) : (TK[tkTab] || []);   // search looks in every part
  const groups = tkTab === 'phrases' && !tkQ ? ['All', ...new Set(list.map(x => x.g))] : [];
  const text = x => [x.en, x.hi, x.t, x.ex, x.a, x.s, x.d, x.g].filter(Boolean).join(' ').toLowerCase();
  const shown = list.filter(x => (tkQ || tkGroup === 'All' || x.g === tkGroup || tkTab !== 'phrases') && (!tkQ || text(x).includes(tkQ.toLowerCase())));
  const open = shown.filter(x => full() || x.free), locked = shown.length - open.length;

  const row = x => {
    if (x.k === 'phrase') return `<div class="tk-item"><p class="tk-en">${esc(x.en)}</p><p class="tk-hi" lang="hi" data-noi18n>${esc(x.hi)}</p></div>`;
    if (x.k === 'term') return `<div class="tk-item"><p class="tk-en"><b>${esc(x.t)}</b> <span class="tk-hi" lang="hi" data-noi18n>${esc(x.hi)}</span></p><p class="tk-ex">“${esc(x.ex)}”</p></div>`;
    if (x.k === 'act') return `<div class="tk-item"><p class="tk-act"><span class="tk-sec">${esc(x.s)}</span><b>${esc(x.a)}</b></p><p class="tk-ex">${esc(x.d)}</p></div>`;
    return `<div class="tk-item"><p class="tk-hi big" lang="hi" data-noi18n>${esc(x.hi)}</p><p class="tk-en">→ ${esc(x.en)}</p></div>`;
  };

  V.innerHTML = modeBar('toolkit', WRITE_MODES) + `<h2>Writing toolkit</h2>
    <div class="tk-tabs" role="tablist">${TK_TABS.map(([k, n]) => `<button role="tab" data-t="${k}" aria-selected="${k === tkTab}">${n}</button>`).join('')}</div>
    <p class="lede">${TK_HELP[tkTab]}</p>
    ${tkTab === 'acts' ? `<a class="card chg-home" href="#legal" style="margin-bottom:12px"><span class="chg-n">§</span><span><b>Open the full Law Dictionary</b><small>162 legal words: Act, section, meaning and a ready line, with search and quiz</small></span><span aria-hidden="true">›</span></a>` : ''}
    <input type="text" id="tkq" placeholder="Search" value="${esc(tkQ)}" autocomplete="off">
    ${groups.length ? `<div class="chips" id="tkg" style="margin-top:10px">${groups.map(g => `<button class="chip" data-g="${esc(g)}" aria-pressed="${g === tkGroup}">${esc(g)}</button>`).join('')}</div>` : ''}
    <div class="card tk-list">${open.length ? open.map(row).join('') : '<p class="src">Nothing matches your search.</p>'}</div>
    ${locked ? `<div style="margin-top:12px">${lockCard(locked)}</div>` : ''}
`;

  V.querySelector('.tk-tabs').onclick = e => { const b = e.target.closest('[data-t]'); if (!b) return; tkTab = b.dataset.t; tkGroup = 'All'; store.set('tkTab', tkTab); toolkit(); };
  const g = $('#tkg'); if (g) g.onclick = e => { const b = e.target.closest('[data-g]'); if (!b) return; tkGroup = b.dataset.g; toolkit(); };
  const q = $('#tkq');
  q.oninput = () => { tkQ = q.value; clearTimeout(q.t); q.t = setTimeout(() => { const pos = q.selectionStart; toolkit().then(() => { const n = $('#tkq'); n.focus(); n.setSelectionRange(pos, pos); }); }, 250); };
}

WRITE_MODES.splice(1, 0, ['toolkit', 'Toolkit'], ['legal', 'Law']);
Object.assign(ROUTES, { toolkit });
Object.assign(TITLES, { toolkit: 'Writing toolkit' });
Object.assign(HI, {
  'Writing toolkit': 'लेखन टूलकिट', 'Toolkit': 'टूलकिट', 'Phrases': 'वाक्यांश', 'Key terms': 'मुख्य शब्द', 'Acts & sections': 'अधिनियम और धाराएं',
  'Search': 'खोजें', 'Nothing matches your search.': 'खोज से कुछ नहीं मिला।',
  'Ready sentences for every part of an answer. Learn a few from each group and use them as they are.': 'उत्तर के हर भाग के लिए तैयार वाक्य। हर समूह से कुछ याद करें और वैसे ही उपयोग करें।',
  'Banking words examiners look for, with Hindi meaning and a model sentence.': 'परीक्षक जिन बैंकिंग शब्दों को खोजते हैं, हिंदी अर्थ और उदाहरण वाक्य सहित।',
  'Quote one section in an answer and it immediately looks stronger.': 'उत्तर में एक धारा का उल्लेख करें, उत्तर तुरंत मज़बूत दिखता है।',
  'Think it in Hindi, write it in correct exam English.': 'हिंदी में सोचें, परीक्षा-योग्य सही अंग्रेज़ी में लिखें।'
});

<script>/* Writing help inside the descriptive answer screen:
   (1) key-word chips from the model answer, tap to insert; (2) phrase bank, tap to insert at the cursor;
   (3) after "Show model answer": key words used / missed and linking words used.
   Wraps nextDesc() and answerCheck(); the toolkit content comes from toolkit.js (TK). */
'use strict';

const LINKERS = ['firstly', 'secondly', 'thirdly', 'finally', 'moreover', 'in addition', 'however', 'on the other hand', 'therefore',
  'hence', 'thus', 'as a result', 'for example', 'in other words', 'to sum up', 'in conclusion', 'furthermore', 'consequently'];
const PHRASE_GROUP = { RAT: 'Opening', FA: 'For', SIT: 'Situation', BC: 'Letter', EM: 'Letter', COMP: 'Linking' };
const KW_SKIP = new Set(['THE', 'AND', 'FOR', 'BUT', 'NOT', 'ALL', 'ANY', 'MAY', 'ONE', 'TWO', 'SUB', 'REF', 'DATE', 'DEAR', 'YOURS', 'XYZ', 'ABC', 'PQR', 'OF', 'AT', 'TO', 'IN', 'ON', 'BY', 'AGAINST', 'CONCLUSION']);

async function loadTK() {
  if (!TK) { try { TK = await (await fetch('content/toolkit.json')).json(); } catch (e) { TK = { phrases: [], terms: [] }; } }
  return TK;
}

/** Key words for one question: section references, named terms (e.g. "Basel III"), acronyms, toolkit terms,
    then the answer's core words, ranking words that also appear in the question first and skipping plain verbs. */
function keyWords(ans, q = '') {
  // headings, subject lines and placeholders (all-caps lines, XYZ/ABC) are not key words
  ans = ans.split('\n').filter(l => { const L = l.replace(/[^A-Za-z]/g, ''); return !(L.length > 6 && L.replace(/[^A-Z]/g, '').length / L.length > .6); }).join('\n');
  const out = [], seen = new Set(), add = w => { const k = w.toLowerCase(); if (!seen.has(k) && out.length < 12) { seen.add(k); out.push(w); } };
  const wb = w => new RegExp('\\b' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
  (ans.match(/\b(?:Sec(?:tion)?\.?|Article)\s*\d+[A-Z]*(?:\(\d+\))?/g) || []).forEach(x => add(x.replace(/^Section/, 'Sec').replace(/\.\s*/, ' ').replace(/\s+/, ' ')));
  (ans.match(/\b[A-Z][a-z]+ (?:I{1,3}|IV|V)\b/g) || []).forEach(add);
  (ans.match(/\b[A-Z][A-Z0-9-]{1,9}\b/g) || []).map(w => w.replace(/-+$/, '')).filter(w => !KW_SKIP.has(w) && !/^\d/.test(w) && !/^(?:I{1,3}|IV|V|VI)$/.test(w)).forEach(add);
  if (TK) TK.terms.forEach(t => { const base = t.t.replace(/\s*\(.*\)/, '').split('/')[0].trim(); if (base.length > 3 && wb(base).test(ans)) add(base); });
  const ql = q.toLowerCase(), score = {};
  (ans.toLowerCase().match(/[a-z]{6,}/g) || []).forEach(w => {
    if (STOPW.has(w) || /^(because|should|within|without|through|therefore|however|whether|another)$/.test(w)) return;
    const inQ = ql.includes(w);
    if (!inQ && /(?:ed|ing|ly)$/.test(w)) return;          // plain verbs/adverbs only if the question uses them
    score[w] = (score[w] || 0) + 1 + (inQ ? 3 : 0);
  });
  Object.entries(score).sort((a, b) => b[1] - a[1] || b[0].length - a[0].length).slice(0, 8).forEach(([w]) => add(w));
  return out;
}
const usedIn = (text, w) => new RegExp('\\b' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s*'), 'i').test(text);

function insertAt(ta, s) {
  const a = ta.selectionStart ?? ta.value.length, b = ta.selectionEnd ?? a, before = ta.value.slice(0, a);
  const pad = before && !/\s$/.test(before) ? ' ' : '';
  ta.value = before + pad + s + ' ' + ta.value.slice(b);
  const p = a + pad.length + s.length + 1; ta.focus(); ta.setSelectionRange(p, p);
  ta.dispatchEvent(new Event('input'));
}

const currentDesc = () => { const q = $('#dq .q'); return q ? DESC.find(d => d.q === q.textContent) : null; };

const _nextDesc = nextDesc;
nextDesc = function () {
  _nextDesc();
  const x = currentDesc(), ta = $('#ta'); if (!x || !ta) return;
  loadTK().then(() => {
    const kw = x.type === 'COMP' ? [] : keyWords(x.ans, x.q);   // comprehension: chips would reveal the right options
    if (kw.length) ta.insertAdjacentHTML('beforebegin', `<div class="kw-box"><div class="row end"><b>Key words to use</b><small class="src">tap to insert</small></div>
      <div class="kw" data-noi18n>${kw.map(w => `<button class="kw-chip" data-w="${esc(w)}">${esc(w)}</button>`).join('')}</div></div>`);
    V.querySelectorAll('.kw-chip').forEach(b => b.onclick = () => insertAt(ta, b.dataset.w));
  });
  const fr = $('#fr');
  if (fr) fr.insertAdjacentHTML('beforebegin', '<button class="linkish" id="phr">Phrases</button>');
  const phr = $('#phr'); if (!phr) return;
  phr.onclick = async () => {
    await loadTK();
    let grp = PHRASE_GROUP[x.type] || 'Opening';
    const box = document.createElement('div'); box.className = 'phr-box'; $('#frm').before(box);
    const draw = () => {
      const groups = [...new Set(TK.phrases.map(p => p.g))], list = TK.phrases.filter(p => p.g === grp && (full() || p.free));
      const locked = TK.phrases.filter(p => p.g === grp).length - list.length;
      box.innerHTML = `<div class="row end"><b>Phrases</b><button class="linkish" id="phx">Close</button></div>
        <div class="chips">${groups.map(g => `<button class="chip small" data-g="${esc(g)}" aria-pressed="${g === grp}">${esc(g)}</button>`).join('')}</div>
        <div class="phr-list">${list.map((p, k) => `<button class="phr" data-k="${k}"><span>${esc(p.en)}</span><small lang="hi" data-noi18n>${esc(p.hi)}</small></button>`).join('') || '<p class="src">Unlock full access for this group.</p>'}</div>
        ${locked ? `<p class="src" style="margin:6px 0 0">${locked} more in full access.</p>` : ''}`;
      box.querySelector('.chips').onclick = e => { const b = e.target.closest('[data-g]'); if (b) { grp = b.dataset.g; draw(); } };
      box.querySelectorAll('.phr').forEach(b => b.onclick = () => insertAt(ta, list[+b.dataset.k].en.replace(/\s*…\s*$/, '')));
      $('#phx').onclick = () => { box.remove(); phr.hidden = false; };
    };
    draw(); phr.hidden = true;
  };
};

const _answerCheck = answerCheck;
answerCheck = function (text, x, el, compact = false) {
  _answerCheck(text, x, el, compact);
  if (compact || !el || words(text) < 10) return;
  const kw = keyWords(x.ans, x.q), used = kw.filter(w => usedIn(text, w)), miss = kw.filter(w => !usedIn(text, w));
  const links = LINKERS.filter(l => new RegExp('\\b' + l + '\\b', 'i').test(text));
  const box = el.querySelector('.check-box'); if (!box) return;
  box.insertAdjacentHTML('beforeend', `<div class="kp-head">Key words used: <b>${used.length} of ${kw.length}</b></div>
    <div class="kw" data-noi18n>${used.map(w => `<span class="kw-chip ok">✓ ${esc(w)}</span>`).join('')}${miss.map(w => `<span class="kw-chip miss">${esc(w)}</span>`).join('')}</div>
    <div class="kp-head">Linking words: <b>${links.length}</b>${links.length >= 3 ? ' ✓' : ''}</div>
    <p class="src" style="margin:2px 0 0">${links.length >= 3 ? 'Good flow: ' + esc(links.join(', ')) + '.' : 'Use words like Firstly, Moreover, However, Hence to make your answer flow (see Phrases).'}</p>`);
};

Object.assign(HI, {
  'Key words to use': 'उपयोग करने योग्य मुख्य शब्द', 'tap to insert': 'जोड़ने के लिए टैप करें', 'Phrases': 'वाक्यांश', 'Close': 'बंद करें',
  'Unlock full access for this group.': 'इस समूह के लिए फुल एक्सेस अनलॉक करें।',
  'Use words like Firstly, Moreover, However, Hence to make your answer flow (see Phrases).': 'उत्तर में प्रवाह के लिए Firstly, Moreover, However, Hence जैसे शब्द लिखें (वाक्यांश देखें)।'
});
HI_PATTERNS.push([/^Key words used: (\d+) of (\d+)$/, 'उपयोग किए गए मुख्य शब्द: $2 में से $1'], [/^Linking words: (\d+)( ✓)?$/, 'जोड़ने वाले शब्द: $1$2'], [/^(\d+) more in full access\.$/, 'फुल एक्सेस में $1 और।']);
</script>
<script>/* Writing courses: the shared course screen and hub (#learn), and the letter and e-mail course (#learnbc): ten short lessons with good/weak examples, a "which is better" drill,
   and buttons that open the practice screen on Letter (BC) or E-mail (EM). Original teaching text; no outside material. */
'use strict';

const BC_LESSONS = [
  { t: 'What the examiner gives marks for', b: `
<p>A business letter or e-mail is marked on four things. Know them before you write a word.</p>
<ol><li><b>Format</b>: every part in its place (sender, reference, date, addressee, subject, salutation, body, closing).</li>
<li><b>Content</b>: the facts the question gives, used correctly, plus the rule or reason where it fits.</li>
<li><b>Purpose and action</b>: the reader knows exactly what you want, from whom and by when.</li>
<li><b>Language</b>: polite, clear, short sentences, no grammar slips.</li></ol>
<p class="tip">A short letter with all four is worth more than a long one that wanders.</p>` },
  { t: 'Three kinds of letters, three tones', b: `
<table class="lt"><tr><th>Writing to</th><th>Typical purpose</th><th>Tone</th></tr>
<tr><td>Your controller (RM, AGM, Regional/Zonal office)</td><td>Report, seek sanction, ask for staff, equipment or approval</td><td>Respectful, factual, figures first</td></tr>
<tr><td>A customer</td><td>Reply to a complaint, remind about dues, inform about a rule or a new product</td><td>Courteous, simple words, no bank jargon</td></tr>
<tr><td>An outside office (police, court, government department, builder)</td><td>Request action, give information, follow up</td><td>Formal, precise, refer to dates and numbers</td></tr></table>
<p>Ask yourself first: <b>who reads this, and what should they do after reading it?</b> That one line decides your subject, your tone and your last paragraph.</p>` },
  { t: 'The parts of a formal letter', b: `
<div class="frame">[Bank name]
XYZ Branch (Branch Code ____)               <span class="lbl">① sender</span>
Letter No. ____/2026-27        Date: __.__.2026   <span class="lbl">② reference and date</span>

The Regional Manager,                       <span class="lbl">③ addressee: designation first</span>
[Bank name], Regional Business Office, ABC

Dear Sir/Madam,                              <span class="lbl">④ salutation</span>

SHORTAGE OF STAFF AT XYZ BRANCH             <span class="lbl">⑤ subject: capitals, specific</span>

Opening: why you are writing.               <span class="lbl">⑥ body</span>
Facts and figures.
What the branch has already done.
Request: what, and by when.

Yours faithfully,                            <span class="lbl">⑦ closing</span>
(Name)
Branch Manager, Contact No.                  <span class="lbl">⑧ signature block</span>
Encl.: list of enclosures, if any            <span class="lbl">⑨ enclosures</span></div>
<p>Leave blanks (____) for names and numbers the question does not give. Never invent a real person's name or a real account number.</p>` },
  { t: 'The subject line', b: `
<p>The subject is the first thing the reader sees. It must say <b>what</b> and <b>for whom/which</b> in under 12 words.</p>
<table class="lt"><tr><th>Weak</th><th>Better</th></tr>
<tr><td>Regarding staff</td><td>SHORTAGE OF STAFF AT XYZ BRANCH</td></tr>
<tr><td>Complaint</td><td>YOUR COMPLAINT DATED 12.10.2026: FAILED ATM WITHDRAWAL OF ₹10,000</td></tr>
<tr><td>Request for ATM guard</td><td>POSTING OF ARMED GUARD AT ONSITE ATM OF XYZ BRANCH</td></tr>
<tr><td>Loan</td><td>OVERDUE INSTALMENTS IN HOME LOAN ACCOUNT NO. ______</td></tr></table>
<p class="tip">In a letter, write the subject in capitals (or begin with "Sub:"). In an e-mail, use normal case in the Subject field.</p>` },
  { t: 'Building the body: Facts → Action → Request', b: `
<p>Every good body has three blocks. Write them in this order.</p>
<ol><li><b>Facts</b>: what happened, with dates, amounts, numbers. <i>"Against a sanctioned strength of 8 officers, the branch has 5."</i></li>
<li><b>Action already taken / reason</b>: shows you are responsible, and quotes the rule where it helps. <i>"Under RBI's rules, failed ATM debits are to be reversed within T+5 days."</i></li>
<li><b>Request or reply</b>: one clear sentence with a timeline. <i>"We request you to post two officers by 30 November 2026."</i></li></ol>
<p>Use numbered points or bullets when you have three or more facts. Keep paragraphs to 2-4 lines.</p>
<h4>Opening lines that work</h4>
<ul><li>We wish to bring to your kind notice that …</li><li>We refer to your letter dated … regarding …</li><li>We are pleased to report the steps taken by the branch to …</li><li>We regret the inconvenience caused to you and have examined your complaint dated …</li></ul>
<h4>Request lines that work</h4>
<ul><li>We request you to sanction … at the earliest, preferably by …</li><li>You are requested to visit the branch with … on or before …</li><li>We shall be grateful if you could arrange … by …</li></ul>` },
  { t: 'Language: polite, plain, correct', b: `
<table class="lt"><tr><th>Avoid</th><th>Write instead</th></tr>
<tr><td>Kindly do the needful.</td><td>Please sanction one additional cash officer by 30.11.2026.</td></tr>
<tr><td>Revert back at the earliest.</td><td>Please reply by 20.11.2026.</td></tr>
<tr><td>We have received your complaint and the same is being looked into.</td><td>We have examined your complaint dated 12.10.2026.</td></tr>
<tr><td>Prepone the meeting.</td><td>Hold the meeting earlier, on 14.11.2026.</td></tr>
<tr><td>You have failed to pay.</td><td>Our records show that the instalments due on … are unpaid.</td></tr>
<tr><td>It is to inform you that …</td><td>We write to inform you that …</td></tr></table>
<ul><li>One idea per sentence; sentences under 25 words.</li><li>Firm with defaulters, never rude or threatening.</li><li>With customers, explain terms: not "T+5", but "within five working days".</li><li>Numbers: write ₹ amounts and dates the same way throughout (₹10,000; 12.10.2026).</li></ul>` },
  { t: 'Closing and signature', b: `
<ul><li><b>"Dear Sir/Madam" → "Yours faithfully"</b> (formal, reader not named).</li>
<li><b>"Dear Shri Sharma" → "Yours sincerely"</b> (reader named).</li>
<li>A courtesy line before the close is good: <i>"We assure you of our best services."</i> / <i>"For any clarification, please contact the undersigned."</i></li>
<li>"Thanking you" alone is not a closing; it goes before "Yours faithfully", if at all.</li>
<li>Signature block: (Name), designation, branch, contact number. Add "Encl.:" if you mention a copy.</li></ul>` },
  { t: 'E-mail: what changes', b: `
<p>An official e-mail follows the same thinking as a letter (purpose, facts, action), but the form is lighter.</p>
<div class="frame">To: rm.abc@[bank domain]        Cc: chief manager (only if needed)
Subject: Shortage of cash officers at XYZ Branch (Code ____)

Dear Sir,

The branch is short of two cash officers from 1 November 2026, after one transfer and one retirement.

1. Daily footfall is about 900; counter waiting time has risen to 40 minutes.
2. We have opened the Green Channel counter and moved two associates to cash.

Please post two officers by 15 November 2026. The staff statement is attached.

Regards,
(Name)
Branch Manager, XYZ Branch
Phone: ________</div>
<ul><li><b>Subject</b> in normal case, specific; the reader decides from it whether to open now.</li>
<li><b>Purpose in the first two lines</b>; on a phone screen that is all that shows.</li>
<li><b>Short paragraphs</b> or numbered points; 100-160 words is enough.</li>
<li><b>To</b> = who must act; <b>Cc</b> = who must know; use <b>Bcc</b> when writing to many customers, so their addresses stay private.</li>
<li>Close with <b>"Regards,"</b> plus name, designation, branch and phone. No "Yours faithfully" needed.</li>
<li>Mention attachments in the body, then attach them.</li>
<li>Never send customer account data or passwords to personal e-mail IDs; use the official ID only.</li>
<li>Think before "Reply all"; one topic per e-mail.</li></ul>` },
  { t: 'Your 5-step method in the exam', b: `
<ol><li><b>Read</b> the question twice; underline who writes, to whom, and the purpose. (1 minute)</li>
<li><b>Note facts</b>: list every number, date and detail the question gives. Use all of them. (1 minute)</li>
<li><b>Frame</b>: write the subject line and your one-sentence request first. (1 minute)</li>
<li><b>Write</b> in the Facts → Action → Request order. (8-10 minutes)</li>
<li><b>Check</b>: date, subject, salutation-closing pair, spellings of names, ₹ and dates, word count. (1-2 minutes)</li></ol>
<p class="tip">Typing in the exam: set the format lines first (sender, date, addressee), then type the body. Do not spend time on alignment.</p>` },
  { t: 'Ten mistakes that cost marks', b: `
<ol><li>No subject line, or a vague one ("Regarding loan").</li><li>"Dear Sir" with "Yours sincerely" (or the reverse).</li><li>Facts from the question left out.</li><li>No clear request or deadline at the end.</li><li>Invented names, account numbers or circular numbers.</li><li>Emotional or threatening language to a customer.</li><li>One long paragraph with no breaks.</li><li>Writing far over or under the word limit.</li><li>Bank jargon to a customer without explanation.</li><li>No date or letter number.</li></ol>` }
];

const BC_DRILL = [
  { o: ['Regarding ATM', 'Failed ATM withdrawal of ₹10,000 on 12.10.2026: your complaint'], ok: 1, why: 'A subject must say what and which.' },
  { o: ['Kindly do the needful at the earliest.', 'Please sanction one cash officer by 30.11.2026.'], ok: 1, why: 'Say exactly what you want and by when.' },
  { o: ['Dear Sir, … Yours faithfully,', 'Dear Sir, … Yours sincerely,'], ok: 0, why: '"Dear Sir/Madam" pairs with "Yours faithfully".' },
  { o: ['You have failed to pay and legal action will follow.', 'Our records show that three instalments are unpaid. Please repay them by 30.11.2026 to avoid further action under the loan agreement.'], ok: 1, why: 'Firm, factual and polite: state the facts and the consequence calmly.' },
  { o: ['Your amount will be reversed as per T+5 TAT.', 'The amount will be credited back to your account within five working days of the transaction.'], ok: 1, why: 'Explain terms to a customer in plain words.' },
  { o: ['To: all 40 customers in the "To" field', 'To: own ID; Bcc: the 40 customers'], ok: 1, why: 'Bcc keeps customers\' e-mail addresses private.' }
];

/* ---- shared course screen: lessons (marked read when opened), a tap drill, and buttons into practice ---- */
const COURSES = {
  bc: { r: 'learnbc', t: 'Letters and e-mails', key: 'bcLearn', lessons: BC_LESSONS, drill: BC_DRILL, drillT: 'Which is better? (tap one)',
    lede: 'Ten short lessons, about 15 minutes in all. Read them once, try the drill, then write one letter and one e-mail and compare with the model answer.',
    go: [['BC', 'Write a letter'], ['EM', 'Write an e-mail']] }
};

function course(id) {
  const C = COURSES[id], done = store.get(C.key, {}), firstUnread = C.lessons.findIndex((_, i) => !done[i]), n = Object.keys(done).length;
  V.innerHTML = modeBar('learn', WRITE_MODES) + `<p class="crumbs"><a href="#learn">Learn</a> › ${esc(C.t)}</p><h2>${esc(C.t)}</h2>
    <p class="lede">${esc(C.lede)}</p>
    <div class="card"><div class="row end"><b>Your progress</b><span class="progress">${n} of ${C.lessons.length} read</span></div><div class="meter"><i style="width:${Math.round(n / C.lessons.length * 100)}%"></i></div></div>
    ${C.lessons.map((l, i) => `<details class="card lesson" data-i="${i}"${i === firstUnread ? ' open' : ''}><summary><b>${i + 1}. ${l.t}</b>${done[i] ? ' <span class="tag">read ✓</span>' : ''}</summary><div class="lesson-b">${l.b}</div></details>`).join('')}
    <h3>${esc(C.drillT)}</h3>
    <div id="drill">${C.drill.map((d, i) => `<div class="card drill" data-i="${i}">${d.p ? `<p class="qq">${esc(d.p)}</p>` : ''}${d.o.map((o, k) => `<button class="opt" data-k="${k}"><span class="k">${LETTERS[k]}</span><span>${esc(o)}</span></button>`).join('')}<p class="src why" hidden>${esc(d.why)}</p></div>`).join('')}</div>
    <h3>Now write</h3>
    <div class="row" style="gap:10px;flex-wrap:wrap">${C.go.map(([k, t], i) => `<button class="btn${i ? ' ghost' : ''}" data-go="${k}">${esc(t)}</button>`).join('')}</div>`;
  V.querySelectorAll('details.lesson').forEach(d => d.addEventListener('toggle', () => { if (d.open) { const D = store.get(C.key, {}); D[d.dataset.i] = 1; store.set(C.key, D); } }));
  $('#drill').onclick = e => {
    const b = e.target.closest('.opt'); if (!b || b.disabled) return; const card = b.closest('.drill'), ok = C.drill[card.dataset.i].ok;
    card.querySelectorAll('.opt').forEach(o => { o.disabled = true; o.classList.toggle('right', +o.dataset.k === ok); });
    if (+b.dataset.k !== ok) b.classList.add('wrong');
    card.querySelector('.why').hidden = false;
  };
  V.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { dType = b.dataset.go; store.set('dType', dType); location.hash = 'write'; });
}

function learn() {
  V.innerHTML = modeBar('learn', WRITE_MODES) + `<h2>Learn to write</h2><p class="lede">Short courses that teach the method behind each type of answer. Learn the method once; then every model answer makes sense.</p>
    ${TRACK_ID === 's3' ? `<div class="card"><b>Your 80-minute plan (12 answers, typed)</b>
      <table class="lt"><tr><th>Part</th><th>Answer</th><th>Words each</th><th>Minutes</th></tr>
      <tr><td>Read the paper, choose questions</td><td></td><td></td><td>3</td></tr>
      <tr><td>Rationale</td><td>4 of 6</td><td>50–75</td><td>16 (4 each)</td></tr>
      <tr><td>For and against</td><td>4 of 6</td><td>50–80</td><td>20 (5 each)</td></tr>
      <tr><td>Situation analysis</td><td>2 of 3</td><td>90–130</td><td>16 (8 each)</td></tr>
      <tr><td>Comprehension</td><td>1 long passage, 4 questions with options</td><td>type the chosen option</td><td>8 (mostly reading)</td></tr>
      <tr><td>Letter / e-mail</td><td>1 of 2</td><td>140–200</td><td>10</td></tr>
      <tr><td>Final check</td><td></td><td></td><td>4</td></tr></table>
      <p class="src" style="margin:6px 0 0">When an answer's time is up, finish the sentence and move on: a complete paper scores more than four perfect answers. Short, keyword-led points are faster to type and easier for the examiner to mark.</p></div>` : ''}
    <div class="card list">${Object.values(COURSES).filter(C => C.go.some(([k]) => DESC.some(d => d.type === k))).map(C => { const n = Object.keys(store.get(C.key, {})).length; return `<a class="item" href="#${C.r}"><span>${esc(C.t)}<small>${C.lessons.length} lessons · ${n} read</small></span></a>`; }).join('')}</div>
    ${DESC.length && DESC.every(d => d.type === 'ESSAY') ? `<p class="src">Your paper: one essay out of three topics, 20 marks, 40 minutes, typed (keyboard and mouse).</p>` : ''}`;
}

Object.assign(ROUTES, { learn, learnbc: () => course('bc') });
Object.assign(TITLES, { learn: 'Learn to write', learnbc: 'Letters and e-mails' });
</script>
<script>/* Rationale course (#learnrat): how to explain WHY a banking rule or practice exists. Uses the shared course screen
   in letters.js. Original teaching text. */
'use strict';

const RAT_LESSONS = [
  { t: 'What a rationale question really asks', b: `
<p>A rationale question gives you a rule or a practice and asks <b>why</b> it exists. It does not ask what the rule is.</p>
<div class="frame">Statement: Cash, keys and valuables at a branch are kept under dual control.

Weak (describes):  Two officers hold the keys and both must be present to open the strong room.
Strong (explains): No single person can take cash or valuables alone, so theft and fraud need two people
                   to collude; errors are caught at once; and staff are protected from false blame.</div>
<p class="tip">Test every line you write: does it answer "why?" If it only answers "what?" or "how?", it scores little.</p>` },
  { t: 'The P-R-R-B method', b: `
<p>Build every rationale from four kinds of reason, then close with one line.</p>
<table class="lt"><tr><th>Step</th><th>Ask yourself</th><th>Sample line</th></tr>
<tr><td><b>P</b>urpose</td><td>What is this meant to achieve?</td><td>The measure aims to make loan pricing transparent.</td></tr>
<tr><td><b>R</b>ule</td><td>Which Act, section or RBI direction requires it?</td><td>RBI's directions on Key Fact Statement require it for retail and MSME loans.</td></tr>
<tr><td><b>R</b>isk</td><td>Which risk does it control?</td><td>It prevents mis-selling and later disputes over hidden charges.</td></tr>
<tr><td><b>B</b>enefit</td><td>Who gains, and how?</td><td>The borrower can compare offers; the bank's reputation is protected.</td></tr>
<tr><td><b>H</b>ence</td><td>Close in one line</td><td>Hence the KFS protects both the borrower and the bank.</td></tr></table>
<p>You do not need all four in every answer, but aim for three separate reasons. <b>50-75 words</b> is enough: the paper has 12 answers in 80 minutes.</p>` },
  { t: 'Where reasons come from: four viewpoints', b: `
<p>If you are stuck, look at the rule through four pairs of eyes.</p>
<ol><li><b>The regulator / law</b>: stability of the system, protection of depositors, preventing money laundering, fair treatment.</li>
<li><b>The bank</b>: safety of funds, recovery, legal enforceability, control over staff and processes, cost.</li>
<li><b>The customer</b>: transparency, convenience, speed, safety of money and data, grievance redress.</li>
<li><b>The economy / society</b>: credit to priority sectors, financial inclusion, digital payments, formal economy.</li></ol>
<h4>Risk words to use</h4>
<table class="lt"><tr><th>Risk</th><th>Meaning in one line</th></tr>
<tr><td>Credit risk</td><td>The borrower may not repay.</td></tr>
<tr><td>Fraud / operational risk</td><td>Loss from people, process or system failure, or deliberate deceit.</td></tr>
<tr><td>Legal risk</td><td>The bank's claim or document may not stand in court.</td></tr>
<tr><td>KYC / AML risk</td><td>The account may be misused for crime or terror funding.</td></tr>
<tr><td>Liquidity risk</td><td>The bank may not have cash to meet withdrawals.</td></tr>
<tr><td>Reputation risk</td><td>Loss of public trust after a complaint, fraud or penalty.</td></tr>
<tr><td>Cyber risk</td><td>Attack on systems, data or customer credentials.</td></tr></table>` },
  { t: 'Worked example 1: return of property documents', b: `
<p><b>Statement:</b> Banks must return original property documents within 30 days of a loan being fully repaid.</p>
<div class="frame">P  The measure ensures that a borrower who has repaid gets his property papers back without delay.
R  RBI's 2023 directions on release of movable/immovable property documents require release within
   30 days and removal of charges with registries, with compensation for each day of delay.
R  It ends the practice of holding documents after repayment, a common source of complaints,
   and makes the bank liable if papers are lost.
B  The borrower can sell or mortgage the property freely; the bank's service image improves.
H  Hence the rule protects the borrower's right over his property and builds trust in the bank.</div>
<p class="tip">Notice: every line answers "why", and there is a rule, a risk and a benefit.</p>` },
  { t: 'Worked example 2: compulsory leave in sensitive posts', b: `
<p><b>Statement:</b> Staff in sensitive positions must take compulsory leave every year.</p>
<div class="frame">P  Compulsory leave lets another officer handle the desk for a continuous period.
R  It is part of preventive vigilance and the bank's staff-rotation and leave policy.
R  Many frauds stay hidden only because the same person handles the work every day;
   a substitute is likely to notice irregular entries or missing papers.
B  It deters misconduct, trains a second person for the job, and gives the employee rest.
H  Hence compulsory leave is a simple control against hidden frauds.</div>
<p>If you do not remember the exact circular, name the policy area (preventive vigilance, KYC, fair practices). Never invent a circular number.</p>` },
  { t: 'Weak answers and how to fix them', b: `
<table class="lt"><tr><th>Weak pattern</th><th>Fix</th></tr>
<tr><td>Repeats the question in other words.</td><td>Start with the purpose, not the statement.</td></tr>
<tr><td>Only "because RBI says so".</td><td>Name the rule, then say what risk the rule controls.</td></tr>
<tr><td>One long paragraph.</td><td>3-4 bullet points, one reason each.</td></tr>
<tr><td>Vague words: "for safety", "for smooth functioning".</td><td>Say whose safety and against what: "protects depositors' money from staff fraud".</td></tr>
<tr><td>Describes the procedure step by step.</td><td>Keep procedure to half a line; spend the words on reasons.</td></tr>
<tr><td>No closing line.</td><td>End with "Hence …" in one sentence.</td></tr></table>` },
  { t: 'Key words fetch marks', b: `
<p>Examiners scan for the right technical words. Start each bullet with one and the marker sees your point in a second.</p>
<div class="frame">Weak:   It is done so that bad people cannot misuse the account.
Strong: AML risk: stops criminals hiding behind shell entities.</div>
<table class="lt"><tr><th>Area</th><th>Key words to use</th></tr>
<tr><td>Risk</td><td>credit risk, fraud risk, operational risk, AML/CFT, cyber risk, reputation risk, concentration</td></tr>
<tr><td>Control</td><td>dual control, maker-checker, preventive vigilance, audit trail, segregation of duties</td></tr>
<tr><td>Customer</td><td>transparency, fair practices, grievance redress, TAT, consent, data privacy</td></tr>
<tr><td>Credit</td><td>due diligence, end-use, margin, security, early warning, SMA, NPA, provisioning</td></tr>
<tr><td>Law</td><td>Sec __ BR Act, RBI direction, PMLA, SARFAESI, NI Act, valid discharge</td></tr></table>
<p class="tip">Pattern for every bullet: <b>Key word: reason in under 15 words.</b> Example: <i>"Credit risk: reveals overdues before take-over."</i></p>` },
  { t: 'Words that make reasons sound like reasons', b: `
<p><b>Verbs:</b> ensures, prevents, deters, reduces, enables, protects, promotes, safeguards, discourages, improves.</p>
<p><b>Openers:</b></p>
<ul><li>The measure aims to …</li><li>This ensures that …</li><li>It prevents / reduces the risk of …</li><li>It protects the interest of …</li><li>From the customer's point of view, …</li><li>It also helps the bank to …</li></ul>
<p><b>Closers:</b> Hence …, Thus …, Therefore the measure …</p>
<p class="tip">One reason per sentence. A sentence with "and … and … and" is usually two or three reasons; split them into bullets.</p>` },
  { t: 'When you do not know the rule', b: `
<p>Reason from first principles. Ask three questions:</p>
<ol><li><b>What could go wrong without this rule?</b> (fraud, loss, dispute, misuse, delay)</li>
<li><b>Who would lose?</b> (depositor, borrower, bank, government)</li>
<li><b>What does the rule make possible?</b> (recovery, transparency, speed, trust)</li></ol>
<div class="frame">Statement: The nominee need not sign the nomination form.
Without the rule? The depositor could not nominate a minor or someone far away.
Who would lose?    The depositor's freedom to choose; the nominee is not a party to the contract.
What it enables?   Quick payment to the nominee, with a valid discharge to the bank.</div>
<p>Three honest reasons built this way score well even without a section number.</p>` },
  { t: 'Your method in the exam', b: `
<ol><li><b>Read</b> the statement; underline the key word (who, what limit, what time).</li>
<li><b>Jot P-R-R-B</b> in the margin: one word each. (30 seconds)</li>
<li><b>Write</b> 3 keyword-led bullets, then "Hence …". (3 minutes)</li>
<li><b>Check</b>: every line answers "why"; 50-75 words; one rule named. (30 seconds)</li></ol>
<p class="tip">Four minutes per rationale, four rationales: 16 minutes. Do not overshoot: a fifth bullet earns less than the time it costs.</p>` },
  { t: 'Ten mistakes that cost marks', b: `
<ol><li>Answering "what" instead of "why".</li><li>Only one reason.</li><li>No rule, Act or RBI direction named anywhere.</li><li>Invented circular numbers or dates.</li><li>Writing 150 words for a 50-75 word answer.</li><li>Vague reasons ("for smooth functioning").</li><li>Forgetting the customer's side.</li><li>Forgetting the risk the rule controls.</li><li>No closing line.</li><li>Copying a memorised paragraph that does not fit the statement.</li></ol>` }
];

const RAT_DRILL = [
  { p: 'Statement: Positive Pay is used for cheques of ₹50,000 and above. Which line is a REASON?', o: ['The drawer gives the cheque details to the bank in advance.', 'It stops altered or fraudulent cheques from being paid, as the details are matched before payment.', 'Positive Pay was introduced by NPCI in CTS.'], ok: 1, why: 'Only B explains why; A is the procedure and C is a fact.' },
  { p: 'Statement: Cyber incidents must be reported to CERT-In within 6 hours. Which risk does this mainly control?', o: ['Credit risk', 'Cyber risk spreading to other institutions', 'Liquidity risk'], ok: 1, why: 'Fast reporting lets CERT-In warn others and contain the attack.' },
  { p: 'Which is the better PURPOSE line for "Banks classify overdue accounts as SMA-0, SMA-1 and SMA-2"?', o: ['SMA means Special Mention Account.', 'The classification flags stress early, so the bank can act before the account turns NPA.', 'SMA-0 is overdue up to 30 days.'], ok: 1, why: 'A purpose line says what the measure achieves, not what it is.' },
  { p: 'Statement: Stock financed by the bank is insured with a "bank clause". Which is the best reason?', o: ['Insurance is compulsory for all assets.', 'If the stock is destroyed, the claim is paid to the bank, so the security is not lost.', 'The borrower pays the premium.'], ok: 1, why: 'The bank clause protects the bank\'s security; that is the "why".' },
  { p: 'Which closing line is best?', o: ['That is all.', 'Hence the measure protects depositors and strengthens control over cash.', 'RBI may change this rule.'], ok: 1, why: 'A "Hence" line sums up the reasons in one sentence.' },
  { p: 'Statement: TDS applies to cash withdrawals above ₹1 crore a year. Which viewpoint does "it discourages cash and promotes digital payments" use?', o: ['The customer\'s', 'The economy\'s', 'The bank\'s own risk'], ok: 1, why: 'Promoting a less-cash economy is a reason from the economy/society viewpoint.' }
];

COURSES.rat = { r: 'learnrat', t: 'Rationale', key: 'ratLearn', lessons: RAT_LESSONS, drill: RAT_DRILL, drillT: 'Quick drill (tap one)',
  lede: 'Eleven short lessons on explaining why a banking rule exists. Learn the P-R-R-B method, try the drill, then write rationales and compare with the model answers.',
  go: [['RAT', 'Write a rationale']] };
Object.assign(ROUTES, { learnrat: () => course('rat') });
Object.assign(TITLES, { learnrat: 'Rationale' });
</script>
<script>/* For and against course (#learnfa): argue both sides of a banking or economic proposition in 50-80 words.
   Uses the shared course screen in letters.js. Original teaching text. */
'use strict';

const FA_LESSONS = [
  { t: 'What the examiner wants', b: `
<p>You get a statement, such as <i>"Bank branches will become unnecessary in the digital age."</i> You must give points <b>for</b> it, points <b>against</b> it, and a short <b>conclusion</b>.</p>
<ul><li><b>Balance</b>: both sides, equally serious. A one-sided answer loses half the marks.</li>
<li><b>Relevance</b>: points about banks, customers, the economy, not general opinions.</li>
<li><b>Judgement</b>: a conclusion that takes a reasoned position.</li></ul>
<p class="tip">You are not asked what you believe. You are asked whether you can see both sides like a manager.</p>` },
  { t: 'The 3 + 3 + 1 shape', b: `
<div class="frame">FOR:
1. Cost: branches costly; digital is 24x7.
2. Digital: UPI and mobile banking handle most transactions.
3. Young customers rarely visit.

AGAINST:
1. Inclusion: elderly, rural, less literate need help.
2. Advice: complex loans and disputes need a person.
3. Trust: cash, KYC and account opening.

CONCLUSION: Branches will be fewer and advisory, not extinct.</div>
<p>That answer is about 45 words and covers six separate points. Three on each side, each under 12 words, one line to close: <b>50-80 words, 5 minutes</b>.</p>` },
  { t: 'Key word first, every time', b: `
<p>Start each point with a key word and a colon. The examiner sees six points in five seconds.</p>
<table class="lt"><tr><th>Slow to read</th><th>Fast to read</th></tr>
<tr><td>It will make it difficult for people who are old and live in villages.</td><td>Inclusion: elderly and rural customers excluded.</td></tr>
<tr><td>The bank has to spend a lot of money on staff and security for cash.</td><td>Cost of cash: staff, security, transport.</td></tr>
<tr><td>Borrowers will stop paying because they expect a waiver.</td><td>Moral hazard: damages credit discipline.</td></tr></table>
<h4>Key words that work for most topics</h4>
<p><b>Bank:</b> cost, profitability, credit risk, NPA, capital, liquidity, compliance, reputation.<br>
<b>Customer:</b> convenience, inclusion, transparency, fairness, privacy, trust.<br>
<b>Economy:</b> growth, employment, fiscal deficit, inflation, productivity, formalisation.<br>
<b>Staff:</b> morale, productivity, accountability, skills, vigilance.</p>` },
  { t: 'Finding points fast: the six lenses', b: `
<p>Run the statement through these six lenses; each usually gives one point for or against.</p>
<ol><li><b>Customer</b>: who gains, who is left out?</li><li><b>Bank</b>: cost, income, risk?</li><li><b>Staff</b>: workload, morale, skills?</li><li><b>Regulator / law</b>: does a rule allow or forbid it?</li><li><b>Economy / society</b>: growth, inclusion, environment?</li><li><b>Technology / practicality</b>: can it actually work?</li></ol>
<div class="frame">Statement: Banks should charge for cash transactions at branches.
Bank lens      → FOR: Cost of cash: staff, security, transport.
Customer lens  → AGAINST: Small traders and the elderly depend on cash.
Society lens   → AGAINST: Hurts financial inclusion.
Technology     → FOR: Nudge to cheaper digital channels.</div>` },
  { t: 'Writing the conclusion', b: `
<p>One line. Take a position, but a balanced one. Four patterns that always work:</p>
<ul><li><b>Yes, with conditions:</b> "Yes, if practical, local and supported by an allowance."</li>
<li><b>No, with an alternative:</b> "Not advisable; auto-sweep serves customers with surplus funds."</li>
<li><b>Middle path:</b> "Branches will be fewer and advisory, not extinct."</li>
<li><b>Gradual change:</b> "Reduce gradually; price climate risk; grow renewables."</li></ul>
<p class="tip">Avoid "Both sides have merits" with nothing after it. That is not a conclusion.</p>` },
  { t: 'Mistakes that cost marks', b: `
<ol><li>Only one side, or 4 points for and 1 against.</li><li>The same point repeated on both sides in different words.</li><li>Long sentences that hide the point.</li><li>General points with no banking angle ("it is good for society").</li><li>No conclusion, or a conclusion that sits on the fence.</li><li>Stating rules wrongly; if unsure, leave the number out.</li><li>Writing 150 words: it costs the time of another answer.</li></ol>` },
  { t: 'Your 5-minute method', b: `
<ol><li><b>Read</b> and decide: who is affected? (20 seconds)</li>
<li><b>Six lenses</b>: jot one key word per lens, mark F or A. (1 minute)</li>
<li><b>Type</b> FOR 1-2-3, AGAINST 1-2-3, each "Key word: reason". (3 minutes)</li>
<li><b>Conclude</b> in one line using a pattern from lesson 5. (30 seconds)</li>
<li><b>Check</b>: 3 + 3, key words first, 50-80 words. (10 seconds)</li></ol>` }
];

const FA_DRILL = [
  { p: 'Which point is better written?', o: ['It will create difficulties for many old persons living in rural areas who are not used to technology.', 'Inclusion: elderly and rural customers excluded.'], ok: 1, why: 'Key word first, under 12 words, same meaning.' },

];

COURSES.fa = { r: 'learnfa', t: 'For and against', key: 'faLearn', lessons: FA_LESSONS, drill: FA_DRILL, drillT: 'Quick drill (tap one)',

<script>/* Situation analysis course (#learnsit): decide a branch problem like a manager in 90-130 words, using the
   Facts-Issue-Law-Action-Conclusion frame. Uses the shared course screen in letters.js. Original teaching text. */
'use strict';

const SIT_LESSONS = [
  { t: 'What the examiner wants', b: `
<p>A situation question puts you in the branch: a customer, a borrower, a notice, a fraud. The examiner wants to see you <b>decide</b> as a manager would.</p>
<ul><li><b>Law</b>: you know the rule that applies.</li><li><b>Action</b>: you know what to do first, next and last.</li><li><b>Balance</b>: you protect the bank and treat the customer fairly.</li></ul>
<p class="tip">Two answers, 8 minutes each, 90-130 words. Clear steps beat long explanations.</p>` },
  { t: 'The F-I-L-A-C frame', b: `
<div class="frame">Facts: ₹40,000 unauthorised UPI debits, reported the same day; PIN/OTP not shared.
Issue: liability and immediate protection.
Law/rule: RBI 2017 customer-liability directions: third-party breach reported
          within 3 working days means zero liability.
Action:
a) Register complaint; acknowledgement; block UPI and other channels.
b) Shadow credit within 10 working days of report.
c) Advise 1930 / cybercrime.gov.in and police complaint.
d) Trace funds with NPCI and beneficiary banks; seek freeze.
e) Resolve within 90 days.
Conclusion: quick blocking and shadow credit protect the customer and limit loss.</div>
<p><b>F</b>acts and <b>I</b>ssue: one line each, no story-telling. <b>L</b>aw: the most important line for marks. <b>A</b>ction: 4-6 lettered steps. <b>C</b>onclusion: one line.</p>` },
  { t: 'Action steps: the six-verb ladder', b: `
<p>Most situations are solved with the same ladder. Use the verbs that fit, in this order:</p>
<table class="lt"><tr><th>Verb</th><th>Typical step</th></tr>
<tr><td><b>Stop</b></td><td>Stop payment, block the channel, freeze debits, refuse to return a fake note.</td></tr>
<tr><td><b>Verify</b></td><td>Check documents, KYC, the deed, the system, the stock.</td></tr>
<tr><td><b>Secure</b></td><td>Mark lien, impound, take indemnity, register with CERSAI.</td></tr>
<tr><td><b>Report</b></td><td>Controller, Vigilance, police/FIR, FIU-IND, CIC, RBI.</td></tr>
<tr><td><b>Inform</b></td><td>Explain to the customer in writing, politely, with reasons.</td></tr>
<tr><td><b>Prevent</b></td><td>Fix accountability, train staff, change the process.</td></tr></table>
<p class="tip">Start each step with a key word: <i>"Block: UPI and net banking at once."</i> The examiner sees the step instantly.</p>` },
  { t: 'Laws you will quote most', b: `
<table class="lt"><tr><th>Situation</th><th>Law / rule</th></tr>
<tr><td>Guarantor's liability, variance in terms</td><td>Contract Act, Sec 133 (variance), Sec 128 (co-extensive), Sec 140 (subrogation)</td></tr>
<tr><td>Pledge, gold loan</td><td>Contract Act, Sec 172 (pledge); banker's lien Sec 171</td></tr>
<tr><td>POA holder or agent dies</td><td>Contract Act, Sec 201 (agency ends), Sec 208 (notice)</td></tr>
<tr><td>Partner retires, dies, firm in default</td><td>Partnership Act, Sec 25 (joint and several), Sec 32 (retirement), Sec 42 (dissolution)</td></tr>
<tr><td>Cheque dishonour, stop payment</td><td>NI Act, Sec 138; drawer's written instruction</td></tr>
<tr><td>Equitable mortgage</td><td>Transfer of Property Act, Sec 58(f); CERSAI registration</td></tr>
<tr><td>Nomination (deposit / locker)</td><td>BR Act, Sec 45ZA / 45ZE</td></tr>
<tr><td>NPA recovery</td><td>SARFAESI Sec 13(2) notice, 13(4) possession; DRT above ₹20 lakh</td></tr>
<tr><td>Fraud on a customer's account</td><td>RBI customer-liability directions (2017)</td></tr>
<tr><td>Suspicious cash, mule accounts</td><td>PMLA and RBI KYC Directions; STR to FIU-IND</td></tr></table>
<p>If you are not sure of a section number, name the Act and the principle. A wrong number costs more than no number.</p>` },
  { t: 'Answer the question asked', b: `
<p>Many questions end with <i>"Can the bank …?"</i> or <i>"Is the guarantor liable?"</i>. Give the answer early, in the Law line or the first action:</p>
<ul><li><b>Yes</b>: "Yes: set-off is valid after the guarantee is invoked."</li>
<li><b>No</b>: "No: counterfeit notes are never returned."</li>
<li><b>It depends</b>: "Depends on the deed: a consent-to-variation clause keeps X liable."</li></ul>
<p class="tip">An examiner who has to search for your answer gives fewer marks.</p>` },
  { t: 'Customer and staff angle', b: `
<p>Every good answer has one step for the people involved:</p>
<ul><li><b>Customer</b>: explain politely, in writing, with reasons; offer the alternative (a fresh POA, a fresh cheque, doorstep service).</li>
<li><b>Vulnerable customers</b>: elderly, illiterate, bereaved: empathy plus protection.</li>
<li><b>Staff</b>: if there was a lapse, fix accountability; if there is a risk, brief and train.</li></ul>` },
  { t: 'Mistakes that cost marks', b: `
<ol><li>Re-telling the story in the Facts line.</li><li>No law or rule anywhere.</li><li>Actions in one paragraph instead of lettered steps.</li><li>Wrong order: reporting before stopping the loss.</li><li>Not answering "can the bank …?".</li><li>Forgetting the customer.</li><li>Invented names, dates or circular numbers.</li><li>200 words: it costs the time of a rationale.</li></ol>` },
  { t: 'Your 8-minute method', b: `
<ol><li><b>Read</b> twice; underline who, what, which account. (1 minute)</li>
<li><b>Decide</b> the answer to the question asked, and the law. (1 minute)</li>
<li><b>Ladder</b>: pick 4-6 verbs from Stop-Verify-Secure-Report-Inform-Prevent. (30 seconds)</li>
<li><b>Type</b> F-I-L-A-C. (5 minutes)</li>
<li><b>Check</b>: answer given, law named, steps lettered, 90-130 words. (30 seconds)</li></ol>` }
];

const SIT_DRILL = [
  { p: 'A customer phones to stop payment of a cheque. What is the FIRST step?', o: ['Return the cheque when it comes.', 'Check at once whether the cheque is already paid.', 'Recover stop-payment charges.'], ok: 1, why: 'Stop the loss first: if it is unpaid, flag it and ask for written confirmation.' },
  { p: 'Which Facts line is better?', o: ['Facts: a customer named X came to the branch on a Monday morning and said that ...', 'Facts: six counterfeit notes in a known customer\'s deposit; cashier ready to return them.'], ok: 1, why: 'One line, only what matters for the decision.' },
  { p: 'A POA holder dies. Which law applies?', o: ['Sec 201, Contract Act: agency ends on the agent\'s death.', 'Sec 138, NI Act.', 'Sec 58(f), Transfer of Property Act.'], ok: 0, why: 'Death of the agent ends the agency; it binds the bank once it has notice (Sec 208).' },
  { p: 'Which order of steps is right for an unauthorised UPI debit?', o: ['Inform customer → block channels → report', 'Block channels → shadow credit → trace funds', 'Trace funds → block channels → acknowledge'], ok: 1, why: 'Stop further loss first, then protect the customer, then investigate.' },
  { p: 'How long should a situation answer be in the 80-minute paper?', o: ['40-60 words', '90-130 words', '200-250 words'], ok: 1, why: 'Two answers in about 16 minutes.' }
];

COURSES.sit = { r: 'learnsit', t: 'Situation analysis', key: 'sitLearn', lessons: SIT_LESSONS, drill: SIT_DRILL, drillT: 'Quick drill (tap one)',
  lede: 'Eight short lessons on deciding a branch problem like a manager: the F-I-L-A-C frame, the six-verb action ladder, the laws you will quote most, and an 8-minute method.',
  go: [['SIT', 'Write a situation answer']] };
Object.assign(ROUTES, { learnsit: () => course('sit') });
Object.assign(TITLES, { learnsit: 'Situation analysis' });

<script>/* Comprehension course (#learncomp): the exam passage is long (4-6 paragraphs) with four questions that carry options;
   the candidate types the correct option. Almost all the time goes into reading, so the course teaches fast,
   targeted reading and option elimination. Uses the shared course screen in letters.js. Original teaching text. */
'use strict';

const COMP_LESSONS = [
  { t: 'How the exam question works', b: `
<p>You get one long passage of <b>4 to 6 paragraphs</b> and <b>four questions</b>. Each question has options (a)-(e). You choose the right one and <b>type that option</b> as your answer.</p>
<div class="frame">1. (b) fraudsters create fear and urgency
2. (b) ₹1.8 lakh
3. (c) Pausing, hanging up and calling the bank on a known number
4. (b) Pause Before You Share</div>
<p>Typing takes a minute. <b>Reading is where the time goes</b>, and reading well is where the marks come from. Every lesson here is about reading faster and choosing right.</p>` },
  { t: 'Questions and options first', b: `
<ol><li>Read the four questions <b>and their options</b> before the passage. (about 1 minute)</li>
<li>Underline the key word in each question: a name (Ramesh), a number (₹1.8 lakh), a quoted word ("dormant"), or NOT/EXCEPT.</li>
<li>Now read the passage knowing exactly what to hunt for.</li></ol>
<p class="tip">Reading the options first also tells you which details matter. If three options are amounts, you know a number is coming.</p>` },
  { t: 'Read fast: skim, then scan', b: `
<p><b>Skim</b> (find the map): read the first and last sentence of every paragraph. Note in one word what each paragraph is about: <i>P1 Ramesh · P2 access · P3 camp · P4 bankers · P5 teach</i>.</p>
<p><b>Scan</b> (find the answer): for each question, go to the paragraph your map points to and look only for its key word, number or name. Then read that sentence and the one before and after it carefully.</p>
<h4>Speed habits</h4>
<ul><li>Do not read every word aloud in your head; read in groups of words.</li>
<li>Keep moving; do not go back over a line unless a question needs it.</li>
<li>Follow the line with the cursor or a finger to keep your eyes steady.</li>
<li>Skip examples and stories on the first pass; return only if a question asks about them.</li>
<li>Practise daily: one newspaper editorial in under 4 minutes builds exam speed.</li></ul>` },
  { t: 'The question types', b: `
<table class="lt"><tr><th>Type</th><th>Looks like</th><th>Where the answer is</th></tr>
<tr><td>Fact / detail</td><td>"How much did Mr Iyer lose?"</td><td>One sentence; scan for the name or number.</td></tr>
<tr><td>Reason</td><td>"… mainly because:"</td><td>Near words like because, since, so, therefore.</td></tr>
<tr><td>NOT / EXCEPT</td><td>"Which is NOT mentioned …?"</td><td>Tick off each option you find; the one left is the answer.</td></tr>
<tr><td>True statement</td><td>"Which statement is TRUE?"</td><td>Check each option against the passage; only one survives.</td></tr>
<tr><td>Main idea / title</td><td>"Most suitable title"</td><td>Covers the whole passage, not one paragraph.</td></tr>
<tr><td>Vocabulary</td><td>"'dormant' as used in the passage means"</td><td>Put each option in place of the word; keep the one that fits the sentence.</td></tr>
<tr><td>Inference</td><td>"The writer suggests …"</td><td>Not written directly, but clearly follows from the lines.</td></tr></table>` },
  { t: 'Spot the trap options', b: `
<p>Wrong options are built in a few standard ways. Learn to see them and you can strike them out in seconds.</p>
<table class="lt"><tr><th>Trap</th><th>Example</th></tr>
<tr><td><b>True but not in the passage</b></td><td>"OTPs are weak": may be true in life, but the passage never says it.</td></tr>
<tr><td><b>Opposite</b></td><td>"victims are careless" when the passage says frauds succeed "not because the victims are careless".</td></tr>
<tr><td><b>Extreme words</b></td><td>always, never, all, only, completely: rarely correct unless the passage uses them.</td></tr>
<tr><td><b>Too narrow</b></td><td>A title that covers one paragraph only.</td></tr>
<tr><td><b>Too broad</b></td><td>"History of Digital Banking" for a passage on one kind of fraud.</td></tr>
<tr><td><b>Word-match</b></td><td>Uses the passage's own words but changes the meaning: "praising privately and correcting openly".</td></tr>
<tr><td><b>Look-alike numbers</b></td><td>₹18,000 / ₹1.8 lakh / ₹81,000: check digits and units.</td></tr></table>` },
  { t: 'Eliminate, then confirm', b: `
<ol><li><b>Strike out</b> options that are clearly traps (opposite, extreme, not in passage). Usually two or three go at once.</li>
<li><b>Compare</b> the remaining two with the exact line in the passage.</li>
<li><b>Choose</b> the one that matches the meaning of the line, even if it uses different words.</li></ol>
<p class="tip">The right option is often a paraphrase, not a copy. An option that repeats the passage word for word deserves a second look: it may be the word-match trap.</p>` },
  { t: 'NOT / EXCEPT questions', b: `
<p>These are the most common mistake. Read the question twice and say "NOT" to yourself.</p>
<div class="frame">Which of these is NOT mentioned as an opportunity?
(a) Rooftop solar      ✓ found in P4
(b) Electric vehicles  ✓ found in P4
(c) Efficient buildings ✓ found in P4
(d) Coal mining expansion  ✗ not found  → answer
(e) Water-saving irrigation ✓ found in P4</div>
<p>Tick every option you find. The one without a tick is your answer.</p>` },
  { t: 'Typing the answer', b: `
<ul><li>Type the question number, the option letter and the option text: <b>1. (b) fraudsters create fear and urgency</b></li>
<li>Type the option exactly as given; do not reword it.</li>
<li>Check numbers, ₹ signs and spellings of key words.</li>
<li>Never leave a question blank; if unsure, eliminate and choose the best remaining option.</li></ul>` },
  { t: 'Your 8-minute plan', b: `
<table class="lt"><tr><th>Step</th><th>Minutes</th></tr>
<tr><td>Questions and options first; underline key words</td><td>1</td></tr>
<tr><td>Skim: first and last line of each paragraph; one-word map</td><td>1½</td></tr>
<tr><td>Scan and read closely around each answer; eliminate traps</td><td>4</td></tr>
<tr><td>Type the four options</td><td>1</td></tr>
<tr><td>Check: numbers, NOT questions, spellings</td><td>½</td></tr></table>
<p class="tip">If one question is taking too long, choose your best option and move on; come back if time remains.</p>` },
  { t: 'Mistakes that cost marks', b: `
<ol><li>Reading the whole passage slowly before seeing the questions.</li><li>Missing NOT / EXCEPT in the question.</li><li>Choosing what is true in real life instead of what the passage says.</li><li>Falling for the word-match option.</li><li>Choosing a title that fits one paragraph only.</li><li>Misreading look-alike numbers.</li><li>Rewording the option instead of typing it exactly.</li><li>Leaving a question blank.</li></ol>` }
];

const COMP_DRILL = [
  { p: 'What should you read first?', o: ['The whole passage, slowly', 'The questions and their options', 'The last paragraph'], ok: 1, why: 'Knowing the questions and options tells you what to hunt for while reading.' },
  { p: 'Passage: "Frauds like this succeed not because the victims are careless but because the fraudsters create fear." Which option is the OPPOSITE trap?', o: ['Fraudsters create fear and urgency', 'Victims are careless', 'Fraudsters use the bank\'s language'], ok: 1, why: 'The passage says the opposite; this option reverses it.' },
  { p: 'Which option is most likely a trap?', o: ['Banks must ALWAYS refuse such loans', 'Banks may face higher risk from such loans', 'Such loans need good data'], ok: 0, why: 'Extreme words (always, never, all) are rarely right unless the passage uses them.' },
  { p: 'For a NOT / EXCEPT question, the best method is:', o: ['Pick the first option you remember', 'Tick each option found in the passage; choose the one left', 'Choose the longest option'], ok: 1, why: 'The option you cannot find in the passage is the answer.' },
  { p: '"dormant accounts": which meaning fits when put in place of the word?', o: ['dangerous accounts', 'inactive accounts', 'secret accounts'], ok: 1, why: 'Substitute each option into the sentence; keep the one that makes sense.' },
  { p: 'How should you type your answer?', o: ['In your own words, in a paragraph', '1. (b) and the option text exactly', 'Only the letter, without the number'], ok: 1, why: 'Question number, option letter and the option text as given.' }
];

COURSES.comp = { r: 'learncomp', t: 'Comprehension', key: 'compLearn', lessons: COMP_LESSONS, drill: COMP_DRILL, drillT: 'Quick drill (tap one)',
  lede: 'Ten short lessons on reading a long passage fast and choosing the right option: questions first, skim and scan, trap options, elimination, NOT questions and an 8-minute plan.',
  go: [['COMP', 'Practise a passage']] };
Object.assign(ROUTES, { learncomp: () => course('comp') });
Object.assign(TITLES, { learncomp: 'Comprehension' });
</script>
<script>/* Essay course (#learnessay): one essay of about 250 words in 40 minutes (Trainee Officer channel: 1 of 3 topics,
   20 marks, typed). Uses the shared course screen in letters.js. Original teaching text. */
'use strict';

const ESSAY_LESSONS = [
  { t: 'What the examiner gives marks for', b: `
<ul><li><b>Content</b>: relevant ideas, with facts, schemes or examples, linked to banking and customers.</li>
<li><b>Structure</b>: an introduction, three or four body paragraphs with one idea each, and a conclusion.</li>
<li><b>Language</b>: simple, correct sentences; no slang or Hinglish.</li>
<li><b>Balance</b>: both opportunities and challenges, then a way forward.</li></ul>
<p class="tip">About 250 words in 40 minutes, typed with keyboard and mouse. A clear, well-organised 250 words beats a crowded 400; use the extra time to plan and revise, not to pad.</p>` },
  { t: 'Choosing the topic in one minute', b: `
<p>You will see three topics. Choose the one for which you can write down <b>three ideas and two facts</b> in 30 seconds, not the one that sounds impressive.</p>
<div class="frame">Topic: Digital banking: opportunities and challenges
Ideas: low cost · 24x7 convenience · cyber fraud · elderly left out
Facts: UPI (NPCI, 2016) · Direct Benefit Transfer · "bank never asks for OTP"
→ Enough material: choose it.</div>
<p>Banking topics (digital, inclusion, MSMEs, fraud, customer service) are safer for a banker than abstract ones, because you can use your own branch experience.</p>` },
  { t: 'The five-paragraph plan', b: `
<table class="lt"><tr><th>Paragraph</th><th>Job</th><th>Words</th></tr>
<tr><td>1. Introduction</td><td>Hook (a scene or fact) + what the topic means</td><td>40</td></tr>
<tr><td>2. Body: opportunities / importance</td><td>Why it matters; benefits with an example</td><td>55</td></tr>
<tr><td>3. Body: challenges</td><td>Problems and risks, honestly</td><td>55</td></tr>
<tr><td>4. Body: role of banks / way forward</td><td>What banks, government and customers should do</td><td>55</td></tr>
<tr><td>5. Conclusion</td><td>One strong closing thought; no new points</td><td>40</td></tr></table>
<p>This plan fits almost every topic. For "importance of savings" paragraph 3 becomes "why people do not save"; for "ethics in banking" it becomes "where ethics are tested".</p>` },
  { t: 'Finding ideas: the five lenses', b: `
<p>Run the topic through these five lenses; each gives at least one idea.</p>
<ol><li><b>Customer</b>: convenience, safety, cost, access, trust.</li>
<li><b>Bank</b>: business, cost, risk, staff, technology.</li>
<li><b>Government / RBI</b>: schemes, rules, policy goals.</li>
<li><b>Economy and society</b>: jobs, growth, inclusion, women, rural India, environment.</li>
<li><b>Technology</b>: UPI, mobile apps, AI, data, cyber security.</li></ol>` },
  { t: 'Writing a strong paragraph', b: `
<p>Each body paragraph follows <b>T-E-E-L</b>:</p>
<div class="frame">T  Topic sentence:  The opportunities are large.
E  Explain:         Digital channels cut the cost of each transaction, so small
                    customers can be served profitably.
E  Example:         A vegetable seller with a QR code builds a record of receipts
                    and gets his first loan.
L  Link:            Digital banking thus widens both business and inclusion.</div>
<p class="tip">One idea per paragraph. If a paragraph starts a second idea, split it.</p>` },
  { t: 'Facts and schemes you can safely use', b: `
<p>One or two facts per paragraph lift the essay. Use only facts you are sure of; if unsure of a number, describe it in words ("billions of transactions a month").</p>
<table class="lt"><tr><th>Area</th><th>Safe facts</th></tr>
<tr><td>Inclusion</td><td>PMJDY (2014): basic accounts with RuPay card and insurance; Direct Benefit Transfer reduces leakages.</td></tr>
<tr><td>Digital</td><td>UPI launched by NPCI in 2016; banks never ask for PIN/OTP; cyber-fraud helpline 1930.</td></tr>
<tr><td>MSME</td><td>MUDRA (Shishu, Kishore, Tarun, Tarun Plus); CGTMSE guarantees; Udyam registration.</td></tr>
<tr><td>Deposits</td><td>DICGC insures up to ₹5 lakh per depositor per bank.</td></tr>
<tr><td>Social security</td><td>PMJJBY, PMSBY, Atal Pension Yojana.</td></tr>
<tr><td>Grievances</td><td>RBI Integrated Ombudsman Scheme; complain to the bank first.</td></tr>
<tr><td>Vision</td><td>Viksit Bharat @2047: India as a developed nation by its 100th year of independence.</td></tr></table>` },
  { t: 'Introductions and conclusions that work', b: `
<h4>Openings</h4>
<ul><li><b>A scene</b>: "A farmer receives a subsidy in his account; a shopkeeper accepts payment by QR code."</li>
<li><b>A fact</b>: "India's UPI now handles more payments than many countries' card networks combined." (only if sure)</li>
<li><b>A question</b>: "Can a bank be trusted if it is not honest when no one is watching?"</li></ul>
<p>Avoid "Since ancient times …" and "In today's modern world …"; they waste the first line.</p>
<h4>Conclusions</h4>
<ul><li>Sum up the balance: "If convenience is matched by security and inclusion, digital banking can reach every Indian."</li>
<li>Look forward: "Banks that invest in people as well as technology will lead the way to Viksit Bharat."</li></ul>
<p class="tip">Begin with "In conclusion," or "Thus," and keep it to two or three sentences. Never add a new point here.</p>` },
  { t: 'Language: simple, correct, formal', b: `
<table class="lt"><tr><th>Avoid</th><th>Write</th></tr>
<tr><td>Nowadays everybody is going digital only.</td><td>Most customers now prefer digital channels.</td></tr>
<tr><td>Banks should do the needful.</td><td>Banks should train staff and simplify their apps.</td></tr>
<tr><td>It is very very important.</td><td>It is essential.</td></tr>
<tr><td>Govt., pvt., etc. in running text</td><td>Government, private (write in full)</td></tr></table>
<ul><li>Sentences of 12-20 words; active voice.</li><li>Linking words: moreover, however, therefore, for example, as a result, in conclusion.</li><li>Check subject-verb agreement and articles (a / an / the).</li></ul>` },
  { t: 'Your 40-minute plan', b: `
<table class="lt"><tr><th>Step</th><th>Minutes</th></tr>
<tr><td>Read the three topics; choose one</td><td>1</td></tr>
<tr><td>Plan: five lenses, 5-paragraph outline, 2-3 facts</td><td>6</td></tr>
<tr><td>Type the essay</td><td>25</td></tr>
<tr><td>Revise: spellings, articles, one idea per paragraph, word count</td><td>8</td></tr></table>
<p class="tip">At 25 words a minute, 250 words take 10 minutes of pure typing. The rest is thinking. Plan before you type.</p>` },
  { t: 'Mistakes that cost marks', b: `
<ol><li>Choosing a topic with too few ideas.</li><li>No paragraphs, or one long paragraph.</li><li>Only praise or only problems, no balance.</li><li>No facts, schemes or examples.</li><li>Wrong figures: worse than none.</li><li>A memorised essay that does not fit the exact topic.</li><li>New points in the conclusion.</li><li>Far over or under 250 words.</li><li>No time left to revise.</li></ol>` }
];

const ESSAY_DRILL = [
  { p: 'Which topic should you choose?', o: ['The one that sounds most impressive', 'The one for which you can quickly list three ideas and two facts', 'The longest topic'], ok: 1, why: 'Material, not glamour, decides the score.' },
  { p: 'Which is the better opening line?', o: ['Since ancient times, money has been important.', 'A farmer now receives his subsidy directly in his account, without visiting an office.'], ok: 1, why: 'A concrete scene draws the reader in and is on the topic at once.' },
  { p: 'What belongs in the conclusion?', o: ['A new argument', 'A short summing-up and a way forward', 'A list of statistics'], ok: 1, why: 'No new points; sum up and look ahead.' },
  { p: 'How many ideas should one body paragraph carry?', o: ['One', 'Three', 'As many as possible'], ok: 0, why: 'One idea per paragraph, developed with an example.' },
  { p: 'You are not sure of an exact figure. What should you do?', o: ['Guess a number', 'Describe it in words, e.g. "billions of transactions a month"', 'Leave a blank'], ok: 1, why: 'A wrong figure costs more than no figure.' }
];

COURSES.essay = { r: 'learnessay', t: 'Essay', key: 'essayLearn', lessons: ESSAY_LESSONS, drill: ESSAY_DRILL, drillT: 'Quick drill (tap one)',
  lede: 'Ten short lessons on writing a 250-word essay in 40 minutes: choosing the topic, the five-paragraph plan, five lenses for ideas, T-E-E-L paragraphs, safe facts, openings and conclusions.',
  go: [['ESSAY', 'Write an essay']] };
Object.assign(ROUTES, { learnessay: () => course('essay') });
Object.assign(TITLES, { learnessay: 'Essay' });
